# Fixture: xr-min's KV MR after a successful first write — and its data Secret
# (composed-data-secrets.yaml) deliberately absent. That is the #454 point 4
# case: someone deleted the Secret holding the generated password while Vault
# (and whatever consumes it) still has the old one.
#
# Expected golden: no data Secret, the MR composed with crossplane.io/paused,
# `blocked: [password]` in status.share, GeneratedValuesPreserved=False, and
# the XR at Ready=False. No random value, so the golden is stable.
#
# The external-name marks it as written — provider-vault sets it only after a
# successful apply. Deliberately NO crossplane.io/external-create-succeeded:
# that annotation is set when the async create call returns and also sits on
# MRs whose create failed (measured on u26-kind3, #454 point 1), so it must not
# count.
apiVersion: kv.vault.m.upbound.io/v1alpha1
kind: SecretV2
metadata:
  name: vault-secrets-min-fe0d42c5-kv
  namespace: default
  annotations:
    crossplane.io/composition-resource-name: vault-secrets-min-fe0d42c5-kv
    crossplane.io/external-name: xpv-proto-kv/data/demo/min
spec:
  forProvider:
    mount: xpv-proto-kv
    name: demo/min
