# Fixture: the data Secrets each example XR composes, as they look after a first
# reconcile. Generated values are read back from these — without them every
# render generates fresh random values and a golden could never be stable.
#
# So the goldens cover REUSE (incl. an ascii value with \ " < & that has to
# survive the JSON round trip) and the update of literal / secretKeyRef values
# over stale ones. The generate-when-absent path cannot be pinned offline by
# construction; it is exercised on a cluster.
