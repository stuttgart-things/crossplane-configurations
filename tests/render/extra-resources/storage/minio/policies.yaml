---
# Fixture: the Policy as it looks once provider-minio has created it. Without
# it, `crossplane render` sees no Ready policy and the User branch renders to
# nothing, so no golden would cover a user (CLAUDE.md gotcha 6).
apiVersion: minio.crossplane.io/v1
kind: Policy
metadata:
  name: tofu-state-writer
  annotations:
    crossplane.io/external-name: tofu-state-writer
spec:
  forProvider:
    allowBucket: tofu-state
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
    - type: Synced
      status: "True"
      reason: ReconcileSuccess
