---
# Observed-state fixtures for the node-registration block of
# machinery/rancher-cluster (#422).
#
# WHY THIS FILE EXISTS. Everything in that block sits behind data only a
# provider-kubernetes observation produces: the management cluster ID (1c), the
# raw command Rancher writes into the ClusterRegistrationToken (1e), and on
# Rancher 2.15+ the token from crt-token-<name> (1f). `crossplane render`
# observes nothing, so without these Secrets the published command, the mirror
# and the token Object render to nothing and no golden covers them -- the blind
# spot #388 shipped through.
#
# THE TWO EXAMPLES DELIBERATELY COVER THE TWO RANCHER GENERATIONS:
#   xr.yaml     (k3s-test)  Rancher 2.14 shape: the raw command embeds the token.
#                           No placeholder, so no token Object; published as is.
#   xr-max.yaml (rke2-prod) Rancher 2.15+ shape: the raw command carries a literal
#                           `{token}`, so (1f) is emitted and (1g)/(1h) publish the
#                           command with the token from <name>-registration-token
#                           substituted in.
#
# Values are fake and low entropy on purpose: a .invalid host, a zero checksum
# and an obviously fake token. A registration command IS a cluster credential,
# and a fixture ends up in a committed golden.

---
apiVersion: v1
kind: Secret
metadata:
  name: k3s-test-rancher-id
  namespace: default
type: Opaque
data:
  clusterId: Yy1tLWZha2UwMDAx

---
# Rancher 2.14 shape: token embedded, no placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: k3s-test-node-command-raw
  namespace: default
type: Opaque
data:
  nodeCommand:   # pragma: allowlist secret
  insecureNodeCommand:   # pragma: allowlist secret

---
apiVersion: v1
kind: Secret
metadata:
  name: rke2-prod-rancher-id
  namespace: default
type: Opaque
data:
  clusterId: Yy1tLWZha2UwMDAy

---
# Rancher 2.15+ shape: the command is a template with a literal {token}.
apiVersion: v1
kind: Secret
metadata:
  name: rke2-prod-node-command-raw
  namespace: default
type: Opaque
data:
  nodeCommand:   # pragma: allowlist secret
  insecureNodeCommand:   # pragma: allowlist secret

---
# The token (1f) extracts from crt-token-default-token.
apiVersion: v1
kind: Secret
metadata:
  name: rke2-prod-registration-token
  namespace: default
type: Opaque
data:
  token: RkFLRS1SRUdJU1RSQVRJT04tVE9LRU4tTk9ULUEtQ1JFREVOVElBTA==  # pragma: allowlist secret
