---
# Observed-state fixtures for the node-registration block of
# machinery/rancher-cluster (#422).
#
# WHY THIS FILE EXISTS. Publishing Rancher's registration command is TWO hops:
# step (1c) observes the provisioning Cluster for the management cluster ID
# Rancher assigned (status.clusterName, `c-m-xxxxx`), and only then can step
# (1e) name the namespace that cluster's ClusterRegistrationToken lives in.
# Both hops travel through connection Secrets, so both sit behind
#
#     {{- if $rancherClusterId }}
#
# i.e. behind data that only exists once provider-kubernetes has OBSERVED the
# Rancher cluster. `crossplane render` observes nothing, so without these
# Secrets steps (1e) and (1f) render to nothing and no golden covers them —
# the same blind spot the Argo CD block sat in until #388 shipped through it.
#
# The IDs are deliberately not real `c-m-` hashes and the commands point at a
# .invalid host with a zero checksum: a fixture ends up in a committed golden,
# and a registration command IS a cluster credential. Low entropy on purpose.

---
apiVersion: v1
kind: Secret
metadata:
  name: k3s-test-rancher-id
  namespace: default
type: Opaque
data:
  clusterId: Yy1tLWZha2UwMDAx

---
apiVersion: v1
kind: Secret
metadata:
  name: k3s-test-node-command
  namespace: default
type: Opaque
data:
  nodeCommand:   # pragma: allowlist secret
  insecureNodeCommand:   # pragma: allowlist secret
  token: RkFLRS1SRUdJU1RSQVRJT04tVE9LRU4tTk9ULUEtQ1JFREVOVElBTA==  # pragma: allowlist secret

---
apiVersion: v1
kind: Secret
metadata:
  name: rke2-prod-rancher-id
  namespace: default
type: Opaque
data:
  clusterId: Yy1tLWZha2UwMDAy

---
apiVersion: v1
kind: Secret
metadata:
  name: rke2-prod-node-command
  namespace: default
type: Opaque
data:
  nodeCommand:   # pragma: allowlist secret
  insecureNodeCommand:   # pragma: allowlist secret
  token: RkFLRS1SRUdJU1RSQVRJT04tVE9LRU4tTk9ULUEtQ1JFREVOVElBTA==  # pragma: allowlist secret
