# Fixture copy of vault/app-secret-profile/examples/profiles/zaehlwerk.yaml — the AppSecretProfile xr-rancher's profiles fetch (#464).
# Keep in step with the source; crossplane render observes nothing on its own.
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: zaehlwerk
spec:
  reads:
    omni-pitcher-token:
      from: {app: homerun2, key: authToken}
    redis-password:
      from: {app: homerun2, key: redisPassword}
    schmetterpause-token:
      from: {app: schmetterpause, suffix: "-scoreboard", key: token}
