---
# The Vault policy mapping for ClusterStacks in environment `labul`
# (infra.sthings-vsphere). Selected by label, matched against the XR's
# spec.environmentConfig. Cluster-scoped, so only an admin changes which policies
# an order may end up with — the order itself names stores, never policies
# (crossplane-configurations#454).
#
# Rancher mode only. Every name here must exist in Vault: a role referencing a
# missing policy is accepted and its token silently has no permissions.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: cluster-vault-labul
  labels:
    cluster.stuttgart-things.com/environment: labul
data:
  vault:
    # The cert-manager auth: issue certificates from the PKI role.
    certManagerPolicies:
      - pki-issue
    # KV mount -> the existing policies that let a cluster's ESO read it.
    # The keys double as an allow-list: a store not listed here fails the order.
    secretStores:
      homerun2-pr:
        - read-homerun2-pr
      # One path segment on <mount>/data/+ each — a cluster's own entries plus
      # the shared `_` ones (stuttgart-things/stuttgart-things#2999, #3017).
      homerun2:
        - read-homerun2-clusters
      schmetterpause:
        - read-schmetterpause-clusters
      observability:
        - read-observability-clusters
    # --- app secrets (AppSecretProfiles, #464) -------------------------------
    # Logical mount of a profile -> the real KV mount in this Vault.
    mounts:
      homerun2: homerun2
      schmetterpause: schmetterpause
    # Shared, externally seeded values: name used by profiles -> `_` entry.
    # Consumers read these directly; nothing copies them into a cluster entry.
    shared:
      git-pat:
        mount: homerun2
        entry: _git-pat
      object-store-backup:
        mount: schmetterpause
        entry: _backup
    # Entries live fleets still read from hand-seeded paths. A cluster whose
    # derived entry lands on one fails the order — the writer policy only grants
    # read there anyway. Drop once homerun2-test1 migrates (#464 step 7).
    reservedEntries:
      schmetterpause:
        - schmetterpause
        - schmetterpause-backup
        - schmetterpause-scoreboard
        - zaehlwerk
    # The provider-vault ClusterProviderConfig logging in as the
    # cluster-secrets-writer AppRole (write-{observability,homerun2,
    # schmetterpause}-clusters).
    writer:
      providerConfigName: vault-cluster-secrets
