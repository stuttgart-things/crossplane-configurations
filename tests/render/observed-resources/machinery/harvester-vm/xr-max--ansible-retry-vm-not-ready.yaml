# #556: runID changed, but the VMI is not Running and has no IP. The old
# AnsibleRun is re-emitted VERBATIM (old IP 10.31.104.9, no runID) instead of
# being dropped -- dropping it would delete it. The rebuild waits for the VM.
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: harvester-vm-max-vmi
  namespace: default
  annotations:
    crossplane.io/composition-resource-name: harvester-vm-max-vmi
status:
  atProvider:
    manifest:
      apiVersion: kubevirt.io/v1
      kind: VirtualMachineInstance
      metadata:
        name: harvester-vm-max
        namespace: vms
      status:
        phase: Scheduling
---
# The AnsibleRun from the FIRST attempt. Its inventory carries the old IP
# 10.31.104.9, so a verbatim re-emit and a rebuild are told apart by the IP.
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: AnsibleRun
metadata:
  name: harvester-vm-max-ansible-run
  namespace: default
  annotations:
    crossplane.io/composition-resource-name: harvester-vm-max-ansible-run
spec:
  pipelineRunName: harvester-vm-max-ansible
  ansiblePlaybooks:
    - sthings.baseos.setup
  ansibleVarsInventory:
    - all+["10.31.104.9"]
  wrapInCrossplane: true
  crossplaneObjectName: harvester-vm-max-ansible
  crossplaneNamespace: default
  crossplaneProviderConfig: in-cluster
status:
  succeeded: "False"
  reason: Failed
