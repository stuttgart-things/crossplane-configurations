# #554: xr-max sets ansible.runID "2", the observed AnsibleRun has none and
# failed. VM Ready with IP -> the AnsibleRun is REBUILT: runID "2", current
# IP 10.31.103.50 in the inventory.
apiVersion: virtualenvironmentvm.proxmoxbpg.m.crossplane.io/v1alpha1
kind: EnvironmentVM
metadata:
  name: proxmoxvm-max
  namespace: default
  annotations:
    crossplane.io/composition-resource-name: proxmoxvm
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
      lastTransitionTime: "2026-11-05T10:00:00Z"
  atProvider:
    ipv4Addresses:
      - ["127.0.0.1"]
      - ["10.31.103.50"]
---
# The AnsibleRun from the FIRST attempt. Its inventory carries the old IP
# 10.31.103.9, so a verbatim re-emit and a rebuild are told apart by the IP.
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: AnsibleRun
metadata:
  name: proxmoxvm-max-ansible-run
  namespace: default
  annotations:
    crossplane.io/composition-resource-name: ansible-run
spec:
  pipelineRunName: proxmoxvm-max-ansible
  ansiblePlaybooks:
    - sthings.baseos.setup
  ansibleVarsInventory:
    - all+["10.31.103.9"]
  wrapInCrossplane: true
  crossplaneObjectName: proxmoxvm-max-ansible
  crossplaneNamespace: default
  crossplaneProviderConfig: in-cluster
status:
  succeeded: "False"
  reason: Failed
