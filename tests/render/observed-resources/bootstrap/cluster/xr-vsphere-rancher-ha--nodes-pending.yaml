    lastTransitionTime: '2026-10-16T08:00:00Z'
  - type: Synced
    status: 'True'
    reason: ReconcileSuccess
    lastTransitionTime: '2026-10-16T08:00:00Z'
  share:
    ip:
    - 10.100.136.121
    moid: vm-1
    powerState: poweredOn
    ansibleReady: true
    ansibleSucceeded: 'True'
    ansibleCompletionTime: '2026-10-16T08:00:00Z'
---
apiVersion: resources.stuttgart-things.com/v1alpha1
