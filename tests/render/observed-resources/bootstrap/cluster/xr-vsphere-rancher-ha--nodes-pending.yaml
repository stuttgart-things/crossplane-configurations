# Platform and ClusterAccess are ready, but nodes 2 and 3 have not finished
# their join: the aggregate gate holds status.ready false and the stage reads
# `nodes`, with stages.nodes.pending naming both (xplane-cluster 0.26.0, #170).
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: RancherCluster
metadata:
  name: rancher-vsphere-ha-rancher
  namespace: default
  annotations:
    crossplane.io/composition-resource-name: rancher
spec:
  environmentConfig: rancher-labda-rke2
  clusterAnnotations:
    field.cattle.io/no-creator-rbac: 'true'
  clusterSpec:
    rkeConfig:
      chartValues:
        rke2-coredns:
          servers:
          - zones:
            - zone: 4sthings.tiab.ssc.sva.de.
            port: 53
            plugins:
            - name: errors
            - name: cache
              parameters: 30
              configBlock: serve_stale 24h
            - name: template
              parameters: ANY HINFO
              configBlock: rcode NOERROR
            - name: forward
              parameters: . 10.100.136.115
          - zones:
            - zone: .
              use_tcp: true
            port: 53
            plugins:
            - name: errors
            - name: health
              configBlock: lameduck 10s
            - name: ready
            - name: kubernetes
              parameters: in-addr.arpa ip6.arpa
              configBlock: 'pods insecure

                fallthrough in-addr.arpa ip6.arpa

                ttl 30'
            - name: prometheus
              parameters: 0.0.0.0:9153
            - name: forward
              parameters: . /etc/resolv.conf
            - name: cache
              parameters: 30
              configBlock: serve_stale 24h
            - name: loop
            - name: reload
            - name: loadbalance
  argocd:
    register: true
    reservation:
      enabled: true
      networkKey: 10.100.136
    labels:
      network-platform: 'true'
      network-platform/cert-manager-vault-pki: 'false'
      network-platform/cilium-gateway-secondary: 'false'
      storage-platform: 'true'
      storage-platform/longhorn: 'false'
      storage-platform/nfs-csi-install: 'false'
      storage-platform/nfs-csi-storageclasses: 'false'
      security-platform: 'true'
      auto-project: 'true'
      security-platform/external-secrets-stores: 'true'
      env: LabDA
    annotations:
      observability-platform.stuttgart-things.com/storage-class: openebs-hostpath
      homerun2-platform.stuttgart-things.com/storage-class: openebs-hostpath
      clusterbook.stuttgart-things.com/vault-server: https://vault-vsphere.tiab.labda.sva.de:8200
      clusterbook.stuttgart-things.com/wildcard-issuer-name: vault-pki-k8s
      external-secrets.stuttgart-things.com/kv-mounts: rancher-vsphere-ha
      external-secrets.stuttgart-things.com/vault-server: https://openbao.sthings-infra.4sthings.tiab.ssc.sva.de
  name: rancher-vsphere-ha
  machineGlobalConfig:
    cni: none
    disable-kube-proxy: true
    ingress-controller: none
    disable:
    - rke2-traefik-crd
    - rke2-gateway-api-crd
  nodeRegistration:
    publish: true
    secretNamespace: tekton-ci  # pragma: allowlist secret
status:
  conditions:
  - type: Ready
    status: 'True'
    reason: Available
    lastTransitionTime: '2026-10-16T08:00:00Z'
  - type: Synced
    status: 'True'
    reason: ReconcileSuccess
    lastTransitionTime: '2026-10-16T08:00:00Z'
  nodeCommandSecret: rancher-vsphere-ha-node-command  # pragma: allowlist secret
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  name: rancher-vsphere-ha-kubeconfig-vault
  namespace: default
  annotations:
    crossplane.io/composition-resource-name: kubeconfig-vault
spec:
  providerConfigRef:
    name: in-cluster
    kind: ClusterProviderConfig
  forProvider:
    source: Inline
    module: "terraform {\n  required_providers {\n    vault = {\n      source  = \"\
      hashicorp/vault\"\n      version = \"~> 3.25\"\n    }\n  }\n}\n\nvariable \"\
      vault_addr\" {\n  type = string\n}\n\nvariable \"metadata_path\" {\n  type =\
      \ string\n}\n\nvariable \"cluster_name\" {\n  type = string\n}\n\nvariable \"\
      vault_role_id\" {\n  type = string\n}\n\nvariable \"vault_secret_id\" {\n  type\
      \      = string\n  sensitive = true\n}\n\nprovider \"vault\" {\n  address  \
      \        = var.vault_addr\n  skip_tls_verify  = true\n  skip_child_token = true\n\
      \n  auth_login {\n    path = \"auth/approle/login\"\n    parameters = {\n  \
      \    role_id   = var.vault_role_id\n      secret_id = var.vault_secret_id\n\
      \    }\n  }\n}\n\n# Owns the ENTRY, never its content: the join play writes\
      \ the kubeconfig into\n# <mount>/data/<cluster> and keeps writing new versions.\
      \ Writing custom_metadata\n# is what marks the entry as Crossplane-owned; destroying\
      \ this resource DELETEs\n# the metadata path, and with it every version.\n#\n\
      # disable_read: a GET on the metadata path returns a different shape than the\n\
      # POST takes, so reading it back would diff forever.\nresource \"vault_generic_endpoint\"\
      \ \"kubeconfig_metadata\" {\n  path                 = var.metadata_path\n  disable_read\
      \         = true\n  ignore_absent_fields = true\n\n  data_json = jsonencode({\n\
      \    custom_metadata = {\n      \"managed-by\" = \"crossplane\"\n      \"cluster\"\
      \    = var.cluster_name\n    }\n  })\n}\n"
    vars:
    - key: vault_addr
      value: https://vault-vsphere.tiab.labda.sva.de:8200
    - key: metadata_path
      value: kubeconfigs/metadata/rancher-vsphere-ha
    - key: cluster_name
      value: rancher-vsphere-ha
    varFiles:
    - source: SecretKey
      format: HCL
      secretKeyRef:
        name: vault-kubeconfig-writer-labda
        key: terraform.tfvars
status:
  conditions:
  - type: Ready
    status: 'True'
    reason: Available
    lastTransitionTime: '2026-10-16T08:00:00Z'
  - type: Synced
    status: 'True'
    reason: ReconcileSuccess
    lastTransitionTime: '2026-10-16T08:00:00Z'
---
