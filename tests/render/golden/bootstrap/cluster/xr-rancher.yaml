      homerun2-platform.stuttgart-things.com/homerun2-secret-store: vault-homerun2
      homerun2-platform.stuttgart-things.com/secret-store: vault-homerun2
      homerun2-platform.stuttgart-things.com/shared-git-pat-secret-key: _git-pat
      homerun2-platform.stuttgart-things.com/shared-git-pat-secret-store: vault-homerun2
      homerun2-platform.stuttgart-things.com/storage-class: openebs-hostpath
      observability-platform.stuttgart-things.com/alert-webhook-secret-key: _omni-pitcher
      observability-platform.stuttgart-things.com/alert-webhook-url: https://omni.platform.sthings-vsphere.labul.sva.de/pitch/grafana
      observability-platform.stuttgart-things.com/secret-store: vault-observability
      observability-platform.stuttgart-things.com/storage-class: openebs-hostpath
      tabletennis-platform.stuttgart-things.com/homerun2-secret-key: rke2-rancher-1
      tabletennis-platform.stuttgart-things.com/homerun2-secret-store: vault-homerun2
