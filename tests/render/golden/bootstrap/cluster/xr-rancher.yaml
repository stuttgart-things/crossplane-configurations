---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/composition-resource-name: kubeconfig-vault
  labels:
    crossplane.io/composite: rke2-rancher-1
  name: rke2-rancher-1-kubeconfig-vault
  namespace: default
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: ClusterStack
    name: rke2-rancher-1
    uid: a9303176-99df-5a6a-b0b8-ffa8a0bb3a13
spec:
  forProvider:
    module: |
      terraform {
        required_providers {
          vault = {
            source  = "hashicorp/vault"
            version = "~> 3.25"
          }
        }
      }

      variable "vault_addr" {
        type = string
      }

      variable "metadata_path" {
        type = string
      }

      variable "cluster_name" {
        type = string
      }

      variable "vault_role_id" {
        type = string
      }

      variable "vault_secret_id" {
        type      = string
        sensitive = true
      }

      provider "vault" {
        address          = var.vault_addr
        skip_tls_verify  = true
        skip_child_token = true

        auth_login {
          path = "auth/approle/login"
          parameters = {
            role_id   = var.vault_role_id
            secret_id = var.vault_secret_id
          }
        }
      }

      # Owns the ENTRY, never its content: the join play writes the kubeconfig into
      # <mount>/data/<cluster> and keeps writing new versions. Writing custom_metadata
      # is what marks the entry as Crossplane-owned; destroying this resource DELETEs
      # the metadata path, and with it every version.
      #
      # disable_read: a GET on the metadata path returns a different shape than the
      # POST takes, so reading it back would diff forever.
      resource "vault_generic_endpoint" "kubeconfig_metadata" {
        path                 = var.metadata_path
        disable_read         = true
        ignore_absent_fields = true

        data_json = jsonencode({
          custom_metadata = {
            "managed-by" = "crossplane"
            "cluster"    = var.cluster_name
          }
        })
      }
    source: Inline
    varFiles:
    - format: HCL
      secretKeyRef:
        key: terraform.tfvars
        name: vault-kubeconfig-writer
      source: SecretKey
    vars:
    - key: vault_addr
      value: https://vault.infra.sthings-vsphere.labul.sva.de
    - key: metadata_path
      value: kubeconfigs/metadata/rke2-rancher-1
    - key: cluster_name
      value: rke2-rancher-1
  providerConfigRef:
    kind: ClusterProviderConfig
    name: in-cluster
---
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: RancherCluster
metadata:
  annotations:
    crossplane.io/composition-resource-name: rancher
  labels:
    crossplane.io/composite: rke2-rancher-1
  name: rke2-rancher-1-rancher
  namespace: default
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: ClusterStack
    name: rke2-rancher-1
    uid: a9303176-99df-5a6a-b0b8-ffa8a0bb3a13
spec:
  argocd:
    annotations:
      clusterbook.stuttgart-things.com/wildcard-issuer-name: vault-pki-k8s
    labels:
      env: LabUL
      network-platform: "true"
      network-platform/cert-manager-cluster-ca: "true"
      network-platform/cert-manager-install: "true"
      network-platform/cert-manager-selfsigned: "true"
      network-platform/cert-manager-vault-pki: "false"
      network-platform/cilium-lb: "true"
      network-platform/trust-manager-bundle: "true"
      network-platform/trust-manager-install: "true"
    register: true
    reservation:
      enabled: true
      networkKey: 10.31.102
  environmentConfig: rancher-join-test
  kubernetesVersion: v1.36.4+rke2r1
  machineGlobalConfig:
    cni: none
    disable:
    - rke2-traefik-crd
    - rke2-gateway-api-crd
    disable-kube-proxy: true
    ingress-controller: none
  name: rke2-rancher-1
  nodeRegistration:
    publish: true
    secretNamespace: tekton-ci
