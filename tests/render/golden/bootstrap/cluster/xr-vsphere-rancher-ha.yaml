---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/composition-resource-name: kubeconfig-vault
  labels:
    crossplane.io/composite: rancher-vsphere-ha
  name: rancher-vsphere-ha-kubeconfig-vault
  namespace: default
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: ClusterStack
    name: rancher-vsphere-ha
    uid: 7b0ddcbf-e01c-5bb7-8747-5e43725b88b9
spec:
  forProvider:
    module: |
      terraform {
        required_providers {
          vault = {
            source  = "hashicorp/vault"
            version = "~> 3.25"
          }
        }
      }

      variable "vault_addr" {
        type = string
      }

      variable "metadata_path" {
        type = string
      }

      variable "cluster_name" {
        type = string
      }

      variable "vault_role_id" {
        type = string
      }

      variable "vault_secret_id" {
        type      = string
        sensitive = true
      }

      provider "vault" {
        address          = var.vault_addr
        skip_tls_verify  = true
        skip_child_token = true

        auth_login {
          path = "auth/approle/login"
          parameters = {
            role_id   = var.vault_role_id
            secret_id = var.vault_secret_id
          }
        }
      }

      # Owns the ENTRY, never its content: the join play writes the kubeconfig into
      # <mount>/data/<cluster> and keeps writing new versions. Writing custom_metadata
      # is what marks the entry as Crossplane-owned; destroying this resource DELETEs
      # the metadata path, and with it every version.
      #
      # disable_read: a GET on the metadata path returns a different shape than the
      # POST takes, so reading it back would diff forever.
      resource "vault_generic_endpoint" "kubeconfig_metadata" {
        path                 = var.metadata_path
        disable_read         = true
        ignore_absent_fields = true

        data_json = jsonencode({
          custom_metadata = {
            "managed-by" = "crossplane"
            "cluster"    = var.cluster_name
          }
        })
      }
    source: Inline
    varFiles:
    - format: HCL
      secretKeyRef:
        key: terraform.tfvars
        name: vault-kubeconfig-writer-labda
      source: SecretKey
    vars:
    - key: vault_addr
      value: https://vault-vsphere.tiab.labda.sva.de:8200
    - key: metadata_path
      value: kubeconfigs/metadata/rancher-vsphere-ha
    - key: cluster_name
      value: rancher-vsphere-ha
  providerConfigRef:
    kind: ClusterProviderConfig
    name: in-cluster
---
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: RancherCluster
metadata:
  annotations:
    crossplane.io/composition-resource-name: rancher
  labels:
    crossplane.io/composite: rancher-vsphere-ha
  name: rancher-vsphere-ha-rancher
  namespace: default
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: ClusterStack
    name: rancher-vsphere-ha
    uid: 7b0ddcbf-e01c-5bb7-8747-5e43725b88b9
spec:
  argocd:
    annotations:
      cicd-platform.stuttgart-things.com/storage-class: openebs-hostpath
      clusterbook.stuttgart-things.com/vault-server: https://vault-vsphere.tiab.labda.sva.de:8200
      clusterbook.stuttgart-things.com/wildcard-issuer-name: vault-pki-k8s
      external-secrets.stuttgart-things.com/kv-mounts: rancher-vsphere-ha
      external-secrets.stuttgart-things.com/vault-server: https://openbao.sthings-infra.4sthings.tiab.ssc.sva.de
      homerun2-platform.stuttgart-things.com/storage-class: openebs-hostpath
      observability-platform.stuttgart-things.com/storage-class: openebs-hostpath
    labels:
      auto-project: "true"
      env: LabDA
      network-platform: "true"
      network-platform/cert-manager-vault-pki: "false"
      network-platform/cilium-gateway-secondary: "false"
      security-platform: "true"
      security-platform/external-secrets-stores: "true"
      storage-platform: "true"
      storage-platform/longhorn: "false"
      storage-platform/nfs-csi-install: "false"
      storage-platform/nfs-csi-storageclasses: "false"
    register: true
    reservation:
      enabled: true
      networkKey: 10.100.136
  clusterAnnotations:
    field.cattle.io/no-creator-rbac: "true"
  clusterSpec:
    rkeConfig:
      chartValues:
        rke2-coredns:
          servers:
          - plugins:
            - name: errors
            - configBlock: serve_stale 24h
              name: cache
              parameters: 30
            - configBlock: rcode NOERROR
              name: template
              parameters: ANY HINFO
            - name: forward
              parameters: . 10.100.136.115
            port: 53
            zones:
            - zone: 4sthings.tiab.ssc.sva.de.
          - plugins:
            - name: errors
            - configBlock: lameduck 10s
              name: health
            - name: ready
            - configBlock: |-
                pods insecure
                fallthrough in-addr.arpa ip6.arpa
                ttl 30
              name: kubernetes
              parameters: in-addr.arpa ip6.arpa
            - name: prometheus
              parameters: 0.0.0.0:9153
            - name: forward
              parameters: . /etc/resolv.conf
            - configBlock: serve_stale 24h
              name: cache
              parameters: 30
            - name: loop
            - name: reload
            - name: loadbalance
            port: 53
            zones:
            - use_tcp: true
              zone: .
  environmentConfig: rancher-labda-rke2
  machineGlobalConfig:
    cni: none
    disable:
    - rke2-traefik-crd
    - rke2-gateway-api-crd
    disable-kube-proxy: true
    ingress-controller: none
  name: rancher-vsphere-ha
  nodeRegistration:
    publish: true
    secretNamespace: tekton-ci
