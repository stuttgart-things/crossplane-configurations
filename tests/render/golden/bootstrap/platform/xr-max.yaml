    controller: true
    kind: Platform
    name: production
    uid: f2f8c67d-a306-5252-869c-f4b2df96b7cd
spec:
  clusterName: production
  k8sAuths:
  - boundServiceAccountNames:
    - cert-manager
    boundServiceAccountNamespaces:
    - cert-manager
    name: certmanager
    tokenPolicies:
    - pki-issue
  - boundServiceAccountNames:
    - external-secrets
    boundServiceAccountNamespaces:
    - external-secrets
    name: eso
    policies:
    - kvMount: kv
      name: kv-own
      read:
      - own
    - kvMount: kv
      name: kv-cicd
      read:
      - cicd
  providerConfigKind: ClusterProviderConfig
  providerConfigName: in-cluster
  skipTlsVerify: true
  vaultAddr: https://vault.example.com
  vaultTokenSecret: vault-approle
