---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-cert-manager-observe
  labels:
    crossplane.io/composite: production
  name: production-cert-manager-observe
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: Platform
    name: production
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: Endpoints
      metadata:
        name: cert-manager-webhook
        namespace: cert-manager
  managementPolicies:
  - Observe
  providerConfigRef:
    kind: ClusterProviderConfig
    name: production-kubernetes
---
apiVersion: config.stuttgart-things.com/v1alpha1
kind: FluxApps
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-flux-apps
  labels:
    crossplane.io/composite: production
  name: production-flux-apps
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: Platform
    name: production
    uid: ""
spec:
  apps:
  - name: dapr-control-plane
    path: ./components/control-plane
    sourceRef:
      kind: OCIRepository
      name: dapr
    substitute:
      DAPR_HA_ENABLED: "false"
      DAPR_NAMESPACE: dapr-system
      DAPR_VERSION: 1.17.4
    timeout: 20m
  - dependsOn:
    - name: dapr-control-plane
    name: dapr-template-execution
    path: ./components/template-execution
    sourceRef:
      kind: OCIRepository
      name: dapr
    substitute:
      DAPR_BACKSTAGE_TPL_NAMESPACE: backstage-workflows
      DAPR_HA_ENABLED: "false"
      DAPR_NAMESPACE: dapr-system
      DAPR_VERSION: 1.17.4
      FLUX_SOURCE_API_VERSION: v1
    substituteFrom:
    - kind: Secret
      name: dapr-backstage-template-execution-vars
    targetNamespace: backstage-workflows
  kubernetesProviderConfigRef: production-kubernetes
  namespace: flux-system
---
apiVersion: config.stuttgart-things.com/v1alpha1
kind: FluxInit
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-flux-init
  labels:
    crossplane.io/composite: production
  name: production-flux-init
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: Platform
    name: production
    uid: ""
spec:
  clusterName: production
  helmProviderConfigRef: production-helm
  instance:
    components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    distribution: upstream
    sources:
    - kind: OCIRepository
      name: fleet-infra
      path: clusters/production
      pullSecret: ghcr-auth
      ref: latest
      url: oci://ghcr.io/stuttgart-things/fleet-infra
    - kind: GitRepository
      name: flux-apps
      path: apps/production
      ref: main
      url: https://github.com/stuttgart-things/flux-apps.git
    - kind: OCIRepository
      name: dapr
      ref: v1.18.1
      url: oci://ghcr.io/stuttgart-things/flux/apps/dapr
  kubernetesProviderConfigRef: production-kubernetes
  kustomize:
    patches:
    - patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --concurrent=8
      target:
        kind: Deployment
        name: kustomize-controller
  namespace: flux-system
  observeProviderConfigRef: in-cluster
  operatorChart:
    repoURL: oci://ghcr.io/controlplaneio-fluxcd/charts
    version: 0.55.0
  sops:
    ageKeySecretRef:
      key: age.agekey
      name: sops-age-key
      namespace: flux-system
    enabled: true
    secretName: sops-age
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-reviewer-crb
  labels:
    crossplane.io/composite: production
  name: production-reviewer-crb
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: Platform
    name: production
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: vault-auth-reviewer
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:auth-delegator
      subjects:
      - kind: ServiceAccount
        name: vault-auth-reviewer
        namespace: kube-system
  providerConfigRef:
    kind: ClusterProviderConfig
    name: production-kubernetes
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-reviewer-observe
  labels:
    crossplane.io/composite: production
  name: production-reviewer-observe
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: Platform
    name: production
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vault-auth-reviewer-token
        namespace: kube-system
  managementPolicies:
  - Observe
  providerConfigRef:
    kind: ClusterProviderConfig
    name: production-kubernetes
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-reviewer-sa
  labels:
    crossplane.io/composite: production
  name: production-reviewer-sa
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: Platform
    name: production
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: vault-auth-reviewer
        namespace: kube-system
  providerConfigRef:
    kind: ClusterProviderConfig
    name: production-kubernetes
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-reviewer-token
  labels:
    crossplane.io/composite: production
  name: production-reviewer-token
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: Platform
    name: production
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        annotations:
          kubernetes.io/service-account.name: vault-auth-reviewer
        name: vault-auth-reviewer-token
        namespace: kube-system
      type: kubernetes.io/service-account-token
  providerConfigRef:
    kind: ClusterProviderConfig
    name: production-kubernetes
---
apiVersion: config.stuttgart-things.com/v1alpha1
kind: VaultK8sAuth
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-vault-auth
  labels:
    crossplane.io/composite: production
  name: production-vault-auth
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: Platform
    name: production
    uid: ""
spec:
  clusterName: production
  k8sAuths:
  - boundServiceAccountNames:
    - cert-manager
    boundServiceAccountNamespaces:
    - cert-manager
    name: certmanager
    tokenPolicies:
    - pki-issue
  - boundServiceAccountNames:
    - external-secrets
    boundServiceAccountNamespaces:
    - external-secrets
    name: eso
    policies:
    - kvMount: kv
      name: kv-own
      read:
      - own
    - kvMount: kv
      name: kv-cicd
      read:
      - cicd
  providerConfigKind: ClusterProviderConfig
  providerConfigName: in-cluster
  skipTlsVerify: true
  vaultAddr: https://vault.example.com
  vaultTokenSecret: vault-approle
