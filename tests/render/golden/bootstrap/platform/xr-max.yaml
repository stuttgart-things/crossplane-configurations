apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-cluster-secrets
  labels:
    crossplane.io/composite: production
  name: production-cluster-secrets
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: Platform
    name: production
    uid: f2f8c67d-a306-5252-869c-f4b2df96b7cd
spec:
  forProvider:
    module: |
      terraform {
        required_providers {
          vault = {
            source  = "hashicorp/vault"
            version = "~> 3.25"
          }
          random = {
            source  = "hashicorp/random"
            version = "~> 3.6"
          }
        }
      }

      variable "vault_addr" {
        type = string
      }

      variable "mount" {
        type = string
      }

      variable "entry" {
        type = string
      }

      # Maps travel as JSON: a Workspace var is a string, so the alternative would be
      # one variable per key and a module that is no longer a constant.
      variable "generated_keys_json" {
        type = string
      }

      variable "literal_values_json" {
        type = string
      }

      variable "vault_role_id" {
        type = string
      }

      variable "vault_secret_id" {
        type      = string
        sensitive = true
      }

      locals {
        generated_keys = jsondecode(var.generated_keys_json)
        literal_values = jsondecode(var.literal_values_json)
      }

      provider "vault" {
        address          = var.vault_addr
        skip_tls_verify  = true
        skip_child_token = true

        auth_login {
          path = "auth/approle/login"
          parameters = {
            role_id   = var.vault_role_id
            secret_id = var.vault_secret_id
          }
        }
      }

      # Alphanumeric on purpose. These values travel through Helm values, a URL query
      # and a file an Alertmanager config reads back -- every one of those has its own
      # quoting rules, and 32 alphanumeric characters carry more entropy than 16 with
      # punctuation anyway.
      resource "random_password" "generated" {
        for_each = local.generated_keys

        length  = each.value
        special = false
      }

      # delete_all_versions is what makes a teardown a real delete: without it the
      # destroy leaves the versions behind and the next cluster of the same name
      # reads the old password.
      resource "vault_kv_secret_v2" "cluster" {
        mount               = var.mount
        name                = var.entry
        delete_all_versions = true

        data_json = jsonencode(merge(
          local.literal_values,
          { for k, r in random_password.generated : k => r.result },
        ))
      }
    source: Inline
    varFiles:
    - format: HCL
      secretKeyRef:
        key: terraform.tfvars
        name: vault-cluster-secrets-writer
      source: SecretKey
    vars:
    - key: vault_addr
      value: https://vault.infra.sthings-vsphere.labul.sva.de
    - key: mount
      value: observability
    - key: entry
      value: kind1
    - key: generated_keys_json
      value: '{"grafana-admin-password": 32, "alertmanager-webhook-token": 32}'
    - key: literal_values_json
      value: '{"grafana-admin-user": "admin"}'
  providerConfigRef:
    kind: ClusterProviderConfig
    name: in-cluster
---
apiVersion: config.stuttgart-things.com/v1alpha1
kind: FluxApps
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-flux-apps
  labels:
    crossplane.io/composite: production
  name: production-flux-apps
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: Platform
    name: production
    uid: f2f8c67d-a306-5252-869c-f4b2df96b7cd
spec:
  apps:
  - name: dapr-control-plane
    path: ./components/control-plane
    sourceRef:
      kind: OCIRepository
      name: dapr
    substitute:
      DAPR_HA_ENABLED: "false"
      DAPR_NAMESPACE: dapr-system
      DAPR_VERSION: 1.17.4
    timeout: 20m
  - dependsOn:
    - name: dapr-control-plane
    name: dapr-template-execution
    path: ./components/template-execution
    sourceRef:
      kind: OCIRepository
      name: dapr
    substitute:
      DAPR_BACKSTAGE_TPL_NAMESPACE: backstage-workflows
      DAPR_HA_ENABLED: "false"
      DAPR_NAMESPACE: dapr-system
      DAPR_VERSION: 1.17.4
      FLUX_SOURCE_API_VERSION: v1
    substituteFrom:
    - kind: Secret
      name: dapr-backstage-template-execution-vars
    targetNamespace: backstage-workflows
  kubernetesProviderConfigRef: production-kubernetes
  namespace: flux-system
---
apiVersion: config.stuttgart-things.com/v1alpha1
kind: FluxInit
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-flux-init
  labels:
    crossplane.io/composite: production
  name: production-flux-init
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: Platform
    name: production
    uid: f2f8c67d-a306-5252-869c-f4b2df96b7cd
spec:
  clusterName: production
  helmProviderConfigRef: production-helm
  instance:
    components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    distribution: upstream
    sources:
    - kind: OCIRepository
      name: fleet-infra
      path: clusters/production
      pullSecret: ghcr-auth
      ref: latest
      url: oci://ghcr.io/stuttgart-things/fleet-infra
    - kind: GitRepository
      name: flux-apps
      path: apps/production
      ref: main
      url: https://github.com/stuttgart-things/flux-apps.git
    - kind: OCIRepository
      name: dapr
      ref: v1.18.1
      url: oci://ghcr.io/stuttgart-things/flux/apps/dapr
  kubernetesProviderConfigRef: production-kubernetes
  kustomize:
    patches:
    - patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --concurrent=8
      target:
        kind: Deployment
        name: kustomize-controller
  namespace: flux-system
  observeProviderConfigRef: in-cluster
  operatorChart:
    repoURL: oci://ghcr.io/controlplaneio-fluxcd/charts
    version: 0.55.0
  sops:
    ageKeySecretRef:
      key: age.agekey
      name: sops-age-key
      namespace: flux-system
    enabled: true
    secretName: sops-age
