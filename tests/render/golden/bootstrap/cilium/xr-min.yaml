      name: cilium
      repository: https://helm.cilium.io
      version: 1.19.2
    namespace: kube-system
    values:
      autoDirectNodeRoutes: true
      externalIPs:
        enabled: true
      gatewayAPI:
        enabled: true
      ipv4NativeRoutingCIDR: 10.244.0.0/16
      k8sServiceHost: ""
      k8sServicePort: 6443
      kubeProxyReplacement: true
      l2announcements:
        enabled: true
      operator:
        replicas: 1
