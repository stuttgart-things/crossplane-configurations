---
apiVersion: config.stuttgart-things.com/v1alpha1
kind: FluxApps
metadata:
  name: staging-apps
  namespace: crossplane-system
status:
  appCount: 2
  appsReady: false
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: staging-apps-app-crossplane, staging-apps-app-tekton'
    reason: Creating
    status: "False"
    type: Ready
  ready: false
  readyCount: 0
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: staging-apps-app-crossplane
  labels:
    crossplane.io/composite: staging-apps
  name: staging-apps-app-crossplane
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: FluxApps
    name: staging-apps
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: crossplane
        namespace: flux-system
      spec:
        dependsOn:
        - name: tekton
        interval: 1h
        path: ./apps/crossplane
        postBuild:
          substitute:
            CROSSPLANE_HELM_PROVIDER_VERSION: v0.21.0
            CROSSPLANE_K8S_PROVIDER_VERSION: v0.18.0
            CROSSPLANE_NAMESPACE: crossplane-system
            CROSSPLANE_VERSION: 1.20.0
        prune: true
        retryInterval: 1m
        sourceRef:
          kind: GitRepository
          name: flux-apps
        timeout: 10m
        wait: true
  providerConfigRef:
    kind: ClusterProviderConfig
    name: staging-kubernetes
  readiness:
    policy: DeriveFromObject
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: staging-apps-app-tekton
  labels:
    crossplane.io/composite: staging-apps
  name: staging-apps-app-tekton
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: FluxApps
    name: staging-apps
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: tekton
        namespace: flux-system
      spec:
        interval: 1h
        path: ./cicd/tekton
        postBuild:
          substitute:
            TEKTON_NAMESPACE: tekton-pipelines
            TEKTON_VERSION: 0.76.1
        prune: true
        retryInterval: 1m
        sourceRef:
          kind: GitRepository
          name: flux-apps
        timeout: 10m
        wait: true
  providerConfigRef:
    kind: ClusterProviderConfig
    name: staging-kubernetes
  readiness:
    policy: DeriveFromObject
