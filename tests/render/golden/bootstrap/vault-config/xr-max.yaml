  forProvider:
    chart:
      name: external-secrets
      repository: https://charts.external-secrets.io
      version: 0.11.3
    namespace: external-secrets-system
    values:
      certController:
        create: true
        livenessProbe:
          enabled: true
        readinessProbe:
          enabled: true
        requeueInterval: 5m
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
      installCRDs: true
      livenessProbe:
        enabled: true
      logLevel: info
      readinessProbe:
        enabled: true
      replicaCount: 1
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
      serviceMonitor:
        enabled: true
      webhook:
        certCheckInterval: 5m
        create: true
        lookaheadInterval: 168h
        port: 10250
    wait: true
    waitTimeout: 10m
  managementPolicies:
  - '*'
  providerConfigRef:
    kind: ClusterProviderConfig
    name: in-cluster
