---
apiVersion: config.stuttgart-things.com/v1alpha1
kind: VaultK8sAuth
metadata:
  name: vault-auth-max
  namespace: default
status:
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: vcluster-tink2-cicd-vault-auth, vcluster-tink2-dev-vault-auth,
      and vcluster-tink2-eso-vault-auth'
    reason: Creating
    status: "False"
    type: Ready
  share:
    auths:
    - name: eso
      ready: false
      workspace: vcluster-tink2-eso-vault-auth
    - name: dev
      ready: false
      workspace: vcluster-tink2-dev-vault-auth
    - name: cicd
      ready: false
      workspace: vcluster-tink2-cicd-vault-auth
    clusterName: vcluster-tink2
    ready: false
    vaultAddr: https://vault.example.com
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/composition-resource-name: vcluster-tink2-cicd-vault-auth
  labels:
    crossplane.io/composite: vault-auth-max
  name: vcluster-tink2-cicd-vault-auth
  namespace: default
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: VaultK8sAuth
    name: vault-auth-max
    uid: ""
spec:
  forProvider:
    entrypoint: ""
    inlineFormat: HCL
    module: |
      terraform {
        required_providers {
          vault = {
            source  = "hashicorp/vault"
            version = "~> 3.25"
          }
        }
      }

      provider "vault" {
        address          = var.vault_addr
        skip_tls_verify  = var.skip_tls_verify
        skip_child_token = true

        auth_login {
          path = "auth/approle/login"
          parameters = {
            role_id   = var.vault_role_id
            secret_id = var.vault_secret_id
          }
        }
      }

      resource "vault_auth_backend" "kubernetes" {
        type = "kubernetes"
        path = "${var.cluster_name}-${var.auth_name}"
      }

      # Empty map when no policies were declared, so a caller that only references
      # existing ones gets a plan identical to before.
      resource "vault_policy" "auth" {
        for_each = var.policies
        name     = "${var.cluster_name}-${each.key}"
        policy   = each.value
      }

      resource "vault_kubernetes_auth_backend_role" "service_account" {
        backend                          = vault_auth_backend.kubernetes.path
        role_name                        = var.auth_name
        bound_service_account_names      = var.bound_service_account_names
        bound_service_account_namespaces = var.bound_service_account_namespaces
        token_ttl                        = var.token_ttl
        # The reference is what orders the two: tofu creates the policy before the
        # role that names it, and destroys them in the reverse order. Splitting this
        # across two systems is what makes "role bound to a policy that is not there
        # yet" possible, and Vault reports that as nothing at all.
        token_policies                   = concat(var.token_policies, [for p in vault_policy.auth : p.name])
      }

      variable "auth_name" {
        type = string
      }

      variable "cluster_name" {
        type = string
      }

      variable "vault_addr" {
        type = string
      }

      variable "skip_tls_verify" {
        type    = bool
        default = false
      }

      variable "vault_role_id" {
        type      = string
        sensitive = true
      }

      variable "vault_secret_id" {
        type      = string
        sensitive = true
      }

      variable "token_policies" {
        type    = list(string)
        default = []
      }

      variable "policies" {
        type    = map(string)
        default = {}
      }

      variable "token_ttl" {
        type    = number
        default = 3600
      }

      variable "bound_service_account_names" {
        type    = list(string)
        default = ["default"]
      }

      variable "bound_service_account_namespaces" {
        type    = list(string)
        default = ["default"]
      }

      output "auth_backend_path" {
        value = vault_auth_backend.kubernetes.path
      }

      output "auth_role_name" {
        value = vault_kubernetes_auth_backend_role.service_account.role_name
      }

      output "policy_names" {
        value = [for p in vault_policy.auth : p.name]
      }
    remotePullPolicy: Always
    source: Inline
    varFiles:
    - format: HCL
      secretKeyRef:
        key: terraform.tfvars
        name: vault
      source: SecretKey
    vars:
    - key: auth_name
      value: cicd
    - key: cluster_name
      value: vcluster-tink2
    - key: vault_addr
      value: https://vault.example.com
    - key: skip_tls_verify
      value: "true"
    - key: token_policies
      value: '["read-all-tektoncd-kvv2"]'
    - key: token_ttl
      value: "3600"
    - key: bound_service_account_names
      value: '["default"]'
    - key: bound_service_account_namespaces
      value: '["tekton-ci"]'
    - key: policies
      value: '{}'
  managementPolicies:
  - '*'
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/composition-resource-name: vcluster-tink2-dev-vault-auth
  labels:
    crossplane.io/composite: vault-auth-max
  name: vcluster-tink2-dev-vault-auth
  namespace: default
  ownerReferences:
  - apiVersion: config.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: VaultK8sAuth
    name: vault-auth-max
    uid: ""
spec:
  forProvider:
    entrypoint: ""
    inlineFormat: HCL
    module: |
      terraform {
        required_providers {
          vault = {
            source  = "hashicorp/vault"
            version = "~> 3.25"
          }
          kubernetes = {
            source  = "hashicorp/kubernetes"
            version = "~> 2.0"
          }
        }
      }

      provider "vault" {
        address          = var.vault_addr
        skip_tls_verify  = var.skip_tls_verify
        skip_child_token = true

        auth_login {
          path = "auth/approle/login"
          parameters = {
            role_id   = var.vault_role_id
            secret_id = var.vault_secret_id
          }
        }
      }

      resource "vault_auth_backend" "kubernetes" {
        type = "kubernetes"
        path = "${var.cluster_name}-${var.auth_name}"
      }

      # Empty map when no policies were declared, so a caller that only references
      # existing ones gets a plan identical to before.
      resource "vault_policy" "auth" {
        for_each = var.policies
        name     = "${var.cluster_name}-${each.key}"
        policy   = each.value
      }

      resource "vault_kubernetes_auth_backend_role" "service_account" {
        backend                          = vault_auth_backend.kubernetes.path
        role_name                        = var.auth_name
        bound_service_account_names      = var.bound_service_account_names
        bound_service_account_namespaces = var.bound_service_account_namespaces
        token_ttl                        = var.token_ttl
        # The reference is what orders the two: tofu creates the policy before the
        # role that names it, and destroys them in the reverse order. Splitting this
        # across two systems is what makes "role bound to a policy that is not there
        # yet" possible, and Vault reports that as nothing at all.
        token_policies                   = concat(var.token_policies, [for p in vault_policy.auth : p.name])
      }

      variable "auth_name" {
        type = string
      }

      variable "cluster_name" {
        type = string
      }

      variable "vault_addr" {
        type = string
      }

      variable "skip_tls_verify" {
        type    = bool
        default = false
      }

      variable "vault_role_id" {
        type      = string
        sensitive = true
      }

      variable "vault_secret_id" {
        type      = string
        sensitive = true
      }

      variable "token_policies" {
        type    = list(string)
        default = []
      }

      variable "policies" {
        type    = map(string)
        default = {}
      }

      variable "token_ttl" {
        type    = number
        default = 3600
      }

      variable "bound_service_account_names" {
        type    = list(string)
        default = ["default"]
      }

      variable "bound_service_account_namespaces" {
        type    = list(string)
        default = ["default"]
      }

      output "auth_backend_path" {
        value = vault_auth_backend.kubernetes.path
      }

      output "auth_role_name" {
        value = vault_kubernetes_auth_backend_role.service_account.role_name
      }

      output "policy_names" {
        value = [for p in vault_policy.auth : p.name]
      }

      provider "kubernetes" {}

      data "kubernetes_secret" "sa" {
        metadata {
          name      = var.sa_secret_name
          namespace = var.sa_secret_namespace
        }
      }

      resource "vault_kubernetes_auth_backend_config" "kubernetes" {
        backend                = vault_auth_backend.kubernetes.path
        kubernetes_host        = var.kubernetes_host
        # try(): the DESTROY re-evaluates this expression, and by then the reviewer
        # Secret is usually gone -- it is a composed child of the same Platform XR, so
        # it is deleted in parallel with this Workspace. data.kubernetes_secret.sa.data
        # is then null, indexing it raises "Attempt to index null value", and the
        # destroy fails before it removes anything. The Workspace then hangs in
        # Deleting forever and blocks the whole teardown, because its NAME is derived
        # from clusterName+authName and a replacement XR needs that same name.
        # Measured on argoplatform-test1, 2026-08-19 -- see
        # crossplane-configurations#333.
        #
        # Destroy does not use these values, so falling back to null is correct there.
        # On CREATE/UPDATE a null is NOT silently accepted: the precondition below
        # fails loudly instead, which is the behaviour the bare index used to give.
        kubernetes_ca_cert     = try(data.kubernetes_secret.sa.data[var.sa_ca_cert_key], null)
        token_reviewer_jwt     = try(data.kubernetes_secret.sa.data[var.sa_token_key], null)
        disable_iss_validation = var.disable_iss_validation
        disable_local_ca_jwt   = var.disable_local_ca_jwt

        depends_on = [vault_auth_backend.kubernetes]

        # Keeps the loud failure that the bare index provided, but only where it
        # belongs. Preconditions are not evaluated when the resource is destroyed,
        # so this cannot re-introduce the hang above.
        lifecycle {
          precondition {
            condition     = try(data.kubernetes_secret.sa.data[var.sa_ca_cert_key], null) != null
            error_message = "Secret ${var.sa_secret_namespace}/${var.sa_secret_name} has no key ${var.sa_ca_cert_key}. The reviewer ServiceAccount secret must exist before the Vault kubernetes auth backend can be configured."
          }
          precondition {
            condition     = try(data.kubernetes_secret.sa.data[var.sa_token_key], null) != null
            error_message = "Secret ${var.sa_secret_namespace}/${var.sa_secret_name} has no key ${var.sa_token_key}."
          }
        }
      }

      variable "kubernetes_host" {
        type = string
      }

      variable "sa_secret_name" {
        type = string
      }

      variable "sa_secret_namespace" {
        type = string
      }

      variable "sa_ca_cert_key" {
        type    = string
        default = "ca.crt"
      }

      variable "sa_token_key" {
        type    = string
        default = "token"
      }

      variable "disable_iss_validation" {
        type    = bool
        default = true
      }

      variable "disable_local_ca_jwt" {
        type    = bool
        default = true
      }
    remotePullPolicy: Always
    source: Inline
    varFiles:
    - format: HCL
      secretKeyRef:
        key: terraform.tfvars
        name: vault
      source: SecretKey
    vars:
    - key: auth_name
      value: dev
    - key: cluster_name
      value: vcluster-tink2
    - key: vault_addr
      value: https://vault.example.com
    - key: skip_tls_verify
      value: "true"
    - key: token_policies
      value: '["read-all-s3-kvv2","read-write-all-s3-kvv2"]'
    - key: token_ttl
      value: "7200"
    - key: bound_service_account_names
      value: '["default","vault-auth"]'
    - key: bound_service_account_namespaces
      value: '["default","applications"]'
    - key: policies
      value: '{}'
    - key: kubernetes_host
      value: https://kubernetes.default.svc:443
    - key: sa_secret_name
      value: vault-dev
    - key: sa_secret_namespace
      value: default
    - key: sa_ca_cert_key
      value: ca.crt
    - key: sa_token_key
      value: token
    - key: disable_iss_validation
      value: "true"
    - key: disable_local_ca_jwt
      value: "true"
  managementPolicies:
  - '*'
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
