        - name: gitRepoUrl
          value: https://github.com/stuttgart-things/stage-time.git
        - name: gitRevision
          value: main
        - name: extraEnvSecretName
          value: ansible-extra-env
        - name: decryptSops
          value: "true"
        - name: sopsFiles
