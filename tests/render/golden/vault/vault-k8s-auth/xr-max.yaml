    controller: true
    kind: VaultK8sAuth
    name: vault-k8s-auth-max
    uid: e7c48d76-e4d0-557e-babe-81cba82f2a12
spec:
  forProvider:
    name: xpv-adopt-kv-cicd
    policy: |
      path "kv/data/cicd" { capabilities = ["read"] }
      path "kv/data/cicd/*" { capabilities = ["read"] }
      path "kv/metadata/cicd" { capabilities = ["read", "list"] }
      path "kv/metadata/cicd/*" { capabilities = ["read", "list"] }
      path "kv/data/shared" { capabilities = ["read"] }
      path "kv/data/shared/*" { capabilities = ["read"] }
      path "kv/metadata/shared" { capabilities = ["read", "list"] }
      path "kv/metadata/shared/*" { capabilities = ["read", "list"] }
  managementPolicies:
  - Observe
  providerConfigRef:
    kind: ClusterProviderConfig
    name: vault
