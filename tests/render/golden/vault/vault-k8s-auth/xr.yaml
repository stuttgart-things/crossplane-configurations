---
apiVersion: vault.vault.m.upbound.io/v1alpha1
kind: Policy
metadata:
  annotations:
    crossplane.io/composition-resource-name: xpv-proto-eso-policy-observability
  labels:
    crossplane.io/composite: vault-k8s-auth
    vault.stuttgart-things.com/auth: eso
    vault.stuttgart-things.com/cluster: xpv-proto
  name: xpv-proto-eso-policy-observability
  namespace: default
  ownerReferences:
  - apiVersion: vault.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: VaultK8sAuth
    name: vault-k8s-auth
    uid: 33c6e3af-63f8-598a-bae7-fb9754c5d46f
spec:
  forProvider:
    name: xp-xpv-proto-observability
    policy: |
      path "observability/data/xpv-proto" { capabilities = ["read"] }
      path "observability/data/xpv-proto/*" { capabilities = ["read"] }
      path "observability/metadata/xpv-proto" { capabilities = ["read", "list"] }
      path "observability/metadata/xpv-proto/*" { capabilities = ["read", "list"] }
      path "observability/data/_omni-pitcher" { capabilities = ["read"] }
      path "observability/data/_omni-pitcher/*" { capabilities = ["read"] }
      path "observability/metadata/_omni-pitcher" { capabilities = ["read", "list"] }
      path "observability/metadata/_omni-pitcher/*" { capabilities = ["read", "list"] }
  providerConfigRef:
    kind: ClusterProviderConfig
    name: vault
