---
apiVersion: zitadel.stuttgart-things.com/v1alpha1
kind: ZitadelOidcClient
metadata:
  name: argocd-cluster1
  namespace: default
spec:
  crossplane:
    resourceRefs:
    - apiVersion: kv.vault.m.upbound.io/v1alpha1
      kind: SecretV2
      name: argocd-cluster1-vault
    - apiVersion: opentofu.m.upbound.io/v1beta1
      kind: Workspace
      name: argocd-cluster1-zitadel-app
status:
  app:
    appId: "300000000000000001"
    projectId: "200000000000000001"
    ready: true
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: WatchCircuitClosed
    status: "True"
    type: Responsive
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: ReconcileSuccess
    status: "True"
    type: Synced
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: Creating
    status: "False"
    type: Ready
  vault:
    entry: kv/cluster1/argocd-oidc
    ready: false
---
apiVersion: kv.vault.m.upbound.io/v1alpha1
kind: SecretV2
metadata:
  annotations:
    crossplane.io/composition-resource-name: vault-entry
    zitadel.stuttgart-things.com/entry: kv/cluster1/argocd-oidc
  labels:
    crossplane.io/composite: argocd-cluster1
  name: argocd-cluster1-vault
  namespace: default
  ownerReferences:
  - apiVersion: zitadel.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: ZitadelOidcClient
    name: argocd-cluster1
    uid: b6ed1aea-e2a8-5f84-92b9-cc3e53f0d779
spec:
  forProvider:
    dataJsonSecretRef:
      key: vault_data_json
      name: argocd-cluster1-zitadel-oidc
    deleteAllVersions: true
    mount: kv
    name: cluster1/argocd-oidc
  managementPolicies:
  - Observe
  - Create
  - Update
  - LateInitialize
  providerConfigRef:
    kind: ClusterProviderConfig
    name: vault-cluster-secrets
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/composition-resource-name: workspace
  labels:
    crossplane.io/composite: argocd-cluster1
  name: argocd-cluster1-zitadel-app
  namespace: default
  ownerReferences:
  - apiVersion: zitadel.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: ZitadelOidcClient
    name: argocd-cluster1
    uid: b6ed1aea-e2a8-5f84-92b9-cc3e53f0d779
spec:
  forProvider:
    module: |
      terraform {
        required_version = ">= 1.5"
        required_providers {
          zitadel = {
            source  = "zitadel/zitadel"
            version = "~> 3.0"
          }
        }
      }

      variable "zitadel_domain" {
        type = string
      }

      variable "jwt_profile_json" {
        type      = string
        sensitive = true
      }

      variable "org_name" {
        type = string
      }

      variable "project_name" {
        type = string
      }

      # null in any optional field means the module's default.
      variable "app" {
        type = object({
          name                        = string
          redirect_uris               = list(string)
          post_logout_redirect_uris   = optional(list(string))
          app_type                    = optional(string)
          auth_method_type            = optional(string)
          grant_types                 = optional(list(string))
          response_types              = optional(list(string))
          access_token_type           = optional(string)
          access_token_role_assertion = optional(bool)
          id_token_role_assertion     = optional(bool)
          id_token_userinfo_assertion = optional(bool)
          dev_mode                    = optional(bool)
        })
      }

      variable "vault_keys" {
        type = object({
          client_id     = string
          client_secret = string
        })
      }

      # No `port` (an explicit 443 breaks the issuer match) and no
      # `insecure` (it means plain http).
      provider "zitadel" {
        domain           = var.zitadel_domain
        jwt_profile_json = var.jwt_profile_json
      }

      module "app" {
        source = "git::https://github.com/stuttgart-things/zitadel-base-setup//modules/oidc-app?ref=v0.2.0"

        org_name     = var.org_name
        project_name = var.project_name

        name                        = var.app.name
        redirect_uris               = var.app.redirect_uris
        post_logout_redirect_uris   = var.app.post_logout_redirect_uris
        app_type                    = var.app.app_type
        auth_method_type            = var.app.auth_method_type
        grant_types                 = var.app.grant_types
        response_types              = var.app.response_types
        access_token_type           = var.app.access_token_type
        access_token_role_assertion = var.app.access_token_role_assertion
        id_token_role_assertion     = var.app.id_token_role_assertion
        id_token_userinfo_assertion = var.app.id_token_userinfo_assertion
        dev_mode                    = var.app.dev_mode
      }

      output "client_id" {
        value     = module.app.client_id
        sensitive = true
      }

      output "client_secret" {
        value     = module.app.client_secret
        sensitive = true
      }

      # The Vault entry as one JSON object, for the SecretV2's
      # dataJsonSecretRef: the credentials go Workspace -> connection
      # Secret -> Vault without passing through any spec.
      output "vault_data_json" {
        value = jsonencode({
          (var.vault_keys.client_id)     = module.app.client_id
          (var.vault_keys.client_secret) = module.app.client_secret
        })
        sensitive = true
      }

      output "app_id" {
        value = module.app.app_id
      }

      output "project_id" {
        value = module.app.project_id
      }
    source: Inline
    varFiles:
    - format: HCL
      secretKeyRef:
        key: terraform.tfvars
        name: zitadel-terraform
      source: SecretKey
    varmap:
      app:
        name: argocd-cluster1
        post_logout_redirect_uris:
        - https://argocd.cluster1.example.com/
        redirect_uris:
        - https://argocd.cluster1.example.com/auth/callback
      org_name: ZITADEL
      project_name: argocd
      vault_keys:
        client_id: client_id
        client_secret: client_secret
      zitadel_domain: zitadel.example.com
  managementPolicies:
  - Observe
  - Create
  - Update
  - LateInitialize
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  writeConnectionSecretToRef:
    name: argocd-cluster1-zitadel-oidc
