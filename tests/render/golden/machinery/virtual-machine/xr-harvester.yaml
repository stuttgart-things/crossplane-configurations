---
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: XVirtualMachine
metadata:
  name: vm-harvester
  namespace: default
spec:
  crossplane:
    resourceRefs:
    - apiVersion: resources.stuttgart-things.com/v1alpha1
      kind: HarvesterVM
      name: vm-harvester
status:
  ansibleReady: false
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: WatchCircuitClosed
    status: "True"
    type: Responsive
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: ReconcileSuccess
    status: "True"
    type: Synced
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: vm-harvester'
    reason: Creating
    status: "False"
    type: Ready
  share:
    environment: labul
    ip: []
    provider: harvester
    size: medium
  vmReady: false
---
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: HarvesterVM
metadata:
  annotations:
    crossplane.io/composition-resource-name: vm-harvester
  labels:
    crossplane.io/composite: vm-harvester
  name: vm-harvester
  namespace: default
  ownerReferences:
  - apiVersion: resources.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XVirtualMachine
    name: vm-harvester
    uid: 165c6714-81f1-58ef-8111-8ef03bafc8ac
spec:
  ansible:
    ansibleWorkingImage: ghcr.io/stuttgart-things/sthings-ansible:13.5.0-test
    crossplaneProviderConfig: in-cluster
    enabled: true
    playbooks:
    - sthings.baseos.setup
    varsFile:
    - manage_filesystem+-true
    - update_packages+-true
    - ansible_become+-true
    - ansible_become_method+-sudo
  cloudInit:
    hostname: vm-harvester
    namespace: vms
    sshPasswordAuth: true
    users:
    - lockPasswd: false
      name: sthings
      shell: /bin/bash
      sshAuthorizedKeys:
      - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC...
      sudo: ALL=(ALL) NOPASSWD:ALL
    vmName: vm-harvester
  providerConfigRef: harvester
  vm:
    cpu:
      cores: 4
    networks:
    - name: default
      networkName: default/vms
    resources:
      cpu: "4"
      memory: 4096Mi
  volume:
    imageId: default/image-ubuntu-24
    namespace: vms
    pvcName: vm-harvester-disk
    storage: 64Gi
    storageClassName: lh-00000000-ubuntu24-backingimage-class
    volumeMode: Block
