apiVersion: resources.stuttgart-things.com/v1alpha1
kind: RancherCluster
metadata:
  name: ferdinand
  namespace: default
spec:
  name: ferdinand
  environmentConfig: default
  infrastructure: harvester
  harvester:
    cpuCount: 6
    memorySize: 6
    diskSize: 40
    quantity: 1
  argocd:
    register: true
    reservation:
      enabled: true
      createDNS: true
    labels:
      storage-platform: 'true'
      storage-platform/openebs: 'true'
      security-platform: 'true'
      security-platform/external-secrets: 'true'
      security-platform/kyverno: 'true'
      network-platform: 'true'
      network-platform/cert-manager-install: 'true'
      network-platform/cert-manager-selfsigned: 'true'
      network-platform/cert-manager-cluster-ca: 'true'
      network-platform/cert-manager-vault-pki: 'true'
      network-platform/trust-manager-install: 'true'
      network-platform/trust-manager-bundle: 'true'
    # These reach the cert-manager-vault-pki-clusterbook ApplicationSet by way of
    # the ClusterbookCluster and the Argo CD cluster Secret, and are the whole
    # configuration of this cluster's PKI issuer. First cluster moved off the
    # Vault on `infra` (being switched off) onto the OpenBao on `platform` —
    # stuttgart-things/harvester#152.
    #
    # Deliberately ferdinand alone. The other clusterbook-managed clusters
    # (k3s-xp, crossplane-mgmt) keep the old annotations until this one has
    # issued a certificate from the new root.
    annotations:
      clusterbook.stuttgart-things.com/vault-server: https://openbao.platform.sthings.lab
      clusterbook.stuttgart-things.com/vault-pki-path: pki/sign/sthings-lab
      # Tokenless. cert-manager mints a ServiceAccount token per signing request
      # through the TokenRequest API instead of holding a Vault token that
      # nothing renews — the defect being left behind on infra, where the token
      # died at day 30, the ClusterIssuer went on reporting Ready (it verifies
      # the LOGIN, never the ability to sign) and every certificate expired at
      # day 90.
      clusterbook.stuttgart-things.com/vault-auth-method: kubernetes
      # Created by clusters/ferdinand/openbao in stuttgart-things/harvester
      # (#172): vault-base-setup derives the mount from <cluster_name>-<name>,
      # and binds a role of that same <name> to a ServiceAccount of that <name>.
      # All three move together — change one and the other two follow.
      clusterbook.stuttgart-things.com/vault-k8s-auth-mount: /v1/auth/ferdinand-sthings-certmanager
      clusterbook.stuttgart-things.com/vault-k8s-auth-role: certmanager
      clusterbook.stuttgart-things.com/vault-k8s-auth-sa: certmanager
      # Inert under kubernetes auth — the chart renders only the block matching
      # the method. Kept so step (5c) of the Composition goes on refreshing the
      # Secret it already writes rather than leaving a differently-named unused
      # one behind; it goes when every cluster has moved.
      clusterbook.stuttgart-things.com/vault-token-secret: cert-manager-vault-token
      # Unchanged on purpose: existing Certificates keep issuerRef vault-pki and
      # move with this switch instead of needing an edit each. The name says
      # Vault; the endpoint above is OpenBao.
      clusterbook.stuttgart-things.com/wildcard-issuer-name: vault-pki
