---
# The high-level VM entrypoint (XVirtualMachine: size/provider/environment/os).
# For provider: harvester it emits a HarvesterVM. Needs an EnvironmentConfig
# labelled virtual-machine.resources.stuttgart-things.com/environment=<env>
# — see env-config-virtualmachine.yaml next to this file.
#
# This is also the ONLY place harvester-vm's version is managed: it has no
# explicit install, so raising the dependsOn floor here is what rolls it.
# Per-version history lives in git log and the PRs, not here.
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: virtual-machine
spec:
# EXPECT ONE LOCK DUPLICATE on a bump. Short-named CR with a dependent: the
# resolver briefly sees an unsatisfied dependency and auto-installs a long-named
# copy of the same ghcr path, which collides. Wait ~30s, find it with
# `jq -r '.packages[].source' | sort | uniq -d`, check the XRDs belong to the
# short chain, then delete the long-named Configuration. One round.
#
# The resolver also never RAISES an already-satisfied dependency — it refuses
# one level at a time. Patch each dependency Configuration's spec.package by
# hand, top-down, until `kubectl get configurations` is clean.
  package: ghcr.io/stuttgart-things/crossplane-configurations/virtual-machine:v0.1.14
