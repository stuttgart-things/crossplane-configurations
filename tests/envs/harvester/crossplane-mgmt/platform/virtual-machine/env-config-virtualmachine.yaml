---
# EnvironmentConfig for the virtual-machine Configuration (XVirtualMachine).
# Selected by the label below matched against the XR's spec.environment.
# function-environment-configs needs EXACTLY ONE match per environment.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: virtualmachine-harvester
  labels:
    virtual-machine.resources.stuttgart-things.com/environment: harvester
data:
  # Ansible defaults, inert unless an XR sets ansible: true. Needs virtual-machine >=v0.1.6.
  # The inventory is NOT set here — harvester-vm fills in the VM's IP once it boots.
  ansible:
    crossplaneProviderConfig: in-cluster
    ansibleWorkingImage: ghcr.io/stuttgart-things/sthings-ansible:14.0.0-test
    playbooks:
      - sthings.baseos.setup
    # key+-value form. manage_filesystem=false: no LVM data disk here, the role
    # would fail with "'lvm_disk' is undefined". vault_instances overrides the
    # baseos default (tiab, unreachable) — it is only used to fetch the PKI CA.
    varsFile:
      - manage_filesystem+-false
      - update_packages+-true
      - ansible_become+-true
      - ansible_become_method+-sudo
      - vault_instances+-["https://openbao.platform.sthings.lab"]
  # Harvester placement. images maps spec.os -> {imageId, storageClassName}.
  # Each image has its OWN Longhorn backing-image class — a wrong class yields a blank disk.
  harvester:
    images:
      ubuntu24:                                                  # alias for u26-dev
        imageId: default/u26-dev
        storageClassName: lh-7f7c570a-a326-4232-b291-3f2a946aeadf
      sthings-u26:
        imageId: default/sthings-u26
        storageClassName: lh-68e4c918-0059-48bf-acaf-0de0ebe1eb65
      sthings-u26-k3s:
        imageId: default/sthings-u26-k3s
        storageClassName: lh-103a0ea1-2403-4370-9c01-f5bd45077375
      rocky9-dev:
        imageId: default/rocky9-dev
        storageClassName: lh-3d211dc0-a298-4277-9d5a-fe2c5bcec053
      sthings-rocky9:
        imageId: default/sthings-rocky9
        storageClassName: lh-cdf924f2-6c46-4d7d-8a61-17973408273c
      sthings-leap:
        imageId: default/sthings-leap
        storageClassName: lh-3a6f72f1-c87e-44c3-b136-4020dbefea6c
    providerConfigRef: harvester
    namespace: vms                                               # on the HARVESTER cluster
    networkName: default/vms
    user: sthings
    sshKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOoe/pqEulMLsJRxBqgbDtdOftsCHq9K2hU1Xr99FQZA sthings@sthings-air12"
