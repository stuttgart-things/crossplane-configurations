---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: harvestervm-defaults
  labels:
    harvester-vm.resources.stuttgart-things.com/environment: default
data:
  # Must equal the ClusterProviderConfig naming the REMOTE Harvester target.
  providerConfigRef: harvester
  # MUST be the per-image Longhorn class carrying the backingImage for imageId
  # below — the generic harvester-longhorn class yields a BLANK, unbootable disk.
  #   kubectl --kubeconfig ~/.kube/harvester -n default get virtualmachineimage \
  #     u26-dev -o jsonpath='{.status.storageClassName}'
  storageClassName: lh-7f7c570a-a326-4232-b291-3f2a946aeadf
  namespace: vms                    # for PVC/Secret/VM ON THE HARVESTER cluster
  networkName: default/vms          # Multus NAD, <namespace>/<name>
  imageId: default/u26-dev          # also: sthings-u26, sthings-u26-k3s, rocky9-dev, sthings-rocky9, sthings-leap
  # Only used when an XR sets spec.ansible.enabled: true, inert otherwise.
  # crossplaneProviderConfig is in-cluster on purpose: the Tekton PipelineRun
  # always runs on the MANAGEMENT cluster, even though the VM is remote.
  ansible:
    crossplaneProviderConfig: in-cluster
    ansibleWorkingImage: ghcr.io/stuttgart-things/sthings-ansible:14.0.0-test
