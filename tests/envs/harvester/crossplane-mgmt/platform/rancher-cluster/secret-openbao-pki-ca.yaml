---
# SOURCE Secret for the OpenBao root CA, on THIS cluster (crossplane-mgmt).
#
# The rancher-cluster Composition reads it — step (5b), via
# vaultPkiSourceCaName in env-config-rancher-cluster.yaml — and pushes it onto
# each downstream cluster's cert-manager namespace as `vault-pki-ca`, where the
# vault-pki ClusterIssuer verifies the PKI server's TLS against it.
#
# WHY A NEW NAME RATHER THAN OVERWRITING vault-pki-ca. That Secret already
# exists here and is NOT GitOps-managed: `blueprints/argocd create-vault-issuer`
# created it out-of-band on 2026-06-08 (see stuttgart-things/harvester,
# clusters/crossplane-mgmt/README.md) and still owns it. Committing a manifest
# under the same name would give one identity two owners, which is the failure
# mode this environment has been bitten by before. So the switch is the one-line
# vaultPkiSourceCaName change beside it — and reverting is the same line.
#
# SUPERSEDED IN PART, 2026-09-08. That reasoning held while vault-pki-ca only
# had to be left alone. It stopped holding when crossplane-mgmt itself migrated
# to OpenBao: its own issuer verifies against a Secret the ApplicationSet
# hardcodes as vault-pki-ca, so leaving that one on the March root was no
# longer an option. It is now declared, with the reasoning, in
# ../vault-pki/secret-vault-pki-ca.yaml. THIS file is still the right home for
# the DOWNSTREAM source under its own name — the split above is unchanged.
#
# The DOWNSTREAM name is unaffected: the Composition writes
# vaultPkiCaSecretName, which is unset and therefore still `vault-pki-ca` —
# which is what the cert-manager-vault-pki-clusterbook ApplicationSet passes as
# caBundleSecretRef.
#
# This is a NEW root, not a renewal. The old sthings.lab root lived in the infra
# Vault and was created `internal`, so its key could not be exported; the two
# share a common name and nothing else:
#
#   old (still on the downstream clusters)  notBefore Mar  4 2026  23:3A:6A:BB:…
#   new (this file)                         notBefore Sep  2 2026  4E:3F:AD:1D:…
#
# A CA certificate is public. Intentionally not SOPS-encrypted, same as
# stuttgart-things/harvester clusters/platform/openbao-pki-ca.yaml, from which
# these bytes are copied verbatim. Verified identical to what
# https://openbao.platform.sthings.lab serves.
#
# Full context: stuttgart-things/harvester#152.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: openbao-pki-ca # pragma: allowlist secret
  namespace: cert-manager
  labels:
    app.kubernetes.io/managed-by: argocd
data:
  ca.crt:   # pragma: allowlist secret
