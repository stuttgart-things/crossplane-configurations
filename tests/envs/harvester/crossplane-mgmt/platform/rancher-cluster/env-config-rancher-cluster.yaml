---
# Per-environment defaults for RancherCluster XRs in the crossplane-mgmt split lab.
#
# Selected by the config-scoped label
# `rancher-cluster.resources.stuttgart-things.com/environment` matched against the
# XR's `spec.environmentConfig` (default "default"). `data` values become defaults
# in the Composition pipeline; anything set on the XR spec wins over them.
#
# These are the live values for this showcase env (crossplane-mgmt control plane +
# Rancher/Harvester on the platform cluster). With this in place a RancherCluster
# XR carries only per-cluster values (name, sizing, argocd.register).
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: rancher-cluster-defaults
  labels:
    rancher-cluster.resources.stuttgart-things.com/environment: default
data:
  # Control-plane cluster where Crossplane runs (wired CPC + bridged Secret land here)
  providerConfigRef: in-cluster
  # Rancher management cluster (provisioning.cattle.io + Harvester)
  rancherProviderConfigRef: rancher-mgmt
  # Namespace of the provisioning Cluster + Rancher-managed kubeconfig Secret
  rancherNamespace: fleet-default
  # Distro + Kubernetes version (lab standard; override per XR if needed)
  distro: k3s
  kubernetesVersion: v1.35.4+k3s1

  # --- Harvester infrastructure defaults (infrastructure: harvester) ---
  # Harvester cloud credential, cattle-global-data:<name>
  cloudCredentialSecretName: cattle-global-data:cc-cl944  # pragma: allowlist secret
  # Harvester VM image, <namespace>/<image>
  imageName: default/sthings-u26-k3s
  # Harvester network, <namespace>/<network>
  networkName: default/vms
  # Harvester namespace the VMs are created in
  vmNamespace: default
  # SSH user baked into the image
  sshUser: sthings

  # --- Argo CD registration defaults (argocd.register: true) ---
  # Namespace + cluster running Argo CD + clusterbook-operator (the Rancher cluster)
  argocdNamespace: argocd
  argocdProviderConfigRef: rancher-mgmt

  # --- IP/DNS reservation defaults (argocd.reservation.enabled: true) ---
  # Network prefix the clusterbook-operator reserves the cluster IP from, and the
  # ClusterbookProviderConfig backing it. These produce the allocation-ip anchor
  # the network-platform ApplicationSets require. Only consumed when the XR sets
  # spec.argocd.reservation.enabled: true (otherwise skipReservation stays true).
  clusterbookNetworkKey: "192.168.10"
  clusterbookProviderConfigRef: default

  # --- Vault-PKI prerequisite Secrets (inlined vault-pki-secrets) ---
  # Consumed only when the XR enables network-platform/cert-manager-vault-pki.
  # SOURCE Secrets on the control plane (this mgmt cluster's cert-manager ns) the
  # Composition reads and pushes onto the downstream cluster's cert-manager ns —
  # so the vault-pki ClusterIssuer has its CA bundle + token. The target token
  # Secret name comes from the clusterbook vault-token-secret annotation; the CA
  # Secret name defaults to vault-pki-ca.
  vaultPkiSourceTokenName: cert-manager-vault-token  # pragma: allowlist secret
  vaultPkiSourceTokenNamespace: cert-manager
  # The OpenBao root, from secret-openbao-pki-ca.yaml beside this file — NOT the
  # `vault-pki-ca` Secret that create-vault-issuer left here, which still holds
  # the March root from the infra Vault being switched off. Distinct names on
  # purpose: that one is not GitOps-managed and keeping it unreferenced avoids
  # two owners for one identity. Reverting this migration is this line.
  #
  # Only the SOURCE moves. The downstream Secret is still written as
  # `vault-pki-ca` (vaultPkiCaSecretName unset), which is what the
  # cert-manager-vault-pki-clusterbook ApplicationSet passes as
  # caBundleSecretRef — so nothing on the target clusters has to change name.
  vaultPkiSourceCaName: openbao-pki-ca  # pragma: allowlist secret
  vaultPkiSourceCaNamespace: cert-manager

  # --- Default platform labels for the ClusterbookCluster / Argo CD cluster
  # Secret. These are the BASE; spec.argocd.labels on the XR overrides per key.
  #
  # SHORT ON PURPOSE, and it used to be the opposite. The platform AppSets are
  # opt-OUT: every per-component selector is `NotIn ["false"]`, and a label
  # selector's NotIn matches when the key is ABSENT as well — so an umbrella on
  # 'true' enrols the cluster in the WHOLE profile and only an explicit 'false'
  # takes one component back out (stuttgart-things/argocd platforms/README.md:
  # "default = included"). The previous version of this file pinned all ~27
  # toggles to 'false' on the theory that the NotIn-selectors needed the
  # siblings. They do not. What the pins actually did was turn every profile an
  # XR enables into an EMPTY profile that has to be re-enumerated component by
  # component, and tie this file to every AppSet added to the catalog — it was
  # already 23 of 27, the four kind-platform ones were missing.
  #
  # "A bare XR deploys nothing" still holds: it comes from the UMBRELLAS, which
  # `matchLabels: <profile>: "true"` never matches at 'false'.
  #
  # Below the umbrellas, only the exclusions this lab actually means. With them
  # the two registering XRs (k3s-xp, apps1) resolve to exactly the component set
  # they resolve to today — the pins that vanished were all components those XRs
  # set to 'true' themselves, or ones no cluster here wants.
  defaultLabels:
    auto-project: 'true'
    allow-all: 'false'
    # Cluster identity. `env` is not decoration: appset-crossplane-platform-
    # baseline and the three appset-cxp-* build a git path out of it
    # (crossplane/platform/baseline/*/vars/<env>.yaml,
    # crossplane/xrs/<kind>/<env>/<cluster>/), and unset it renders as an empty
    # path segment — nothing matches, nothing is generated, nothing complains.
    # Left out because no cluster here enables cicd-platform; SET IT before the
    # first one does. `tier` ('dev' | 'prod') drives how permissive
    # config/cluster-project's AppProject is; absent behaves like 'prod'.
    # env: <this-lab>
    # tier: prod
    # --- profile umbrellas: the actual master switches ---
    cicd-platform: 'false'
    network-platform: 'false'
    storage-platform: 'false'
    security-platform: 'false'
    # --- the exclusions we mean, fleet-wide for clusters built from this XR ---
    # Cilium: clusters from this Configuration are k3s with its default flannel,
    # and both AppSets assume Cilium (CiliumLoadBalancerIPPool / Cilium Gateway).
    # A cluster rebuilt with cilium via spec.machineGlobalConfig flips these to
    # 'true' on its own XR.
    network-platform/cilium-lb: 'false'
    network-platform/cilium-gateway: 'false'
    # A second Gateway needs the fqdn-secondary annotation, which the operator
    # only stamps where a second FQDN was reserved.
    network-platform/cilium-gateway-secondary: 'false'
    # OpenEBS ships from BOTH platforms/cicd and platforms/storage. Keep the
    # storage one (default StorageClass + snapshot CRDs), switch the cicd copy
    # off, so a cluster never installs it twice.
    cicd-platform/openebs: 'false'
    # openebs-hostpath is the default SC here; Longhorn alongside it is a
    # per-cluster decision.
    storage-platform/longhorn: 'false'
    # No NFS in this lab. The driver alone does nothing without the
    # storageclasses AppSet, which needs the nfs-config gate + nfs-* annotations.
    storage-platform/nfs-csi-install: 'false'
    # Its StorageClass AppSet is gated on the nfs-config `Exists` label anyway,
    # but spelling it out keeps the label set identical to what these clusters
    # carry today and makes "no NFS here" readable in one place.
    storage-platform/nfs-csi-storageclasses: 'false'
    # NOT listed, on purpose:
    #   kind-platform + kind-platform/* — a Rancher-provisioned cluster is never
    #     a kind cluster.
    #   storage-platform.stuttgart-things.com/nfs-config — an `Exists` GATE, not
    #     a toggle: 'false' satisfies it exactly as well as 'true', so pinning it
    #     would invert it into always-on and appset-nfs-csi-storageclasses would
    #     render a StorageClass with an empty server/share.
    #   cicd-platform/crossplane-{ansible,proxmoxvm,vspherevm} and the
    #     *-pr-preview labels — those AppSets select opt-IN with
    #     `matchLabels: 'true'`, so an absent label is already off.

  # --- Default platform annotations for the ClusterbookCluster / Argo CD
  # cluster Secret. Same merge as defaultLabels (XR wins per key). Only the
  # lab constants live here — the vault-k8s-auth-* mount path contains the
  # cluster name and stays on each XR.
  defaultAnnotations:
    clusterbook.stuttgart-things.com/vault-server: https://openbao.platform.sthings.lab
    clusterbook.stuttgart-things.com/vault-pki-path: pki/sign/sthings-lab
    clusterbook.stuttgart-things.com/vault-token-secret: cert-manager-vault-token  # pragma: allowlist secret
