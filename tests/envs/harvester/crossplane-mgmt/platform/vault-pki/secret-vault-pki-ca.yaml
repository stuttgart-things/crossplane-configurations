---
# The CA that crossplane-mgmt's OWN vault-pki ClusterIssuer verifies against.
#
# Not to be confused with ../rancher-cluster/secret-openbao-pki-ca.yaml. That
# one is the SOURCE the rancher-cluster Composition reads and pushes onto each
# DOWNSTREAM cluster. crossplane-mgmt is not downstream of itself, so nothing
# was ever writing this one — it has to be declared here. Same bytes, different
# job.
#
# The name is not free. The cert-manager-vault-pki-clusterbook ApplicationSet
# hardcodes `caBundleSecretRef: {name: vault-pki-ca, key: ca.crt}` in
# stuttgart-things/argocd platforms/network/appset-cert-manager-vault-pki.yaml
# — it is not derived from an annotation, so pointing this cluster at the
# existing openbao-pki-ca Secret instead was not an option.
#
# THIS REVERSES A DECISION MADE ONE DAY EARLIER, deliberately. The note in
# secret-openbao-pki-ca.yaml argues against committing anything called
# vault-pki-ca, because `blueprints/argocd create-vault-issuer` created that
# Secret out-of-band on 2026-06-08 and "still owns it". That reasoning held
# while the Secret only had to be left alone. It does not survive this cluster
# migrating to OpenBao: the CA in it is the March root from the infra Vault
# (23:3A:6A:BB:…), the issuer cannot verify OpenBao against it, and the choice
# is no longer "adopt or leave alone" but "adopt or patch by hand forever".
#
# The other owner is a one-shot CLI a human runs at bootstrap, not a controller
# that reconciles — so Argo CD adopting this Secret ends the drift rather than
# starting a fight. If that cluster is ever rebuilt with create-vault-issuer,
# the CLI writes the old root once and Argo CD writes it back within the sync
# interval.
#
# A CA certificate is public; deliberately not SOPS-encrypted. These bytes are
# copied verbatim from secret-openbao-pki-ca.yaml and verified on 2026-09-08 to
# be byte-identical to what https://openbao.platform.sthings.lab/v1/pki/ca/pem
# serves: sha256 4E:3F:AD:1D:DD:40:42:62:5F:63:A8:F1:66:9A:3F:1C:9D:65:96:DA:
# 18:EC:BD:77:AF:5B:D5:DD:6D:3D:51:9E, notBefore Sep 2 2026.
#
# Full context: stuttgart-things/harvester#152.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: vault-pki-ca # pragma: allowlist secret
  namespace: cert-manager
  labels:
    app.kubernetes.io/managed-by: argocd
data:
  ca.crt:   # pragma: allowlist secret
