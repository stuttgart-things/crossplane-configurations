---
# Golden render snapshots are generated output, not source. They are produced by
# tests/render/render-golden.sh from files this config already lints, and they
# are verified by their own drift check (tests/render/check-golden.sh) — linting
# them a second time asserts nothing new.
#
# Concretely, not linting them is what keeps detect-secrets usable. The rendered
# Compositions carry the literal `password:` / `token:` KEYS their templates
# emit, so the Secret-Keyword plugin fires on every one — 71 findings across the
# seeded snapshots, not one of them a credential. Baselining generated files
# instead would mean re-baselining on every regeneration, i.e. a permanently
# churning allowlist that hides real hits.
exclude: '\.rendered\.yaml$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: detect-private-key
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
        args:
          - "-e"
          - "SC1090"
          - "-e"
          - "SC1091"
  - repo: https://github.com/sirosen/check-jsonschema
    rev: 0.30.0
    hooks:
      - id: check-github-workflows
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        description: Detects high entropy strings that are likely to be passwords.
        entry: detect-secrets-hook
        language: python
        files: .*
        args: ["--baseline", ".secrets.baseline"]
  - repo: local
    hooks:
      # Structural invariant linter for the Configuration packages. Enforces the
      # conventions documented as "gotchas we learned (don't repeat)" in
      # CLAUDE.md: XRD v2 + Namespaced + no claimNames, Composition on /v1 +
      # Pipeline, short-form Function CR names, the deliberate xpkg.upbound.io
      # mirror pin, required crossplane.yaml annotations. pre-commit builds an
      # isolated venv with the pinned pyyaml, so it runs the same locally and in
      # the CI pre-commit job. always_run because a package change anywhere can
      # break a cross-cutting invariant, not just the file that was edited.
      - id: lint-configurations
        name: Lint Crossplane Configuration invariants
        entry: python tests/lint/lint-configurations.py
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        pass_filenames: false
        always_run: true
