---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: nativeproxmoxvms.resources.stuttgart-things.com
spec:
  group: resources.stuttgart-things.com
  defaultCompositeDeletePolicy: Foreground
  scope: Namespaced
  names:
    kind: NativeProxmoxVM
    plural: nativeproxmoxvms
    singular: nativeproxmoxvm
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                vm:
                  type: object
                  description: |
                    Per-VM settings. Placement fields (node, datastore, bridge,
                    vlanTag, pool, templateVmId) and the
                    cpuType/osType/bios/diskInterface/networkModel/annotation
                    fields default from the selected EnvironmentConfig when unset
                    here; set them explicitly to override per VM.
                  properties:
                    name:
                      type: string
                    cpu:
                      type: string
                      description: vCPU cores.
                      default: "2"
                    memory:
                      type: string
                      description: Dedicated memory in MiB.
                      default: "4096"
                    disk:
                      type: string
                      description: Root disk size in GB.
                      default: "64"
                    agentEnabled:
                      type: boolean
                      description: |
                        Enable the QEMU guest agent. MUST be true (and the agent
                        installed in the template) for the VM IP to be reported
                        back onto status.share.ip.
                      default: true
                    vmId:
                      type: string
                      description: |
                        Optional explicit VMID for the new VM. Omit to let
                        Proxmox / the provider assign one.
                    # --- fields below default from the EnvironmentConfig ---
                    # No XRD default: leaving them unset lets the
                    # EnvironmentConfig value win; setting them overrides it.
                    cpuType:
                      type: string
                    osType:
                      type: string
                      description: Proxmox OS type (e.g. l26 for Linux 2.6+/3.x).
                    bios:
                      type: string
                      description: Firmware — "seabios" or "ovmf".
                    diskInterface:
                      type: string
                      description: Disk bus/interface (e.g. scsi0, virtio0).
                    networkModel:
                      type: string
                      description: NIC model (e.g. virtio, e1000).
                    annotation:
                      type: string
                      description: VM description/notes.
                    node:
                      type: string
                      description: Proxmox node name (nodeName).
                    datastore:
                      type: string
                      description: Datastore/storage id for the root disk.
                    bridge:
                      type: string
                      description: Network bridge (e.g. vmbr0, vmbrvlan).
                    vlanTag:
                      type: string
                      description: Optional VLAN tag for the NIC.
                    pool:
                      type: string
                      description: Resource pool id (poolId).
                    templateVmId:
                      type: string
                      description: |
                        VMID of the template to clone. bpg clones by numeric
                        VMID (not name) — resolve your template (e.g. sthings-u26)
                        to its VMID and set it here or, preferably, on the
                        EnvironmentConfig.
                    cloneDatastore:
                      type: string
                      description: |
                        Datastore the CLONE allocates into (clone.datastoreId).
                        Unset, Proxmox allocates on the TEMPLATE's datastore and
                        bpg then moves the disk to `datastore` — so every build
                        writes the full image twice, and the clone needs
                        Datastore.AllocateSpace on the template's storage even
                        when the VM is not meant to live there. Set this to
                        `datastore` to clone straight onto the target.

                        OPT-IN ON PURPOSE, and it must stay that way: bpg's
                        clone block is ForceNew, so emitting a value where a
                        live VM previously rendered none is a spec change on an
                        immutable field — the provider would destroy and
                        recreate the VM. Existing VMs render byte-identical
                        while this is unset.

                        `none` is an explicit OPT-OUT: it renders exactly as if
                        the field were absent, and it is the ONLY way for an XR
                        to decline a value coming from the EnvironmentConfig —
                        an empty string is falsy and falls through to it.

                        To roll this out for a whole environment: set
                        `cloneDatastore: none` on every EXISTING VM's XR first,
                        then add the real value to the EnvironmentConfig. New
                        VMs pick it up, old ones stay pinned. ORDERING TRAP:
                        `none` only means "opt out" from v0.11.0 on — against an
                        older package it reads as a datastore literally NAMED
                        none, causing the destroy + recreate you are avoiding.
                        Bump the package before setting the sentinel anywhere.
                  required:
                    - name
                cloudInit:
                  type: object
                  description: |
                    Cloud-init (Proxmox `initialization`) settings — replaces the
                    legacy SSH remote-exec bootstrap. The guest hostname is set
                    from the VM name by Proxmox cloud-init.
                  properties:
                    ipv4Address:
                      type: string
                      description: IPv4 config — "dhcp" or CIDR (e.g. 10.0.0.5/24).
                      default: dhcp
                    ipv4Gateway:
                      type: string
                    datastoreId:
                      type: string
                      description: |
                        Datastore for the cloud-init drive bpg adds on clone (the
                        stuttgart-things Packer templates have no cloud-init
                        disk). Defaults to the root disk's datastore when unset.
                    username:
                      type: string
                      description: |
                        Default cloud-init user. Falls back to the
                        EnvironmentConfig `ciUsername` when unset.
                    sshKeys:
                      type: array
                      items:
                        type: string
                    passwordSecretRef:
                      type: object
                      description: |
                        Reference to a Secret key holding the cloud-init user
                        password (the provider reads it at apply time). The Secret
                        MUST live in this XR's namespace — the namespaced
                        EnvironmentVM CRD has no `namespace` field and always
                        resolves it locally.

                        Usually set ONCE per environment via the EnvironmentConfig
                        (`ciPasswordSecretName` / `ciPasswordSecretKey`), which
                        this overrides. `key` falls back to that, then `password`.

                        Needed whenever the template runs cloud-init. Proxmox
                        generates user-data from `ciuser`/`cipassword`, and with no
                        password cloud-init applies its `lock_passwd` default and
                        LOCKS the account (`passwd -S` reports `L`) — wiping the
                        password baked in at build time and breaking any
                        password-based Ansible run.
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                          description: |
                            DEPRECATED and ignored — kept so existing XRs do not
                            break. The Secret is always read from this XR's
                            namespace.
                        key:
                          type: string
                      required:
                        - name
                    dnsDomain:
                      type: string
                    dnsServers:
                      type: array
                      items:
                        type: string
                    hostname:
                      type: string
                      description: |
                        Guest hostname. Falls back to `vm.name`, then
                        `metadata.name`. This becomes the PVE VM NAME: bpg has no
                        hostname field, but Proxmox generates cloud-init user-data
                        carrying `hostname: <VM name>`, and that outranks every
                        NoCloud meta-data source, so the VM name is the only lever.
                        PVE does not require VM names to be unique. Inert on
                        templates that ship /etc/cloud/cloud-init.disabled.
                    snippetsDatastore:
                      type: string
                      description: |
                        Datastore (with the Proxmox "Snippets" content type) used
                        to upload a cloud-init meta-data snippet, which pins the
                        instance-id. It does NOT set the hostname — see `hostname`.
                        Must be filesystem-backed (Directory/NFS/CIFS); block
                        datastores cannot hold snippets. bpg can only place the
                        file by SSHing into the PVE node, which is often
                        unavailable. Falls back to the EnvironmentConfig
                        `snippetsDatastore`; when neither is set, no snippet is
                        emitted.
                providerConfigRef:
                  type: object
                  description: |
                    The provider-proxmox-bpg provider config the (namespaced)
                    EnvironmentVM runs through. `name` defaults from the
                    EnvironmentConfig (providerConfigName) or "default"; `kind`
                    defaults from the EnvironmentConfig (providerConfigKind) or
                    "ClusterProviderConfig".
                  properties:
                    name:
                      type: string
                    kind:
                      type: string
                      enum:
                        - ClusterProviderConfig
                        - ProviderConfig
                ansible:
                  type: object
                  description: |
                    Optional base-OS provisioning. When `enabled: true`, once the
                    VM is Ready with an IP the Composition emits an `AnsibleRun`
                    (Tekton) whose inventory is auto-populated with the VM IP.
                    Shared fields (playbooks, varsFile, gitRepoUrl,
                    ansibleWorkingImage, credentialsSecretName,
                    crossplaneProviderConfig, pipelineNamespace) default from the
                    EnvironmentConfig `ansible` sub-block when unset here.
                    Requires the ansible-run preconditions on the cluster (Tekton,
                    the credentials Secret, an in-cluster provider-kubernetes
                    config).
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    playbooks:
                      type: array
                      items:
                        type: string
                    varsFile:
                      type: array
                      items:
                        type: string
                    varsInventory:
                      type: array
                      items:
                        type: string
                    extraCollections:
                      type: array
                      items:
                        type: string
                    extraRoles:
                      type: array
                      items:
                        type: string
                    gitRepoUrl:
                      type: string
                    pipelineNamespace:
                      type: string
                    ansibleWorkingImage:
                      type: string
                    credentialsSecretName:
                      type: string
                    crossplaneProviderConfig:
                      type: string
                    wrapInCrossplane:
                      type: boolean
                environmentConfig:
                  type: string
                  description: |
                    Selects the Crossplane EnvironmentConfig that provides the
                    shared per-environment placement defaults. The Composition
                    matches an EnvironmentConfig carrying the config-scoped label
                    `proxmoxvm.resources.stuttgart-things.com/environment=<value>`.
                    Supported `data` keys: node, datastore, bridge, vlanTag, pool,
                    templateVmId, cpuType, osType, bios, diskInterface,
                    networkModel, annotation, ciUsername, providerConfigName,
                    providerConfigKind, and an optional `ansible` sub-block. Any
                    value set explicitly on this XR's spec overrides the
                    EnvironmentConfig.
                  default: default
              required:
                - vm
            status:
              description: A Status represents the observed state.
              type: object
              properties:
                share:
                  description: Freeform field containing status information.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
