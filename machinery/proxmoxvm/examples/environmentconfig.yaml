---
# Shared per-environment placement for NativeProxmoxVM XRs.
#
# The `proxmoxvm` Composition selects an EnvironmentConfig via the config-scoped
# label `proxmoxvm.resources.stuttgart-things.com/environment`, matched against
# the XR's `spec.environmentConfig` (default "default"). The key is namespaced to
# this Configuration so it never collides with another Configuration's
# EnvironmentConfig (function-environment-configs requires EXACTLY ONE Selector
# match). The `data` values are loaded into the pipeline context; anything set
# explicitly on the XR spec wins over them.
#
# Unlike the OpenTofu `proxmox-vm` Configuration (which clones a template by
# NAME), the native bpg provider clones by numeric VMID — set `templateVmId`
# to the VMID of your prepared template (e.g. the VMID of `sthings-u26`).
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: proxmoxvm-defaults
  labels:
    proxmoxvm.resources.stuttgart-things.com/environment: default
data:
  # ul-pve11, NOT ul-pve01. The LabUL rebuild moved the ubuntu26 templates, and
  # bpg derives the clone SOURCE node from this key unless `templateNode` is set
  # — so a stale value fails every build with an error that names neither the
  # key nor this file: `unable to find configuration file for VM 211 on node
  # 'ul-pve01'`.
  node: ul-pve11
  datastore: V5010-01-1
  # Datastore the CLONE allocates into. Without it Proxmox allocates on the
  # TEMPLATE's datastore and bpg moves the disk afterwards — the full image
  # written twice, and Datastore.AllocateSpace needed on the template's storage.
  # SAFE TO SET HERE ONLY BECAUSE every VM already built under this
  # EnvironmentConfig carries `cloneDatastore: none` in its own XR: bpg's clone
  # block is ForceNew, so an env-level value would otherwise rewrite their clone
  # block and trigger destroy + recreate.
  cloneDatastore: V5010-01-1
  # Datastore for the cloud-init drive. Deliberately NOT `datastore`: the
  # cloud-init image is the one disk PVE frees and re-allocates on every
  # stop/start, and on `V5010-01-1` that round trip is broken — the stop leaves
  # an LV behind that no device node backs, and the next start dies on
  # `lvcreate ... already exists` with the VM unbootable until the volume is
  # deleted through the API. Verified host-side 2026-08-20: the same VM with its
  # cidata image on the NFS store `DD-sthings` stops and starts cleanly. Only
  # the 4 MB cidata image moves; the data disk stays on `datastore`.
  # SAME FORCENEW CAVEAT AS `cloneDatastore` ABOVE, and unverified: bpg may treat
  # a changed `initialization` block as a rebuild, so setting this against VMs
  # that already exist can destroy and recreate them. Safe for new builds.
  cloudInitDatastore: DD-sthings
  bridge: vmbrvlan          # VLAN-trunk bridge; template ships on vmbr0/untagged
  vlanTag: "102"            # 10.31.102.0/24
  pool: stuttgart-things
  # 211, NOT 110 — because 110 ships /etc/cloud/cloud-init.disabled, so
  # cloud-init never runs and every clone keeps the hostname `ubuntu` regardless
  # of what is injected (#2432). 211 removes the file in its provisioner.
  # Nothing about the failure points at the template: the VM comes up healthy,
  # just not as the host you asked for.
  #
  # The names have since diverged and this comment used to claim they had not:
  # as of 2026-08-25 the cluster holds exactly ONE template called `sthings-u26`
  # and that is 110. 211 is now `ubuntu26-base-20260731-0909`. bpg clones by
  # VMID, so the number is still the only thing that matters here — but do not
  # resolve either template by name and expect the old ambiguity.
  templateVmId: "211"
  cpuType: host
  osType: l26
  bios: seabios
  diskInterface: virtio0    # sthings-u26 root disk is on virtio0, NOT scsi0
  networkModel: virtio
  annotation: PROXMOX-VM BUILD w/ CROSSPLANE (native) FOR STUTTGART-THINGS
  ciUsername: sthings
  # Secret (in the XR's namespace) holding the cloud-init user password, plus its
  # key. Set this per environment: with no password Proxmox emits user-data
  # without cipassword, cloud-init applies its lock_passwd default and LOCKS the
  # guest account — key logins still work, so it hides well, but every
  # password-based AnsibleRun goes UNREACHABLE. Overridable per XR via
  # spec.cloudInit.passwordSecretRef. ciPasswordSecretKey defaults to `password`.
  ciPasswordSecretName: proxmoxvm-ci-password  # pragma: allowlist secret
  ciPasswordSecretKey: password  # pragma: allowlist secret
  # OPT-IN, and deliberately left unset. This pins the cloud-init instance-id via
  # a NoCloud meta-data snippet; it does NOT set the hostname (that is the VM
  # name — see the README). bpg can only place the file by SSHing INTO THE PVE
  # NODE: the API refuses `content=snippets` outright, so there is no API path,
  # and node SSH is typically unavailable — in LabUL the credentials the
  # capability chart supplies are guest credentials, not node ones. Set it only
  # if you know node SSH works.
  # snippetsDatastore: DD-sthings
  # provider-proxmox-bpg ProviderConfig the EnvironmentVM runs through.
  providerConfigName: default
  providerConfigKind: ClusterProviderConfig
---
# Same placement, exposed under the `labul` environment label so an XR can
# select it explicitly with `spec.environmentConfig: labul` (see xr-max.yaml).
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: proxmoxvm-labul
  labels:
    proxmoxvm.resources.stuttgart-things.com/environment: labul
data:
  node: ul-pve11            # see the note on the first EnvironmentConfig above
  datastore: V5010-01-1
  # REQUIRED here, and it was missing until 2026-08-25 — the omission made this
  # EnvironmentConfig fail every build while the `default` one above worked.
  #
  # Template 211 lives on DD-sthings. Without `cloneDatastore` Proxmox allocates
  # the clone on the TEMPLATE's datastore, and that needs
  # Datastore.AllocateSpace on `/storage/DD-sthings` — which this identity does
  # not have, because a more specific ACL there grants only `SVATemplates`
  # (AllocateTemplate + Audit) and REPLACES the broader `/storage` grant under
  # Proxmox' deepest-path rule. The clone is refused before anything is built:
  #
  #   403 Permission check failed (/storage/DD-sthings, Datastore.AllocateSpace)
  #
  # Verified against the raw API on 2026-08-25, same user, same template:
  # `POST .../qemu/211/clone storage=V5010-01-1` starts the task,
  # the identical call without `storage=` returns the 403 above.
  #
  # SAME FORCENEW CAVEAT as on the `default` EnvironmentConfig: bpg's clone
  # block is ForceNew, so adding this rewrites the clone block of any VM already
  # built under this label and triggers destroy + recreate. Nothing has ever
  # been built under it — it could not be — so there is nothing to break.
  cloneDatastore: V5010-01-1
  # Cloud-init drive on NFS rather than on `datastore` — see the note on the
  # first EnvironmentConfig above (`V5010-01-1` orphans the cidata LV on stop).
  # DD-sthings is safe for THIS: only root-disk allocation is refused there,
  # cidata creation goes through a different privilege path and was observed
  # working on 2026-08-25.
  cloudInitDatastore: DD-sthings
  bridge: vmbrvlan
  vlanTag: "102"
  pool: stuttgart-things
  # not 110 — see above. Note 211 is NOT called `sthings-u26` any more; it is
  # `ubuntu26-base-20260731-0909`. bpg clones by VMID, so this still resolves.
  templateVmId: "211"
  cpuType: host
  osType: l26
  bios: seabios
  diskInterface: virtio0
  networkModel: virtio
  annotation: PROXMOX-VM BUILD w/ CROSSPLANE (native) FOR STUTTGART-THINGS
  ciUsername: sthings
  # Secret (in the XR's namespace) holding the cloud-init user password, plus its
  # key. Set this per environment: with no password Proxmox emits user-data
  # without cipassword, cloud-init applies its lock_passwd default and LOCKS the
  # guest account — key logins still work, so it hides well, but every
  # password-based AnsibleRun goes UNREACHABLE. Overridable per XR via
  # spec.cloudInit.passwordSecretRef. ciPasswordSecretKey defaults to `password`.
  ciPasswordSecretName: proxmoxvm-ci-password  # pragma: allowlist secret
  ciPasswordSecretKey: password  # pragma: allowlist secret
  # Opt-in — see the note on the first EnvironmentConfig above.
  # snippetsDatastore: DD-sthings
  providerConfigName: default
  providerConfigKind: ClusterProviderConfig
