---
# OS choice: `spec.vm.os` picks an entry of the EnvironmentConfig's `templates`
# table, which supplies the template VMID (and, if it lives on another node,
# templateNode). Everything else still comes from the `labul` EnvironmentConfig.
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: NativeProxmoxVM
metadata:
  name: proxmoxvm-rocky
  namespace: default
spec:
  environmentConfig: labul
  vm:
    name: proxmoxvm-rocky
    os: rocky10
    cpu: "2"
    memory: "4096"
    disk: "40"
