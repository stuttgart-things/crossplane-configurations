---
# Realistic "standard" usage: a single VM sized per spec, with all Proxmox
# placement inherited from the "default" EnvironmentConfig. This is the
# copy-paste template.
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: NativeProxmoxVM
metadata:
  name: proxmoxvm-test1
  namespace: default
spec:
  environmentConfig: default
  vm:
    name: proxmoxvm-test1
    cpu: "2"
    memory: "4096"
    disk: "64"
    # Opt out of the EnvironmentConfig's cloneDatastore: renders exactly as if
    # the field were absent. This is what an ALREADY-BUILT VM must carry before
    # its environment gains a cloneDatastore, or the ForceNew clone block would
    # be rewritten under it. An empty string would NOT work — it is falsy and
    # falls through to the EnvironmentConfig.
    cloneDatastore: none
  cloudInit:
    ipv4Address: dhcp
