---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: vmbatches.resources.stuttgart-things.com
spec:
  group: resources.stuttgart-things.com
  defaultCompositeDeletePolicy: Foreground
  scope: Namespaced
  names:
    kind: VMBatch
    plural: vmbatches
    singular: vmbatch
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                provider:
                  type: string
                  description: |
                    Which native VM Configuration the batch fans out to.
                    `proxmox` emits `NativeProxmoxVM` XRs (Configuration
                    `proxmoxvm`); `vsphere` emits `NativeVsphereVM` XRs
                    (Configuration `vspherevm`). A batch is single-provider.
                  enum:
                    - proxmox
                    - vsphere
                environmentConfig:
                  type: string
                  description: |
                    Passed through verbatim to every emitted native VM XR as
                    its `spec.environmentConfig`. Each native VM then resolves
                    its own per-environment placement (node/datastore/network,
                    template*, MOIDs, …) from the matching EnvironmentConfig —
                    vm-batch itself carries no placement, so the whole fleet
                    lands in one environment by naming it once here.
                  default: default
                providerConfigRef:
                  type: object
                  description: |
                    Passed through to every emitted native VM XR. When unset,
                    each native VM falls back to its own EnvironmentConfig /
                    built-in default (`default` / `ClusterProviderConfig`).
                  properties:
                    name:
                      type: string
                    kind:
                      type: string
                      enum:
                        - ClusterProviderConfig
                        - ProviderConfig
                cloudInit:
                  type: object
                  description: |
                    Proxmox only: passed through verbatim to every emitted
                    `NativeProxmoxVM` as its `spec.cloudInit` (ipv4Address,
                    username, sshKeys, dnsServers, …). Ignored for vsphere.
                    Free-form so it mirrors the `proxmoxvm` XRD's `cloudInit`
                    block exactly without re-declaring it here.
                  x-kubernetes-preserve-unknown-fields: true
                defaults:
                  type: object
                  description: |
                    Default `spec.vm` fields applied to EVERY vms[] entry; an
                    entry's own `vm` block overrides these key-by-key. The keys
                    are the native VM's `spec.vm` fields — for `proxmox`:
                    cpu, memory, disk, cpuType, bios, templateVmId, node, … ;
                    for `vsphere`: cpu, ram, disk, guestId, templateUuid, … .
                    Free-form (mirrors each native XRD's `spec.vm`) so the
                    batch never drifts from the native field set.

                    Note the provider split: Proxmox uses `memory`, vSphere uses
                    `ram`. Getting it wrong FAILS SILENTLY — free-form applies
                    only here; the native XRDs are structural, so a key they do
                    not declare is pruned by the API server with no error and no
                    event, and the VM builds at that field's XRD default (e.g.
                    `ram` on a Proxmox batch → 4096 MiB, not the value you set).
                    Check the rendered child XR when a size does not take.
                  x-kubernetes-preserve-unknown-fields: true
                vms:
                  type: array
                  description: |
                    The batch. One entry per distinct VM definition; each entry
                    may set `count` to stamp out that many identical replicas.
                    A replica is always named `<name>-<0-based index>` — count 1
                    of `web` is `web-0`, count 3 is `web-0`, `web-1`, `web-2`.
                    The suffix is constant on purpose: if the name shape varied
                    with the count, changing `count` between 1 and 2 would rename
                    the child XR, dropping the old name from the desired set and
                    making Crossplane DELETE the running VM. With a constant
                    suffix, scaling up only adds replicas and scaling down only
                    removes trailing ones.
                  minItems: 1
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: |
                          Base VM name for this entry. Each replica is emitted as
                          a native VM XR named `<batch>-<name>-<index>`; that
                          OBJECT name becomes the hypervisor VM name, while the
                          un-prefixed `<name>-<index>` is passed as the child's
                          `spec.vm.name` and becomes the GUEST hostname. The
                          batch prefix keeps two batches in a namespace from
                          colliding, so it stays out of the guest.

                          Needs vspherevm >= v0.8.0 (the `dependsOn` floor):
                          earlier versions ignored `spec.vm.name` and leaked the
                          prefix into the vSphere guest hostname.
                      count:
                        type: string
                        description: |
                          Number of identical replicas of this entry. Digits only
                          and at least 1 — the Composition int()-converts this,
                          and a non-numeric value would fail the WHOLE batch
                          rather than just its entry, so the schema rejects it
                          here instead.
                        pattern: "^[1-9][0-9]*$"
                        default: "1"
                      vm:
                        type: object
                        description: |
                          Per-entry `spec.vm` overrides, merged OVER `defaults`
                          (this wins). Free-form: use the native VM's own
                          `spec.vm` field names (proxmox `memory` / vsphere
                          `ram`, disk, cpu, template*, placement, …). Same silent
                          pruning caveat as `defaults` — see there.
                        x-kubernetes-preserve-unknown-fields: true
                    required:
                      - name
                ansible:
                  type: object
                  description: |
                    Optional base-OS provisioning for the WHOLE batch. When
                    `enabled: true`, once every VM in the batch is Ready with an
                    IP the Composition emits a SINGLE `AnsibleRun` (Tekton) whose
                    inventory lists every VM IP (`all+["ip1","ip2",…]`) — one
                    play across the whole fleet. Requires the ansible-run
                    preconditions on the cluster (Tekton, the credentials
                    Secret, an in-cluster provider-kubernetes config).

                    CREATE-ONLY. The inventory is frozen when the run is first
                    emitted, so replicas added to the batch afterwards are built
                    but NEVER Ansible-provisioned. Provision late additions with
                    their own `VMBatch`, or delete and recreate the batch.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    playbooks:
                      type: array
                      items:
                        type: string
                    varsFile:
                      type: array
                      items:
                        type: string
                    varsInventory:
                      type: array
                      description: |
                        Explicit Ansible inventory. When set it wins; when
                        omitted the inventory is auto-built from every VM IP.
                      items:
                        type: string
                    extraCollections:
                      type: array
                      items:
                        type: string
                    extraRoles:
                      type: array
                      items:
                        type: string
                    gitRepoUrl:
                      type: string
                    pipelineNamespace:
                      type: string
                    ansibleWorkingImage:
                      type: string
                    credentialsSecretName:
                      type: string
                    crossplaneProviderConfig:
                      type: string
                    wrapInCrossplane:
                      type: boolean
              required:
                - provider
                - vms
            status:
              description: A Status represents the observed state.
              type: object
              properties:
                share:
                  description: |
                    Freeform status: `ip` (every VM IP in the batch),
                    `provider`, plus the ansible completion latch
                    (`ansibleReady` / `ansibleSucceeded` /
                    `ansibleCompletionTime`).
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                vmReady:
                  type: boolean
                  description: True once every VM in the batch is Ready.
                ansibleReady:
                  type: boolean
                  description: |
                    True once the batch AnsibleRun is Ready (or when Ansible is
                    disabled).
                vmCount:
                  type: integer
                  description: Total VMs the batch expects (sum of every entry's count).
                readyCount:
                  type: integer
                  description: How many of those VMs are currently Ready.
