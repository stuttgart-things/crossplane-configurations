---
apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: vm-batch
  annotations:
    # Local convention used by `task push` to bump and re-publish.
    # Not a Crossplane-standard field — the true package version is the OCI tag.
    meta.crossplane.io/version: v0.1.0
    meta.crossplane.io/maintainer: patrick.hermann@sva.de
    meta.crossplane.io/source: github.com/stuttgart-things/crossplane-configurations
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Batch VM provisioning (+ Ansible) from a single namespaced `VMBatch` XR.
      Fans out a list of VM definitions — each optionally with a `count` of
      identical replicas — to the native `proxmoxvm` / `vspherevm`
      Configurations, then (optionally) runs ONE Ansible play across the whole
      fleet with an inventory auto-built from every VM IP.
    meta.crossplane.io/readme: |
      # vm-batch

      A Crossplane v2 Configuration that provisions a BATCH of VMs — and,
      optionally, Ansible-provisions all of them at once — from a single
      namespaced `VMBatch` XR (group `resources.stuttgart-things.com`).

      The native single-VM Configurations `proxmoxvm` (`NativeProxmoxVM`) and
      `vspherevm` (`NativeVsphereVM`) each build one VM. `vm-batch` is the
      fan-out on top:

      - `spec.vms[]` is a list of distinct VM definitions; each entry may set
        `count` to stamp out that many identical replicas
        (`<name>-0`, `<name>-1`, …). `spec.defaults` supplies shared `spec.vm`
        fields; a per-entry `vm` block overrides them.
      - `spec.provider` (`proxmox`/`vsphere`) picks which native Configuration
        the batch emits into. `spec.environmentConfig` is passed through to
        every emitted VM, so the whole fleet inherits one environment's
        placement.
      - When `spec.ansible.enabled` is true, a SINGLE `AnsibleRun` is emitted
        once every VM is Ready with an IP — its inventory lists every VM IP
        (`all+["ip1","ip2",…]`), so one play configures the whole fleet.
      - Aggregate VM IPs, VM/Ansible readiness and the ready-vs-total counts
        are surfaced on the XR status.

      ## Preconditions

      The composed Configurations must be installed on the cluster (declared as
      `dependsOn`, so the package manager pulls them): `proxmoxvm`, `vspherevm`,
      `ansible-run`. Plus their own preconditions — the native VM provider +
      its `ClusterProviderConfig`, the `EnvironmentConfig`(s), and (for Ansible)
      the Tekton stack + credentials Secret. See the per-Configuration README.
spec:
  crossplane:
    version: ">=v2.1.3"
  dependsOn:
    # Pipeline Functions used by this Configuration's Composition.
    - function: xpkg.crossplane.io/crossplane-contrib/function-kcl
      version: ">=v0.12.0,<v0.13.0"
    - function: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      version: ">=v0.6.5,<v0.7.0"
    # Native single-VM Configurations this module fans out to. Installing
    # vm-batch pulls these (and transitively their providers/functions).
    - configuration: ghcr.io/stuttgart-things/crossplane-configurations/proxmoxvm
      version: ">=v0.2.0"
    - configuration: ghcr.io/stuttgart-things/crossplane-configurations/vspherevm
      version: ">=v0.3.0"
    # Emitted directly by this Configuration for the shared batch Ansible run.
    - configuration: ghcr.io/stuttgart-things/crossplane-configurations/ansible-run
      version: ">=v0.1.4"
