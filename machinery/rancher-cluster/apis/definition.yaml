---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: rancherclusters.resources.stuttgart-things.com
spec:
  group: resources.stuttgart-things.com
  defaultCompositeDeletePolicy: Foreground
  scope: Namespaced
  names:
    kind: RancherCluster
    plural: rancherclusters
    singular: ranchercluster
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                environmentConfig:
                  type: string
                  description: >-
                    Selects the EnvironmentConfig (by the config-scoped label
                    `rancher-cluster.resources.stuttgart-things.com/environment`)
                    that supplies per-environment defaults — providerConfigRef(s),
                    rancherNamespace, distro, kubernetesVersion, the Harvester
                    infra fields and the Argo CD target. Anything set on this XR
                    spec wins over the EnvironmentConfig.
                  default: default
                providerConfigRef:
                  type: string
                  description: >-
                    Name of the provider-kubernetes ClusterProviderConfig for
                    the CONTROL-PLANE cluster where Crossplane runs. The wired
                    downstream ClusterProviderConfig, the bridged kubeconfig
                    Secret and (optional) Argo CD objects are created here. When
                    co-located with Rancher (the default, see
                    rancherProviderConfigRef) this is also where the
                    provisioning.cattle.io Cluster lands. Falls back to the
                    EnvironmentConfig `providerConfigRef` when unset.
                rancherProviderConfigRef:
                  type: string
                  description: >-
                    Optional. Name of the provider-kubernetes
                    ClusterProviderConfig that targets the Rancher MANAGEMENT
                    cluster (where the provisioning.cattle.io Cluster is created
                    and Rancher publishes <name>-kubeconfig). Defaults to
                    providerConfigRef — i.e. Crossplane and Rancher co-located
                    on one cluster. Set this to a DIFFERENT
                    ClusterProviderConfig to split them: the Composition then
                    bridges Rancher's published kubeconfig to the control-plane
                    cluster via an Observe Object + connection Secret, and wires
                    the downstream ClusterProviderConfig against the bridged
                    copy.
                name:
                  type: string
                  description: >-
                    Name of the Rancher cluster. Also the prefix of the
                    Rancher-managed kubeconfig Secret (`<name>-kubeconfig`) and
                    the name of the emitted downstream ClusterProviderConfig.
                distro:
                  type: string
                  description: >-
                    Kubernetes distribution for the cluster. Falls back to the
                    EnvironmentConfig `distro`, then `k3s`.
                  enum:
                    - k3s
                    - rke2
                infrastructure:
                  type: string
                  description: >-
                    How the cluster's nodes are provisioned. `generic`
                    (default) creates a custom-node cluster with no machine
                    pools — nodes are registered manually via Rancher's
                    registration command. `harvester` provisions VM nodes on a
                    Harvester cluster via a machine pool backed by a
                    HarvesterConfig; requires the `harvester` block.
                  enum:
                    - generic
                    - harvester
                  default: generic
                kubernetesVersion:
                  type: string
                  description: >-
                    Rancher Kubernetes version, e.g. `v1.34.7+k3s1` or
                    `v1.31.5+rke2r1`. The `+k3s`/`+rke2` suffix selects the
                    distribution; keep it consistent with `distro`. Falls back to
                    the EnvironmentConfig `kubernetesVersion` when unset.
                rancherNamespace:
                  type: string
                  description: >-
                    Namespace on the management cluster holding the
                    provisioning Cluster and the Rancher-managed kubeconfig
                    Secret. Falls back to the EnvironmentConfig `rancherNamespace`,
                    then `fleet-default`.
                clusterLabels:
                  type: object
                  description: "Extra labels for the provisioning.cattle.io Cluster."
                  additionalProperties:
                    type: string
                machineGlobalConfig:
                  type: object
                  description: >-
                    Free-form rkeConfig.machineGlobalConfig passthrough
                    (e.g. cni, disable, kube-apiserver-arg).
                  x-kubernetes-preserve-unknown-fields: true
                clusterSpec:
                  type: object
                  description: >-
                    Free-form passthrough, deep-merged UNDER the
                    `provisioning.cattle.io` Cluster spec this Composition
                    composes. Anything the Rancher CRD offers and this XRD does
                    not name goes here — `rkeConfig.machineSelectorConfig` (the
                    per-role config a custom-node cluster with mixed roles needs),
                    `rkeConfig.registries` (mirrors / air-gap), `rkeConfig.etcd`
                    (snapshot schedule + S3), `rkeConfig.upgradeStrategy`,
                    `rkeConfig.chartValues`, `rkeConfig.additionalManifest`,
                    `localClusterAuthEndpoint`, `agentEnvVars`,
                    `enableNetworkPolicy`, the agent customizations.

                    Composed values win the merge. The keys the active path owns
                    are a render ERROR rather than a silent drop:
                    `kubernetesVersion` always, plus `cloudCredentialSecretName`
                    and `rkeConfig.machinePools` on `infrastructure: harvester`.
                    Use `spec.kubernetesVersion` / `spec.harvester.*` for those.

                    `rkeConfig.machineGlobalConfig` is the exception — it deep-
                    merges with `spec.machineGlobalConfig` per key, with the
                    latter winning, because both are the same distro config file.
                    Nothing here is schema-checked (the Rancher CRD is not ours),
                    so a misspelled key reaches the cluster and is rejected there,
                    not at admission.
                  x-kubernetes-preserve-unknown-fields: true
                nodeRegistration:
                  type: object
                  description: >-
                    Publish Rancher's node registration command, so nodes this
                    Configuration does NOT provision (the `generic` path, and any
                    custom node added to a `harvester` cluster) can be joined
                    without reading it out of the Rancher UI by hand.

                    Off by default: the command embeds the cluster's registration
                    token, and anyone who can read the published Secret can attach
                    a node to the cluster. That is a smaller grant than
                    `vaultAuth.enabled` but the same kind, so it is asked for
                    rather than assumed.
                  properties:
                    publish:
                      type: boolean
                      description: >-
                        Observe the cluster's ClusterRegistrationToken on the
                        Rancher cluster and publish its command into a Secret
                        beside this XR.
                      default: false
                    secretName:
                      type: string
                      description: >-
                        Name of the published Secret. Defaults to
                        `<name>-node-command`. Keys: `nodeCommand`,
                        `insecureNodeCommand`, both ready to run. On Rancher 2.15+
                        the ClusterRegistrationToken only carries a template with a
                        literal `{token}`; the token is read from its
                        `crt-token-<name>` Secret and substituted in. The raw
                        template is kept beside it as `<secretName>-raw`.
                    secretNamespace:
                      type: string
                      description: >-
                        Additionally mirror the published Secret into this
                        namespace on the control-plane cluster. Needed because
                        `ansible-run`'s `extraEnvSecretName` reads a Secret from
                        the PipelineRun's namespace (e.g. `tekton-ci`), while the
                        published Secret lands next to this XR. Unset means no
                        mirror.
                    tokenName:
                      type: string
                      description: >-
                        Name of the ClusterRegistrationToken in the management
                        cluster's namespace. Rancher creates it as `default-token`;
                        the knob exists because that name is a convention of
                        Rancher's, not an API guarantee.
                      default: default-token
                  default:
                    publish: false
                harvester:
                  type: object
                  description: >-
                    VM node config for `infrastructure: harvester`. The
                    Composition renders a HarvesterConfig (the VM template) and
                    a single machine pool referencing it. Ignored when
                    infrastructure is generic. The infra-identity fields
                    (cloudCredentialSecretName, imageName, networkName,
                    vmNamespace, sshUser) fall back to the EnvironmentConfig, so
                    a per-cluster XR typically only sets sizing/quantity here.
                  properties:
                    cloudCredentialSecretName:
                      type: string
                      description: >-
                        Rancher Harvester cloud credential, in
                        `<namespace>:<name>` form (e.g.
                        `cattle-global-data:cc-xxxxx`). Must already exist on the
                        Rancher cluster. Falls back to the EnvironmentConfig
                        `cloudCredentialSecretName`.
                    imageName:
                      type: string
                      description: >-
                        Harvester VM image, `<namespace>/<name>`
                        (e.g. `default/sthings-u26-k3s`). Falls back to the
                        EnvironmentConfig `imageName`.
                    networkName:
                      type: string
                      description: >-
                        Harvester network, `<namespace>/<name>`
                        (e.g. `default/vms`). Falls back to the EnvironmentConfig
                        `networkName`.
                    vmNamespace:
                      type: string
                      description: >-
                        Harvester namespace the VMs are created in. Falls back to
                        the EnvironmentConfig `vmNamespace`, then `default`.
                    cpuCount:
                      type: integer
                      description: "vCPUs per node."
                      default: 2
                    memorySize:
                      type: integer
                      description: "Memory per node, in GiB."
                      default: 4
                    diskSize:
                      type: integer
                      description: "Root disk per node, in GiB."
                      default: 40
                    sshUser:
                      type: string
                      description: >-
                        SSH user baked into the image (e.g. `ubuntu`, `sthings`).
                        Falls back to the EnvironmentConfig `sshUser`, then
                        `ubuntu`.
                    quantity:
                      type: integer
                      description: "Number of nodes in the pool."
                      default: 1
                    userData:
                      type: string
                      description: >-
                        cloud-init userData for the nodes (plain YAML; the
                        Composition base64-encodes it for HarvesterConfig).
                        Defaults to installing + enabling qemu-guest-agent,
                        which Harvester needs for IP reporting.
                bootstrap:
                  type: object
                  description: >-
                    Resources to apply to the DOWNSTREAM cluster via the
                    wired ClusterProviderConfig — proves the kubeconfig works.
                  properties:
                    namespace:
                      type: string
                      description: "Namespace to bootstrap on the downstream cluster."
                      default: crossplane-bootstrap
                    labels:
                      type: object
                      description: "Labels for the downstream bootstrap namespace."
                      additionalProperties:
                        type: string
                  default:
                    namespace: crossplane-bootstrap
                argocd:
                  type: object
                  description: >-
                    Optional: register the provisioned cluster in Argo CD via
                    the clusterbook-operator. Mints a non-expiring argocd-manager
                    ServiceAccount token on the downstream cluster, extracts it +
                    the downstream CA to the control plane, auto-discovers the
                    cluster's direct API endpoint, and assembles a direct-endpoint
                    kubeconfig (no Rancher proxy dependency). Emits the kubeconfig
                    Secret + a ClusterbookCluster on the cluster that runs Argo CD
                    + clusterbook-operator (providerConfigRef).
                  properties:
                    register:
                      type: boolean
                      description: "Enable Argo CD registration via clusterbook-operator."
                      default: false
                    reservation:
                      type: object
                      description: >-
                        IP/DNS reservation via clusterbook-operator. When
                        enabled, the ClusterbookCluster reserves an IP from
                        networkKey (and optionally creates DNS), stamping the
                        `clusterbook.stuttgart-things.com/allocation-ip` label +
                        ip/fqdn annotations onto the cluster Secret — the anchor
                        every network-platform ApplicationSet requires. When
                        disabled (the default), `skipReservation: true` is set
                        and no anchor is produced (the cluster joins Argo CD with
                        its verbatim direct endpoint, no clusterbook IP/DNS).
                      properties:
                        enabled:
                          type: boolean
                          description: "Reserve an IP (sets the ClusterbookCluster's skipReservation: false). Default false."
                          default: false
                        networkKey:
                          type: string
                          description: >-
                            Network prefix to reserve the IP from (e.g.
                            '192.168.10'). Falls back to the EnvironmentConfig
                            `clusterbookNetworkKey`. Required for a reservation.
                        providerConfigRef:
                          type: string
                          description: >-
                            ClusterbookProviderConfig name backing the
                            reservation. Falls back to the EnvironmentConfig
                            `clusterbookProviderConfigRef`, then `default`.
                        createDNS:
                          type: boolean
                          description: "Create the DNS record for the reserved IP. Defaults true when a reservation is enabled."
                        releaseOnDelete:
                          type: boolean
                          description: >-
                            Give the reserved IP and its DNS record back to clusterbook when
                            the cluster is deleted. Defaults true. Set false only to park an
                            address across a rebuild -- and note that a parked address is
                            invisible: clusterbook reports it ASSIGNED to a cluster that no
                            longer exists, and nothing ever reclaims it.
                    namespace:
                      type: string
                      description: >-
                        Argo CD namespace — holds the assembled kubeconfig
                        Secret and the generated cluster Secret. Falls back to the
                        EnvironmentConfig `argocdNamespace`, then `argocd`.
                    providerConfigRef:
                      type: string
                      description: >-
                        ClusterProviderConfig for the cluster running Argo CD +
                        clusterbook-operator (where the kubeconfig Secret and
                        ClusterbookCluster are created). Falls back to the
                        EnvironmentConfig `argocdProviderConfigRef`, then
                        spec.rancherProviderConfigRef — in the stuttgart-things
                        lab Argo CD + clusterbook run on the Rancher cluster, not
                        the Crossplane control plane.
                    server:
                      type: string
                      description: >-
                        Optional override for the downstream cluster's direct API
                        endpoint (https://<host>:6443). Normally left UNSET — the
                        Composition auto-discovers it from the downstream
                        `kubernetes` Endpoints. Set this only for HA clusters
                        where you want a stable VIP/LB instead of a node IP.
                    labels:
                      type: object
                      description: >-
                        Labels for the ClusterbookCluster / Argo CD cluster
                        Secret (e.g. for ApplicationSet cluster selectors —
                        the platform profile toggles like
                        `cicd-platform/crossplane: 'true'`).
                      additionalProperties:
                        type: string
                    annotations:
                      type: object
                      description: >-
                        Annotations for the ClusterbookCluster / Argo CD
                        cluster Secret. Platform ApplicationSets read component
                        parameters from these (e.g.
                        `clusterbook.stuttgart-things.com/vault-server`,
                        `storage-platform.stuttgart-things.com/nfs-server`).
                        Set only the `[user]` annotations here; `[auto]` ones
                        (ip/fqdn/…) are stamped by the clusterbook controller
                        from the reservation and are absent when
                        skipReservation is true.
                      additionalProperties:
                        type: string
                  default:
                    register: false
                vaultAuth:
                  type: object
                  description: >-
                    Prepares the cluster for Vault/OpenBao KUBERNETES auth, so a
                    VaultK8sAuth XR can create the auth mount without a human
                    running terraform with the root token first.

                    It does NOT create the mount. What it creates is the part only
                    this Composition can: the token-reviewer identity on the new
                    cluster, its credentials mirrored back to a Secret next to this
                    XR (which is where VaultK8sAuth.spec.k8sAuths[].backendConfig
                    reads them), the cert-manager ServiceAccount that the issuer
                    logs in as, and the API endpoint as status.vaultKubernetesHost.

                    See docs/392-handover.md.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                      description: >-
                        Off by default. On, this cluster grows a
                        system:auth-delegator-bound ServiceAccount whose token any
                        holder can use to review logins — a real grant, so it is
                        opt-in per cluster.

                        composeMount: true turns this on regardless of what is
                        stored here. XRD defaulting writes `enabled: false` into
                        the spec of an XR that only set composeMount, and the
                        Composition overrides it internally, so a cluster showing
                        composeMount: true next to enabled: false is behaving
                        correctly. Check status.vaultReviewerSecret and
                        status.vaultKubernetesHost — they only exist once it took
                        effect. Do not add `enabled: true` to "fix" the spec: it
                        then reads as required and the next cluster copies it,
                        which quietly undoes composeMount implying it.
                    reviewerServiceAccount:
                      type: string
                      default: vault-auth-reviewer
                      description: >-
                        Name of the token-reviewer ServiceAccount created on the
                        DOWNSTREAM cluster. vault-base-setup creates the same
                        identity itself (k8s_auth_reviewer_create) and blueprints
                        CreateVaultKubernetesAuth creates it on pipeline-built
                        clusters — keep the name aligned with whichever owns it,
                        or two owners fight over one identity.
                    reviewerNamespace:
                      type: string
                      default: kube-system
                      description: "Namespace of the reviewer ServiceAccount and its token Secret."
                    certManagerServiceAccount:
                      type: string
                      default: certmanager
                      description: >-
                        ServiceAccount cert-manager authenticates to Vault as. Only
                        created when the vault-pki block is also on, because that is
                        the only thing that needs it. Its absence surfaces as a Vault
                        error ("while requesting a token for the service account
                        /certmanager"), which is what makes it worth owning here.
                        The matching cert-manager-tokenrequest Role arrives on its
                        own from the cert-manager-vault-pki ApplicationSet.
                    composeMount:
                      type: boolean
                      default: false
                      description: >-
                        Compose the VaultK8sAuth child XR that CREATES the auth mount, instead of
                        leaving it to a separately applied XR. Requires the vault-auth Configuration
                        on this control plane -- declared as a dependsOn, so a version below the
                        floor is a refused install rather than a child XR carrying fields its XRD
                        does not declare. Implies enabled.
                    mountClusterName:
                      type: string
                      description: >-
                        First half of the Vault auth mount path -- vault-base-setup derives the mount
                        as <mountClusterName>-<roleName>. Defaults to '<cluster name>-sthings'.
                        Changing it changes the mount path, so it must stay in step with the
                        vault-k8s-auth-mount annotation; with composeMount that annotation is
                        derived from this value rather than written twice.
                    roleName:
                      type: string
                      default: certmanager
                      description: "Second half of the mount path, and the name of the Vault role bound to the cert-manager ServiceAccount."
                    tokenPolicies:
                      type: array
                      items:
                        type: string
                      default: ["pki-issue"]
                      description: >-
                        Vault policies the login token receives. REFERENCED, not created -- a role
                        bound to a policy that does not exist logs in successfully and is granted
                        nothing, which surfaces as a denied signing request much later.
                    approleSecret:
                      type: string
                      default: vault
                      description: >-
                        Secret in this XR's namespace holding terraform.tfvars with vault_role_id and
                        vault_secret_id. AppRole, not a token, despite VaultK8sAuth calling the field
                        vaultTokenSecret. The AppRole needs sudo AND delete on sys/auth/*.
                    opentofuProviderConfigName:
                      type: string
                      default: in-cluster
                      description: "OpenTofu ClusterProviderConfig the composed VaultK8sAuth drives Vault through."
                  default:
                    enabled: false
              # providerConfigRef, kubernetesVersion and the Harvester infra
              # fields are resolved from the EnvironmentConfig when unset, so they
              # are not `required` here (CEL cannot see EnvironmentConfig values).
              # spec.argocd.server is auto-discovered, not required.
              required:
                - name
            status:
              type: object
              properties:
                kubeconfigSecret:
                  type: string
                  description: "Name of the Rancher-managed kubeconfig Secret."
                clusterProviderConfig:
                  type: string
                  description: "Name of the emitted downstream ClusterProviderConfig."
                argocdClusterSecret:
                  type: string
                  description: "Name of the Argo CD cluster Secret clusterbook-operator generates (cluster-<name>)."
                vaultReviewerSecret:
                  type: string
                  description: >-
                    Secret next to this XR holding the token reviewer's `token`
                    and `ca.crt`. Feed it to
                    VaultK8sAuth.spec.k8sAuths[].backendConfig.secretName.
                nodeCommandSecret:
                  type: string
                  description: >-
                    Secret beside this XR holding Rancher's node registration
                    command (`nodeCommand`, `insecureNodeCommand`), ready to
                    run: the registration token is substituted in.
                    Append the role flags (`--etcd --controlplane --worker`)
                    when running it — Rancher does not include them.
                rancherClusterId:
                  type: string
                  description: >-
                    The management cluster ID Rancher assigned (`c-m-xxxxx`) —
                    the namespace its ClusterRegistrationToken lives in.
                vaultKubernetesHost:
                  type: string
                  description: >-
                    The downstream API endpoint, discovered from that cluster's
                    own `kubernetes` Endpoints. This is VaultK8sAuth's
                    kubernetesHost — it defaults to the in-cluster address, which
                    is wrong when Vault runs elsewhere.
                ready:
                  type: boolean
