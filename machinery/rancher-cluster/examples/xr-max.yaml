---
# Every spec field set — catches templating breakage. A generic rke2 cluster
# with cluster labels, an rkeConfig.machineGlobalConfig passthrough and a
# labelled downstream bootstrap namespace.
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: RancherCluster
metadata:
  name: rke2-prod
  namespace: default
spec:
  # Explicit, even though the XRD defaults it to "default". `crossplane render`
  # does NOT apply XRD schema defaults — there is no API server and no defaulting
  # admission — so an example that omits this renders with an EMPTY $env: no
  # EnvironmentConfig is selected, every value that comes from one falls back to
  # its in-template default, and any block gated on an env key silently vanishes.
  # That is what kept the whole vault-pki block (5) out of this golden.
  environmentConfig: default
  providerConfigRef: in-cluster
  name: rke2-prod
  distro: rke2
  kubernetesVersion: v1.31.5+rke2r1
  rancherNamespace: fleet-default
  clusterLabels:
    env: prod
    team: platform
    app.kubernetes.io/part-of: stuttgart-things
  machineGlobalConfig:
    cni: calico
    disable:
      - rke2-ingress-nginx
    kube-apiserver-arg:
      - audit-log-maxage=30
  bootstrap:
    namespace: platform-system
    labels:
      managed-by: crossplane
      app.kubernetes.io/part-of: stuttgart-things
  # Register the new cluster in Argo CD via clusterbook-operator. Mints a
  # non-expiring argocd-manager SA token on the downstream cluster and assembles
  # a direct-endpoint kubeconfig (server below + downstream CA + SA token) — no
  # Rancher auth-proxy dependency. The kubeconfig Secret + ClusterbookCluster are
  # created on the cluster that runs Argo CD + clusterbook (providerConfigRef;
  # here the Rancher cluster).
  # Prepares this cluster for Vault/OpenBao kubernetes auth: the token-reviewer
  # identity downstream, its credentials mirrored back to
  # `rke2-prod-vault-reviewer` next to this XR, and the API endpoint published as
  # status.vaultKubernetesHost. Hand that Secret and that host to a VaultK8sAuth
  # XR and the auth mount needs no root token and no manual step. See
  # docs/392-handover.md.
  vaultAuth:
    enabled: true
  argocd:
    register: true
    namespace: argocd
    providerConfigRef: rancher-mgmt          # cluster running Argo CD + clusterbook
    server: https://192.168.10.135:6443      # downstream API endpoint (VIP/LB for HA)
    labels:
      env: prod
      region: eu-central-1
      # Turns on block (5): the Composition reads the vault-pki token + CA from
      # the control plane and pushes both onto this cluster's cert-manager
      # namespace, so the ClusterIssuer the cert-manager-vault-pki AppSet ships
      # has its prerequisites. Set here because xr-max is the "every field"
      # example — it is what keeps that block rendered, and therefore covered by
      # a golden snapshot.
      network-platform/cert-manager-vault-pki: 'true'
    annotations:
      # Name of the token Secret block (5c) writes downstream, and the name the
      # ClusterIssuer's auth.tokenSecretRef expects.
      clusterbook.stuttgart-things.com/vault-token-secret: cert-manager-vault-token  # pragma: allowlist secret
