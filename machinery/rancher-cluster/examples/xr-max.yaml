---
# Every spec field set — catches templating breakage. A generic rke2 cluster
# with cluster labels, an rkeConfig.machineGlobalConfig passthrough and a
# labelled downstream bootstrap namespace.
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: RancherCluster
metadata:
  name: rke2-prod
  namespace: default
spec:
  # Explicit, even though the XRD defaults it to "default". `crossplane render`
  # does NOT apply XRD schema defaults — there is no API server and no defaulting
  # admission — so an example that omits this renders with an EMPTY $env: no
  # EnvironmentConfig is selected, every value that comes from one falls back to
  # its in-template default, and any block gated on an env key silently vanishes.
  # That is what kept the whole vault-pki block (5) out of this golden.
  environmentConfig: default
  providerConfigRef: in-cluster
  name: rke2-prod
  distro: rke2
  kubernetesVersion: v1.31.5+rke2r1
  rancherNamespace: fleet-default
  clusterLabels:
    env: prod
    team: platform
    app.kubernetes.io/part-of: stuttgart-things
  machineGlobalConfig:
    cni: calico
    disable:
      - rke2-ingress-nginx
    kube-apiserver-arg:
      - audit-log-maxage=30
  bootstrap:
    namespace: platform-system
    labels:
      managed-by: crossplane
      app.kubernetes.io/part-of: stuttgart-things
  # Free-form passthrough into the provisioning Cluster's spec: everything the
  # Rancher CRD offers that this XRD does not name. Deep-merged UNDER the
  # composed spec, so kubernetesVersion and (on the harvester path) the machine
  # pool cannot be redefined from here — those are a render error, not a silent
  # drop. rkeConfig below MERGES with the machineGlobalConfig above rather than
  # replacing it: the rendered cluster carries cni/disable/kube-apiserver-arg
  # AND the four blocks here.
  clusterSpec:
    # Authorized Cluster Endpoint: a kubeconfig straight at the cluster instead
    # of through the Rancher auth proxy. Relevant to the token-TTL caveat in the
    # README — the proxy kubeconfig's token can expire, this endpoint does not.
    localClusterAuthEndpoint:
      enabled: true
    enableNetworkPolicy: false
    rkeConfig:
      # THE ONE A CUSTOM-NODE CLUSTER CANNOT DO WITHOUT once it has more than one
      # role: config that applies only to the nodes matching the selector. With
      # every node registered by hand (infrastructure: generic), this is how a
      # control-plane node gets different arguments from a worker.
      machineSelectorConfig:
        - machineLabelSelector:
            matchLabels:
              rke.cattle.io/control-plane-role: 'true'
          config:
            protect-kernel-defaults: true
      # Registry mirrors — the Rancher-side equivalent of the registry_mirror_url
      # the ansible path passes.
      registries:
        mirrors:
          docker.io:
            endpoint:
              - https://registry-1.docker.io
      etcd:
        snapshotScheduleCron: 0 */5 * * *
        snapshotRetention: 5
      upgradeStrategy:
        controlPlaneConcurrency: '1'
        workerConcurrency: '1'
  # Publish Rancher's node registration command. Every field set, which is what
  # this example is for: secretNamespace additionally mirrors the Secret into the
  # Tekton namespace, because ansible-run's extraEnvSecretName reads its Secret
  # from the PipelineRun's namespace, not from next to this XR. tokenName is
  # Rancher's own convention and normally left alone.
  nodeRegistration:
    publish: true
    secretName: rke2-prod-node-command  # pragma: allowlist secret
    secretNamespace: tekton-ci  # pragma: allowlist secret
    tokenName: default-token
  # Register the new cluster in Argo CD via clusterbook-operator. Mints a
  # non-expiring argocd-manager SA token on the downstream cluster and assembles
  # a direct-endpoint kubeconfig (server below + downstream CA + SA token) — no
  # Rancher auth-proxy dependency. The kubeconfig Secret + ClusterbookCluster are
  # created on the cluster that runs Argo CD + clusterbook (providerConfigRef;
  # here the Rancher cluster).
  # Prepares this cluster for Vault/OpenBao kubernetes auth: the token-reviewer
  # identity downstream, its credentials mirrored back to
  # `rke2-prod-vault-reviewer` next to this XR, and the API endpoint published as
  # status.vaultKubernetesHost. Hand that Secret and that host to a VaultK8sAuth
  # XR and the auth mount needs no root token and no manual step. See
  # docs/392-handover.md.
  vaultAuth:
    enabled: true
    # Phase 2: also compose the VaultK8sAuth that creates the mount. Requires
    # the vault-auth Configuration (declared as a dependsOn) and an AppRole
    # Secret named `vault` next to this XR.
    composeMount: true
  argocd:
    register: true
    namespace: argocd
    providerConfigRef: rancher-mgmt          # cluster running Argo CD + clusterbook
    server: https://192.168.10.135:6443      # downstream API endpoint (VIP/LB for HA)
    labels:
      env: prod
      region: eu-central-1
      # The umbrella. Required for the component below to do anything: every
      # network-platform AppSet gates on `network-platform: 'true'` first, and
      # the Composition's inlined vault-pki block mirrors that same gate -- a
      # component label without the umbrella switches on nothing, anywhere.
      network-platform: 'true'
      # Turns on block (5): the Composition reads the vault-pki token + CA from
      # the control plane and pushes both onto this cluster's cert-manager
      # namespace, so the ClusterIssuer the cert-manager-vault-pki AppSet ships
      # has its prerequisites. Set here because xr-max is the "every field"
      # example — it is what keeps that block rendered, and therefore covered by
      # a golden snapshot.
      network-platform/cert-manager-vault-pki: 'true'
    annotations:
      # Name of the token Secret block (5c) writes downstream, and the name the
      # ClusterIssuer's auth.tokenSecretRef expects.
      # Required by vaultAuth.composeMount -- the composed VaultK8sAuth reads the
      # Vault address from here rather than taking a second field that could
      # disagree with it.
      clusterbook.stuttgart-things.com/vault-server: https://openbao.platform.sthings.lab
      clusterbook.stuttgart-things.com/vault-pki-path: pki/sign/sthings-lab
      clusterbook.stuttgart-things.com/vault-token-secret: cert-manager-vault-token  # pragma: allowlist secret
