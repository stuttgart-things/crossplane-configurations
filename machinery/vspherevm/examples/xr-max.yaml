---
# Maximum example: every spec field set, selecting the `labda` EnvironmentConfig
# and overriding placement MOIDs + tunables per VM (XR spec wins over the
# EnvironmentConfig). Catches templating breakage.
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: NativeVsphereVM
metadata:
  name: vspherevm-max
  namespace: default
spec:
  environmentConfig: labda
  providerConfigRef:
    name: default
  vm:
    name: vspherevm-max
    cpu: "8"
    ram: "16384"
    disk: "96"
    waitForGuestNetTimeout: "5"
    guestId: ubuntu64Guest
    firmware: bios
    scsiType: pvscsi
    adapterType: vmxnet3
    annotation: "VSPHERE-VM BUILD w/ CROSSPLANE (native) FOR STUTTGART-THINGS"
    # placement MOID overrides (otherwise inherited from the labda EnvironmentConfig)
    templateUuid: 42212cd2-5060-9bc5-ac82-7fdef66efc61
    datastoreId: datastore-12
    resourcePoolId: resgroup-8
    networkId: dvportgroup-2048
    folder: stuttgart-things/testing
    # Tag IDs, NOT tag names — a vSphere tag is an inventory object and the
    # VirtualMachine resource takes its URN. PLACEHOLDER: look yours up with
    # `govc tags.ls -json`; an id that does not exist fails the clone, and
    # nothing here can create it. Merged with the labda EnvironmentConfig's tag,
    # then sorted and deduped (the CRD declares the field as a set).
    tags:
      - urn:vmomi:InventoryServiceTag:1d3f7a90-0000-0000-0000-000000000002:GLOBAL
    tagsPolicy: Merge
    # Custom attributes, keyed by the NUMERIC vCenter field id (`govc fields.ls`).
    # Merged per key with the environment's, this XR winning — 101 comes from the
    # labda EnvironmentConfig, 102 is added here.
    customAttributes:
      "102": crossplane
  # Optional base-OS provisioning: once the VM is Ready with an IP, an AnsibleRun
  # is emitted with the inventory auto-populated to the VM IP. Requires the
  # ansible-run cluster preconditions (Tekton, ansible-credentials Secret, an
  # in-cluster provider-kubernetes config).
  ansible:
    enabled: true
    playbooks:
      - sthings.baseos.setup
    varsFile:
      - manage_filesystem+-true
      - update_packages+-true
    crossplaneProviderConfig: in-cluster
    # Keys of this Secret become env vars of the same name in the ansible step.
    # The Rancher custom-node join (crossplane-configurations#422) is what this
    # is for: the play reads lookup('env', 'nodeCommand') instead of taking the
    # registration token through varsFile, i.e. through this spec.
    extraEnvSecretName: ansible-extra-env  # pragma: allowlist secret
    # Secret the ansible step takes VAULT_ADDR / VAULT_ROLE_ID / VAULT_SECRET_ID
    # from. Unset, ansible-run's default `vault` applies. A join play publishing
    # the node kubeconfig to the infra Vault needs a writer AppRole instead
    # (crossplane-configurations#421).
    vaultSecretName: vault-infra-kubeconfig-writer  # pragma: allowlist secret
