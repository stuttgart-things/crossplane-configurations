---
# Shared per-environment infrastructure defaults for ProxmoxVM XRs.
#
# The `proxmox-vm` Composition selects this EnvironmentConfig via the
# config-scoped label `proxmox-vm.resources.stuttgart-things.com/environment`,
# matched against the XR's `spec.environmentConfig` (default "default"). The
# key is namespaced to this Configuration so it never collides with another
# Configuration's EnvironmentConfig (function-environment-configs requires
# exactly one Selector match). The `data` values are loaded
# into the pipeline environment and used by `function-patch-and-transform`
# as defaults for the OpenTofu Workspace vars. Anything set explicitly on the
# XR spec wins over the values here.
#
# Values below describe the LabUL Proxmox environment.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: proxmox-vm-defaults
  labels:
    proxmox-vm.resources.stuttgart-things.com/environment: default
data:
  # Proxmox placement (LabUL).
  node: ul-pve01
  # V5010-01-1, NOT DD-sthings. `DD-sthings` is a TEMPLATES-ONLY store for this
  # identity and a root disk there fails the build:
  #
  #   403 Permission check failed (/storage/DD-sthings, Datastore.AllocateSpace)
  #
  # `/storage/DD-sthings` carries a more specific ACL granting the role
  # `SVATemplates` — Datastore.AllocateTemplate + Datastore.Audit, no
  # AllocateSpace — and under Proxmox' deepest-path rule that REPLACES the
  # broader `/storage` grant instead of adding to it. Measured 2026-08-25 with
  # the identity in the `proxmox-tfvars` secret (`phermann@LabUL`): allocating
  # on DD-sthings returns 403, the same call against V5010-01-1 returns 200.
  #
  # The homerun2-dev Terraform this file used to cite still says DD-sthings. It
  # predates the ACL; do not copy it back.
  datastore: V5010-01-1
  folderPath: stuttgart-things
  network: vmbr0

  # VM template / metadata
  #
  # `sthings-u26` is unambiguous again: it names exactly ONE template, VMID 110,
  # and that template lives on **ul-pve10** while `node` above is ul-pve01. The
  # cross-node clone is fine — 110's disk is on V5010-01-1, which is shared LVM
  # active on both nodes — and was verified end-to-end on 2026-08-25.
  #
  # Note 110 ships `/etc/cloud/cloud-init.disabled`, so the guest ignores
  # cloud-init. Hostname and user must come from configuration management, not
  # from injected user-data.
  template: sthings-u26
  annotation: PROXMOX-VM BUILD w/ CROSSPLANE FOR STUTTGART-THINGS

  # tfvars Secret (pre-created in the XR's namespace; holds Proxmox creds)
  tfvarsSecretName: proxmox-tfvars # pragma: allowlist secret
  tfvarsSecretKey: terraform.tfvars # pragma: allowlist secret

  # OpenTofu provider config the Workspace runs through.
  #
  # NOT reliably "default" -- kind1 serves exactly one, called `in-cluster`.
  # Check with `kubectl get clusterproviderconfigs.opentofu.m.upbound.io`; a
  # wrong name here fails the Workspace with `cannot get provider config:
  # ClusterProviderConfig … not found`. Corrected 2026-08-06 together with the
  # same stale value in cicd/packer-release/examples/environmentconfig.yaml,
  # which matters here because a Proxmox PackerRelease smoke test provisions
  # through this Configuration.
  providerConfigName: in-cluster
  providerConfigKind: ClusterProviderConfig
