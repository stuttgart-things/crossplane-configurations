---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: platforms.config.stuttgart-things.com
spec:
  group: config.stuttgart-things.com
  defaultCompositeDeletePolicy: Foreground
  scope: Namespaced
  names:
    kind: Platform
    plural: platforms
    singular: platform
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "has(self.clusterName) || (has(self.helmProviderConfigRef) && has(self.kubernetesProviderConfigRef))"
                  message: either clusterName, or both helmProviderConfigRef and kubernetesProviderConfigRef, must be set
                # Apps reference Flux sources that the FluxInit child creates, so
                # enabling one without fluxInit can never converge. Rejected here,
                # at apply time, rather than as a composition error later.
                - rule: "!(has(self.apps) && self.apps.exists(k, self.apps[k].enabled) && has(self.fluxInit) && has(self.fluxInit.enabled) && !self.fluxInit.enabled)"
                  message: apps are enabled but fluxInit is disabled — fluxInit creates the Flux sources every app references; enable fluxInit or disable all apps
              properties:
                # --- Shared cluster identity: set once here, passed to every component ---
                clusterName:
                  type: string
                  description: >-
                    Target cluster's RemoteCluster name. When set, the provider
                    config refs default to {clusterName}-helm and
                    {clusterName}-kubernetes. This is the primary shared input —
                    every component of the platform targets this cluster.
                helmProviderConfigRef:
                  type: string
                  description: >-
                    Helm ClusterProviderConfig for the target cluster. Optional
                    when clusterName is set (defaults to {clusterName}-helm).
                kubernetesProviderConfigRef:
                  type: string
                  description: >-
                    Kubernetes ClusterProviderConfig for the target cluster.
                    Optional when clusterName is set (defaults to {clusterName}-kubernetes).
                observeProviderConfigRef:
                  type: string
                  default: in-cluster
                  description: >-
                    Kubernetes ClusterProviderConfig (InjectedIdentity) used to
                    observe resources on the management cluster.
                namespace:
                  type: string
                  default: flux-system
                  description: >-
                    Target namespace on the cluster for platform components.
                    Distinct from metadata.namespace (where the XR itself lives).
                # --- Apps: catalog-driven, delegated to the flux-apps Configuration ---
                apps:
                  type: object
                  description: >-
                    Apps to deploy, keyed by catalog name (see the
                    xplane-flux-catalog KCL module). Enabling one emits BOTH the
                    OCIRepository source on the FluxInit child and the
                    Kustomization entries on the FluxApps child — the source name
                    and the app are the same fact, because stuttgart-things/flux
                    publishes one OCI artifact per app. A map, not a list, so
                    per-app overrides merge. Unknown names are rejected.
                  additionalProperties:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                        description: Deploy this app. false prunes it (the Kustomization and its workload are removed)
                      version:
                        type: string
                        description: OCI tag of the app artifact; defaults to the catalog's defaultVersion
                      targetNamespace:
                        type: string
                        description: Namespace all of this app's resources are applied to
                      substitute:
                        type: object
                        description: postBuild.substitute applied to every component of this app. Values are environment-specific and deliberately live here, not in the catalog.
                        x-kubernetes-preserve-unknown-fields: true
                      components:
                        type: object
                        description: Per-component overrides, keyed by the catalog's component name (e.g. control-plane)
                        additionalProperties:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            timeout:
                              type: string
                              description: Overrides the catalog's timeout for this component
                            targetNamespace:
                              type: string
                            substitute:
                              type: object
                              description: Merged over the app-level substitute; wins on conflict
                              x-kubernetes-preserve-unknown-fields: true
                            substituteFrom:
                              type: array
                              description: >-
                                postBuild.substituteFrom for this component only.
                                Component-scoped on purpose — it resolves at build
                                time and a missing Secret fails the build, so an
                                app-wide one would break components that do not need it.
                              items:
                                type: object
                                required:
                                  - kind
                                  - name
                                properties:
                                  kind:
                                    type: string
                                    enum:
                                      - ConfigMap
                                      - Secret
                                  name:
                                    type: string
                                  optional:
                                    type: boolean
                # --- Components: one block per wrapped Configuration ---
                cni:
                  type: object
                  description: >-
                    Cluster networking, delegated to the cni Configuration
                    (composes a Cni XR). Disabled by default — a cluster that
                    already has a CNI (most of them) must not get a second one.
                    Enable it for clusters built deliberately blank, e.g. the
                    kind clusters this fleet provisions via ansible.

                    When enabled, every other component waits for it: a cluster
                    with no CNI has NotReady nodes, so a Helm install aimed at
                    it does not fail fast, it times out and retries.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                      description: Compose a Cni XR for this platform
                    provider:
                      type: string
                      default: cilium
                      enum:
                        - cilium
                    namespace:
                      type: string
                      description: Namespace on the target cluster (defaults to kube-system)
                    chart:
                      type: object
                      properties:
                        version:
                          type: string
                        repository:
                          type: string
                    cilium:
                      type: object
                      description: Passed through verbatim to Cni.spec.cilium.
                      x-kubernetes-preserve-unknown-fields: true
                    values:
                      type: object
                      description: Passed through verbatim to Cni.spec.values (raw Helm values).
                      x-kubernetes-preserve-unknown-fields: true
                fluxInit:
                  type: object
                  description: >-
                    Flux bootstrap, delegated to the flux-init Configuration
                    (composes a FluxInit XR). Fields mirror FluxInit.spec; the
                    shared cluster identity above is injected automatically.
                  properties:
                    enabled:
                      type: boolean
                      default: true
                      description: Compose a FluxInit XR for this platform
                    operatorChart:
                      type: object
                      properties:
                        version:
                          type: string
                        repoURL:
                          type: string
                    instance:
                      type: object
                      properties:
                        distribution:
                          type: string
                        components:
                          type: array
                          items:
                            type: string
                        sources:
                          type: array
                          description: Optional list of OCI/Git sources - if omitted, Flux controllers are installed without sources
                          items:
                            type: object
                            required:
                              - name
                              - url
                            properties:
                              name:
                                type: string
                              kind:
                                type: string
                                enum:
                                  - GitRepository
                                  - OCIRepository
                                default: OCIRepository
                              url:
                                type: string
                              ref:
                                type: string
                                default: latest
                              path:
                                type: string
                                default: "."
                              pullSecret:
                                type: string
                    kustomize:
                      type: object
                      description: Passed through verbatim to FluxInit.spec.kustomize.
                      x-kubernetes-preserve-unknown-fields: true
                    sops:
                      type: object
                      description: Passed through verbatim to FluxInit.spec.sops.
                      x-kubernetes-preserve-unknown-fields: true
                ipReservation:
                  type: object
                  description: >-
                    Reserve a clusterbook IP for this cluster, delegated to the
                    ip-reservation Configuration (composes an XIPReservation on
                    the management cluster). Opt-in. When cilium's dynamic
                    LoadBalancer is also enabled, its reservationRef auto-wires to
                    this reservation so the reserved IP becomes the LB pool block.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                      description: Compose an XIPReservation for this platform
                    count:
                      type: integer
                      description: Number of IPs to reserve (default 1)
                    ip:
                      type: string
                      description: Explicit IP — skips auto-reservation
                    createDNS:
                      type: boolean
                      description: Create a PDNS wildcard record for the reserved IP
                    clusterbookProviderConfigRef:
                      type: string
                      description: clusterbook ClusterProviderConfig name (default "default")
                cilium:
                  type: object
                  description: >-
                    Cilium LoadBalancer + Gateway services, delegated to the
                    cilium Configuration (composes a Cilium XR). Superset of cni.
                    Opt-in and defaults install.enabled=false — it layers the
                    LB/Gateway services on top of the CNI (installed by cni or
                    already on the cluster), so it is gated on the network being
                    up. install/loadBalancer/gateway are passed through verbatim
                    to the Cilium XR (which validates them).
                  properties:
                    enabled:
                      type: boolean
                      default: false
                      description: Compose a Cilium XR for this platform
                    install:
                      type: object
                      description: Cilium install (defaults enabled=false in the platform). Passed to Cilium.spec.install.
                      x-kubernetes-preserve-unknown-fields: true
                    loadBalancer:
                      type: object
                      description: Passed to Cilium.spec.loadBalancer. reservationRef auto-wires to ipReservation when dynamic and unset.
                      x-kubernetes-preserve-unknown-fields: true
                    gateway:
                      type: object
                      description: Passed to Cilium.spec.gateway.
                      x-kubernetes-preserve-unknown-fields: true
                vaultIssuer:
                  type: object
                  description: >-
                    Tokenless cert-manager -> Vault-PKI issuer (opt-in). Composes
                    a VaultK8sAuth (Vault k8s-auth mount), a VaultPkiSecret (CA
                    bundle -> target cert-manager ns), and the k8s-auth
                    ClusterIssuer + TokenRequest RBAC. The cert-manager CONTROLLER
                    comes via apps.cert-manager (FluxApps); this only wires the
                    issuer. Prereqs on the mgmt cluster in the Platform namespace:
                    approleSecret, reviewerSecret, caSourceSecret (referenced by
                    name, not created here).
                  properties:
                    enabled:
                      type: boolean
                      default: false
                      description: Compose the vault-issuer children for this platform
                    autoReviewer:
                      type: boolean
                      default: true
                      description: >-
                        Auto-provision the Vault token_reviewer_jwt: an
                        auth-delegator SA + token Secret on the target, observed
                        and copied into a mgmt Secret the Workspace reads. When
                        false, supply reviewerSecret instead.
                    vaultAddr:
                      type: string
                      description: Vault server URL (required when enabled)
                    skipTlsVerify:
                      type: boolean
                      default: true
                    authName:
                      type: string
                      default: certmanager
                      description: k8s auth mount suffix; mountPath = /v1/auth/{clusterName}-{authName}
                    pkiMount:
                      type: string
                      default: pki
                    pkiRole:
                      type: string
                      description: PKI role; issuer sign path = {pkiMount}/sign/{pkiRole}
                    tokenPolicies:
                      type: array
                      items:
                        type: string
                      description: Vault policies for the auth role (default ["pki-issue"])
                    additionalAuths:
                      type: array
                      description: >-
                        Further Kubernetes-auth mounts beside cert-manager's,
                        each with its own bound ServiceAccount and its own
                        policies.

                        external-secrets is why this exists: it needs a mount
                        and role of its own. Reusing cert-manager's would hand a
                        secrets reader the right to issue certificates.

                        Each entry appears on status.components.vaultIssuer.auths
                        keyed by name once Vault has created it, which is what
                        lets a catalog app discover its own cluster's mount
                        instead of being told the name by hand.
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            description: >-
                              Mount path becomes {clusterName}-{name}, role
                              becomes {name}.
                          boundServiceAccountNames:
                            type: array
                            items:
                              type: string
                          boundServiceAccountNamespaces:
                            type: array
                            items:
                              type: string
                          tokenPolicies:
                            type: array
                            items:
                              type: string
                            description: Policies that already exist in Vault.
                          policies:
                            type: array
                            description: >-
                              Policies to CREATE for this auth, named
                              {clusterName}-{name} and appended to tokenPolicies.
                              Created in the same OpenTofu plan as the role that
                              names them: Vault accepts a role referencing a
                              policy that does not exist, and the token then
                              simply has no permissions, with no error anywhere.
                              REQUIRES AN APPROLE THAT MAY WRITE POLICIES. The
                              fleet's bootstrap approle may not — sudo on
                              sys/auth only — and the resulting 403 on
                              sys/policies/acl aborts the plan BEFORE the role is
                              created, leaving a mount without a role. That
                              surfaces far from its cause, as `invalid role name`
                              at login. Against infra.sthings-vsphere use
                              tokenPolicies and create the policy elsewhere; see
                              crossplane-configurations#285.
                            items:
                              type: object
                              required:
                                - name
                                - rules
                              properties:
                                name:
                                  type: string
                                rules:
                                  type: string
                                  description: >-
                                    HCL body. The cluster's own subtree is the
                                    usual case, plus whatever the role it plays
                                    grants it.
                    kubernetesHost:
                      type: string
                      description: Target API host for the Vault mount config (kubernetes_host)
                    approleSecret:
                      type: string
                      default: vault-approle
                      description: Secret (mgmt ns) with terraform.tfvars = vault_role_id + vault_secret_id
                    reviewerSecret:
                      type: string
                      description: backendConfig secret (mgmt ns) with target ca.crt + reviewer token
                    caSourceSecret:
                      type: string
                      default: vault-pki-source-ca
                      description: Source CA secret (mgmt ns) copied to the target as caSecretName
                    caSecretName:
                      type: string
                      default: vault-pki-ca
                    certManagerNamespace:
                      type: string
                      default: cert-manager
                    issuerName:
                      type: string
                      default: vault-pki-k8s
                    wildcardCertificate:
                      type: object
                      description: >-
                        Issue `*.{domain}` through the ClusterIssuer above into a
                        Secret a Gateway listener can reference. Opt-in, and
                        additionally gated on the domain having been DISCOVERED by
                        the ipReservation child — the certificate reads the same
                        value the cilium substitutions do, so its CN and the
                        listener hostname cannot disagree. Without a domain nothing
                        is composed: a Certificate whose only dnsName is "*." is
                        rejected, and a Gateway waiting on a Secret that never
                        arrives is worse than one that was never asked to.
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        secretName:
                          type: string
                          default: wildcard-tls
                          description: >-
                            Name of the TLS Secret on the target, and of the
                            Certificate itself. Must match what the Gateway
                            listener names in certificateRefs — for the cilium
                            catalog app that is CILIUM_GATEWAY_TLS_SECRET.
                        namespace:
                          type: string
                          default: default
                          description: >-
                            Namespace on the target. cert-manager writes the Secret
                            where the Certificate lives, and a Gateway can only
                            reference one in its OWN namespace.
                    opentofuProviderConfigRef:
                      type: string
                      default: in-cluster
            status:
              type: object
              properties:
                shared:
                  type: object
                  description: >-
                    The resolved shared contract of this platform. Written once,
                    read by every component (and by humans / downstream XRs):
                    the refs each component was handed, plus facts discovered
                    from the cluster itself (clusterType). Additional components
                    consume these instead of re-deriving them.
                  properties:
                    clusterName:
                      type: string
                    helmProviderConfigRef:
                      type: string
                      description: Resolved ref (explicit, or derived from clusterName)
                    kubernetesProviderConfigRef:
                      type: string
                      description: Resolved ref (explicit, or derived from clusterName)
                    observeProviderConfigRef:
                      type: string
                    namespace:
                      type: string
                    clusterType:
                      type: string
                      description: >-
                        Distribution observed from the target RemoteCluster,
                        surfaced up from the FluxInit child.
                components:
                  type: object
                  description: Per-component readiness and outputs, keyed by component name.
                  properties:
                    cni:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        ready:
                          type: boolean
                        provider:
                          type: string
                        version:
                          type: string
                    fluxInit:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        ready:
                          type: boolean
                        operatorReady:
                          type: boolean
                        instanceReady:
                          type: boolean
                        sourcesReady:
                          type: boolean
                        sourceCount:
                          type: integer
                    fluxApps:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        ready:
                          type: boolean
                        appCount:
                          type: integer
                        readyCount:
                          type: integer
                        # Components held back this reconcile, waiting on a value
                        # this same Composition still has to produce. Absent from
                        # appCount, so without this list an app enabled on the XR
                        # would not appear anywhere. Entries read
                        # "{app}-{component}: {VARIABLE}".
                        #
                        # MUST stay in lockstep with what the module writes. This
                        # schema is structural: an undeclared status field does
                        # not get pruned, it fails the whole status apply with
                        # `field not declared in schema`, and with it every
                        # compose — Ready stays True on the stale result while
                        # Synced goes False, so the XR looks healthy at a glance.
                        # v0.3.15 shipped the field without this block and did
                        # exactly that on kind3.
                        pendingSubstitutions:
                          type: array
                          items:
                            type: string
                    ipReservation:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        ready:
                          type: boolean
                        ipAddresses:
                          type: array
                          items:
                            type: string
                        networkKey:
                          type: string
                        fqdn:
                          type: string
                          description: >-
                            Wildcard DNS name as clusterbook returned it, e.g.
                            "*.<cluster>.<zone>". Kept verbatim beside `domain` so a
                            wrong domain is traceable to the reservation rather than
                            guessed at.
                        zone:
                          type: string
                          description: DNS zone the wildcard was created in.
                        domain:
                          type: string
                          description: >-
                            `fqdn` reduced to the usable name — the leading "*." belongs
                            to the DNS record, not the domain. This is what a Gateway
                            listener hostname, a certificate CN or CILIUM_GATEWAY_DOMAIN
                            wants. Absent (not blank) when the reservation carries no DNS.
                    cilium:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        ready:
                          type: boolean
                        loadBalancerReady:
                          type: boolean
                        gatewayReady:
                          type: boolean
                        networkKey:
                          type: string
                    vaultIssuer:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        ready:
                          type: boolean
                        authReady:
                          type: boolean
                        caReady:
                          type: boolean
                        issuerReady:
                          type: boolean
                        auths:
                          type: object
                          description: >-
                            What Vault actually created, keyed by auth name —
                            mountPath, role and the policies created for it.

                            Keyed rather than listed on purpose: this is what a
                            catalog `substitutionSources` path addresses
                            (vaultIssuer.auths.eso.mountPath), and an index would
                            break the moment someone reorders additionalAuths —
                            silently pointing external-secrets at cert-manager's
                            mount.
                          x-kubernetes-preserve-unknown-fields: true
                componentCount:
                  type: integer
                  description: Number of enabled components
                readyComponents:
                  type: integer
                  description: Number of enabled components that are Ready
                ready:
                  type: boolean
                  description: True when every enabled component is Ready
