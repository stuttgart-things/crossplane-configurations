---
apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: argocd-cluster
  annotations:
    # Local convention used by `task push` to bump and re-publish.
    # Not a Crossplane-standard field — the true package version is the OCI tag.
    meta.crossplane.io/version: v0.2.1
    meta.crossplane.io/maintainer: patrick.hermann@sva.de
    meta.crossplane.io/source: github.com/stuttgart-things/crossplane-configurations
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Registers a cluster with ArgoCD. From a namespaced `ArgocdCluster` XR it
      writes two objects onto the ArgoCD cluster: an `ExternalSecret` that pulls
      the kubeconfig out of Vault, and a `ClusterbookCluster` whose labels switch
      on the platform ApplicationSets.
    meta.crossplane.io/readme: |
      # argocd-cluster

      Sibling of `remote-cluster`. Where `ClusterAccess` makes a cluster
      targetable by **Crossplane**, `ArgocdCluster` makes it targetable by
      **ArgoCD** — and, through the Clusterbook labels, decides which platform
      components land on it.

      Emits exactly two objects, both onto the ArgoCD cluster through
      provider-kubernetes:

      | object | purpose |
      |---|---|
      | `ExternalSecret` in `argocd` | ESO pulls the kubeconfig from Vault into `argocd/{clusterName}` |
      | `ClusterbookCluster` | the operator reserves IP/DNS and renders the ArgoCD cluster Secret |

      Everything else follows: the rendered Secret carries the labels, the
      platform ApplicationSets select on them, and the components appear on the
      target cluster. The XR never touches a kubeconfig — the credential travels
      Vault → ESO → Secret and is never held by Crossplane.

      ## What it deliberately does NOT do

      * It does not create the cluster. That is `ClusterStack` with
        `platformEnabled: false` — a cluster gets its platform either from Flux
        (`Platform`) or from ArgoCD (this), never both.
      * It does not write the kubeconfig to Vault. That is the `kubeconfig` stage
        of `ClusterStack` (`sthings.*.upload_kubeconfig_vault`).
      * It does not clean up the Applications the AppSets generate. See the
        teardown section in the README — that ordering is load-bearing.
spec:
  crossplane:
    version: ">=v2.1.3"
  dependsOn:
    # Both composed objects are provider-kubernetes Objects written onto the
    # ArgoCD cluster. The ClusterProviderConfig that points there is a cluster
    # precondition, not a package dependency — it carries a kubeconfig no
    # package can supply. Same call remote-cluster and ip-reservation make.
    - provider: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes
      version: ">=v1.2.0,<v2.0.0"
    - function: xpkg.crossplane.io/crossplane-contrib/function-kcl
      version: ">=v0.12.0,<v0.13.0"
    - function: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      version: ">=v0.6.5,<v0.7.0"
