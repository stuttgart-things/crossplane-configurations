# The AppSecretProfiles xr-rancher's app profiles fetch — copies of
# vault/app-secret-profile/examples (homerun2, schmetterpause, zaehlwerk,
# tabletennis). Cluster preconditions for app secrets; also what offline
# render (verify, goldens) hands over as extra resources.
---
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: homerun2
spec:
  mount: homerun2
  entries:
    - suffix: ""
      keys:
        redisPassword:
          generate: {length: 32}
          overridable: true
        authToken:
          generate: {length: 32}
          overridable: true
        githubToken:
          shared: git-pat
---
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: schmetterpause
spec:
  mount: schmetterpause
  entries:
    - suffix: ""
      keys:
        username:
          literal: schmetterpause
        password:
          generate: {length: 32}
          overridable: true
        session-key:
          generate: {length: 64}
          overridable: true
    - suffix: "-scoreboard"
      keys:
        token:
          generate: {length: 32}
          overridable: true
    - suffix: "-backup"
      keys:
        access_key:
          shared: object-store-backup
        secret_key:
          shared: object-store-backup
---
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: zaehlwerk
spec:
  reads:
    omni-pitcher-token:
      from: {app: homerun2, key: authToken}
    redis-password:
      from: {app: homerun2, key: redisPassword}
    schmetterpause-token:
      from: {app: schmetterpause, suffix: "-scoreboard", key: token}
---
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: tabletennis
spec:
  reads:
    redisPassword:
      from: {app: homerun2, key: redisPassword}
