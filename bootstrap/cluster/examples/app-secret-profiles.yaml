# The AppSecretProfiles xr-rancher's app profiles fetch — copies of
# vault/app-secret-profile/examples (homerun2, schmetterpause, zaehlwerk,
# tabletennis, kargo). Cluster preconditions for app secrets; also what offline
# render (verify, goldens) hands over as extra resources.
---
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: homerun2
spec:
  mount: homerun2
  entries:
    - suffix: ""
      keys:
        redisPassword:
          generate: {length: 32}
          overridable: true
        authToken:
          generate: {length: 32}
          overridable: true
        githubToken:
          shared: git-pat
        # The notification-catcher's MS Teams webhook: one per lab, read by
        # every catcher from the shared entry `teams-webhook` maps to
        # (stuttgart-things/stuttgart-things#3715).
        teamsWebhookUrl:
          shared: teams-webhook
        # schedule-pitcher's API/UI/findings token -- its own, not authToken:
        # agents on other clusters and jobs on VMs carry it to POST /findings,
        # and ai-pitcher reads the open findings with it (argocd#633).
        schedulePitcherAuthToken:
          generate: {length: 32}
          overridable: true
        # ai-pitcher's OpenRouter account key: one per lab, shared, optional --
        # without it every run pitches the plain digest marked "[AI n/a]".
        openrouterApiKey:
          shared: openrouter
---
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: schmetterpause
spec:
  mount: schmetterpause
  entries:
    - suffix: ""
      keys:
        username:
          literal: schmetterpause
        password:
          generate: {length: 32}
          overridable: true
        session-key:
          generate: {length: 64}
          overridable: true
    - suffix: "-scoreboard"
      keys:
        token:
          generate: {length: 32}
          overridable: true
    # The kiosk: the only way back for someone who has lost their PIN AND
    # their recovery code. Nobody may set a PIN for someone else, not even an
    # admin (schmetterpause ADR-0007/0008) -- the kiosk instead issues a new
    # code to a person STANDING THERE (ADR-0006).
    #
    # Its own entry rather than a key on the app's: vault-base-setup writes an
    # entry whole, via data_json, so a rotation of one key would rewrite the
    # others -- and a changed session-key logs every player out at once. Same
    # reason -scoreboard and -backup are separate.
    #
    # Ordering matters for the consumer, not here: the entry must exist BEFORE
    # the chart's kiosk switch goes on, or the app's ExternalSecret fails on the
    # missing property -- the WHOLE one, including SP_SESSION_KEY.
    - suffix: "-kiosk"
      keys:
        token:
          generate: {length: 32}
          overridable: true
    - suffix: "-backup"
      keys:
        access_key:
          shared: object-store-backup
        secret_key:
          shared: object-store-backup
---
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: zaehlwerk
spec:
  reads:
    omni-pitcher-token:
      from: {app: homerun2, key: authToken}
    redis-password:
      from: {app: homerun2, key: redisPassword}
    schmetterpause-token:
      from: {app: schmetterpause, suffix: "-scoreboard", key: token}
---
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: tabletennis
spec:
  reads:
    redisPassword:
      from: {app: homerun2, key: redisPassword}
---
# kargo -- the admin password in plain and the token signing key. The bcrypt
# hash Kargo wants is made by the ExternalSecret that renders kargo-admin
# (stuttgart-things/stuttgart-things#3232).
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: kargo
spec:
  mount: kargo
  entries:
    - suffix: ""
      keys:
        password:
          generate: {length: 32}
          overridable: true
        tokenSigningKey:
          generate: {length: 32}
          overridable: true
