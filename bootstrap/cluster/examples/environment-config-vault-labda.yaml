---
# The Vault policy mapping for ClusterStacks in environment `labda`. Selected by
# label, matched against the XR's spec.environmentConfig — the SAME value that
# resolves the VM environment (vspherevm-labda), which is why this one has to
# exist before a LabDA vSphere order renders in rancher mode (#508, gap 1).
#
# LabDA has TWO Vaults:
#
#   vault-vsphere.tiab.labda.sva.de:8200   PKI (pki/sign/4sthings.tiab.ssc.sva.de),
#                                          cert-manager auth mounts, kubeconfigs
#   openbao.sthings-infra.4sthings...      the KV that ESO reads, ONE MOUNT PER
#                                          CLUSTER, named after it
#
# `vault.eso` sends the derived eso auth to the OpenBao (a VaultK8sAuth of its
# own, xplane-platform >= 0.26.0) and lets an order ask for its own mount with
# `secretStores: [own]` -- the Platform composes the mount <cluster> (never
# deleted) and the policy xp-<cluster>-eso-own. #508 point 6.
#
# `secretStores`, `mounts`, `shared` and `writer` (LabUL's shared mounts for the
# app profiles) are still absent: an order naming any store but `own` fails the
# render with "no policy in the EnvironmentConfig for environment 'labda'".
#
# Rancher mode only. The policy must exist in that Vault: a role bound to a
# missing policy logs in green and every signing request is denied.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: cluster-vault-labda
  labels:
    cluster.stuttgart-things.com/environment: labda
data:
  vault:
    # The cert-manager auth. Same policy the LabDA VM pipeline binds its
    # <cluster>-certmanager roles to (stuttgart-things terraform/vsphere/labda/*/
    # vault-auth.yaml).
    certManagerPolicies:
      - pki-issue-4sthings
    # External Secrets: the OpenBao on sthings-infra, through the machinery's
    # openbao-labda ClusterProviderConfig (AppRole crossplane-machinery,
    # stuttgart-things sthings-infra/openbao-approles: may create KV mounts
    # and xp-* policies, cannot read secrets or delete a mount).
    eso:
      providerConfigName: openbao-labda
      vaultAddr: https://openbao.sthings-infra.4sthings.tiab.ssc.sva.de
      ownMount: true
