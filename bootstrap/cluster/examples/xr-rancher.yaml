---
# A Rancher custom-node rke2 cluster from one XR.
#
# `distribution: rancher-rke2` changes the SHAPE of the stack, not just the
# playbooks: Rancher creates the cluster, so a RancherCluster child comes first,
# the VM waits for the node-registration command it publishes, and ONE join
# stage (register + kubeconfig upload) replaces the distribution + kubeconfig
# pair. Everything after — ClusterAccess, Platform — is the same as elsewhere.
#
# The CNI is the one real difference: Rancher's own proxy needs
# `cattle-cluster-agent`, which needs a pod network, so the cluster is
# unreachable through Rancher until cilium runs. The catalog entry therefore
# leaves the CNI to the Platform, and its defaults (API address 127.0.0.1,
# Gateway API, L2 announcements, externalIPs, hubble) are merged under whatever
# is set in `platform.cni` here.
#
# Its golden is thin by design: `crossplane render` observes nothing, so the
# RancherCluster is the only child — the VM waits for a Secret that does not
# exist yet. That IS the first reconcile.
apiVersion: config.stuttgart-things.com/v1alpha1
kind: ClusterStack
metadata:
  name: rke2-rancher-1
  namespace: default
spec:
  provider: proxmox
  distribution: rancher-rke2
  size: medium
  environmentConfig: labul
  kubeconfig:
    # The join play uploads with the WRITER approle; the ClusterAccess reads the
    # entry back through vault-kubeconfigs-infra, derived from this name.
    vaultSecretName: vault-infra-kubeconfig-writer  # pragma: allowlist secret
    # Owns kubeconfigs/rke2-rancher-1: claims it with custom_metadata and
    # deletes every version on teardown. On by default for this provisioner;
    # vaultAddr is what it needs to know.
    lifecycle:
      vaultAddr: https://vault.infra.sthings-vsphere.labul.sva.de
  ansible:
    # Per-stage overrides live under `stages`, merged over the shared block.
    # The join stage needs the rke collection that carries rancher_register.
    stages:
      join:
        pipelineNamespace: tekton-ci
        extraCollections:
          - https://github.com/stuttgart-things/ansible/releases/download/sthings-rke-26.915.1292/sthings-rke-26.915.1292.tar.gz
  # Verbatim passthrough to the RancherCluster child. `name`,
  # `nodeRegistration.publish` and the machineGlobalConfig baseline come from
  # the Composition and the catalog.
  # Which app platforms run — CHOICES, one word each (xplane-cluster-catalog).
  profiles:
    - network
    - security
    - storage-openebs
    - observability
  # The KV mounts this cluster's ESO opens. The eso auth with its policies, the
  # stores, their opt-in gate, the observability secrets gate and the shared
  # webhook-token entry all follow from this list plus platform.clusterSecrets —
  # nothing to write by hand. Only stores the environment maps are accepted.
  secretStores:
    - homerun2-pr
    - schmetterpause
    - observability
  # Verbatim passthrough to the RancherCluster child. `name`,
  # `nodeRegistration.publish` and the machineGlobalConfig baseline come from
  # the Composition and the catalog; argocd labels/annotations from profiles and
  # derivation, with anything written here on top.
  rancher:
    environmentConfig: rancher-join-test
    kubernetesVersion: v1.36.4+rke2r1
    argocd:
      register: true
      reservation:
        enabled: true
        networkKey: '10.31.102'
      labels:
        env: LabUL
      # Environment, not derivable: where this LabUL cluster sends its alerts.
      annotations:
        observability-platform.stuttgart-things.com/alert-webhook-url: https://omni.platform.sthings-vsphere.labul.sva.de/pitch/grafana
  platformEnabled: true
  platform:
    # Apps come from Argo CD. fluxInit defaults to ON in the Platform, so
    # without this a rancher cluster also gets flux-operator and a
    # FluxInstance it never uses — rancher-join-test6 did.
    fluxInit:
      enabled: false
    vaultIssuer:
      enabled: true
      vaultAddr: https://vault.infra.sthings-vsphere.labul.sva.de
      pkiRole: sthings-vsphere
      caSourceSecret: vault-pki-source-ca  # pragma: allowlist secret
      # No tokenPolicies and no eso auth here, on purpose: in rancher mode the
      # cert-manager policies and the whole eso auth are DERIVED — from
      # secretStores above and the `vault` mapping in the EnvironmentConfig for
      # environment labul (examples/environment-config-vault-labul.yaml). Writing
      # either by hand fails the render: a Vault role accepts any existing
      # policy, so the order must not be the one choosing them.
    # The cluster's own observability entry, created and deleted with it.
    clusterSecrets:
      enabled: true
