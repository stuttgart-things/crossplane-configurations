---
# Maximum: every spec field set, to catch templating breakage. Values are
# deliberately non-default so a field silently dropped from the template shows
# up as a diff rather than coinciding with a default.
apiVersion: config.stuttgart-things.com/v1alpha1
kind: ClusterStack
metadata:
  name: cluster-max
  namespace: crossplane-system
spec:
  provider: vsphere
  size: large
  distribution: kind
  clusterName: max-cluster
  environmentConfig: labda

  vm:
    # vSphere clone source. CREATE-ONLY: changing it forces delete+recreate.
    templateUuid: 4234df9c-0000-0000-0000-000000000000
    # PROXMOX ONLY — ignored here on purpose, and set anyway so the template's
    # provider branching is exercised in the direction that must NOT emit it
    # (NativeVsphereVM has no cloudInit block at all).
    ipv4Address: dhcp

  ansible:
    ansibleWorkingImage: ghcr.io/stuttgart-things/sthings-ansible:14.0.0-test
    crossplaneProviderConfig: in-cluster
    pipelineNamespace: tekton-ci
    extraCollections:
      - "kubernetes.core:6.4.0"
    extraVars:
      - update_packages+-false
    # Merged OVER the shared block above, not replacing it — so pinning a
    # collection for one stage does not silently drop the set another stage
    # needs. That happened on the first live build.
    stages:
      distribution:
        extraCollections:
          - "kubernetes.core:6.4.0"
          - "https://github.com/stuttgart-things/ansible/releases/download/sthings-rke-26.6.905.tar.gz/sthings-rke-26.6.905.tar.gz"
    # Requires sthings-baseos >= 26.5.695; on an older set the var is silently
    # ignored. Left true here to exercise the default path.
    setHostname: true

  # Per-stage re-run ids. A MAP on purpose: one global id would rename every
  # stage, so repairing the upload would also re-run the distribution install
  # against a live cluster.
  runIDs:
    kubeconfig: "1"

  kubeconfig:
    vaultPath: kubeconfigs-archive/max-cluster
    secretNamespace: crossplane-system  # pragma: allowlist secret
    # THE TWO BELOW ARE DIFFERENT KINDS OF OBJECT, and both are restated here
    # only because this file exists to set every field — the defaults are right.
    #
    # vaultSecretName is a SECRET in the pipeline namespace, holding the AppRole
    # the upload play writes with. `vault` is the fleet's vault-vsphere
    # credential; it is what sops-git-secrets actually materializes.
    vaultSecretName: vault  # pragma: allowlist secret
    # providerConfigRef is a CLUSTERPROVIDERCONFIG the ClusterAccess child reads
    # back through, emitted by the provider-kubeconfig-vault chart. Same name the
    # Secret used to carry, which is exactly how the two got confused.
    providerConfigRef: vault-kubeconfigs

  # Sibling of `platform`, not a key inside it: `platform` is a verbatim
  # passthrough of the Platform XRD's spec, and a preserve-unknown-fields block
  # that also declares known properties makes schema converters reject every
  # passthrough key.
  # Make this cluster one that BUILDS clusters. Off by default — a control
  # plane is the exception, not the norm.
  managementPlaneEnabled: true
  managementPlane:
    # The package set comes from a named profile in xplane-crossplane-catalog,
    # not from here: it is a fleet fact, version-controlled and unit-tested.
    profile: machinery
    # Bind the crossplane-system ServiceAccount GROUP to cluster-admin on the
    # target. Default true, and turning it off is not a hardening knob — what it
    # removes is the ability to reconcile anything at all.
    clusterAdminRbac: true
  platformEnabled: true
  platform:
    fluxInit:
      enabled: true
    # kind is built WITHOUT a CNI, so the distribution makes cni.enabled true
    # automatically. Chart settings still pass through — only `enabled` is
    # derived.
    cni:
      chart:
        version: "1.19.6"
      cilium:
        kubeProxyReplacement: true
        operatorReplicas: 1
