---
# Minimum: only the XRD-required field. Everything else defaults — size medium,
# distribution k3s, environmentConfig labul, clusterName from metadata.name,
# platform enabled. This variant exists to prove those defaults, so do not add
# fields to it.
apiVersion: config.stuttgart-things.com/v1alpha1
kind: ClusterStack
metadata:
  name: cluster-min
  namespace: crossplane-system
spec:
  provider: proxmox
  # The XRD defaults this to labul, but `crossplane render` applies no XRD
  # defaults (CLAUDE.md gotcha 5), and the environment step selects its
  # EnvironmentConfig by this field with a Required path — set it here so the
  # golden exercises the same selection a live XR gets.
  environmentConfig: labul
