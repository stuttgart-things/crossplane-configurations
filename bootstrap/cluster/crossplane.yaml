---
apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: cluster
  annotations:
    # Local convention used by `task push` to bump and re-publish.
    # Not a Crossplane-standard field — the true package version is the OCI tag.
    meta.crossplane.io/version: v0.2.1
    meta.crossplane.io/maintainer: patrick.hermann@sva.de
    meta.crossplane.io/source: github.com/stuttgart-things/crossplane-configurations
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Builds a whole Kubernetes cluster — machine, distribution, access,
      platform — from one namespaced `ClusterStack` XR, driven by a size and a
      distribution profile.
    meta.crossplane.io/readme: |
      # cluster

      A Crossplane v2 Configuration that composes the full chain for one
      cluster as child XRs: a VM (proxmoxvm / vspherevm, with base-OS ansible),
      the distribution install and the kubeconfig upload (ansible-run),
      `ClusterAccess` (remote-cluster) and `Platform`.

      Replaces the five hand-written XRs a cluster needs today, in which the
      cluster name appears eight times and the VM IP three — both of which this
      Configuration derives instead. `size` and `distribution` resolve through
      the `xplane-cluster-catalog` KCL module; `platform.cni.enabled` follows
      from the distribution's CNI ownership rather than being restated.

      Each stage is gated on the previous one having SUCCEEDED (not merely being
      Ready), and every gate is sticky — not emitting a composed resource is
      what makes Crossplane delete it, and a deleted AnsibleRun re-runs its play
      against a live machine. Three `Usage` resources order teardown.

      ## Cluster preconditions

      - Tekton + the ansible credentials Secret + an in-cluster
        provider-kubernetes config (for the ansible stages).
      - `provider-kubeconfig` with a `vault-kubeconfigs` ClusterProviderConfig.
      - A per-environment EnvironmentConfig for the chosen provider.

      Distributions: k3s, kind and — since v0.3.0 — single-node rke2.
      Multi-node and day-2 scaling remain deliberately unsupported.
spec:
  crossplane:
    version: ">=v2.1.3"
  dependsOn:
    # The wrapped Configurations. This package composes only child XRs — it
    # talks to no provider itself, so no provider is listed here; they come
    # transitively from these.
    - configuration: ghcr.io/stuttgart-things/crossplane-configurations/proxmoxvm
      version: ">=v0.4.1"
    - configuration: ghcr.io/stuttgart-things/crossplane-configurations/vspherevm
      version: ">=v0.7.1"
    - configuration: ghcr.io/stuttgart-things/crossplane-configurations/ansible-run
      version: ">=v0.3.2"
    - configuration: ghcr.io/stuttgart-things/crossplane-configurations/remote-cluster
      version: ">=v0.1.0"
    - configuration: ghcr.io/stuttgart-things/crossplane-configurations/platform
      version: ">=v0.3.1"
    - function: xpkg.crossplane.io/crossplane-contrib/function-kcl
      version: ">=v0.12.0,<v0.13.0"
    - function: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      version: ">=v0.6.5,<v0.7.0"
