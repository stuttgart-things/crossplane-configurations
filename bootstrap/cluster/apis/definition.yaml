---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: clusterstacks.config.stuttgart-things.com
spec:
  group: config.stuttgart-things.com
  defaultCompositeDeletePolicy: Foreground
  scope: Namespaced
  names:
    # NOT `Cluster`. The plural `clusters` is claimed by
    # `provisioning.cattle.io` (which machinery/rancher-cluster composes) and by
    # CAPI wherever either is installed, so `kubectl get clusters` would be
    # ambiguous on exactly the clusters this XR is meant to build. `ClusterStack`
    # says what it is: the whole stack for one cluster — machine, distribution,
    # access, platform — as opposed to `Platform`, which is only the top layer.
    kind: ClusterStack
    plural: clusterstacks
    singular: clusterstack
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - provider
              x-kubernetes-validations:
                # --- Immutability -------------------------------------------
                # These are create-only in effect, and the failure mode of
                # letting them change is silent: a new template UUID or a
                # different node count tears the machine down and rebuilds it
                # rather than converging in place. Rejected at admission, where
                # the message can say so, instead of surfacing as a delete on a
                # managed resource nobody asked to delete.
                - rule: "self.provider == oldSelf.provider"
                  message: provider is immutable — changing it would destroy the VM and rebuild it on the other platform; delete and recreate the ClusterStack instead
                - rule: "!has(self.clusterName) || !has(oldSelf.clusterName) || self.clusterName == oldSelf.clusterName"
                  message: clusterName is immutable — it is the Vault path and the stem of every derived ClusterProviderConfig name
                - rule: "!has(self.distribution) || !has(oldSelf.distribution) || self.distribution == oldSelf.distribution"
                  message: distribution is immutable — switching it would re-run an install play against a live cluster; delete and recreate instead
                # size is immutable for a blunt reason worth stating: a size
                # carries a control-plane node count, and CEL cannot see the
                # catalog to tell a cpu/memory change (in place) from a masters
                # change (a rebuild). Relaxing this is crossplane-configurations#172.
                - rule: "!has(self.size) || !has(oldSelf.size) || self.size == oldSelf.size"
                  message: size is immutable in v0.1.0 — a size carries a node count, and day-2 scaling is not supported yet (see issue #172)
              properties:
                # --- What the user actually chooses -------------------------
                provider:
                  type: string
                  enum:
                    - proxmox
                    - vsphere
                    - harvester
                  description: >-
                    Which machine platform to build on. Selects the VM XR kind:
                    NativeProxmoxVM, NativeVsphereVM or HarvesterVM.


                    proxmox and vsphere differ only in field names — staging,
                    gating and everything downstream are identical. Harvester
                    does not: its boot disk is a PVC of its own, cpu is an object
                    rather than a number, memory is a quantity string, cloud-init
                    is a required block, and its `ansible.enabled` defaults to
                    FALSE (xplane-cluster 0.10.0 switches it on, or the VM would
                    come up with no base OS and the stack would wait forever on a
                    stage that was never emitted).


                    Harvester additionally needs an `EnvironmentConfig` carrying
                    the storage class and image, the way proxmoxvm-labul does for
                    Proxmox. Without one the VM has nothing to boot from.
                    crossplane-configurations#258 Block B.
                size:
                  type: string
                  default: medium
                  description: >-
                    T-shirt size from the xplane-cluster-catalog module
                    (small | medium | large | medium-ha). Resolves to cpu,
                    memory, disk and the node counts. An unknown name fails the
                    render with the list of known sizes rather than silently
                    building a default.
                distribution:
                  type: string
                  default: k3s
                  description: >-
                    Kubernetes distribution from the catalog
                    (k3s | kind | rke2). Determines the install playbooks, the
                    required inventory groups, and WHO OWNS THE CNI — which is
                    why `platform.cni.enabled` must not be set by hand: the k3s
                    and rke2 roles install cilium themselves, a kind cluster is
                    built without one.
                clusterName:
                  type: string
                  description: >-
                    Cluster identity. Defaults to metadata.name. This one value
                    becomes the VM name, the guest hostname, the ansible
                    cluster_name, the Vault kubeconfig path, the ClusterAccess
                    name and Platform.clusterName — the eight hand-copies this
                    Configuration exists to remove.
                environmentConfig:
                  type: string
                  default: labul
                  description: >-
                    Per-environment placement, passed to the VM XR. Placement
                    itself (node, datastore, bridge, vlan, pool / the vSphere
                    MOIDs) deliberately has NO field here — it lives in the
                    EnvironmentConfig, which is what keeps `provider` a one-word
                    switch instead of a second placement API.

                # --- Narrow escape hatches ----------------------------------
                vm:
                  type: object
                  description: >-
                    Per-VM overrides for the few things a size cannot express.
                    Deliberately small: anything that belongs to an environment
                    belongs in the EnvironmentConfig.
                  properties:
                    templateVmId:
                      type: string
                      description: >-
                        Proxmox clone source (template VMID), overriding the
                        EnvironmentConfig. CREATE-ONLY in bpg — changing it on a
                        live VM forces delete+recreate, it does not re-clone in
                        place.
                    templateUuid:
                      type: string
                      description: >-
                        vSphere clone source (template BIOS config.uuid),
                        overriding the EnvironmentConfig. Same create-only
                        caveat as templateVmId.
                    ipv4Address:
                      type: string
                      description: >-
                        Static address in CIDR form, or `dhcp`. PROXMOX ONLY —
                        NativeVsphereVM has no cloudInit block at all (its
                        cloud-init is baked into the template's guestinfo), so
                        on vSphere this is ignored. Multi-node will require
                        static addressing, which is why the asymmetry is called
                        out here rather than discovered later (issue #170).
                ansible:
                  type: object
                  description: >-
                    Overrides for the base-OS stage, which runs from the VM XR's
                    own spec.ansible. The distribution and kubeconfig stages get
                    their playbooks and vars from the catalog.
                  properties:
                    extraCollections:
                      type: array
                      items:
                        type: string
                    extraVars:
                      type: array
                      description: Additional varsFile entries in `key+-value` form, merged over the catalog's.
                      items:
                        type: string
                    ansibleWorkingImage:
                      type: string
                    crossplaneProviderConfig:
                      type: string
                      default: in-cluster
                    pipelineNamespace:
                      type: string
                      default: tekton-ci
                    setHostname:
                      type: boolean
                      default: true
                      description: >-
                        Set the guest hostname from clusterName during the
                        base-OS stage. On Proxmox this is what names the guest at
                        all — bpg cloud-init cannot, without a snippets
                        datastore.

                        REQUIRES sthings-baseos >= 26.5.695. On an older
                        collection set the var is SILENTLY IGNORED: the guest
                        keeps the template's hostname and nothing reports a
                        problem. Set this to false on a fleet still pinned lower,
                        so the omission is explicit rather than mysterious.
                    stages:
                      type: object
                      description: >-
                        Per-stage overrides, MERGED OVER the shared block above
                        rather than replacing it — so the common case stays one
                        list. Keys: baseos, distribution, kubeconfig.

                        This exists because the shared block reaches every run:
                        pinning one collection for the base-OS stage otherwise
                        replaced the set the distribution stage needed, which on
                        the first live build meant restating sthings-rke in order
                        to bump sthings-baseos.
                      properties:
                        baseos:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        distribution:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        kubeconfig:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                runIDs:
                  type: object
                  description: >-
                    Per-stage re-run identifiers, keyed by stage
                    (`distribution`, `kubeconfig`). Bumping one suffixes that
                    stage's PipelineRun and wrapped Object, which is what makes
                    provider-kubernetes create a NEW run — a completed Tekton
                    PipelineRun is immutable and the wrapped Object has no
                    Update policy, so editing anything else is a silent no-op.

                    A MAP, not a single value, and deliberately so: one global id
                    renames every stage, so repairing the kubeconfig upload also
                    re-runs the k3s install against a live cluster. That is the
                    hazard the fleet's hand-written XRs warn about in their
                    headers, and it happened on the first live build. A re-run
                    has to name its stage.

                    The base-OS stage is absent on purpose — it runs from the VM
                    XR's own spec.ansible, whose XRD has no re-run knob.
                  properties:
                    distribution:
                      type: string
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    kubeconfig:
                      type: string
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

                # --- Downstream passthrough ---------------------------------
                kubeconfig:
                  type: object
                  # Nur Kreuzungen, von denen wir wissen, dass sie falsch sind.
                  # Bewusst kein "muss zur Ableitung passen": das wuerde den
                  # Notausgang zumauern, den providerConfigRef darstellen soll.
                  # Unbekannte Vault-Paarungen bleiben erlaubt — die kennt diese
                  # Regel nicht und darf sie nicht verbieten. Siehe #336.
                  #
                  # Bis 2026-08-20 waren das ZWEI von Hand ausgeschriebene
                  # Kreuzungen. Mit vault-labda (crossplane-configurations#258)
                  # waeren es sechs geworden, und die Aufzaehlung haette bei jedem
                  # weiteren Vault quadratisch zugelegt — mit der sicheren
                  # Aussicht, dass irgendwann eine fehlt. Dieselbe Aussage steht
                  # jetzt als Vergleich gegen die Ableitungstabelle da: greift NUR,
                  # wenn BEIDE Seiten bekannte Namen sind und einander
                  # widersprechen. Ein unbekannter Name auf einer der beiden Seiten
                  # laesst die Regel weiterhin unberuehrt durch — der Notausgang
                  # bleibt genau so weit offen wie vorher.
                  #
                  # Die Tabelle muss mit kubeconfigVaultPairs in xplane-cluster
                  # (logic.k) uebereinstimmen; sie ist ihr Spiegel, nicht ihre
                  # Quelle.
                  x-kubernetes-validations:
                    - rule: >-
                        !has(self.providerConfigRef) ||
                        !(self.vaultSecretName in ['vault', 'vault-infra', 'vault-labda']) ||
                        !(self.providerConfigRef in ['vault-kubeconfigs', 'vault-kubeconfigs-infra', 'vault-kubeconfigs-labda']) ||
                        self.providerConfigRef == {'vault': 'vault-kubeconfigs',
                                                   'vault-infra': 'vault-kubeconfigs-infra',
                                                   'vault-labda': 'vault-kubeconfigs-labda'}[self.vaultSecretName]
                      message: >-
                        vaultSecretName and providerConfigRef point at different
                        Vaults. vaultSecretName says where the kubeconfig is
                        UPLOADED, providerConfigRef where it is READ; they must
                        name the same one. Leave providerConfigRef unset — it is
                        derived from vaultSecretName. See
                        crossplane-configurations#336.
                  description: Passed to the ClusterAccess child (remote-cluster Configuration).
                  properties:
                    vaultPath:
                      type: string
                      description: Defaults to clusterName.
                    secretNamespace:
                      type: string
                      default: crossplane-system
                    vaultSecretName:
                      type: string
                      default: vault
                      description: >-
                        Secret in the pipeline namespace holding the Vault
                        address and AppRole the kubeconfig UPLOAD authenticates
                        with. NOT the same thing as providerConfigRef below,
                        which is a ClusterProviderConfig — the two deliberately
                        no longer share a name. `vault` is the fleet's
                        vault-vsphere credential, which owns the kubeconfigs KV
                        mount. This defaulted to `vault-kubeconfigs` until
                        v0.3.1, a Secret nothing ever created: sops-git-secrets
                        names a Secret from metadata.name inside its blob, so
                        that name needed a fourth blob duplicating a credential
                        already on every cluster. The upload failed with
                        "failed to determine alias name from login request" on
                        every fresh management cluster until someone made the
                        alias by hand.
                    providerConfigRef:
                      type: string
                      description: >-
                        ClusterProviderConfig (kubeconfig.stuttgart-things.com)
                        the ClusterAccess child READS the kubeconfig back
                        through — emitted by the provider-kubeconfig-vault
                        chart. Keeps the name vaultSecretName gave up; they are
                        different kinds of object and only ever looked alike.

                        LEAVE THIS UNSET. Derived from vaultSecretName since
                        xplane-cluster 0.9.0 (`vault` → `vault-kubeconfigs`,
                        `vault-infra` → `vault-kubeconfigs-infra`). The two
                        fields must name the same Vault, and nothing used to
                        enforce that: the old defaults agreed only by accident,
                        so setting vaultSecretName to vault-infra — which the
                        ArgoCD path requires — sent the read to the other Vault.
                        The RemoteCluster then failed with `secret not found`
                        while the ClusterStack stayed Ready=True, because
                        without a ready ClusterAccess the Platform branch is
                        never emitted and nothing is left to wait for. Forty
                        minutes to find, 2026-08-19. See
                        crossplane-configurations#336.

                        Set it only for a Vault pair the mapping does not know;
                        an explicit value still wins.
                platformEnabled:
                  type: boolean
                  default: true
                  description: >-
                    Compose a Platform child at all. false stops once the cluster
                    is targetable (ClusterAccess ready), which is the useful
                    shape for a machine that only needs to exist and be
                    reachable. Deliberately a SIBLING of `platform` rather than a
                    key inside it: `platform` is a verbatim passthrough of
                    another XRD's spec, and `enabled` is this Configuration's own
                    switch, not a Platform field.
                managementPlaneEnabled:
                  type: boolean
                  default: false
                  description: >-
                    Compose a ManagementPlane child — i.e. make this cluster one
                    that BUILDS clusters, not one that runs workloads.

                    Default false, unlike platformEnabled: a control plane is the
                    exception, and installing Crossplane plus the fleet's twenty
                    packages on a machine that did not ask for it is not a
                    default anyone wants to discover.

                    A SIBLING of `managementPlane` for the same reason
                    platformEnabled is one — see below.
                managementPlane:
                  type: object
                  description: >-
                    Passed through to the ManagementPlane child verbatim
                    (profile, crossplaneVersion, packageOverrides,
                    clusterAdminRbac, …). `clusterName` is supplied by this
                    Composition and cannot be overridden here: it is the one
                    field this layer owns, and two sources would let the child
                    point at a different cluster than the stack that built it.

                    No properties are declared on purpose: a block that preserves
                    unknown fields must not also declare known ones, or schema
                    converters emit `additionalProperties: false` and reject
                    every passthrough key.
                  x-kubernetes-preserve-unknown-fields: true
                platform:
                  type: object
                  description: >-
                    Passed through to the Platform child verbatim (fluxInit,
                    apps, ipReservation, cilium, vaultIssuer, …), so nothing in
                    the platform Configuration needs to know this one exists.
                    `clusterName` and `cni.enabled` are supplied by this
                    Composition and must NOT be set here — cni.enabled follows
                    from the distribution's CNI ownership, and setting it by hand
                    is how a cluster ends up with two CNIs.

                    No properties are declared on purpose: a block that preserves
                    unknown fields must not also declare known ones, or schema
                    converters emit `additionalProperties: false` and reject
                    every passthrough key. Same shape as platform's own
                    `cni.cilium` and `apps.*.substitute`.
                  x-kubernetes-preserve-unknown-fields: true

            status:
              type: object
              properties:
                ready:
                  type: boolean
                stage:
                  type: string
                  description: >-
                    The stage the stack is currently waiting on — vm, baseos,
                    distribution, kubeconfig, access, platform, or ready. The
                    single field to look at when a build is stuck.
                share:
                  type: object
                  description: Facts, resolved or discovered, republished for consumers.
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    clusterName:
                      type: string
                    ip:
                      type: string
                      description: The VM's address, discovered from the VM child.
                    apiEndpoint:
                      type: string
                      description: >-
                        From the ClusterAccess child. What a Platform's
                        vaultIssuer.kubernetesHost should derive from instead of
                        restating a node IP by hand.
                    clusterType:
                      type: string
                      description: Discovered from the running cluster, not the requested distribution — they can disagree, and that is worth seeing.
                    serverVersion:
                      type: string
                    cniOwnership:
                      type: string
                      description: Resolved from the catalog; explains the cni.enabled the Platform child received.
                    domain:
                      type: string
                      description: >-
                        The cluster's DNS domain, discovered by the ipReservation child
                        two levels down and republished by platform. Same move as
                        apiEndpoint: stated once where it is discovered, read everywhere
                        else — a Gateway hostname or CILIUM_GATEWAY_DOMAIN reads it here
                        instead of repeating it on the XR. Absent when ipReservation is
                        off or carries no DNS; never published blank, because an empty
                        domain substituted into a hostname looks valid and is not.
                stages:
                  type: object
                  description: Per-stage readiness, in build order.
                  x-kubernetes-preserve-unknown-fields: true
      # No READY or AGE column here on purpose. Crossplane appends SYNCED, READY,
      # COMPOSITION and AGE to every composite by itself, so those would be
      # duplicates — and the READY one would CONTRADICT: ours comes from
      # status.ready, which each module aggregates over a chosen SUBSET of its
      # composed resources, while Crossplane's covers all of them. Two columns
      # of the same name disagreeing is worse than one column less; a
      # ManagementPlane sat at our-READY=true / Crossplane-READY=False for 30
      # hours with an unready ProviderConfig. See #288 and #292.
      additionalPrinterColumns:
        - name: STAGE
          type: string
          jsonPath: .status.stage
        - name: PROVIDER
          type: string
          jsonPath: .spec.provider
        - name: DISTRIBUTION
          type: string
          jsonPath: .spec.distribution
        - name: ENDPOINT
          type: string
          jsonPath: .status.share.apiEndpoint
