---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: cluster
  labels:
    crossplane.io/xrd: clusterstacks.config.stuttgart-things.com
    service: cluster
spec:
  compositeTypeRef:
    apiVersion: config.stuttgart-things.com/v1alpha1
    kind: ClusterStack
  mode: Pipeline
  pipeline:
    # The EnvironmentConfig for this cluster's environment, selected by the
    # label cluster.stuttgart-things.com/environment = spec.environmentConfig.
    # Rancher mode reads the Vault policy mapping from its `vault` key: the
    # order names stores, the environment says which policies they mean
    # (crossplane-configurations#454). EnvironmentConfigs are cluster-scoped, so
    # that mapping is admin-owned — which is the point.
    #
    # Multiple/minMatch 0: most environments carry no such config yet, and the
    # ansible path does not need one. maxMatch 1 plus the Required field path
    # means a missing spec.environmentConfig fails loudly instead of the
    # selector matching every labelled config and picking one by name.
    - step: load-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Selector
              selector:
                mode: Multiple
                minMatch: 0
                maxMatch: 1
                matchLabels:
                  - key: cluster.stuttgart-things.com/environment
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.environmentConfig
                    fromFieldPathPolicy: Required
            # The RANCHER environment, and the reason it is loaded here at all:
            # it is what decides whether the server is k3s or rke2 (`data.distro`),
            # while the catalog entry is picked by spec.distribution. The two were
            # set independently and nothing compared them — and machineGlobalConfig
            # keys belong to the server, where an unknown key is IGNORED rather
            # than refused. rancher-rke2 against a k3s environment therefore left
            # flannel running, cilium could not create its vxlan device, and the
            # cluster never registered, after ten minutes that looked healthy
            # (stuttgart-things/kcl#282, #490). With `distro` in the context the
            # module refuses the pair at render time instead.
            #
            # Optional and minMatch 0 throughout: the ansible path has no
            # spec.rancher at all, and an offline render has no EnvironmentConfig
            # to match. Both mean "not known here", which is not a mismatch.
            #
            # No key collision with the environment above: that one carries
            # `vault`, this one distro, kubernetesVersion, providerConfigRef,
            # rancherNamespace and rancherProviderConfigRef.
            - type: Selector
              selector:
                mode: Multiple
                minMatch: 0
                maxMatch: 1
                matchLabels:
                  - key: rancher-cluster.resources.stuttgart-things.com/environment
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.rancher.environmentConfig
                    fromFieldPathPolicy: Optional
    # The logic step. The logic lives in the xplane-cluster KCL module (which depends
    # on xplane-cluster-catalog) rather than inline here, for the reason
    # bootstrap/platform states: inline KCL cannot be unit-tested, and the rules
    # this Configuration encodes — which stage may open, who owns the CNI, what
    # must outlive what on teardown — are exactly the logic that should be tested
    # before it reaches a cluster. Inline KCL also cannot declare the catalog
    # dependency at all.
    #
    # The module emits, in gated order:
    #   NativeProxmoxVM | NativeVsphereVM   {name}-vm
    #   AnsibleRun                          {name}-distribution
    #   AnsibleRun                          {name}-kubeconfig
    #   ClusterAccess                       {name}-access
    #   Platform                            {name}-platform
    #   VaultSecretSet                      {name}-secrets-<app>  (rancher, app profiles)
    #   Usage x3                            teardown ordering
    #
    # In rancher mode it also requests the AppSecretProfiles its profiles name
    # (function-kcl ExtraResources, by name) — cluster-scoped, so they cannot
    # come from the order's namespace.
    #
    # Every gate is sticky and keyed on the previous stage having SUCCEEDED, not
    # merely being Ready — see the module's README.
    - step: cluster
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        metadata:
          name: cluster
        spec:
          source: oci://ghcr.io/stuttgart-things/xplane-cluster?tag=0.20.0
    # Propagates the composed children's readiness to the XR. status.ready is
    # set by the module itself (from the Platform child, or from ClusterAccess
    # when platformEnabled is false); this makes the XR's Ready condition track
    # the tree.
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
