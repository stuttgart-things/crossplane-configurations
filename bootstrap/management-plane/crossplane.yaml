---
apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: management-plane
  annotations:
    # Local convention used by `task push` to bump and re-publish.
    # Not a Crossplane-standard field — the true package version is the OCI tag.
    meta.crossplane.io/version: v0.3.2
    meta.crossplane.io/maintainer: patrick.hermann@sva.de
    meta.crossplane.io/source: github.com/stuttgart-things/crossplane-configurations
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Turns a target cluster into a MANAGEMENT cluster from a namespaced
      `ManagementPlane` XR: installs Crossplane on it, then the providers,
      functions, configurations and in-cluster provider configs that let it
      build other clusters. What gets installed comes from a named profile in
      the xplane-crossplane-catalog KCL module, not from the XR.
    meta.crossplane.io/readme: |
      # management-plane

      A Crossplane v2 Configuration that makes a cluster a **management**
      cluster (group `config.stuttgart-things.com`).

      `platform` answers *what does this cluster offer*. Being a management
      cluster is a **role**, and the two have different lifetimes: a workload
      cluster's apps change weekly, its control plane does not. So this is a
      sibling of `Platform` rather than a component inside it.

      ## What it emits

      Against the target cluster, through the same provider config refs a
      `Platform` uses:

      - a `helm.m.crossplane.io` Release — the crossplane chart
      - a `kubernetes.m.crossplane.io` Object per Provider / Function /
        Configuration
      - a `kubernetes.m.crossplane.io` Object per in-cluster ProviderConfig

      ## The package set is not in the XR

      It comes from
      [`xplane-crossplane-catalog`](https://github.com/stuttgart-things/kcl/tree/main/crossplane/xplane-crossplane-catalog)
      via `spec.profile` (default `machinery`) — a fleet fact, version
      controlled and unit-tested. `spec.packageOverrides` lets a single cluster
      break out per package.

      ## Cluster preconditions

      - A Helm `ClusterProviderConfig` named `{clusterName}-helm`
      - A Kubernetes `ClusterProviderConfig` named `{clusterName}-kubernetes`

      Both are what `provider-kubeconfig`'s `RemoteCluster` creates for a
      registered cluster — the same precondition `platform` has.
spec:
  crossplane:
    version: ">=v2.1.3"
  dependsOn:
    # Providers this Composition applies its managed resources WITH. The
    # packages it INSTALLS are deliberately not declared: they are applied as
    # Objects onto a different cluster, and pulling them onto this one would
    # install the whole fleet's Configurations on the seed.
    - provider: xpkg.crossplane.io/crossplane-contrib/provider-helm
      version: ">=v1.0.0,<v2.0.0"
    - provider: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes
      version: ">=v1.2.0,<v2.0.0"
    # Functions used by this Composition's pipeline.
    - function: xpkg.crossplane.io/crossplane-contrib/function-kcl
      version: ">=v0.12.0,<v0.13.0"
    - function: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      version: ">=v0.6.5,<v0.7.0"
