---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: managementplanes.config.stuttgart-things.com
spec:
  group: config.stuttgart-things.com
  defaultCompositeDeletePolicy: Foreground
  scope: Namespaced
  names:
    kind: ManagementPlane
    plural: managementplanes
    singular: managementplane
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "has(self.clusterName) || (has(self.helmProviderConfigRef) && has(self.kubernetesProviderConfigRef))"
                  message: either clusterName, or both helmProviderConfigRef and kubernetesProviderConfigRef, must be set
              properties:
                # --- target cluster ---------------------------------------
                clusterName:
                  type: string
                  description: >-
                    Target cluster's RemoteCluster name. When set, the provider
                    config refs default to {clusterName}-helm and
                    {clusterName}-kubernetes — the names provider-kubeconfig
                    creates when a cluster registers. Same contract as Platform.
                helmProviderConfigRef:
                  type: string
                  description: Explicit Helm ClusterProviderConfig; overrides the derivation.
                kubernetesProviderConfigRef:
                  type: string
                  description: Explicit Kubernetes ClusterProviderConfig; overrides the derivation.
                # --- what to install --------------------------------------
                profile:
                  type: string
                  default: machinery
                  description: >-
                    Named package set in the xplane-crossplane-catalog KCL
                    module. The set is a FLEET fact — version controlled and
                    unit-tested there — so it is chosen here, not enumerated.
                    An unknown name is rejected at render time.
                crossplaneVersion:
                  type: string
                  description: >-
                    Overrides the profile's Crossplane chart version. For a
                    cluster that must stay on an older core while a catalog
                    release moves the fleet forward; normally unset.
                namespace:
                  type: string
                  default: crossplane-system
                  description: Namespace Crossplane is installed into on the TARGET cluster.
                clusterAdminRbac:
                  type: boolean
                  default: true
                  description: >-
                    Bind the group system:serviceaccounts:crossplane-system to
                    cluster-admin on the target. THE GROUP, not a ServiceAccount:
                    Crossplane's provider SAs carry a per-revision generated
                    name, so binding one by name applies to nothing — and RBAC
                    does not validate subjects, so it looks like it worked.
                    cluster-admin because on a management cluster the providers
                    create arbitrary cluster content; that is the job. Turning it
                    off is for a cluster where something else grants the
                    equivalent — it is not a hardening knob, since what it
                    removes is the ability to reconcile anything at all.
                packageOverrides:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Per-package escape hatch, keyed by the package's CR NAME as
                    the catalog states it (e.g.
                    stuttgart-things-crossplane-configurations-platform, not
                    "platform"). The value replaces the WHOLE reference, not
                    just the tag: a tag-only override would silently keep the
                    catalog's registry, and which mirror a package comes from is
                    load-bearing here. A key the profile does not carry is
                    rejected rather than ignored — ignoring it would leave you
                    believing a version was pinned when it was not.
            status:
              type: object
              properties:
                ready:
                  type: boolean
                  description: Crossplane is up AND every package reports Healthy.
                profile:
                  type: string
                crossplaneVersion:
                  type: string
                components:
                  type: object
                  description: Per-stage readiness, in install order.
                  properties:
                    crossplane:
                      type: object
                      properties:
                        ready:
                          type: boolean
                        version:
                          type: string
                    packages:
                      type: object
                      properties:
                        total:
                          type: integer
                        ready:
                          type: integer
                    providerConfigs:
                      type: object
                      properties:
                        total:
                          type: integer
                        emitted:
                          type: integer
                    rbac:
                      type: object
                      properties:
                        clusterAdmin:
                          type: boolean
                transitive:
                  type: array
                  items:
                    type: string
                  description: >-
                    Packages that arrive on the target cluster through another
                    package's dependsOn, without ever being installed by name.
                    Published because "what is on this cluster" is not
                    answerable from the spec — two thirds of it is this list.
      additionalPrinterColumns:
        - name: READY
          type: string
          jsonPath: .status.ready
        - name: PROFILE
          type: string
          jsonPath: .status.profile
        - name: PACKAGES
          type: string
          jsonPath: .status.components.packages.ready
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
