---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: vaultk8sauths.config.stuttgart-things.com
spec:
  group: config.stuttgart-things.com
  scope: Namespaced
  defaultCompositeDeletePolicy: Foreground
  names:
    kind: VaultK8sAuth
    plural: vaultk8sauths
    singular: vaultk8sauth
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                clusterName:
                  type: string
                  description: "Name of the target Kubernetes cluster (used as a prefix for Vault auth backend paths)."
                vaultAddr:
                  type: string
                  description: "Address of the Vault server."
                skipTlsVerify:
                  type: boolean
                  default: true
                kubernetesHost:
                  type: string
                  description: "Kubernetes API host to use when any k8sAuth entry configures a backend_config. Typically https://kubernetes.default.svc:443."
                  default: "https://kubernetes.default.svc:443"
                vaultTokenSecret:
                  type: string
                  description: "Name of the Secret (co-located with the Workspace) holding terraform.tfvars with the Vault AppRole login material (vault_role_id + vault_secret_id). AppRole, not a static token: each reconcile mints a fresh short-lived token, so the Workspace never wedges on an expired credential."
                  default: "vault"
                vaultTokenSecretKey:
                  type: string
                  default: "terraform.tfvars"
                providerConfigName:
                  type: string
                  description: "Name of the opentofu ProviderConfig / ClusterProviderConfig."
                  default: "default"
                providerConfigKind:
                  type: string
                  enum:
                    - ClusterProviderConfig
                    - ProviderConfig
                  default: ClusterProviderConfig
                k8sAuths:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      tokenPolicies:
                        type: array
                        items:
                          type: string
                      tokenTtl:
                        type: integer
                        default: 3600
                      boundServiceAccountNames:
                        type: array
                        items:
                          type: string
                        default: ["default"]
                      policies:
                        type: array
                        description: >-
                          Vault policies to CREATE for this auth, each named
                          {clusterName}-{name} and appended to tokenPolicies.

                          A list because a cluster usually wants more than one:
                          its own KV subtree, plus whatever the role it plays
                          grants it — a cluster with the cicd profile reads the
                          cicd tree as well as its own. Separate grants with
                          separate lifetimes, not one policy with a longer body.

                          Created in the SAME OpenTofu plan as the role that
                          names them, which is the point: Vault accepts a role
                          referencing a policy that does not exist, and the
                          token then simply has no permissions — no error at
                          creation, nothing in the audit trail, and a consumer
                          reporting 403 as if it were a network problem.

                          Leave unset to keep referencing policies that already
                          exist in Vault, via tokenPolicies.
                        items:
                          type: object
                          required:
                            - name
                            - rules
                          properties:
                            name:
                              type: string
                              description: >-
                                Suffix. The policy is named {clusterName}-{name},
                                so two clusters granting the same kind of access
                                do not collide on one Vault object.
                            rules:
                              type: string
                              description: >-
                                HCL body, verbatim. The cluster's own subtree is
                                the usual case:
                                path "kv/data/<cluster>/*" { capabilities = ["read"] }
                      boundServiceAccountNamespaces:
                        type: array
                        items:
                          type: string
                        default: ["default"]
                      backendConfig:
                        type: object
                        description: "If set, the generated Workspace additionally renders a vault_kubernetes_auth_backend_config, reading CA cert and token reviewer JWT from a Kubernetes Secret."
                        properties:
                          secretName:
                            type: string
                            description: "Name of the Secret containing ca.crt and token (typically a ServiceAccount token secret)."
                          secretNamespace:
                            type: string
                            description: "Namespace of the Secret. Defaults to the Workspace namespace."
                          caCertKey:
                            type: string
                            default: "ca.crt"
                          tokenKey:
                            type: string
                            default: "token"
                          disableIssValidation:
                            type: boolean
                            default: true
                          disableLocalCaJwt:
                            type: boolean
                            default: true
                        required:
                          - secretName
                    required:
                      - name
                      - tokenPolicies
              required:
                - clusterName
                - vaultAddr
                - k8sAuths
            status:
              type: object
              description: "Observed state of the VaultK8sAuth."
              properties:
                share:
                  type: object
                  description: >-
                    What the auth actually created, lifted from the OpenTofu
                    Workspace outputs. Until v0.2.0 a VaultK8sAuth reported
                    readiness and nothing else, so anything wanting to USE the
                    mount had to be told its name by hand — which is what blocks
                    external-secrets from discovering its own cluster's Vault.

                    mountPath, role and policies are ABSENT while the Workspace
                    is still applying, never published empty: a consumer
                    resolving a substitution source to "" would send a blank
                    mount path to Vault, and Vault answers that with a 403 that
                    names nothing.
                  x-kubernetes-preserve-unknown-fields: true
