---
# Secret referenced by the generated Workspace's varFiles entry. Must be
# co-located in the same namespace as the VaultK8sAuth (Crossplane v2
# secretKeyRef is namespace-local).
#
# AppRole, NOT a static token: the composed module's provider block does
# `auth_login` with these two, and declares `vault_role_id`/`vault_secret_id`
# as required variables with no defaults. A `vault_token` here satisfies
# nothing — tofu fails the plan with "No value for required variable".
#
# The AppRole behind these needs `sudo` on `sys/auth/*`; mounting an auth
# backend is a root-protected operation. A policy of
# `path "*" { capabilities = ["create","read","update","delete","list"] }`
# looks all-powerful and still 403s, because the wildcard does not imply sudo.
apiVersion: v1
kind: Secret
metadata:
  name: vault
  namespace: default
type: Opaque
stringData:
  terraform.tfvars: |
    vault_role_id = "EXAMPLE-ROLE-ID-REPLACE-WITH-REAL-VALUE" # pragma: allowlist secret
    vault_secret_id = "EXAMPLE-SECRET-ID-REPLACE-WITH-REAL-VALUE" # pragma: allowlist secret
