---
# CLUSTER PRECONDITION, not part of the package.
#
# The in-cluster provider-kubernetes ServiceAccount needs to CREATE
# RemoteClusters. This is easy to miss because it was never needed before:
# RemoteClusters have always been applied by hand, so the provider only ever
# had to read the ones that already existed. The moment a Composition creates
# one, the missing verb surfaces as:
#
#   create failed: cannot create object: remoteclusters.kubeconfig.stuttgart-things.com
#   "<name>" is forbidden: User "system:serviceaccount:crossplane-system:provider-kubernetes"
#   cannot create resource "remoteclusters" in API group "kubeconfig.stuttgart-things.com"
#   at the cluster scope
#
# Hit for real on kind1 while first building a cluster through the `cluster`
# Configuration (2026-07-27). It does NOT apply where the provider's SA is
# already cluster-admin — check before applying:
#
#   kubectl auth can-i create remoteclusters.kubeconfig.stuttgart-things.com \
#     --as=system:serviceaccount:crossplane-system:provider-kubernetes
#
# Find the actual SA name with:
#   kubectl get sa -n crossplane-system | grep provider-kubernetes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-kubernetes-remoteclusters
rules:
  - apiGroups: ["kubeconfig.stuttgart-things.com"]
    resources: ["remoteclusters", "remoteclusters/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-remoteclusters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-kubernetes-remoteclusters
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
