---
# The realistic case: a LabUL management cluster that builds Proxmox VMs.
#
# `environment: labul` rather than the cluster name, because the placement facts
# below are properties of LabUL and not of this cluster — a second cluster in the
# same lab wants the same label so the EnvironmentConfig means the same thing.
apiVersion: config.stuttgart-things.com/v1alpha1
kind: Capability
metadata:
  name: u26-rke2-1-capability
  namespace: default
spec:
  clusterName: u26-rke2-1
  kubernetesProviderConfigRef: u26-rke2-1-kubernetes
  environment: labul
  vault:
    server: https://vault.infra.sthings-vsphere.labul.sva.de
    # auth.mountPath defaults to <clusterName>-eso, role to eso, the
    # ServiceAccount to external-secrets/external-secrets and the CA to
    # vault-pki-ca in cert-manager — the shape the platform's external-secrets
    # app already produces on this cluster.
  # Where the VM XRs live. The cloud-init password lands here, not beside the
  # provider — see the README.
  workloadNamespace: default
  capabilities:
    proxmoxvm:
      enabled: true
      vault:
        # The KV-v2 mount. Naming it creates this capability's own
        # ClusterSecretStore — a store fixes ONE mount, and the cluster's
        # existing vault-cluster-secrets points at `clusters`, not here.
        mount: cicd-proxmox-labul
        # Key within that mount. Which FIELDS are read (pve_api_url,
        # vm_ssh_password, ...) is a catalog fact.
        secret: default  # pragma: allowlist secret
      placement:
        node: ul-pve01
        # VLAN-trunk bridge; the template ships on vmbr0/untagged.
        bridge: vmbrvlan
        vlanTag: "102"
        datastore: V5010-01-1
        pool: stuttgart-things
        # bpg clones BY VMID, so this number is the template reference — there
        # is no name or selector to fall back on.
        templateVmId: "211"
