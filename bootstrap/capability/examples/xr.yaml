---
# The realistic case: a LabUL management cluster that builds Proxmox VMs.
#
# `environment: labul` rather than the cluster name, because the placement facts
# below are properties of LabUL and not of this cluster — a second cluster in the
# same lab wants the same label so the EnvironmentConfig means the same thing.
apiVersion: config.stuttgart-things.com/v1alpha1
kind: Capability
metadata:
  name: u26-rke2-1-capability
  namespace: default
spec:
  clusterName: u26-rke2-1
  kubernetesProviderConfigRef: u26-rke2-1-kubernetes
  environment: labul
  vault:
    server: https://vault.infra.sthings-vsphere.labul.sva.de
    # auth.mountPath defaults to <clusterName>-eso, role to eso, the
    # ServiceAccount to external-secrets/external-secrets and the CA to
    # vault-pki-ca in cert-manager — the shape the platform's external-secrets
    # app already produces on this cluster.
  # Where the VM XRs live. The cloud-init password lands here, not beside the
  # provider — see the README.
  workloadNamespace: default
  capabilities:
    proxmoxvm:
      enabled: true
      vault:
        # The KV-v2 mount. Naming it creates this capability's own
        # ClusterSecretStore — a store fixes ONE mount, and the cluster's
        # existing vault-cluster-secrets points at `clusters`, not here.
        mount: cicd-proxmox-labul
        # Key within that mount. Which FIELDS are read (pve_api_url,
        # vm_ssh_password, ...) is a catalog fact.
        secret: default  # pragma: allowlist secret
      placement:
        # The ACTIVE LabUL nodes are ul-pve10 and ul-pve11. Spelled out because
        # ul-pve01 outlived its move by a long way: bpg derives the clone SOURCE
        # node from this key, so a stale value builds nothing and the error names
        # the node rather than where the value came from. The capability Helm
        # chart carried ul-pve01 until stuttgart-things#2541 — it agrees with
        # this file now.
        node: ul-pve11
        # VLAN-trunk bridge; the template ships on vmbr0/untagged.
        bridge: vmbrvlan
        vlanTag: "102"
        datastore: V5010-01-1
        pool: stuttgart-things
        # bpg clones BY VMID, so this number is the template reference — there
        # is no name or selector to fall back on.
        templateVmId: "211"
        # REQUIRED in LabUL, not an optimisation. Without it Proxmox allocates
        # the clone on the TEMPLATE's datastore — the NFS store DD-sthings,
        # where an ACL added in 2026-08 removed Datastore.AllocateSpace, so
        # every clone 403s. Safe on a NEW environment; on one that already has
        # VMs it rewrites their ForceNew clone block (destroy + recreate), so
        # pin those with the `none` sentinel first.
        cloneDatastore: V5010-01-1
        # Und die Gegenrichtung fuer die EINE Platte, die anders liegen muss:
        # das cidata-Image. PVE gibt es bei jedem Stop/Start frei und legt es neu
        # an, und auf V5010-01-1 ist genau dieser Umlauf kaputt — der Stop laesst
        # das LV ohne Device-Node zurueck, der naechste Start stirbt an
        # `lvcreate ... already exists`, die VM ist ab da nicht mehr bootbar.
        # Ohne diesen Schluessel loest die Composition auf `datastore` auf, also
        # auf genau den kaputten Storage, und zwar lautlos: die VM entsteht,
        # meldet Ready, und der Schaden zeigt sich erst beim ersten Neustart.
        #
        # DIE BEIDEN ZEILEN ZIEHEN BEWUSST IN VERSCHIEDENE RICHTUNGEN: die
        # Datenplatte weg von DD-sthings (ACL, siehe oben), das 4 MB grosse
        # cidata-Image hin zu DD-sthings. Das setzt voraus, dass die ACL
        # inzwischen Allocate fuer cidata zulaesst — der LabUL-Admin hat den
        # Stop/Start-Umlauf dort am 2026-08-20 durchgespielt, was ohne Allocate
        # nicht gegangen waere. Kommt beim ersten Clone ein 403 auf die
        # cidata-Platte, ist es die ACL und nicht dieser Schluessel.
        cloudInitDatastore: DD-sthings
