---
# Every field set — two capabilities, both optional and defaulted placement
# fields, per-capability store override.
apiVersion: config.stuttgart-things.com/v1alpha1
kind: Capability
metadata:
  name: labul-capability
  namespace: default
spec:
  clusterName: u26-rke2-1
  kubernetesProviderConfigRef: u26-rke2-1-kubernetes
  environment: labul
  namespace: crossplane-system
  workloadNamespace: default
  secretStoreRef: vault-cluster-secrets  # pragma: allowlist secret
  vault:
    server: https://vault.infra.sthings-vsphere.labul.sva.de
    auth:
      mountPath: u26-rke2-1-eso
      role: eso
      serviceAccountName: external-secrets
      serviceAccountNamespace: external-secrets
    caProvider:
      name: vault-pki-ca
      namespace: cert-manager
      key: ca.crt
  refreshInterval: 30m
  capabilities:
    proxmoxvm:
      enabled: true
      vault:
        mount: cicd-proxmox-labul
        secret: default  # pragma: allowlist secret
      placement:
        node: ul-pve11
        datastore: V5010-01-1
        bridge: vmbrvlan
        vlanTag: "102"
        pool: stuttgart-things
        templateVmId: "211"
        # DANGEROUS on an environment with existing VMs: bpg's clone block is
        # ForceNew, so adding this rewrites the clone block of every VM already
        # built under this EnvironmentConfig and the provider answers with
        # destroy + recreate. Requires proxmoxvm >= v0.11.0, whose `none`
        # sentinel is how an individual XR declines it.
        cloneDatastore: V5010-01-1
        # Steuert das 4-MB-cidata-Image von der Datenplatte weg. Es ist die eine
        # Platte, die PVE bei jedem Stop/Start freigibt und neu anlegt, und auf
        # LabULs V5010-01-1 ist genau dieser Umlauf kaputt: der Stop laesst das
        # LV ohne Device-Node zurueck, der naechste Start stirbt an
        # `lvcreate ... already exists`, die VM ist ab da nicht mehr bootbar.
        # Auf dem NFS-Store DD-sthings laeuft derselbe Umlauf sauber
        # (hostseitig bestaetigt 2026-08-20).
        #
        # Ohne diesen Schluessel loest die proxmoxvm-Composition auf den
        # Datastore der Rootplatte auf — also auf genau den kaputten. Und zwar
        # lautlos: die VM entsteht, meldet Ready, und der Schaden zeigt sich
        # erst beim ersten Neustart.
        cloudInitDatastore: DD-sthings
        snippetsDatastore: local
        smbiosManufacturer: stuttgart-things
        smbiosProduct: sthings-u26
        # Catalog defaults, restated to show they are overridable.
        cpuType: host
        osType: l26
        bios: seabios
        diskInterface: virtio0
        networkModel: virtio
        ciUsername: sthings
    # No ClusterProviderConfig: ansible configures a Configuration, not a
    # provider. Its credentials Secret lands in `namespace` below — the Tekton
    # pipeline reads it there, and one beside the provider would never be read.
    # Named for the Configuration it configures, not for the tool: the
    # ansible-run Composition selects its EnvironmentConfig on
    # ansible-run.resources.stuttgart-things.com/environment, and the catalog
    # derives that label from the entry name.
    ansible-run:
      enabled: true
      vault:
        mount: cicd-proxmox-labul
        secret: default  # pragma: allowlist secret
      placement:
        namespace: tekton-ci
        storageClass: openebs-hostpath
    vspherevm:
      enabled: true
      vault:
        # A different mount, which is exactly why each capability gets its own
        # store rather than sharing the cluster's.
        mount: cicd-vsphere-labul
        secret: default  # pragma: allowlist secret
      placement:
        # vSphere places by managed-object ID, not by name; templateUuid is the
        # BIOS config.uuid rather than the VM name.
        templateUuid: 4234df9c-0000-0000-0000-000000000000
        datastoreId: datastore-12
        resourcePoolId: resgroup-8
        networkId: dvportgroup-2048
        folder: stuttgart-things/testing
        domain: labul.sva.de
        hostSystemId: host-42
        firmware: bios
        guestId: ubuntu64Guest
        scsiType: pvscsi
        adapterType: vmxnet3
