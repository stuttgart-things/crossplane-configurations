---
# Cluster precondition ONLY for dynamic LoadBalancer mode
# (spec.loadBalancer.ipMode: dynamic).
#
# In dynamic mode the Composition Observes an XIPReservation on the MANAGEMENT
# cluster (through the in-cluster provider-kubernetes config) to read its
# reserved IPs into the CiliumLoadBalancerIPPool block. Without this grant the
# observe Object stalls on:
#   observe failed: ... cannot get resource "xipreservations" in API group
#   "resources.stuttgart-things.com" ... is forbidden
# and the pool never gets an IP.
#
# Not needed for static ipRange mode or for install/gateway-only use.
#
# Read-only: XIPReservations are owned by the ip-reservation Configuration.
# patch/update are included only because provider-kubernetes writes
# status/annotations back onto observed objects.
#
# The subject assumes the provider ServiceAccount name is pinned to
# `provider-kubernetes` via a DeploymentRuntimeConfig (see
# ../../platform/examples/rbac.yaml). Without that pin the SA name carries the
# package-revision hash and the binding breaks on every provider upgrade.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-kubernetes-xipreservations
rules:
  - apiGroups: ["resources.stuttgart-things.com"]
    resources: ["xipreservations", "xipreservations/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-xipreservations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-kubernetes-xipreservations
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
