---
version: '3'

tasks:
  render:
    desc: "Render a Configuration locally (interactive; non-interactive: CONFIG=k8s/<name> [XR=xr.yaml] task render)"
    silent: true
    cmds:
      - |
        set -euo pipefail

        # --- pick configuration (env: CONFIG=<path>, e.g. k8s/namespace) ---
        if [ -n "${CONFIG:-}" ]; then
          [ -f "$CONFIG/crossplane.yaml" ] || { gum style --foreground 1 "CONFIG=$CONFIG: missing $CONFIG/crossplane.yaml"; exit 1; }
        else
          CONFIGS=$(find . -type f -name crossplane.yaml -not -path './.git/*' \
            | sed -e 's|/crossplane.yaml$||' -e 's|^\./||' \
            | sort)
          [ -n "$CONFIGS" ] || { gum style --foreground 1 "no configurations found (no crossplane.yaml)"; exit 1; }
          CONFIG=$(echo "$CONFIGS" | gum choose --header "select configuration to render:")
          [ -n "$CONFIG" ] || { gum style --foreground 3 "no selection"; exit 1; }
        fi

        # --- pick XR (env: XR=<path|name>, resolved against cwd, $CONFIG/examples/, $CONFIG/) ---
        if [ -n "${XR:-}" ]; then
          if [ -f "$XR" ]; then :; \
          elif [ -f "$CONFIG/examples/$XR" ]; then XR="$CONFIG/examples/$XR"; \
          elif [ -f "$CONFIG/$XR" ]; then XR="$CONFIG/$XR"; \
          else gum style --foreground 1 "XR=$XR not found (cwd, $CONFIG/examples/, $CONFIG/)"; exit 1; fi
        else
          XRS=$(find "$CONFIG/examples" -maxdepth 1 -type f -name 'xr*.yaml' 2>/dev/null | sort)
          XR_COUNT=$(echo -n "$XRS" | grep -c '^' || true)
          if [ "$XR_COUNT" -eq 0 ]; then
            gum style --foreground 1 "no xr*.yaml found in $CONFIG/examples"
            exit 1
          elif [ "$XR_COUNT" -eq 1 ]; then
            XR="$XRS"
          else
            XR=$(echo "$XRS" | gum choose --header "select example XR:")
            [ -n "$XR" ] || { gum style --foreground 3 "no selection"; exit 1; }
          fi
        fi
        COMPOSITION="$CONFIG/apis/composition.yaml"
        FUNCTIONS="$CONFIG/examples/functions.yaml"

        for f in "$XR" "$COMPOSITION" "$FUNCTIONS"; do
          if [ ! -f "$f" ]; then
            gum style --foreground 1 "missing file: $f"
            exit 1
          fi
        done

        # --- extra-resources (env: EXTRA=<path>; default: $CONFIG/examples/environmentconfig.yaml) ---
        # Compositions with a load-environment step (function-environment-configs)
        # need their EnvironmentConfig(s) passed in, else the selector matches 0
        # and the render fails with "expected exactly one required resource, got 0".
        EXTRA="${EXTRA:-$CONFIG/examples/environmentconfig.yaml}"
        EXTRA_ARG=""
        if [ -f "$EXTRA" ]; then
          EXTRA_ARG="--extra-resources $EXTRA"
        elif [ -n "${EXTRA:-}" ] && [ "$EXTRA" != "$CONFIG/examples/environmentconfig.yaml" ]; then
          gum style --foreground 1 "EXTRA=$EXTRA not found"; exit 1
        fi

        gum style --foreground 4 "→ rendering $CONFIG"
        CMD="crossplane render $XR $COMPOSITION $FUNCTIONS --include-function-results $EXTRA_ARG"
        gum style --foreground 8 "\$ $CMD"
        eval "$CMD"

  render-golden:
    desc: "(Re)generate golden render snapshots under tests/render/golden/ (all, or CONFIG=k8s/<name>). Requires the crossplane CLI + a container runtime, like `render`."
    silent: true
    cmds:
      - |
        set -euo pipefail
        gum style --foreground 4 "→ render-golden ${CONFIG:-<all configurations>}"
        # The script discovers Configurations, renders every examples/xr*.yaml,
        # and writes tests/render/golden/<config>/<xr>.yaml. CONFIG scopes it to one.
        tests/render/render-golden.sh

  check:
    desc: "Check a cluster against a Configuration's requirements (non-interactive: KUBECONFIG=... CONFIG=k8s/<name> task check)"
    silent: true
    cmds:
      - |
        set -euo pipefail

        # --- 1) pick kubeconfig (env: KUBECONFIG=<path>) ---
        if [ -n "${KUBECONFIG:-}" ]; then
          [ -f "$KUBECONFIG" ] || { gum style --foreground 1 "KUBECONFIG=$KUBECONFIG: file not found"; exit 1; }
        else
          KUBE_DIR="${KUBE_DIR:-$HOME/.kube}"
          KUBECONFIGS=$(find "$KUBE_DIR" -maxdepth 1 -type f -not -name 'cache*' 2>/dev/null | sort)
          [ -n "$KUBECONFIGS" ] || { gum style --foreground 1 "no kubeconfigs found in $KUBE_DIR"; exit 1; }
          KUBECONFIG=$(echo "$KUBECONFIGS" | gum choose --header "select kubeconfig:")
          [ -n "$KUBECONFIG" ] || { gum style --foreground 3 "no selection"; exit 1; }
        fi
        export KUBECONFIG

        # --- 2) pick configuration (env: CONFIG=<path>, e.g. k8s/namespace) ---
        if [ -n "${CONFIG:-}" ]; then
          [ -f "$CONFIG/crossplane.yaml" ] || { gum style --foreground 1 "CONFIG=$CONFIG: missing $CONFIG/crossplane.yaml"; exit 1; }
        else
          CONFIGS=$(find . -type f -name crossplane.yaml -not -path './.git/*' \
            | sed -e 's|/crossplane.yaml$||' -e 's|^\./||' \
            | sort)
          [ -n "$CONFIGS" ] || { gum style --foreground 1 "no configurations found"; exit 1; }
          CONFIG=$(echo "$CONFIGS" | gum choose --header "select configuration to check:")
          [ -n "$CONFIG" ] || { gum style --foreground 3 "no selection"; exit 1; }
        fi
        META="$CONFIG/crossplane.yaml"

        gum style --foreground 4 "→ checking $CONFIG against $(basename "$KUBECONFIG")"

        # --- 3) cluster reachable ---
        if ! kubectl version --request-timeout=5s >/dev/null 2>&1; then
          gum style --foreground 1 "✗ cluster not reachable via $KUBECONFIG"
          exit 1
        fi
        CTX=$(kubectl config current-context 2>/dev/null || echo unknown)
        gum style --foreground 2 "✓ cluster reachable  (context: $CTX)"

        # --- 4) crossplane core ---
        REQ_XP=$(yq -r '.spec.crossplane.version' "$META")
        if ! kubectl -n crossplane-system get deploy crossplane >/dev/null 2>&1; then
          gum style --foreground 1 "✗ crossplane not installed  (required $REQ_XP)"
          exit 1
        fi
        INST_XP=$(kubectl -n crossplane-system get deploy crossplane \
          -o jsonpath='{.spec.template.spec.containers[0].image}' | awk -F: '{print $NF}')
        gum style --foreground 2 "✓ crossplane           installed=$INST_XP  required=$REQ_XP"

        # --- 5) dependencies (providers + functions) ---
        FAIL=0
        check_dep() {
          local kind="$1"   # providers | functions
          local pkg="$2"
          local req_ver="$3"
          local row
          row=$(kubectl get "${kind}.pkg.crossplane.io" -o json | yq -r \
            ".items[] | select(.spec.package | test(\"^${pkg}:\")) |
             [.metadata.name,
              .spec.package,
              ([.status.conditions[]? | select(.type==\"Installed\") | .status] | join(\",\")),
              ([.status.conditions[]? | select(.type==\"Healthy\") | .status] | join(\",\"))]
             | @tsv" | head -n1)
          local label="${kind%s}"
          if [ -z "$row" ]; then
            gum style --foreground 1 "✗ $label missing       $pkg ($req_ver)"
            FAIL=$((FAIL+1))
            return
          fi
          local installed_pkg ins healthy inst_ver
          installed_pkg=$(echo "$row" | cut -f2)
          ins=$(echo "$row" | cut -f3)
          healthy=$(echo "$row" | cut -f4)
          inst_ver=${installed_pkg##*:}
          if [ "$ins" = "True" ] && [ "$healthy" = "True" ]; then
            gum style --foreground 2 "✓ $label $(printf '%-20s' "$(basename "$pkg")") installed=$inst_ver  required=$req_ver"
          else
            gum style --foreground 3 "! $label $(basename "$pkg")  installed=$inst_ver  Installed=$ins Healthy=$healthy"
            FAIL=$((FAIL+1))
          fi
        }

        while IFS=$'\t' read -r pkg ver; do
          [ -n "$pkg" ] && check_dep providers "$pkg" "$ver"
        done < <(yq -r '.spec.dependsOn[] | select(has("provider")) | [.provider, .version] | @tsv' "$META")

        while IFS=$'\t' read -r pkg ver; do
          [ -n "$pkg" ] && check_dep functions "$pkg" "$ver"
        done < <(yq -r '.spec.dependsOn[] | select(has("function")) | [.function, .version] | @tsv' "$META")

        echo
        if [ "$FAIL" -eq 0 ]; then
          gum style --foreground 2 --bold "✓ all requirements satisfied"
        else
          gum style --foreground 1 --bold "✗ $FAIL requirement(s) not satisfied"
          exit 1
        fi

  apply-dev:
    desc: "Apply a Configuration and/or example XR from local files (non-interactive: KUBECONFIG=... CONFIG=k8s/<name> WHAT=both [XR=xr.yaml] [FUNCTIONS=1] YES=1 task apply-dev). Functions are skipped unless FUNCTIONS=1 — applying them to a fleet cluster downgrades Functions and can freeze the package resolver."
    silent: true
    cmds:
      - |
        set -euo pipefail

        # Read the FUNCTIONS opt-in NOW: the variable is reused below as the
        # path to examples/functions.yaml, so testing it later reads the path.
        APPLY_FUNCTIONS=0
        case "${FUNCTIONS:-}" in 1|true) APPLY_FUNCTIONS=1 ;; esac

        # --- pick kubeconfig (env: KUBECONFIG=<path>) ---
        if [ -n "${KUBECONFIG:-}" ]; then
          [ -f "$KUBECONFIG" ] || { gum style --foreground 1 "KUBECONFIG=$KUBECONFIG: file not found"; exit 1; }
        else
          KUBE_DIR="${KUBE_DIR:-$HOME/.kube}"
          KUBECONFIGS=$(find "$KUBE_DIR" -maxdepth 1 -type f -not -name 'cache*' 2>/dev/null | sort)
          [ -n "$KUBECONFIGS" ] || { gum style --foreground 1 "no kubeconfigs in $KUBE_DIR"; exit 1; }
          KUBECONFIG=$(echo "$KUBECONFIGS" | gum choose --header "select kubeconfig:")
          [ -n "$KUBECONFIG" ] || { gum style --foreground 3 "no selection"; exit 1; }
        fi
        export KUBECONFIG

        # --- pick configuration (env: CONFIG=<path>, e.g. k8s/namespace) ---
        if [ -n "${CONFIG:-}" ]; then
          [ -f "$CONFIG/crossplane.yaml" ] || { gum style --foreground 1 "CONFIG=$CONFIG: missing $CONFIG/crossplane.yaml"; exit 1; }
        else
          CONFIGS=$(find . -type f -name crossplane.yaml -not -path './.git/*' \
            | sed -e 's|/crossplane.yaml$||' -e 's|^\./||' \
            | sort)
          [ -n "$CONFIGS" ] || { gum style --foreground 1 "no configurations"; exit 1; }
          CONFIG=$(echo "$CONFIGS" | gum choose --header "select configuration:")
          [ -n "$CONFIG" ] || { gum style --foreground 3 "no selection"; exit 1; }
        fi

        # --- pick what to apply (env: WHAT=configuration|xr|both) ---
        if [ -n "${WHAT:-}" ]; then
          case "$WHAT" in
            configuration|xr|both) ;;
            *) gum style --foreground 1 "WHAT=$WHAT not one of: configuration|xr|both"; exit 1 ;;
          esac
        else
          WHAT=$(printf "configuration\nxr\nboth" \
            | gum choose --header "what to apply? (configuration = XRD+Composition, xr = example XR only)")
          [ -n "$WHAT" ] || { gum style --foreground 3 "no selection"; exit 1; }
        fi

        FUNCTIONS="$CONFIG/examples/functions.yaml"
        DEFINITION="$CONFIG/apis/definition.yaml"
        COMPOSITION="$CONFIG/apis/composition.yaml"

        # --- if applying XR, pick which one (env: XR=<path|name>) ---
        if [ "$WHAT" = "xr" ] || [ "$WHAT" = "both" ]; then
          if [ -n "${XR:-}" ]; then
            if [ -f "$XR" ]; then :; \
            elif [ -f "$CONFIG/examples/$XR" ]; then XR="$CONFIG/examples/$XR"; \
            elif [ -f "$CONFIG/$XR" ]; then XR="$CONFIG/$XR"; \
            else gum style --foreground 1 "XR=$XR not found (cwd, $CONFIG/examples/, $CONFIG/)"; exit 1; fi
          else
            XRS=$(find "$CONFIG/examples" -maxdepth 1 -type f -name 'xr*.yaml' 2>/dev/null | sort)
            XR_COUNT=$(echo -n "$XRS" | grep -c '^' || true)
            if [ "$XR_COUNT" -eq 0 ]; then
              gum style --foreground 1 "no xr*.yaml in $CONFIG/examples"
              exit 1
            elif [ "$XR_COUNT" -eq 1 ]; then
              XR="$XRS"
            else
              XR=$(echo "$XRS" | gum choose --header "select example XR:")
              [ -n "$XR" ] || { gum style --foreground 3 "no selection"; exit 1; }
            fi
          fi
        else
          XR=""
        fi

        # --- validate files exist ---
        if [ "$WHAT" = "configuration" ] || [ "$WHAT" = "both" ]; then
          FILES="$DEFINITION $COMPOSITION"
          [ "$APPLY_FUNCTIONS" = "1" ] && FILES="$FUNCTIONS $FILES"
          for f in $FILES; do
            [ -f "$f" ] || { gum style --foreground 1 "missing file: $f"; exit 1; }
          done
        fi

        # --- plan + confirm ---
        CTX=$(kubectl config current-context 2>/dev/null || echo unknown)
        gum style --foreground 4 "→ dev-apply $CONFIG  (mode: $WHAT)"
        echo "  context:    $CTX"
        echo "  kubeconfig: $(basename "$KUBECONFIG")"
        echo
        echo "  manifests:"
        if [ "$WHAT" = "configuration" ] || [ "$WHAT" = "both" ]; then
          [ "$APPLY_FUNCTIONS" = "1" ] && echo "    - $FUNCTIONS  (FUNCTIONS=1)"
          echo "    - $DEFINITION"
          echo "    - $COMPOSITION"
          [ "$APPLY_FUNCTIONS" = "1" ] || echo "    (skipping $FUNCTIONS — pass FUNCTIONS=1 for a bare dev cluster)"
        fi
        [ -n "$XR" ] && echo "    - $XR"
        echo
        if [ "${YES:-}" = "1" ] || [ "${YES:-}" = "true" ]; then
          gum style --foreground 8 "  (YES=$YES — skipping confirmation)"
        else
          gum confirm "apply to '$CTX'?" || { gum style --foreground 3 "aborted"; exit 1; }
        fi

        # --- apply configuration ---
        if [ "$WHAT" = "configuration" ] || [ "$WHAT" = "both" ]; then
          # Applying examples/functions.yaml to a cluster that already has
          # Functions is destructive TWICE OVER, so it is opt-in:
          #
          #  1. The pins here drift behind the fleet, so kubectl apply silently
          #     DOWNGRADES a Function (e.g. environment-configs v0.7.2 -> v0.7.0).
          #  2. Repointing a short-named CR at a registry that a dependsOn-derived
          #     long-named CR already uses collides in the package Lock graph and
          #     freezes dependency resolution for EVERY package on the cluster.
          #     (The upbound pins in examples/functions.yaml exist to prevent
          #     exactly this — see the header comment in any of those files.)
          #
          # Fleet clusters install Functions via Argo CD and need neither. Pass
          # FUNCTIONS=1 only when bootstrapping a bare dev cluster.
          if [ "$APPLY_FUNCTIONS" = "1" ]; then
            gum style --foreground 4 "→ apply functions (FUNCTIONS=1)"
            kubectl apply -f "$FUNCTIONS"
            kubectl wait --for=condition=Healthy --timeout=120s -f "$FUNCTIONS"
          else
            gum style --foreground 8 "→ skipping functions (pass FUNCTIONS=1 for a bare dev cluster)"
          fi

          gum style --foreground 4 "→ apply XRD"
          kubectl apply -f "$DEFINITION"
          XRD_NAME=$(yq -r '.metadata.name' "$DEFINITION")
          kubectl wait --for=condition=Established --timeout=60s "xrd.apiextensions.crossplane.io/$XRD_NAME"

          gum style --foreground 4 "→ apply Composition"
          kubectl apply -f "$COMPOSITION"
        fi

        # --- apply XR ---
        if [ -n "$XR" ]; then
          XR_NS=$(yq -r '.metadata.namespace // "default"' "$XR")
          if ! kubectl get ns "$XR_NS" >/dev/null 2>&1; then
            gum style --foreground 4 "→ create namespace $XR_NS"
            kubectl create namespace "$XR_NS"
          fi
          gum style --foreground 4 "→ apply XR ($(basename "$XR"))"
          kubectl apply -f "$XR"
        fi

        # --- status ---
        echo
        gum style --foreground 2 --bold "✓ done"
        echo
        if [ "$WHAT" = "configuration" ] || [ "$WHAT" = "both" ]; then
          echo "Functions:"
          kubectl get functions.pkg.crossplane.io
          echo
          echo "XRD:"
          kubectl get xrd "$XRD_NAME"
          echo
          echo "Composition:"
          kubectl get composition "$(yq -r '.metadata.name' "$COMPOSITION")"
          echo
        fi
        if [ -n "$XR" ]; then
          XR_KIND=$(yq -r '.kind' "$XR")
          XR_NAME=$(yq -r '.metadata.name' "$XR")
          XR_NS=$(yq -r '.metadata.namespace // "default"' "$XR")
          TRACE_WAIT="${TRACE_WAIT:-5}"
          gum spin --title "waiting ${TRACE_WAIT}s for reconciliation..." --spinner dot -- sleep "$TRACE_WAIT"
          echo
          echo "Trace:"
          # `resource trace`, nicht `beta trace`: die beta-Subcommands sind mit
          # CLI v2.3.0 promotet und dabei umbenannt worden, die alte Schreibweise
          # existiert nicht mehr. Ausgabe ist identisch — auf u26-kind3 gegen
          # dieselbe ManagedNamespace byteweise verglichen (v2.2.1 beta trace vs.
          # v2.4.1 resource trace). Das `|| true` bleibt: der Trace ist Beiwerk,
          # kein Grund den Task scheitern zu lassen.
          crossplane resource trace "$XR_KIND" "$XR_NAME" -n "$XR_NS" || true
        fi

  clean-stranded:
    desc: "Find and clear managed resources wedged on a finalizer (non-interactive: KUBECONFIG=... [NS=crossplane-system] [MATCH=<substring>] YES=1 task clean-stranded)"
    silent: true
    cmds:
      - |
        set -euo pipefail

        # A resource is "stranded" here when it has BOTH a deletionTimestamp and
        # a finalizer: Crossplane asked for it to go, the provider cannot finish,
        # and nothing will resolve it on its own.
        #
        # The case this was written for: a superseded PipelineRun Object. Tekton
        # rejects real spec changes to a COMPLETE PipelineRun, so if the provider
        # needs to apply a changed manifest while deleting, the Object can never
        # finalize. Measured on kind1: a no-op or metadata-only patch is accepted,
        # a genuine spec change is not -- which is why live Objects over finished
        # runs are healthy and only superseded ones wedge (issue #184).
        #
        # Clearing the finalizer is safe HERE because the external resource is a
        # completed PipelineRun: a historical record Tekton prunes on its own.
        # It is NOT a general-purpose fix -- on a resource whose external object
        # still matters, dropping the finalizer orphans it silently.

        if [ -n "${KUBECONFIG:-}" ]; then
          if [ ! -f "$KUBECONFIG" ]; then gum style --foreground 1 "KUBECONFIG=$KUBECONFIG: file not found"; exit 1; fi
        else
          KUBE_DIR="${KUBE_DIR:-$HOME/.kube}"
          KUBECONFIGS=$(find "$KUBE_DIR" -maxdepth 1 -type f -not -name 'cache*' 2>/dev/null | sort)
          if [ -z "$KUBECONFIGS" ]; then gum style --foreground 1 "no kubeconfigs found in $KUBE_DIR"; exit 1; fi
          KUBECONFIG=$(echo "$KUBECONFIGS" | gum choose --header "select kubeconfig:")
          if [ -z "$KUBECONFIG" ]; then gum style --foreground 3 "no selection"; exit 1; fi
        fi
        export KUBECONFIG

        NS="${NS:-crossplane-system}"
        MATCH="${MATCH:-}"

        # `|| true` inside the pipe: kubectl exits non-zero when a CRD is absent,
        # and pipefail would kill the task before printing anything.
        FOUND=$( { kubectl get object.kubernetes.m.crossplane.io,release.helm.m.crossplane.io -n "$NS" -o json 2>/dev/null || true; } \
          | jq -r --arg m "$MATCH" '.items[]?
              | select(.metadata.deletionTimestamp != null)
              | select((.metadata.finalizers // []) | length > 0)
              | select($m == "" or (.metadata.name | test($m)))
              | "\(.kind)/\(.metadata.name)\t\((.status.conditions[]? | select(.type=="Synced") | .message // "")[0:110])"' )

        if [ -z "$FOUND" ]; then
          gum style --foreground 2 "✓ nothing stranded in $NS"
          exit 0
        fi

        gum style --foreground 3 --bold "stranded in $NS:"
        echo "$FOUND" | while IFS="$(printf '\t')" read -r res msg; do
          printf "  %s\n      %s\n" "$res" "$msg"
        done
        echo

        if [ "${YES:-}" = "1" ] || [ "${YES:-}" = "true" ]; then
          gum style --foreground 8 "  (YES=$YES — skipping confirmation)"
        else
          gum confirm "clear finalizers on these?" || { gum style --foreground 3 "aborted — nothing changed"; exit 1; }
        fi

        echo "$FOUND" | cut -f1 | while read -r res; do
          KIND="${res%%/*}"; NAME="${res#*/}"
          case "$KIND" in
            Object)  API=object.kubernetes.m.crossplane.io ;;
            Release) API=release.helm.m.crossplane.io ;;
            *)       gum style --foreground 3 "  skipping unknown kind $KIND"; continue ;;
          esac
          kubectl patch "$API" "$NAME" -n "$NS" --type=merge -p '{"metadata":{"finalizers":[]}}' >/dev/null 2>&1 \
            && gum style --foreground 2 "  ✓ cleared $res" \
            || gum style --foreground 1 "  ✗ failed on $res"
        done

  teardown-cluster:
    desc: "Tear down a ClusterStack in the two phases its teardown requires (non-interactive: KUBECONFIG=... NAME=<clusterstack> [NS=crossplane-system] YES=1 task teardown-cluster)"
    silent: true
    cmds:
      - |
        set -euo pipefail

        # WHY THREE PHASES. Deleting a ClusterStack that has a Platform child in
        # one step leaves resources behind: the whole tree is deleted in
        # parallel, so the ClusterAccess's RemoteCluster (owner of the kubeconfig
        # Secret and both ClusterProviderConfigs) can go while the Platform's own
        # Objects still need those credentials to finalize. Measured: four
        # leftovers, two of them permanent (crossplane-configurations#185).
        #
        # Phase 0 came later and for a different reason. An ArgocdCluster XR with
        # `clusterStackRef` composes a Usage whose whole purpose is to BLOCK the
        # delete in phase 2 — so a teardown that ignores it does not quietly do
        # the wrong thing, it fails at admission. Deregistering first is also
        # correct on its own terms: the generated Applications point at a cluster
        # that is about to stop existing, and once it is gone the ones carrying a
        # pre-delete hook cannot finalize at all.
        #
        # The Usage resources cannot prevent it — they are composed children of
        # the same XR, so they are swept away with everything else, and the
        # admission webhook that enforces them needs its rule object to exist.
        # The Composition cannot sequence it either: Crossplane does not invoke
        # the function while the XR is being deleted.
        #
        # Hence: remove the Platform child first, while the cluster is still
        # reachable, then delete the stack.

        # --- pick kubeconfig (env: KUBECONFIG=<path>) ---
        if [ -n "${KUBECONFIG:-}" ]; then
          if [ ! -f "$KUBECONFIG" ]; then gum style --foreground 1 "KUBECONFIG=$KUBECONFIG: file not found"; exit 1; fi
        else
          KUBE_DIR="${KUBE_DIR:-$HOME/.kube}"
          KUBECONFIGS=$(find "$KUBE_DIR" -maxdepth 1 -type f -not -name 'cache*' 2>/dev/null | sort)
          if [ -z "$KUBECONFIGS" ]; then gum style --foreground 1 "no kubeconfigs found in $KUBE_DIR"; exit 1; fi
          KUBECONFIG=$(echo "$KUBECONFIGS" | gum choose --header "select kubeconfig:")
          if [ -z "$KUBECONFIG" ]; then gum style --foreground 3 "no selection"; exit 1; fi
        fi
        export KUBECONFIG

        NS="${NS:-crossplane-system}"

        # --- pick the ClusterStack (env: NAME=<name>) ---
        if [ -z "${NAME:-}" ]; then
          STACKS=$(kubectl get clusterstack -n "$NS" -o name 2>/dev/null | sed 's|.*/||' | sort)
          if [ -z "$STACKS" ]; then gum style --foreground 1 "no ClusterStacks in namespace $NS"; exit 1; fi
          NAME=$(echo "$STACKS" | gum choose --header "select ClusterStack to tear down:")
          if [ -z "$NAME" ]; then gum style --foreground 3 "no selection"; exit 1; fi
        fi
        if ! kubectl get clusterstack "$NAME" -n "$NS" >/dev/null 2>&1; then
          gum style --foreground 1 "ClusterStack $NAME not found in $NS"; exit 1
        fi

        # `|| true` on EVERY kubectl-into-pipe: kubectl exits non-zero when the
        # object (or its CRD) does not exist, and with `set -o pipefail` that
        # kills the whole task before it prints anything. Absence is the normal
        # case here — it is what the teardown is checking for.
        HAS_PLATFORM=$( { kubectl get platform "${NAME}-platform" -n "$NS" --no-headers 2>/dev/null || true; } | wc -l)

        # Matched on clusterStackRef FIRST and on the name only as a fallback:
        # the XR does not have to share the stack's name, and before
        # argocd-cluster v0.2.0 there was no ref to match on at all. `?` on
        # .items guards the case where the CRD is not installed.
        ARGOCD_XRS=$( { kubectl get argocdcluster -n "$NS" -o json 2>/dev/null || true; } \
          | jq -r --arg n "$NAME" '.items[]? | select(.spec.clusterStackRef == $n or .metadata.name == $n) | .metadata.name' 2>/dev/null | sort -u | tr '\n' ' ')
        ARGOCD_XRS=$(echo "$ARGOCD_XRS" | sed -e 's/[[:space:]]*$//')

        # Resolve a kubeconfig for the ArgoCD cluster NOW, while the XR still
        # exists -- after phase 0 the reference is gone. Chain:
        #   ArgocdCluster.spec.argocd.providerConfigRef
        #     -> ClusterProviderConfig.spec.credentials.secretRef
        #       -> Secret holding the kubeconfig
        # The XRD defaults providerConfigRef, but structural defaulting does not
        # fill fields inside an ABSENT spec.argocd -- so fall back by hand.
        #
        # ARGOCD_KUBECONFIG overrides all of this. The registrar identity is
        # deliberately narrow (clusterbookclusters + externalsecrets only), so a
        # fuller credential buys a fuller sweep; see the sweep below.
        # Vault coordinates for the kubeconfig, resolved NOW: after phase 2 the
        # ClusterStack is gone and with it spec.kubeconfig. The entry survives a
        # teardown unless something removes it, and a stale entry is not inert --
        # a rebuild under the same name finds it and reports SecretSynced with the
        # address of a destroyed VM (crossplane-configurations#262, measured on
        # argoplatform-test2 2026-08-19).
        VAULT_PC=$( { kubectl get clusterstack "$NAME" -n "$NS" -o jsonpath='{.spec.kubeconfig.providerConfigRef}' 2>/dev/null || true; } )
        VAULT_PATH=$( { kubectl get clusterstack "$NAME" -n "$NS" -o jsonpath='{.spec.kubeconfig.vaultPath}' 2>/dev/null || true; } )
        VAULT_PATH="${VAULT_PATH:-$NAME}"
        # Mirrors kubeconfigReadRef in xplane-cluster 0.9.0: the read side is
        # derived from the upload side unless stated. Keep the two in step.
        if [ -z "$VAULT_PC" ]; then
          VAULT_UP=$( { kubectl get clusterstack "$NAME" -n "$NS" -o jsonpath='{.spec.kubeconfig.vaultSecretName}' 2>/dev/null || true; } )
          case "${VAULT_UP:-vault}" in
            vault-infra) VAULT_PC="vault-kubeconfigs-infra" ;;
            *)           VAULT_PC="vault-kubeconfigs" ;;
          esac
        fi

        ARGOCD_KC=""
        ARGOCD_NS_REMOTE="argocd"
        if [ -n "${ARGOCD_KUBECONFIG:-}" ]; then
          if [ -f "$ARGOCD_KUBECONFIG" ]; then ARGOCD_KC="$ARGOCD_KUBECONFIG"; else
            gum style --foreground 3 "ARGOCD_KUBECONFIG=$ARGOCD_KUBECONFIG: file not found — falling back to the registrar"
          fi
        fi
        if [ -z "$ARGOCD_KC" ]; then
          PCREF=""
          for XR in $ARGOCD_XRS; do
            PCREF=$( { kubectl get argocdcluster "$XR" -n "$NS" -o jsonpath='{.spec.argocd.providerConfigRef}' 2>/dev/null || true; } )
            ANS=$( { kubectl get argocdcluster "$XR" -n "$NS" -o jsonpath='{.spec.argocd.namespace}' 2>/dev/null || true; } )
            if [ -n "$ANS" ]; then ARGOCD_NS_REMOTE="$ANS"; fi
            break
          done
          PCREF="${PCREF:-platform-sthings-registrar-kubernetes}"
          SREF=$( { kubectl get clusterproviderconfig.kubernetes.m.crossplane.io "$PCREF" -o json 2>/dev/null || true; } \
            | jq -r '.spec.credentials.secretRef | "\(.namespace) \(.name) \(.key)"' 2>/dev/null || true)
          if [ -n "$SREF" ] && [ "$SREF" != "null null null" ]; then
            SNS=$(echo "$SREF" | awk '{print $1}'); SNAME=$(echo "$SREF" | awk '{print $2}'); SKEY=$(echo "$SREF" | awk '{print $3}')
            CAND=$(mktemp)
            { kubectl get secret "$SNAME" -n "$SNS" -o jsonpath="{.data.$SKEY}" 2>/dev/null || true; } | base64 -d > "$CAND" 2>/dev/null || true
            if [ -s "$CAND" ]; then ARGOCD_KC="$CAND"; else rm -f "$CAND"; fi
          fi
        fi

        gum style --foreground 4 "→ teardown $NAME (namespace $NS)"
        echo "  argocd registration: $(if [ -z "$ARGOCD_XRS" ]; then echo "none — phase 0 is a no-op"; else echo "$ARGOCD_XRS"; fi)"
        echo "  platform child:  $(if [ "$HAS_PLATFORM" = "0" ]; then echo "none — phase 1 is a no-op"; else echo "present"; fi)"
        echo "  argocd sweep:    $(if [ -n "$ARGOCD_KC" ]; then if [ -n "${ARGOCD_KUBECONFIG:-}" ]; then echo "via ARGOCD_KUBECONFIG (full)"; else echo "via registrar (partial — see below)"; fi; else echo "unavailable — ArgoCD side will NOT be checked"; fi)"
        echo "  phase 0:         delete the ArgocdCluster XR, wait for deregistration"
        echo "  phase 1:         platformEnabled=false, wait for the Platform child to go"
        echo "  phase 2:         delete the ClusterStack"
        echo "  phase 3:         delete the kubeconfig in Vault ($VAULT_PC, path $VAULT_PATH)"
        echo
        echo "  THIS DESTROYS THE CLUSTER AND ITS VM."
        echo
        if [ "${YES:-}" = "1" ] || [ "${YES:-}" = "true" ]; then
          gum style --foreground 8 "  (YES=$YES — skipping confirmation)"
        else
          gum confirm "tear down $NAME?" || { gum style --foreground 3 "aborted"; exit 1; }
        fi

        # --- phase 0 ---
        if [ -z "$ARGOCD_XRS" ]; then
          gum style --foreground 8 "phase 0: no ArgocdCluster XR, skipping"
        else
          gum style --foreground 4 "phase 0: deregistering from ArgoCD"
          for XR in $ARGOCD_XRS; do
            kubectl delete argocdcluster "$XR" -n "$NS" --wait=false >/dev/null 2>&1 || true
          done
          i=0
          while [ "$i" -lt 30 ]; do
            LEFT=0
            for XR in $ARGOCD_XRS; do
              N=$( { kubectl get argocdcluster "$XR" -n "$NS" --no-headers 2>/dev/null || true; } | wc -l)
              LEFT=$((LEFT + N))
            done
            if [ "$LEFT" = "0" ]; then break; fi
            sleep 10
            i=$((i + 1))
          done
          if [ "$LEFT" != "0" ]; then
            gum style --foreground 1 "phase 0 did not finish in 5m — NOT continuing"
            gum style --foreground 8 "  the Usage from clusterStackRef would block phase 2 anyway; clearing it by force"
            gum style --foreground 8 "  would deregister nothing and leave the Applications behind."
            kubectl get argocdcluster -n "$NS" --no-headers 2>/dev/null | grep -E "$(echo "$ARGOCD_XRS" | tr ' ' '|')" || true
            exit 1
          fi
          gum style --foreground 2 "  ✓ deregistered"
        fi

        # --- phase 1 ---
        if [ "$HAS_PLATFORM" = "0" ]; then
          gum style --foreground 8 "phase 1: no Platform child, skipping"
        else
          gum style --foreground 4 "phase 1: removing the Platform child"
          kubectl patch clusterstack "$NAME" -n "$NS" --type=merge -p '{"spec":{"platformEnabled":false}}' >/dev/null
          i=0
          while [ "$i" -lt 60 ]; do
            LEFT=$( { kubectl get platform -n "$NS" --no-headers 2>/dev/null || true; } | grep -c "$NAME" || true)
            OWNED=$( { kubectl get object.kubernetes.m.crossplane.io,release.helm.m.crossplane.io -A --no-headers 2>/dev/null || true; } | grep -c "${NAME}-platform" || true)
            if [ "$LEFT" = "0" ] && [ "$OWNED" = "0" ]; then break; fi
            sleep 10
            i=$((i + 1))
          done
          if [ "$LEFT" != "0" ] || [ "$OWNED" != "0" ]; then
            gum style --foreground 1 "phase 1 did not finish in 10m — NOT deleting the stack"
            gum style --foreground 8 "  a stack deleted now would strand the Platform's resources, which is the whole point of phase 1"
            kubectl get platform,object.kubernetes.m.crossplane.io,release.helm.m.crossplane.io -A --no-headers 2>/dev/null | grep "$NAME" || true
            exit 1
          fi
          gum style --foreground 2 "  ✓ platform child gone"
        fi

        # --- phase 2 ---
        gum style --foreground 4 "phase 2: deleting the ClusterStack"
        kubectl delete clusterstack "$NAME" -n "$NS" --wait=false >/dev/null 2>&1 || true
        i=0
        while [ "$i" -lt 60 ]; do
          GONE=$( { kubectl get clusterstack "$NAME" -n "$NS" --no-headers 2>/dev/null || true; } | wc -l)
          if [ "$GONE" = "0" ]; then break; fi
          sleep 10
          i=$((i + 1))
        done
        sleep 15

        # --- leftover sweep -------------------------------------------------
        # Reported rather than assumed: a clean end state is the only evidence
        # that the ordering held, and it is cheap to check.
        gum style --foreground 4 "leftovers"
        FOUND=0
        for pair in \
          "objects:object.kubernetes.m.crossplane.io" \
          "releases:release.helm.m.crossplane.io" \
          "clusteraccess:clusteraccess" \
          "nativeproxmoxvm:nativeproxmoxvm" \
          "nativevspherevm:nativevspherevm" \
          "ansibleruns:ansiblerun" \
          "argocdclusters:argocdcluster" ; do
          LABEL="${pair%%:*}"; KIND="${pair#*:}"
          N=$( { kubectl get "$KIND" -A --no-headers 2>/dev/null || true; } | grep -c "$NAME" || true)
          printf "  %-18s %s\n" "$LABEL" "$N"
          if [ "$N" != "0" ]; then FOUND=1; fi
        done
        for pair in \
          "remotecluster:remoteclusters.kubeconfig.stuttgart-things.com" \
          "clusterproviderconfigs:clusterproviderconfigs.kubernetes.m.crossplane.io" ; do
          LABEL="${pair%%:*}"; KIND="${pair#*:}"
          N=$( { kubectl get "$KIND" --no-headers 2>/dev/null || true; } | grep -c "$NAME" || true)
          printf "  %-18s %s\n" "$LABEL" "$N"
          if [ "$N" != "0" ]; then FOUND=1; fi
        done


        # --- ArgoCD side ----------------------------------------------------
        # Everything above lives on the MANAGEMENT cluster. The registration
        # leaves objects on the ARGOCD cluster too, and on 2026-08-19 those had
        # to be found by hand after a teardown that reported "clean" here.
        #
        # What the registrar identity may read is narrow by design
        # (clusterbookclusters cluster-wide, externalsecrets in the argocd
        # namespace) -- exactly the two objects the ArgocdCluster XR composes.
        # It may NOT list applications, appprojects or secrets, so the generated
        # Applications and the per-cluster AppProject stay invisible unless a
        # fuller credential is supplied via ARGOCD_KUBECONFIG.
        #
        # Whatever is not checked is SAID so. A sweep that stays silent about
        # its blind spot reads as "nothing there", which is how the leftovers
        # went unnoticed in the first place.
        ARGOCD_UNCHECKED=""
        if [ -z "$ARGOCD_KC" ]; then
          gum style --foreground 3 "argocd side: NOT CHECKED (no kubeconfig could be resolved)"
          gum style --foreground 8 "  pass ARGOCD_KUBECONFIG=<path> to sweep it"
          ARGOCD_UNCHECKED="all"
        else
          gum style --foreground 4 "argocd side"
          for pair in \
            "clusterbookcluster:clusterbookclusters" \
            "externalsecret:externalsecrets" ; do
            LABEL="${pair%%:*}"; KIND="${pair#*:}"
            if [ "$KIND" = "externalsecrets" ]; then
              N=$( { KUBECONFIG="$ARGOCD_KC" kubectl get "$KIND" -n "$ARGOCD_NS_REMOTE" --no-headers --request-timeout=20s 2>/dev/null || true; } | grep -c "$NAME" || true)
            else
              N=$( { KUBECONFIG="$ARGOCD_KC" kubectl get "$KIND" --no-headers --request-timeout=20s 2>/dev/null || true; } | grep -c "$NAME" || true)
            fi
            printf "  %-18s %s\n" "$LABEL" "$N"
            if [ "$N" != "0" ]; then FOUND=1; fi
          done
          # Only reachable with a fuller credential; skipped rather than faked.
          for pair in \
            "applications:applications.argoproj.io" \
            "appprojects:appprojects.argoproj.io" \
            "cluster-secrets:secrets" ; do
            LABEL="${pair%%:*}"; KIND="${pair#*:}"
            if KUBECONFIG="$ARGOCD_KC" kubectl auth can-i list "$KIND" -n "$ARGOCD_NS_REMOTE" --request-timeout=20s >/dev/null 2>&1; then
              N=$( { KUBECONFIG="$ARGOCD_KC" kubectl get "$KIND" -n "$ARGOCD_NS_REMOTE" --no-headers --request-timeout=20s 2>/dev/null || true; } | grep -c "$NAME" || true)
              printf "  %-18s %s\n" "$LABEL" "$N"
              if [ "$N" != "0" ]; then FOUND=1; fi
            else
              printf "  %-18s not checked (RBAC)\n" "$LABEL"
              ARGOCD_UNCHECKED="${ARGOCD_UNCHECKED}${LABEL} "
            fi
          done
        fi

        echo
        if [ -n "$ARGOCD_UNCHECKED" ]; then
          gum style --foreground 3 "⚠ argocd side only partly checked: ${ARGOCD_UNCHECKED}"
          gum style --foreground 8 "  Applications generated by AppSets and the per-cluster AppProject can outlive"
          gum style --foreground 8 "  a deregistration -- an Application from an AppSet with"
          gum style --foreground 8 "  preserveResourcesOnDeletion: true has no ownerReference and is never collected,"
          gum style --foreground 8 "  and it then blocks proj-<cluster> from finalizing (stuttgart-things/argocd#320)."
          gum style --foreground 8 "  Check by hand against the ArgoCD cluster:"
          gum style --foreground 8 "    kubectl get application,appproject -n $ARGOCD_NS_REMOTE | grep $NAME"
        fi
        if [ "$FOUND" = "0" ] && [ -z "$ARGOCD_UNCHECKED" ]; then
          gum style --foreground 2 --bold "✓ teardown clean — no leftovers"
        elif [ "$FOUND" = "0" ]; then
          gum style --foreground 2 --bold "✓ no leftovers in what was checked"
        else
          gum style --foreground 3 --bold "⚠ leftovers remain"
          gum style --foreground 8 "  Clear anything wedged on a finalizer with:"
          gum style --foreground 8 "    kubectl patch <resource> -n $NS --type=merge -p '{\"metadata\":{\"finalizers\":[]}}'"
          gum style --foreground 8 "  and report it on crossplane-configurations#185 — a clean two-phase teardown is the expectation."
        fi

        if [ -n "$ARGOCD_KC" ] && [ "$ARGOCD_KC" != "${ARGOCD_KUBECONFIG:-}" ]; then rm -f "$ARGOCD_KC"; fi

        # --- phase 3: the kubeconfig in Vault -------------------------------
        # LAST, and only after a clean sweep. If anything above failed, the Vault
        # entry may be the only remaining way into the cluster -- removing it then
        # would turn a recoverable teardown into an unrecoverable one.
        #
        # KVv2 `delete`, not `destroy`: marks the current version deleted and keeps
        # the metadata. That takes the stale entry away from a rebuild under the
        # same name -- which is the actual damage, see #262 -- while leaving a
        # trace of which cluster existed when. `destroy` is the more thorough
        # choice for a credential and remains a deliberate follow-up, not a
        # silent default.
        if [ "$FOUND" != "0" ]; then
          gum style --foreground 3 "phase 3: skipped — leftovers remain, keeping the Vault entry as a way back in"
        elif [ -z "$VAULT_PC" ]; then
          gum style --foreground 3 "phase 3: skipped — no Vault ClusterProviderConfig resolved"
        else
          gum style --foreground 4 "phase 3: deleting the kubeconfig in Vault"
          VJ=$( { kubectl get clusterproviderconfigs.kubeconfig.stuttgart-things.com "$VAULT_PC" -o json 2>/dev/null || true; } )
          VADDR=$(echo "$VJ" | jq -r '.spec.vault.address // ""')
          VMOUNT=$(echo "$VJ" | jq -r '.spec.vault.mountPath // ""')
          VROLE=$(echo "$VJ" | jq -r '.spec.vault.auth.appRole.roleId // ""')
          VAPATH=$(echo "$VJ" | jq -r '.spec.vault.auth.appRole.mountPath // "approle"')
          VSNS=$(echo "$VJ" | jq -r '.spec.vault.auth.appRole.secretRef.namespace // ""')
          VSNAME=$(echo "$VJ" | jq -r '.spec.vault.auth.appRole.secretRef.name // ""')
          if [ -z "$VADDR" ] || [ -z "$VMOUNT" ] || [ -z "$VROLE" ] || [ -z "$VSNAME" ]; then
            gum style --foreground 3 "  skipped — $VAULT_PC did not yield address/mount/approle"
          else
            VSID=$( { kubectl get secret "$VSNAME" -n "$VSNS" -o json 2>/dev/null || true; } \
              | jq -r '.data // {} | to_entries[0].value // ""' | base64 -d 2>/dev/null | tr -d '[:space:]')
            if [ -z "$VSID" ]; then
              gum style --foreground 3 "  skipped — secret $VSNS/$VSNAME held no secret_id"
            else
              VTOK=$(curl -sk -X POST "$VADDR/v1/auth/$VAPATH/login" \
                -d "{\"role_id\":\"$VROLE\",\"secret_id\":\"$VSID\"}" | jq -r '.auth.client_token // ""')
              if [ -z "$VTOK" ]; then
                gum style --foreground 1 "  AppRole login against $VADDR failed — entry NOT removed"
              else
                VCODE=$(curl -sk -o /dev/null -w '%{http_code}' -X DELETE \
                  -H "X-Vault-Token: $VTOK" "$VADDR/v1/$VMOUNT/data/$VAULT_PATH")
                case "$VCODE" in
                  2*) gum style --foreground 2 "  ✓ $VMOUNT/$VAULT_PATH deleted (current version)" ;;
                  404) gum style --foreground 8 "  nothing to delete at $VMOUNT/$VAULT_PATH" ;;
                  *)  gum style --foreground 1 "  DELETE returned HTTP $VCODE — entry may still be there" ;;
                esac
              fi
            fi
          fi
        fi

  pre-commit:
    desc: Run pre-commit hooks across the repo (via the Dagger linting module)
    silent: true
    cmds:
      - |
        set -euo pipefail

        DAGGER_MOD_LINTING="${DAGGER_MOD_LINTING:-github.com/stuttgart-things/dagger/linting@v0.115.0}"
        OUT="${OUT:-/tmp/pre-commit-findings.txt}"

        gum style --foreground 4 "→ pre-commit (dagger)"
        echo "  dagger mod:  $DAGGER_MOD_LINTING"
        echo "  output:      $OUT"
        echo

        dagger --progress plain call -m "$DAGGER_MOD_LINTING" run-pre-commit \
          --src . \
          export --path "$OUT"

        echo
        gum style --foreground 8 "── findings ────────────────────────────────────"
        cat "$OUT"
        gum style --foreground 8 "────────────────────────────────────────────────"
        echo

        # The dagger function captures all output with `|| true` and always
        # exits 0, so we have to read the text to decide pass/fail.
        # pre-commit prints `<hook>...Failed` per failing hook.
        if grep -qE '\.\.\.+Failed$' "$OUT"; then
          gum style --foreground 1 --bold "✗ pre-commit hooks failed"
          exit 1
        fi
        gum style --foreground 2 --bold "✓ pre-commit passed"

  verify:
    desc: "Verify a Configuration package + each example XR via Dagger (non-interactive: CONFIG=k8s/<name> task verify)"
    silent: true
    cmds:
      - |
        set -euo pipefail

        # --- pick configuration (env: CONFIG=<path>, e.g. k8s/namespace) ---
        if [ -n "${CONFIG:-}" ]; then
          [ -f "$CONFIG/crossplane.yaml" ] || { gum style --foreground 1 "CONFIG=$CONFIG: missing $CONFIG/crossplane.yaml"; exit 1; }
        else
          CONFIGS=$(find . -type f -name crossplane.yaml -not -path './.git/*' \
            | sed -e 's|/crossplane.yaml$||' -e 's|^\./||' \
            | sort)
          [ -n "$CONFIGS" ] || { gum style --foreground 1 "no configurations"; exit 1; }
          CONFIG=$(echo "$CONFIGS" | gum choose --header "select configuration to verify:")
          [ -n "$CONFIG" ] || { gum style --foreground 3 "no selection"; exit 1; }
        fi

        META="$CONFIG/crossplane.yaml"

        # --- sniff provider-kubernetes floor from dependsOn ---
        # Layer 2 of `verify` validates rendered Object resources against the
        # provider-kubernetes CRD schemas at this version. Falls back to the
        # module's own default if the Configuration doesn't pin one.
        PROV_VER=$(yq -r '
          .spec.dependsOn[]
          | select(.provider == "xpkg.crossplane.io/crossplane-contrib/provider-kubernetes")
          | .version
          | capture("(?P<v>v[0-9]+\\.[0-9]+\\.[0-9]+)").v
        ' "$META" 2>/dev/null | head -n1)
        [ -z "$PROV_VER" ] && PROV_VER="v1.2.0"

        # Keep in step with CI (.github/workflows/verify.yaml). v0.115.0 ran
        # `crossplane render` WITHOUT --extra-resources, so every Configuration
        # whose Composition selects an EnvironmentConfig failed locally with
        #   cannot process environment config "environment-config-0" by
        #   selector: expected exactly one required resource, got 0
        # while the same Configuration was green in CI — which reads as a
        # problem with the Configuration, not with the pin.
        DAGGER_MOD="${DAGGER_MOD:-github.com/stuttgart-things/dagger/crossplane@v0.118.1}"

        gum style --foreground 4 "→ verify $CONFIG"
        echo "  provider-kubernetes: $PROV_VER"
        echo "  dagger mod:          $DAGGER_MOD"
        echo

        dagger call -m "$DAGGER_MOD" verify \
          --src "$CONFIG" \
          --provider-kubernetes-version "$PROV_VER" \
          --progress plain

  push:
    desc: "Build and push a Configuration to an OCI registry via Dagger (non-interactive: CONFIG=k8s/<name> BUMP=patch|minor|major|vX.Y.Z YES=1 task push)"
    silent: true
    cmds:
      - |
        set -euo pipefail

        # --- pick configuration (env: CONFIG=<path>, e.g. k8s/namespace) ---
        if [ -n "${CONFIG:-}" ]; then
          [ -f "$CONFIG/crossplane.yaml" ] || { gum style --foreground 1 "CONFIG=$CONFIG: missing $CONFIG/crossplane.yaml"; exit 1; }
        else
          CONFIGS=$(find . -type f -name crossplane.yaml -not -path './.git/*' \
            | sed -e 's|/crossplane.yaml$||' -e 's|^\./||' \
            | sort)
          [ -n "$CONFIGS" ] || { gum style --foreground 1 "no configurations"; exit 1; }
          CONFIG=$(echo "$CONFIGS" | gum choose --header "select configuration to push:")
          [ -n "$CONFIG" ] || { gum style --foreground 3 "no selection"; exit 1; }
        fi

        META="$CONFIG/crossplane.yaml"
        PKG_NAME=$(yq -r '.metadata.name' "$META")
        CURRENT=$(yq -r '.metadata.annotations."meta.crossplane.io/version" // "v0.0.0"' "$META")

        # --- compute bump candidates ---
        NUM=${CURRENT#v}
        MAJ=$(echo "$NUM" | cut -d. -f1)
        MIN=$(echo "$NUM" | cut -d. -f2)
        PAT=$(echo "$NUM" | cut -d. -f3)
        V_PATCH="v$MAJ.$MIN.$((PAT+1))"
        V_MINOR="v$MAJ.$((MIN+1)).0"
        V_MAJOR="v$((MAJ+1)).0.0"

        # --- pick bump (env: BUMP=patch|minor|major|custom|vX.Y.Z; for custom, VERSION=vX.Y.Z) ---
        if [ -n "${BUMP:-}" ]; then
          case "$BUMP" in
            patch)   NEW="$V_PATCH" ;;
            minor)   NEW="$V_MINOR" ;;
            major)   NEW="$V_MAJOR" ;;
            custom)  [ -n "${VERSION:-}" ] || { gum style --foreground 1 "BUMP=custom requires VERSION=vX.Y.Z"; exit 1; }
                     NEW="$VERSION" ;;
            v[0-9]*) NEW="$BUMP" ;;
            *) gum style --foreground 1 "BUMP=$BUMP not one of: patch|minor|major|custom|vX.Y.Z"; exit 1 ;;
          esac
        else
          BUMP=$(printf "patch  →  %s\nminor  →  %s\nmajor  →  %s\ncustom" \
            "$V_PATCH" "$V_MINOR" "$V_MAJOR" \
            | gum choose --header "current: $CURRENT — bump:")
          [ -n "$BUMP" ] || { gum style --foreground 3 "no selection"; exit 1; }
          case "$BUMP" in
            patch*)  NEW="$V_PATCH" ;;
            minor*)  NEW="$V_MINOR" ;;
            major*)  NEW="$V_MAJOR" ;;
            custom)  NEW=$(gum input --header "version (with leading v):" --value "$V_PATCH")
                     [ -n "$NEW" ] || { gum style --foreground 3 "no version"; exit 1; } ;;
          esac
        fi

        # --- auth ---
        REGISTRY="${REGISTRY:-ghcr.io}"
        USERNAME="${USERNAME:-stuttgart-things}"
        PASSWORD_ENV="${PASSWORD_ENV:-GITHUB_TOKEN}"
        if [ -z "${!PASSWORD_ENV:-}" ]; then
          if [ "${YES:-}" = "1" ] || [ "${YES:-}" = "true" ]; then
            gum style --foreground 1 "\$$PASSWORD_ENV is not set (YES=$YES — refusing to prompt)"
            exit 1
          fi
          gum style --foreground 3 "\$$PASSWORD_ENV is not set — prompting"
          TOKEN=$(gum input --password --header "enter $PASSWORD_ENV:")
          [ -n "$TOKEN" ] || { gum style --foreground 1 "no token entered"; exit 1; }
          export "$PASSWORD_ENV=$TOKEN"
        fi

        PREFIX="${PREFIX-crossplane-configurations}"
        if [ -n "$PREFIX" ]; then
          DESTINATION="$REGISTRY/$USERNAME/$PREFIX/$PKG_NAME:$NEW"
        else
          DESTINATION="$REGISTRY/$USERNAME/$PKG_NAME:$NEW"
        fi
        DAGGER_MOD="${DAGGER_MOD:-github.com/stuttgart-things/dagger/crossplane}"

        # --- plan + confirm ---
        gum style --foreground 4 "→ push $CONFIG"
        echo "  package:     $PKG_NAME"
        echo "  current:     $CURRENT"
        echo "  new:         $NEW"
        echo "  destination: $DESTINATION"
        echo "  registry:    $REGISTRY"
        echo "  username:    $USERNAME"
        echo "  password:    \$$PASSWORD_ENV (set)"
        echo "  dagger mod:  $DAGGER_MOD"
        echo
        if [ "${YES:-}" = "1" ] || [ "${YES:-}" = "true" ]; then
          gum style --foreground 8 "  (YES=$YES — skipping confirmation)"
        else
          gum confirm "push?" || { gum style --foreground 3 "aborted"; exit 1; }
        fi

        # --- redaction ---
        # `--progress plain` echoes every DAG op's ARGUMENTS, and the crossplane
        # module writes the registry credential into /root/.docker/config.json
        # with withNewFile — so base64("<user>:<token>") lands in the progress
        # log verbatim. That leaked a live PAT into two session transcripts.
        #
        # We keep plain progress (it is what makes a failing push debuggable —
        # see the stale SSH_AUTH_SOCK hunt) and scrub the value instead.
        #
        # Value-based rules come FIRST and matter most: the secret is known at
        # runtime, so redacting the literal and its base64 forms catches any leak
        # path regardless of how dagger or the module happens to format it. The
        # pattern rules after them are a fallback for shapes we did not predict.
        #
        # Built with printf into a newline-separated sed script — no bash arrays
        # (task runs mvdan/sh) and no literal newline in this block scalar.
        sed_esc() { printf '%s' "$1" | sed -e 's/[][\.*^$/&]/\\&/g'; }
        add_rule() { REDACT=$(printf '%s\n%s' "$REDACT" "$1"); }

        SECRET="${!PASSWORD_ENV:-}"
        REDACT=""
        if [ -n "$SECRET" ]; then
          # The literal token, and the two base64 encodings a docker config or an
          # Authorization header would carry. An empty pattern would make sed
          # reuse the PREVIOUS regex, hence the non-empty guards throughout.
          add_rule "s/$(sed_esc "$SECRET")/<redacted>/g"
          B64_PAIR=$(printf '%s:%s' "$USERNAME" "$SECRET" | base64 -w0 2>/dev/null || true)
          if [ -n "$B64_PAIR" ]; then add_rule "s/$(sed_esc "$B64_PAIR")/<redacted>/g"; fi
          B64_TOK=$(printf '%s' "$SECRET" | base64 -w0 2>/dev/null || true)
          if [ -n "$B64_TOK" ]; then add_rule "s/$(sed_esc "$B64_TOK")/<redacted>/g"; fi
        fi
        # Fallbacks: docker-config auth fields (escaped and unescaped) and bare
        # GitHub token shapes, in case a secret we did NOT pass shows up.
        add_rule 's/(\\"auth\\"[[:space:]]*:[[:space:]]*\\")[^\\]*/\1<redacted>/g'
        add_rule 's/("auth"[[:space:]]*:[[:space:]]*")[^"]*/\1<redacted>/g'
        add_rule 's/gh[pousr]_[A-Za-z0-9]{20,}/<redacted>/g'
        add_rule 's/github_pat_[A-Za-z0-9_]{20,}/<redacted>/g'

        # --- push ---
        # 2>&1 so stderr is scrubbed too. `set -o pipefail` (top of this script)
        # is what preserves dagger's exit code through the pipe — without it a
        # failed push would report success.
        dagger call -m "$DAGGER_MOD" push \
          --src "$CONFIG" \
          --registry "$REGISTRY" \
          --username "$USERNAME" \
          --password "env:$PASSWORD_ENV" \
          --destination "$DESTINATION" \
          --progress plain 2>&1 | sed -E "$REDACT"

        # --- bump annotation in crossplane.yaml ---
        yq -i ".metadata.annotations.\"meta.crossplane.io/version\" = \"$NEW\"" "$META"
        gum style --foreground 2 --bold "✓ pushed $DESTINATION"
        gum style --foreground 8 "  updated $META → meta.crossplane.io/version: $NEW  (don't forget to commit)"

        # --- ghcr visibility check ---
        # New ghcr.io packages default to private. Crossplane pulls anonymously
        # and will hit "UNAUTHORIZED: authentication required" on install until
        # the package visibility is flipped to Public. There is no REST API
        # endpoint to change container-package visibility for org packages —
        # only the web UI — so the best we can do here is detect and remind.
        if [ "$REGISTRY" = "ghcr.io" ] && command -v gh >/dev/null 2>&1; then
          PKG_PATH="$(printf '%s' "${PREFIX:-}" | sed 's|/|%2F|g')$([ -n "${PREFIX:-}" ] && printf '%%2F')$PKG_NAME"
          VIS=$(gh api "/orgs/$USERNAME/packages/container/$PKG_PATH" --jq '.visibility' 2>/dev/null || echo "")
          OWNER_KIND=orgs
          if [ -z "$VIS" ]; then
            VIS=$(gh api "/users/$USERNAME/packages/container/$PKG_PATH" --jq '.visibility' 2>/dev/null || echo "")
            OWNER_KIND=users
          fi
          SETTINGS_URL="https://github.com/$OWNER_KIND/$USERNAME/packages/container/$PKG_PATH/settings"
          echo
          case "$VIS" in
            public)
              gum style --foreground 2 "✓ ghcr visibility: public — Crossplane can pull anonymously"
              ;;
            private)
              gum style --foreground 3 --bold "⚠ ghcr visibility: PRIVATE — Crossplane will fail to install this package"
              gum style --foreground 8 "  Flip to Public (UI-only):"
              gum style --foreground 4 "    $SETTINGS_URL"
              gum style --foreground 8 "  → Danger Zone → Change visibility → Public → type the package name to confirm"
              ;;
            *)
              gum style --foreground 3 "ℹ ghcr visibility: unknown (gh api 404 / unauthenticated)"
              gum style --foreground 8 "  Check at $SETTINGS_URL"
              ;;
          esac
        fi

  push-dev:
    desc: "Build and push a Configuration to ttl.sh for dev iteration (non-interactive: CONFIG=k8s/<name> [TTL=1h] [TTL_PREFIX=...] task push-dev)"
    silent: true
    cmds:
      - |
        set -euo pipefail

        # ttl.sh accepts anonymous pushes and serves the image publicly for a
        # bounded TTL (the tag IS the TTL — `:1h`, `:24h`, etc.). Use it for
        # try-it-on-a-cluster dev iteration; use `task push` for canonical
        # ghcr.io releases. No version bump, no annotation write, no visibility
        # check — every push is throw-away.

        # --- pick configuration (env: CONFIG=<path>, e.g. k8s/namespace) ---
        if [ -n "${CONFIG:-}" ]; then
          [ -f "$CONFIG/crossplane.yaml" ] || { gum style --foreground 1 "CONFIG=$CONFIG: missing $CONFIG/crossplane.yaml"; exit 1; }
        else
          CONFIGS=$(find . -type f -name crossplane.yaml -not -path './.git/*' \
            | sed -e 's|/crossplane.yaml$||' -e 's|^\./||' \
            | sort)
          [ -n "$CONFIGS" ] || { gum style --foreground 1 "no configurations"; exit 1; }
          CONFIG=$(echo "$CONFIGS" | gum choose --header "select configuration to dev-push:")
          [ -n "$CONFIG" ] || { gum style --foreground 3 "no selection"; exit 1; }
        fi

        META="$CONFIG/crossplane.yaml"
        PKG_NAME=$(yq -r '.metadata.name' "$META")

        # --- destination (env: TTL=1h|24h|…, TTL_PREFIX=<user>/<scope>) ---
        TTL="${TTL:-1h}"
        TTL_PREFIX="${TTL_PREFIX:-$(whoami)/crossplane-configurations}"
        DESTINATION="ttl.sh/$TTL_PREFIX/$PKG_NAME:$TTL"

        DAGGER_MOD="${DAGGER_MOD:-github.com/stuttgart-things/dagger/crossplane}"

        gum style --foreground 4 "→ push-dev $CONFIG"
        echo "  package:     $PKG_NAME"
        echo "  destination: $DESTINATION"
        echo "  TTL:         $TTL  (image auto-deleted after this duration)"
        echo "  dagger mod:  $DAGGER_MOD"
        echo

        # --- push via dagger crossplane module ---
        # ttl.sh accepts anonymous, but the dagger Push function expects a
        # *Secret password — pass a harmless env reference; the resulting
        # docker-config blob is ignored by ttl.sh.
        #
        # No output redaction here, unlike `push`: the only credential in play is
        # the literal string "anonymous", so there is nothing for
        # `--progress plain` to leak.
        TTLSH_DUMMY_PASS=anonymous
        export TTLSH_DUMMY_PASS

        dagger call -m "$DAGGER_MOD" push \
          --src "$CONFIG" \
          --registry "ttl.sh" \
          --username "anonymous" \
          --password "env:TTLSH_DUMMY_PASS" \
          --destination "$DESTINATION" \
          --progress plain

        echo
        gum style --foreground 2 --bold "✓ pushed $DESTINATION"
        echo
        gum style --foreground 4 "Install on a test cluster:"
        cat <<EOF
        kubectl apply -f - <<MANIFEST
        ---
        apiVersion: pkg.crossplane.io/v1
        kind: Configuration
        metadata:
          name: $PKG_NAME-dev
        spec:
          package: $DESTINATION
        MANIFEST
        EOF
        echo
        gum style --foreground 8 "  (the Configuration name suffix '-dev' avoids clashing with a canonical $PKG_NAME install)"
