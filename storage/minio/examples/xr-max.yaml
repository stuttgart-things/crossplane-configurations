---
# Every field set, including the ones the XRD defaults — `crossplane render`
# applies no defaults (CLAUDE.md gotcha 5), so an example that relies on one
# silently exercises the wrong path.
apiVersion: storage.stuttgart-things.com/v1alpha1
kind: MinioBucket
metadata:
  name: schmetterpause-cnpg
spec:
  providerConfigRef:
    name: minio
  bucketName: schmetterpause-cnpg
  region: us-east-1
  deletionPolicy: DeleteIfEmpty
  bucketPolicy: |
    {"Version":"2012-10-17","Statement":[{"Effect":"Deny","Principal":{"AWS":["*"]},"Action":["s3:DeleteBucket"],"Resource":["arn:aws:s3:::schmetterpause-cnpg"]}]}
  access:
    # The database archives here; a reader-writer scoped to this bucket.
    - name: backup
      scope: bucket
      user: true
      connectionSecret:
        name: schmetterpause-cnpg-backup
        namespace: schmetterpause
    # A read-only auditor, raw because `bucket` scope always allows writes.
    - name: auditor
      scope: custom
      user: true
      rawPolicy: |
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:ListBucket"],"Resource":["arn:aws:s3:::schmetterpause-cnpg","arn:aws:s3:::schmetterpause-cnpg/*"]}]}
    # Policy without a user: attached to an identity that exists elsewhere.
    - name: oidc
      scope: bucket
      user: false
