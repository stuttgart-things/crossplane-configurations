# Cluster precondition. provider-minio is a pre-v2 provider: its ProviderConfig
# is cluster-scoped, and the referenced Secret holds the keys it drives the
# instance with — `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY`, the shape the
# provider expects.
#
# NOT the MinIO root account: `crossplane-minio-policy.json` next to this file
# is the exact permission set this Configuration needs, measured on a lab MinIO
# — create AND delete of buckets, policies and users all succeed with it, and
# nothing else does. Create the user once per instance (see the README), keep
# its keys in Vault, and let the cluster get them from there.
apiVersion: minio.crossplane.io/v1
kind: ProviderConfig
metadata:
  name: minio
spec:
  minioURL: https://artifacts.platform.sthings-vsphere.labul.sva.de
  credentials:
    apiSecretRef:
      name: minio-crossplane
      namespace: crossplane-system
