---
apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: zitadel-oidc-client
  annotations:
    # Local convention used by `task push` to bump and re-publish.
    # Not a Crossplane-standard field — the true package version is the OCI tag.
    meta.crossplane.io/version: v0.1.0
    meta.crossplane.io/maintainer: patrick.hermann@sva.de
    meta.crossplane.io/source: github.com/stuttgart-things/crossplane-configurations
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      One ZITADEL OIDC client in an existing project, from a namespaced
      `ZitadelOidcClient` XR: an OpenTofu Workspace runs the `oidc-app` module
      of zitadel-base-setup, and its client ID and secret are written to a
      Vault KV entry by provider-vault, for ESO on the target cluster.
    meta.crossplane.io/readme: |
      # zitadel-oidc-client

      A Crossplane v2 Configuration that creates ONE ZITADEL OIDC app — e.g.
      the Argo CD login of one cluster — in a project that already exists, and
      writes its client ID and secret to Vault.

      - `opentofu.m.upbound.io/v1beta1` Workspace, inline root, module
        `zitadel-base-setup//modules/oidc-app` pinned by tag. The project,
        its roles and its user grants stay in the lab root a person applies.
      - `kv.vault.m.upbound.io/v1alpha1` SecretV2 (optional `spec.vault`),
        fed from the Workspace's connection Secret via `dataJsonSecretRef` —
        the credentials never appear in an MR spec or the XR.
      - `releaseOnDelete: true` (default) composes both WITHOUT the Delete
        policy: a recreated app gets a new client ID and secret, and every
        login using the old ones breaks.

      ## Cluster preconditions

      - provider-opentofu with a `ClusterProviderConfig` (`spec.providerConfigRef`,
        default `default`); its backend holds the Workspace state.
      - A Secret in the XR's namespace (`spec.zitadel.credentialsSecretRef`,
        default `zitadel-terraform` / `terraform.tfvars`) holding
        `jwt_profile_json = "<machine key JSON>"` for a ZITADEL machine user
        that may manage the project's apps and read orgs and projects.
      - With `spec.vault`: provider-vault and a `vault.m.upbound.io`
        ClusterProviderConfig (default `vault`) that may write the entry.
        Its policy decides `path`: `<mount>/data/+` allows one segment only.
      - The provider-opentofu pod must trust ZITADEL's CA (e.g. the
        trust-manager `cluster-trust-bundle` mounted via its
        DeploymentRuntimeConfig); a lab CA otherwise fails the handshake.
spec:
  crossplane:
    version: ">=v2.1.3"
  dependsOn:
    # provider-opentofu and provider-vault are published only on the Upbound mirror.
    - provider: xpkg.upbound.io/upbound/provider-opentofu
      version: ">=v1.0.3,<v2.0.0"
    - provider: xpkg.upbound.io/upbound/provider-vault
      version: ">=v4.0.4,<v5.0.0"
    - function: xpkg.crossplane.io/crossplane-contrib/function-go-templating
      version: ">=v0.12.1,<v0.13.0"
    - function: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      version: ">=v0.6.5,<v0.7.0"
