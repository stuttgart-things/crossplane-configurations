# Every spec field set, including those with defaults (render applies no XRD
# defaults, CLAUDE.md gotcha 5): a public browser client (Kargo-style, PKCE,
# no secret) with every app option, a ProviderConfig instead of the cluster
# default, custom Vault keys and releaseOnDelete off.
apiVersion: zitadel.stuttgart-things.com/v1alpha1
kind: ZitadelOidcClient
metadata:
  name: kargo-cluster1
  namespace: default
spec:
  providerConfigRef:
    name: zitadel
    kind: ProviderConfig
  zitadel:
    domain: zitadel.example.com
    orgName: ZITADEL
    credentialsSecretRef:
      name: zitadel-machine-key
      key: zitadel.tfvars
  project: argocd
  app:
    name: kargo-cluster1
    redirectUris:
      - https://kargo.cluster1.example.com/login
    postLogoutRedirectUris:
      - https://kargo.cluster1.example.com/
    appType: OIDC_APP_TYPE_USER_AGENT
    authMethodType: OIDC_AUTH_METHOD_TYPE_NONE
    grantTypes:
      - OIDC_GRANT_TYPE_AUTHORIZATION_CODE
      - OIDC_GRANT_TYPE_REFRESH_TOKEN
    responseTypes:
      - OIDC_RESPONSE_TYPE_CODE
    accessTokenType: OIDC_TOKEN_TYPE_JWT
    accessTokenRoleAssertion: true
    idTokenRoleAssertion: true
    idTokenUserinfoAssertion: false
    devMode: false
  vault:
    providerConfigRef:
      name: vault-labul
      kind: ClusterProviderConfig
    mount: kv
    path: cluster1/kargo-oidc
    clientIdKey: clientID
    clientSecretKey: clientSecret
  releaseOnDelete: false
