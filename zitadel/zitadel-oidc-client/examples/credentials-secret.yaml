# Precondition: the ZITADEL machine key as a tfvars file, in the XR's own
# namespace. The value below is a placeholder — create the real Secret from the
# machine key JSON (never commit it):
#
#   kubectl -n default create secret generic zitadel-terraform \
#     --from-literal=terraform.tfvars="jwt_profile_json = $(jq -c . key.json | jq -R .)"
#
# The machine user needs rights on the target project's apps and read access
# to orgs and projects (the module looks both up by name).
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-terraform
  namespace: default
type: Opaque
stringData:
  terraform.tfvars: | # pragma: allowlist secret
    jwt_profile_json = "{\"type\":\"serviceaccount\",\"keyId\":\"REPLACE\",\"key\":\"REPLACE\",\"userId\":\"REPLACE\"}"
