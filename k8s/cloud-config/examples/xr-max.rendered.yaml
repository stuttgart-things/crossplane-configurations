---
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: CloudInit
metadata:
  name: max-vm
  namespace: default
status:
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: max-cloud-init, max-namespace'
    reason: Creating
    status: "False"
    type: Ready
  secretName: max-cloud-init
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: max-cloud-init
  generateName: max-vm-
  labels:
    app.kubernetes.io/instance: max-cloud-init
    app.kubernetes.io/managed-by: crossplane
    app.kubernetes.io/name: harvester-cloud-init
    crossplane.io/composite: max-vm
  namespace: default
  ownerReferences:
  - apiVersion: resources.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: CloudInit
    name: max-vm
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        annotations:
          gotemplating.fn.crossplane.io/composition-resource-name: cloud-init
        name: max-cloud-init
        namespace: vms
      stringData:
        networkdata: |2

          version: 2
          ethernets:
            enp1s0:
              dhcp4: true
              dhcp6: false
            enp2s0:
              addresses:
                - 10.0.0.42/24
              gateway4: 10.0.0.1
              nameservers:
                addresses:
                  - 1.1.1.1
                  - 8.8.8.8
        userdata: "#cloud-config\nhostname: max\nfqdn: max.example.com\nmanage_etc_hosts:
          true\ntimezone: Europe/Berlin\nusers:\n  - name: ubuntu\n    ssh_authorized_keys:\n
          \     - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAAB... ubuntu@max\n    sudo: ALL=(ALL)
          NOPASSWD:ALL\n    groups: sudo,docker\n    shell: /bin/bash\n    lock_passwd:
          true\n  - name: admin\n    sudo: ALL=(ALL) NOPASSWD:ALL\n    groups: sudo\n
          \   shell: /bin/bash\n    lock_passwd: false\nchpasswd:\n  list: |\n    admin:$6$rounds=4096$saltsalt$hashhash\n
          \ expire: false\npackages:\n  - curl\n  - wget\n  - git\n  - jq\n  - htop\nwrite_files:\n
          \ - path: /etc/motd\n    content: |\n      Welcome to max-vm — provisioned
          via Crossplane CloudInit.\n      \n    owner: root:root\n    permissions:
          '0644'\n  - path: /etc/profile.d/99-prompt.sh\n    content: |\n      export
          PS1='\\u@\\h:\\w\\$ '\n      \n    owner: root:root\n    permissions: '0755'\nruncmd:\n
          \ - systemctl enable docker\n  - systemctl start docker\n  - usermod -aG
          docker ubuntu\n\npackage_update: true\npackage_upgrade: true\nbootcmd:\n
          \ - echo \"boot stage\" >> /var/log/cloud-init-bootcmd.log\n\nssh_pwauth:
          true\ndisable_root: true\n"
      type: Opaque
  managementPolicies:
  - '*'
  providerConfigRef:
    kind: ClusterProviderConfig
    name: in-cluster
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: max-namespace
  generateName: max-vm-
  labels:
    app.kubernetes.io/instance: max-namespace
    app.kubernetes.io/managed-by: crossplane
    app.kubernetes.io/name: harvester-cloud-init
    crossplane.io/composite: max-vm
  namespace: default
  ownerReferences:
  - apiVersion: resources.stuttgart-things.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: CloudInit
    name: max-vm
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: vms
  managementPolicies:
  - Observe
  - Create
  providerConfigRef:
    kind: ClusterProviderConfig
    name: in-cluster
