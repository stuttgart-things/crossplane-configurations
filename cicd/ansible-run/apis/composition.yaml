---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: ansible-run
  labels:
    crossplane.io/xrd: ansibleruns.resources.stuttgart-things.com
spec:
  compositeTypeRef:
    apiVersion: resources.stuttgart-things.com/v1alpha1
    kind: AnsibleRun
  mode: Pipeline
  pipeline:
    # Load shared per-environment defaults from an EnvironmentConfig into
    # the pipeline context. The EnvironmentConfig is selected by the
    # CONFIG-SCOPED label `ansible-run.resources.stuttgart-things.com/environment`,
    # whose value is taken from the XR's `spec.environmentConfig` field. The
    # key is namespaced to this Configuration on purpose: a generic shared key
    # (e.g. `resources.stuttgart-things.com/environment`) collides with other
    # Configurations' EnvironmentConfigs carrying the same value, and
    # function-environment-configs requires EXACTLY ONE Selector match
    # (otherwise: "expected exactly one required resource, got 2").
    # When `spec.environmentConfig` is ABSENT the matcher is skipped
    # (fromFieldPathPolicy: Optional), the selector matches nothing and the
    # step is a no-op — the KCL module then falls back to XR spec / its own
    # defaults. When the field IS set, the Selector requires exactly one
    # matching EnvironmentConfig: if none exists the step fails. Offline
    # `crossplane render` therefore needs the EnvironmentConfig supplied via
    # --extra-resources (the verify harness does this from examples/).
    - step: load-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Selector
              selector:
                # Multiple tolerates zero matches: a fully-specified XR (or one
                # relying on the KCL defaults below) needs no EnvironmentConfig.
                # The default mode Single fatals with "expected exactly one
                # required resource, got 0" on any cluster without the defaults
                # object — and fromFieldPathPolicy: Optional does NOT save you
                # there, because it only governs an absent FIELD, while the XRD
                # defaults spec.environmentConfig to `default` so the field is
                # always set. Same fix as bootstrap/vault-pki-secrets and
                # cicd/scheduled-run.
                mode: Multiple
                matchLabels:
                  - key: ansible-run.resources.stuttgart-things.com/environment
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.environmentConfig
                    fromFieldPathPolicy: Optional
    - step: render-pipelinerun
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        metadata:
          name: ansiblerun
        spec:
          source: oci://ghcr.io/stuttgart-things/kcl-tekton-pr?tag=0.15.1
    # Pin the PipelineRun spec once the PipelineRun exists. Tekton rejects
    # any spec change on a completed PipelineRun ("Once the PipelineRun is
    # complete, no updates are allowed: spec"), and provider-kubernetes
    # dry-runs an SSA patch of the desired manifest on EVERY observe, even
    # without Update in managementPolicies. So each bump of a default the
    # module renders (collection release, image tag, pipeline revision from
    # the EnvironmentConfig) left every finished AnsibleRun's Object
    # Synced=False, with a CannotObserveExternalResource warning per
    # reconcile (seen 2026-10-21 and 2026-11-12, stuttgart-things#4484).
    # Re-emitting the observed spec turns that dry run into a no-op. Before
    # creation nothing is observed and the freshly rendered spec is used.
    # The spec is REPLACED, never unioned: a KCL union of two specs merges
    # the params lists index-wise.
    - step: pin-pipelinerun-spec
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        metadata:
          name: ansiblerun-pin-spec
        spec:
          source: |
            _params = option("params") or {}
            _ocds = _params?.ocds or {}
            _dcds = _params?.dcds or {}

            _names = [
                n for n, d in _dcds
                if d?.Resource?.kind == "Object" \
                    and d?.Resource?.spec?.forProvider?.manifest?.kind == "PipelineRun" \
                    and _ocds?[n]?.Resource?.status?.atProvider?.manifest?.spec
            ]

            items = [
                {k: v for k, v in _dcds[n].Resource if k not in ["metadata", "spec"]} | {
                    metadata = {k: v for k, v in (_dcds[n].Resource?.metadata or {}) if k != "annotations"} | {
                        annotations = {k: v for k, v in (_dcds[n].Resource?.metadata?.annotations or {}) if k != "krm.kcl.dev/composition-resource-name"} | {
                            "krm.kcl.dev/composition-resource-name" = n
                        }
                    }
                    spec = {k: v for k, v in _dcds[n].Resource.spec if k != "forProvider"} | {
                        forProvider = {k: v for k, v in _dcds[n].Resource.spec.forProvider if k != "manifest"} | {
                            manifest = {k: v for k, v in _dcds[n].Resource.spec.forProvider.manifest if k != "spec"} | {
                                spec = _ocds[n].Resource.status.atProvider.manifest.spec
                            }
                        }
                    }
                }
                for n in _names
            ]
    # Surface the live Tekton PipelineRun status onto the AnsibleRun XR.
    # The wrapped provider-kubernetes Object mirrors the PipelineRun under
    # status.atProvider.manifest; this inline KCL reads it (observed
    # composed resources) and patches the composite status. Returning only
    # the desired XR (dxr) leaves the rendered Object from the previous
    # step untouched — function-kcl carries forward prior desired state.
    - step: derive-status
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        metadata:
          name: ansiblerun-status
        spec:
          source: |
            _params = option("params") or {}
            _ocds = _params?.ocds or {}

            # Locate the observed wrapped Object regardless of its
            # composition-resource-name, and read the live PipelineRun.
            _objs = [
                v.Resource for _, v in _ocds if v?.Resource?.kind == "Object"
            ]
            _manifest = _objs[0]?.status?.atProvider?.manifest if _objs else {}
            _pr = _manifest?.status or {}

            _succeeded = [c for c in (_pr?.conditions or []) if c?.type == "Succeeded"]
            _sc = _succeeded[0] if _succeeded else {}
            _children = _pr?.childReferences or []

            # Pipeline results, verbatim. build-packer-template emits
            # `template-name`; without lifting it here nothing downstream can
            # know which template a build produced. Kept generic (name/value
            # pairs) rather than hoisting one well-known key, so this block
            # stays identical to packer-build's.
            #
            # Tekton v1 results may be array- or object-typed, which would not
            # satisfy the string-typed schema, so non-string values are skipped
            # rather than stringified into something no consumer can parse.
            _results = [
                {name = r.name, value = r.value}
                for r in (_pr?.results or [])
                if r?.name and typeof(r?.value) == "str"
            ]

            _statusPatch = {
                installed = True if _manifest else False
                succeeded = _sc?.status or "Unknown"
                if _sc?.reason: reason = _sc.reason
                if _sc?.message: message = _sc.message
                if _manifest?.metadata?.name: pipelineRunName = _manifest.metadata.name
                if _pr?.startTime: startTime = _pr.startTime
                if _pr?.completionTime: completionTime = _pr.completionTime
                taskRuns = [
                    {name = c?.name, pipelineTaskName = c?.pipelineTaskName}
                    for c in _children
                ]
                results = _results
            }

            _dxr = _params?.dxr or {}
            items = [_dxr | {status = (_dxr?.status or {}) | _statusPatch}]
    - step: ready
      functionRef:
        name: function-auto-ready
