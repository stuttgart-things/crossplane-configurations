---
apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: github-runner-set
  annotations:
    # Local convention used by `task push` to bump and re-publish.
    # Not a Crossplane-standard field — the true package version is the OCI tag.
    meta.crossplane.io/version: v0.1.0
    meta.crossplane.io/maintainer: patrick.hermann@sva.de
    meta.crossplane.io/source: github.com/stuttgart-things/crossplane-configurations
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      One GitHub Actions runner scale set (ARC gha-runner-scale-set chart) on
      a target cluster from a namespaced `GithubRunnerSet` XR, via a
      provider-helm namespaced Release. The GitHub PAT or GitHub App
      credential is referenced by Secret name (provided by External Secrets)
      and never passes through Crossplane.
    meta.crossplane.io/readme: | # pragma: allowlist secret
      # github-runner-set

      A Crossplane v2 Configuration that turns a namespaced `GithubRunnerSet`
      XR (group `resources.stuttgart-things.com`) into one
      `helm.m.crossplane.io/v1beta1` Release of
      `oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set`.
      The scale set name (= Helm release name = the `runs-on:` label) defaults
      to `ghr-{repository|organization}-{clusterName}`, the naming of the old
      stuttgart-things/crossplane `github-runner` package, and is published in
      `status.runnerScaleSetName`.

      ## Credentials

      `spec.githubConfigSecret` is the NAME of a Secret that already exists in
      `spec.namespace` on the target cluster, materialised by an
      ExternalSecret: key `github_token` for a PAT, or `github_app_id`,
      `github_app_installation_id` and `github_app_private_key` for a GitHub
      App. The chart is handed the name only, so the credential is in neither
      the XR, the managed resource nor the Helm release values.

      ## Cluster preconditions

      - The ARC controller on the target cluster (Configuration
        `github-arc-controller`), on the same chart version.
      - The credential Secret in `spec.namespace` (External Secrets).
      - provider-helm and a `ClusterProviderConfig` (helm) named
        `{clusterName}-helm` or `spec.helmProviderConfigRef`.
spec:
  crossplane:
    version: ">=v2.1.3"
  dependsOn:
    # The scale set chart goes on the target cluster as a namespaced
    # helm.m.crossplane.io Release.
    - provider: xpkg.crossplane.io/crossplane-contrib/provider-helm
      version: ">=v1.0.0,<v2.0.0"
    # Functions used by this Configuration's Composition pipeline.
    - function: xpkg.crossplane.io/crossplane-contrib/function-go-templating
      version: ">=v0.12.1,<v0.13.0"
    - function: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      version: ">=v0.6.5,<v0.7.0"
