---
# Precondition #4: RBAC for the provider-kubernetes ServiceAccount.
#
# cluster-backup composes ServiceAccounts, CronJobs and RBAC objects through
# provider-kubernetes. On a fleet cluster the provider SA is cluster-admin and
# this is unnecessary. On a scoped cluster (verified on kind1, 2026-07-24) it
# is NOT, and every composed Object stays Synced=False:
#
#   observe failed: cannot get object: cronjobs.batch "<name>" is forbidden:
#   User "system:serviceaccount:crossplane-system:provider-kubernetes" cannot
#   get resource "cronjobs" in API group "batch" ...
#
# Apply this once per such cluster. Adjust the ServiceAccount subject if the
# provider runs under a different name or namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-kubernetes-cluster-backup
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    # bind + escalate: Kubernetes forbids creating an RBAC object that grants
    # permissions the creator does not already hold, unless it has these verbs.
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "bind", "escalate"]
  # And the provider must itself hold the read permissions the backup
  # ClusterRole grants, for the same "no privilege escalation" reason.
  - apiGroups:
      - virtualmachine.vspherevm.m.stuttgart-things.com
      - vm.proxmoxbpg.m.crossplane.io
      - opentofu.m.upbound.io
      - kubernetes.m.crossplane.io
      - helm.m.crossplane.io
      - kubeconfig.stuttgart-things.com
    resources: ["*"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-cluster-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-kubernetes-cluster-backup
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
