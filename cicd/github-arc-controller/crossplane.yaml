---
apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: github-arc-controller
  annotations:
    # Local convention used by `task push` to bump and re-publish.
    # Not a Crossplane-standard field — the true package version is the OCI tag.
    meta.crossplane.io/version: v0.1.0
    meta.crossplane.io/maintainer: patrick.hermann@sva.de
    meta.crossplane.io/source: github.com/stuttgart-things/crossplane-configurations
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Installs the GitHub Actions Runner Controller (ARC,
      gha-runner-scale-set-controller chart) on a target cluster from a
      namespaced `GithubArcController` XR, via a provider-helm namespaced
      Release. One per cluster; runner scale sets come from the sibling
      `github-runner-set` Configuration.
    meta.crossplane.io/readme: |
      # github-arc-controller

      A Crossplane v2 Configuration that turns a namespaced
      `GithubArcController` XR (group `resources.stuttgart-things.com`) into
      one `helm.m.crossplane.io/v1beta1` Release of
      `oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller`
      on the target cluster. The Helm provider config ref derives from
      `spec.clusterName` (`{clusterName}-helm`) unless
      `spec.helmProviderConfigRef` is set.

      Install it once per cluster, then add one `GithubRunnerSet`
      (Configuration `github-runner-set`) per runner scale set, on the SAME
      chart version — ARC supports only matching controller/scale-set pairs.

      ## Upgrading

      Helm installs the ARC CRDs only on the first install and never upgrades
      them. After every `spec.version` bump, apply the matching CRDs
      server-side by hand (see the package README); a stale CRD silently
      prunes status fields the new controller writes.

      ## Cluster preconditions

      provider-helm installed, and a `ClusterProviderConfig` (helm) for the
      target cluster named `{clusterName}-helm` or `spec.helmProviderConfigRef`.
spec:
  crossplane:
    version: ">=v2.1.3"
  dependsOn:
    # The controller chart goes on the target cluster as a namespaced
    # helm.m.crossplane.io Release.
    - provider: xpkg.crossplane.io/crossplane-contrib/provider-helm
      version: ">=v1.0.0,<v2.0.0"
    # Functions used by this Configuration's Composition pipeline.
    - function: xpkg.crossplane.io/crossplane-contrib/function-go-templating
      version: ">=v0.12.1,<v0.13.0"
    - function: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      version: ">=v0.6.5,<v0.7.0"
