---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: packer-build
  labels:
    crossplane.io/xrd: packerbuilds.resources.stuttgart-things.com
spec:
  compositeTypeRef:
    apiVersion: resources.stuttgart-things.com/v1alpha1
    kind: PackerBuild
  mode: Pipeline
  pipeline:
    # Load shared per-environment defaults from an EnvironmentConfig into
    # the pipeline context. The EnvironmentConfig is selected by the
    # CONFIG-SCOPED label `packer-build.resources.stuttgart-things.com/environment`,
    # whose value is taken from the XR's `spec.environmentConfig` field. The
    # key is namespaced to this Configuration on purpose: a generic shared key
    # (e.g. `resources.stuttgart-things.com/environment`) collides with other
    # Configurations' EnvironmentConfigs carrying the same value, and
    # function-environment-configs requires EXACTLY ONE Selector match
    # (otherwise: "expected exactly one required resource, got 2"). In
    # particular the sibling `ansible-run` Configuration ships an
    # EnvironmentConfig labelled `default` — sharing a key with it would break
    # both.
    # When `spec.environmentConfig` is ABSENT the matcher is skipped
    # (fromFieldPathPolicy: Optional), the selector matches nothing and the
    # step is a no-op — the KCL module then falls back to XR spec / its own
    # defaults. When the field IS set, the Selector requires exactly one
    # matching EnvironmentConfig: if none exists the step fails. Offline
    # `crossplane render` therefore needs the EnvironmentConfig supplied via
    # --extra-resources (the verify harness does this from examples/).
    - step: load-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Selector
              selector:
                matchLabels:
                  - key: packer-build.resources.stuttgart-things.com/environment
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.environmentConfig
                    # Optional: when spec.environmentConfig is absent (e.g. a
                    # minimal XR before XRD defaulting) skip this matcher
                    # instead of erroring; the step then becomes a no-op.
                    fromFieldPathPolicy: Optional
    # Renders the PipelineRun for build-packer-template.yaml. This is the
    # packer sibling of kcl-tekton-pr — a DIFFERENT module, because packer
    # keeps the pipeline-definition repo and the template-source repo separate
    # (kcl-tekton-pr conflates them into one gitRepoUrl).
    #
    # PIN COUPLING: the tag below must be published to ghcr BEFORE verify can
    # pass, otherwise it fails with
    #   failed to resolve <v>: ...kcl-tekton-pr-packer:<v>: not found
    # Order: bump stage-time/kcl/packer/kcl.mod -> kcl mod push -> bump here.
    - step: render-pipelinerun
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        metadata:
          name: packerbuild
        spec:
          source: oci://ghcr.io/stuttgart-things/kcl-tekton-pr-packer?tag=0.6.1
    # Surface the live Tekton PipelineRun status onto the PackerBuild XR.
    # The wrapped provider-kubernetes Object mirrors the PipelineRun under
    # status.atProvider.manifest; this inline KCL reads it (observed
    # composed resources) and patches the composite status. Returning only
    # the desired XR (dxr) leaves the rendered Object from the previous
    # step untouched — function-kcl carries forward prior desired state.
    # Generic like ansible-run's (it reads only PipelineRun status), plus one
    # packer-specific lift: templateName / templateVmId, see below.
    - step: derive-status
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        metadata:
          name: packerbuild-status
        spec:
          source: |
            _params = option("params") or {}
            _ocds = _params?.ocds or {}

            # Locate the observed wrapped Object regardless of its
            # composition-resource-name, and read the live PipelineRun.
            _objs = [
                v.Resource for _, v in _ocds if v?.Resource?.kind == "Object"
            ]
            _manifest = _objs[0]?.status?.atProvider?.manifest if _objs else {}
            _pr = _manifest?.status or {}

            _succeeded = [c for c in (_pr?.conditions or []) if c?.type == "Succeeded"]
            _sc = _succeeded[0] if _succeeded else {}
            _children = _pr?.childReferences or []

            # Pipeline results, verbatim. build-packer-template emits
            # `template-name`; without lifting it here nothing downstream can
            # know which template a build produced. Kept generic (name/value
            # pairs) rather than hoisting one well-known key, so this block
            # stays identical to ansible-run's.
            #
            # Tekton v1 results may be array- or object-typed, which would not
            # satisfy the string-typed schema, so non-string values are skipped
            # rather than stringified into something no consumer can parse.
            _results = [
                {name = r.name, value = r.value}
                for r in (_pr?.results or [])
                if r?.name and typeof(r?.value) == "str"
            ]

            # The template a build produced, by name AND -- on Proxmox -- by
            # VMID. execute-packer's `template-name` is packer's artifact ID:
            # the template name on vsphere-iso, the numeric VMID on
            # proxmox-iso, where packer prints the name nowhere. Since
            # stage-time v0.13.6 the pipeline also emits
            # `template-display-name`, which a Proxmox build fills from its
            # manifest post-processor (stuttgart-things packer/builds) and which
            # otherwise falls back to the artifact ID. A Proxmox release needs
            # both: the VMID is what clones and the promotion address, the name
            # is what a human and a name-based clone read (#214, #525).
            #
            # The hypervisor resolves exactly like the KCL module's own:
            # XR spec -> EnvironmentConfig -> "vsphere".
            _spec = _params?.oxr?.spec or {}
            _env = _params?.ctx?["apiextensions.crossplane.io/environment"] or {}
            _isProxmox = (_spec?.hypervisor or _env?.hypervisor or "vsphere") == "proxmox"
            _artifactIds = [r.value for r in _results if r.name == "template-name"]
            _displayNames = [r.value for r in _results if r.name == "template-display-name"]
            _artifactId = _artifactIds[0] if _artifactIds else ""
            _displayName = _displayNames[0] if _displayNames else ""
            # On Proxmox a display name equal to the VMID is the fallback, not a
            # name, so it is left out rather than reported as one.
            _proxmoxName = _displayName if _displayName != _artifactId else ""
            _templateName = _proxmoxName if _isProxmox else (_displayName or _artifactId)
            _templateVmId = _artifactId if _isProxmox else ""

            # Phase: one word that tells "still building" from "failed 20
            # minutes ago" (#527). Without it a failed build sat at
            # Ready=False/Creating, indistinguishable from a running one.
            #   Pending   -- no PipelineRun observed yet, or no Succeeded condition
            #   Running   -- Succeeded=Unknown (Running, ResolvingPipelineRef, ...)
            #   Succeeded -- Succeeded=True
            #   Failed    -- Succeeded=False (Failed, PipelineRunTimeout,
            #                Cancelled, CouldntGetPipeline, ...): terminal
            _scStatus = _sc?.status or ""
            _phase = "Succeeded" if _scStatus == "True" else \
                "Failed" if _scStatus == "False" else \
                "Running" if _scStatus == "Unknown" else "Pending"
            _prName = _manifest?.metadata?.name or ""
            _prNs = _manifest?.metadata?.namespace or ""

            _statusPatch = {
                phase = _phase
                installed = True if _manifest else False
                succeeded = _sc?.status or "Unknown"
                if _sc?.reason: reason = _sc.reason
                if _sc?.message: message = _sc.message
                if _manifest?.metadata?.name: pipelineRunName = _manifest.metadata.name
                if _pr?.startTime: startTime = _pr.startTime
                if _pr?.completionTime: completionTime = _pr.completionTime
                taskRuns = [
                    {name = c?.name, pipelineTaskName = c?.pipelineTaskName}
                    for c in _children
                ]
                results = _results
                if _templateName: templateName = _templateName
                if _templateVmId: templateVmId = _templateVmId
            }

            # The same verdict as a custom condition, because `kubectl wait
            # --for=condition=...` and every generic consumer read conditions,
            # not status fields. Ready itself CANNOT carry it: Crossplane core
            # owns Ready (and Synced/Healthy) -- it drops function-set system
            # conditions (IsSystemConditionType) and writes Ready=False with
            # reason Creating whenever a composed resource is unready, which a
            # failed PipelineRun's Object stays forever. Checked in the
            # composite reconciler of crossplane v2.4.0. So Ready stays
            # False/Creating on a failed build; PipelineRunSucceeded=False with
            # reason Failed (or PipelineRunTimeout, ...) is what says it is over.
            #
            # Tekton's PipelineRun status names no failed task (childReferences
            # carry names only, the message reads "Tasks Completed: 2
            # (Failed: 1, ...)"), so the message points at tkn for the TaskRun.
            _condReason = _sc?.reason or ("Pending" if _phase == "Pending" else _phase)
            _failHint = " -- inspect: tkn pr describe {} -n {}".format(_prName, _prNs) if _phase == "Failed" and _prName and _prNs else ""
            _condMessage = "PipelineRun {}: {}{}".format(_prName, _sc?.message or _condReason, _failHint) if _prName else "No PipelineRun observed yet"
            _conditions = {
                apiVersion = "meta.krm.kcl.dev/v1alpha1"
                kind = "Conditions"
                conditions = [{
                    target = "Composite"
                    force = True
                    condition = {
                        type = "PipelineRunSucceeded"
                        status = _scStatus if _scStatus in ["True", "False"] else "Unknown"
                        reason = _condReason
                        message = _condMessage
                    }
                }]
            }

            _dxr = _params?.dxr or {}
            items = [_conditions, _dxr | {status = (_dxr?.status or {}) | _statusPatch}]
    - step: ready
      functionRef:
        name: function-auto-ready
