---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: packerreleases.resources.stuttgart-things.com
spec:
  group: resources.stuttgart-things.com
  defaultCompositeDeletePolicy: Foreground
  scope: Namespaced
  names:
    kind: PackerRelease
    plural: packerreleases
    singular: packerrelease
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                environmentConfig:
                  type: string
                  description: |
                    Selects the EnvironmentConfig providing defaults for the
                    TEST VM, by the config-scoped label
                    `packer-release.resources.stuttgart-things.com/environment=<value>`.
                    Supported `data` keys: folderPath, datacenter, datastore,
                    resourcePool, network, firmware, tfvarsSecretName,
                    tfvarsSecretKey, providerConfigName, providerConfigKind,
                    and an `ansible` block with `playbooks` / `varsFile`.

                    Scope matters: this environment covers ONLY the test VM.
                    Build settings come from the nested PackerBuild's own
                    EnvironmentConfig (`build.environmentConfig`), and any
                    placement field left unset here falls back to the
                    VsphereVM/ProxmoxVM one. Set a given field in exactly one
                    of the three.
                  default: default

                # ------------------------------------------------------------
                # Build phase — emitted as a nested PackerBuild XR.
                #
                # Only the fields that identify a BUILD live here. Everything
                # that is a property of the environment (repo URLs, pipeline
                # revision, CA ConfigMap, credentials Secret names, working
                # image, storage class, lab, hypervisor) is deliberately NOT
                # duplicated: PackerBuild resolves those from its OWN
                # EnvironmentConfig, selected by `build.environmentConfig`.
                # Re-declaring them here would create a second place to keep
                # in sync, and an XRD default would mask the EnvironmentConfig
                # entirely (defaults are applied before the Composition runs).
                # ------------------------------------------------------------
                build:
                  type: object
                  description: What to build. Infrastructure settings come from packer-build's EnvironmentConfig.
                  properties:
                    environmentConfig:
                      type: string
                      description: |
                        EnvironmentConfig selector value handed to the nested
                        PackerBuild (its own config-scoped label, NOT this
                        Configuration's).
                      default: default
                    pipelineRunName:
                      type: string
                      description: |
                        Name of the Tekton PipelineRun. Defaults to
                        "<xr-name>-build". A PipelineRun is immutable, so
                        re-running a build means recreating this XR.
                    osVersion:
                      type: string
                      description: OS segment of the build directory, e.g. "ubuntu24"
                    provisioning:
                      type: string
                      description: Provisioning segment of the build directory, e.g. "base-os"
                    packerTemplate:
                      type: string
                      description: |
                        Packer template file to build, e.g.
                        "ubuntu24-base-os.pkr.hcl". Name a single FILE — "."
                        fails with "Duplicate local definition" on any build
                        directory holding more than one template.
                    gitRevision:
                      type: string
                      description: Branch or revision of the template source repo
                      default: main
                    lab:
                      type: string
                      description: |
                        Lab segment of the build directory. No default on
                        purpose — normally an EnvironmentConfig property.
                    hypervisor:
                      type: string
                      description: Hypervisor segment of the build directory
                      enum:
                        - vsphere
                        - proxmox
                        - qemu
                    gitWorkspaceSubdirectory:
                      type: string
                      description: |
                        Build directory, set explicitly instead of being
                        composed from osVersion/lab/hypervisor/provisioning.
                    namespace:
                      type: string
                      description: Namespace the build PipelineRun runs in
                    storageClass:
                      type: string
                      description: StorageClass for the build workspace PVC
                    vaultSecretName:
                      type: string
                      description: Name of the Vault Secret the build reads
                      default: vault
                    pipelineRevision:
                      type: string
                      description: |
                        stage-time tag the BUILD pipeline is fetched at.
                        Unset means the packer-build EnvironmentConfig decides,
                        which is what a release normally wants.

                        Here because it pairs with `vaultSecretName`, and the
                        pairing is load-bearing. A Vault Secret that carries an
                        AppRole instead of a token (the infra Vault, named via
                        `vaultSecretName`) only works from stage-time >= v0.12.0,
                        where execute-packer performs the login itself. On an older pin the build dies on "Must set
                        VAULT_TOKEN env var in order to use vault template
                        function". Being able to name the Vault but not the tag
                        that can read it made Proxmox releases unexpressible.

                        Do NOT reach for this to move the fleet forward — bumping
                        the EnvironmentConfig is that change, and it is a fleet
                        decision. This is for a single release that needs a
                        different pin than the environment's.
                  required:
                    - osVersion
                    - provisioning
                    - packerTemplate

                # ------------------------------------------------------------
                # Test phase — emitted as a nested VMProvision XR, but ONLY
                # once the build has succeeded and reported a template name.
                #
                # VMProvision already sequences internally: it emits its
                # AnsibleRun only after the VM is Ready and its IP is known.
                # So this Configuration gates exactly one edge (build -> test)
                # and lets VMProvision own the rest.
                # ------------------------------------------------------------
                test:
                  type: object
                  description: How to smoke-test the built template.
                  properties:
                    enabled:
                      type: boolean
                      description: |
                        Run the smoke test. When false the XR is a plain build
                        wrapper and is Ready as soon as the build succeeds.
                      default: true
                    provider:
                      type: string
                      enum:
                        - vsphere
                        - proxmox
                      default: vsphere
                    environmentConfig:
                      type: string
                      description: |
                        EnvironmentConfig selector value handed to the nested
                        VMProvision (which passes it to VsphereVM/ProxmoxVM).
                      default: default
                    cpu:
                      type: string
                      default: "4"
                    ram:
                      type: string
                      description: Memory in MB
                      default: "4096"
                    disk:
                      type: string
                      description: |
                        Disk size. Must be >= the template's own disk, or the
                        clone fails.
                      default: "64"
                    firmware:
                      type: string
                      description: Must match what the template was built with.
                      default: bios
                    vsphere:
                      type: object
                      description: |
                        vSphere placement for the test VM. Each field falls
                        back to the VsphereVM EnvironmentConfig when unset.
                      properties:
                        folderPath:
                          type: string
                        datacenter:
                          type: string
                        datastore:
                          type: string
                        resourcePool:
                          type: string
                        network:
                          type: string
                    proxmox:
                      type: object
                      description: Proxmox placement for the test VM.
                      properties:
                        node:
                          type: string
                        datastore:
                          type: string
                        folderPath:
                          type: string
                        network:
                          type: string
                    tfvars:
                      type: object
                      description: Secret holding the hypervisor credentials as tfvars.
                      properties:
                        secretName:
                          type: string
                        secretKey:
                          type: string
                    providerRef:
                      type: object
                      description: |
                        The OPENTOFU provider config the test VM's Workspace
                        runs through — not the provider-kubernetes one. Its
                        name is a per-cluster choice; check with
                        `kubectl get clusterproviderconfigs.opentofu.m.upbound.io`.
                      properties:
                        name:
                          type: string
                        kind:
                          type: string
                    ansible:
                      type: object
                      description: |
                        Ansible provisioning run against the test VM. This is
                        what actually proves the image is usable rather than
                        merely bootable — a template can clone and get an IP
                        and still be missing the user or packages every later
                        consumer expects.
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        playbooks:
                          type: array
                          items:
                            type: string
                        varsFile:
                          type: array
                          description: Extra vars as key+-value pairs
                          items:
                            type: string
                # ------------------------------------------------------------
                # Promote phase — emitted as a provider-kubernetes Object
                # wrapping a promote-packer-template PipelineRun, but ONLY once
                # the smoke test has passed.
                #
                # This is the one step here that MUTATES shared state: it
                # renames the golden image every other consumer clones from.
                # Hence `enabled: false` by default — an existing PackerRelease
                # upgraded to a version that knows about promotion must not
                # start overwriting golden images because a default changed.
                #
                # It is also the only composed resource that is NOT torn down
                # again. The test VM disappears because the Composition stops
                # rendering it; the promote PipelineRun is the record of what
                # was promoted and from what, so it stays.
                # ------------------------------------------------------------
                promote:
                  type: object
                  description: |
                    Promote the tested template to the golden image.

                    How, depends on the provider, because the two are not the
                    same operation:

                    - vsphere — govc renames the golden image aside and the
                      fresh build in. Consumers resolve templates by inventory
                      name/path, so the rename redirects them, and it takes
                      effect at once. The fields directly below are this path.
                    - proxmox — see the `proxmox` block. Nothing is renamed:
                      bpg clones by numeric VMID only, so promotion changes the
                      `templateVmId` consumers resolve, as a pull request
                      against the config repo. It takes effect on merge.

                    Requires `test.enabled`. Promotion is gated on
                    `status.tested`, and that latch is only ever set by a test
                    VM reaching Ready — so with the smoke test off, promotion
                    never fires. That is deliberate: the entire claim this
                    Configuration makes is that a promoted image was proven to
                    work first.
                  properties:
                    enabled:
                      type: boolean
                      description: |
                        Off by default. Promotion overwrites the image every
                        later consumer clones, so it is opt-in per release.
                      default: false
                    goldenName:
                      type: string
                      description: |
                        Name the golden image is published under, e.g.
                        "sthings-u24". No default and not derivable from
                        osVersion — the mapping is a platform convention, so
                        set it here or in the EnvironmentConfig's `promote`
                        block. Missing when promotion is enabled is a hard
                        error rather than a guess.
                    buildFolder:
                      type: string
                      description: |
                        Inventory path packer builds into, e.g.
                        "/LabUL/vm/stuttgart-things/packer".
                    goldenFolder:
                      type: string
                      description: |
                        Inventory path golden images live in, e.g.
                        "/LabUL/vm/stuttgart-things/vm-templates".
                    previousSuffix:
                      type: string
                      description: |
                        Suffix for the retained previous generation. Exactly
                        one is kept, so a bad golden image is one rename away
                        from being rolled back.
                      default: "-previous"
                    datacenter:
                      type: string
                      description: vCenter datacenter, e.g. "/LabUL"
                    insecureSkipVerify:
                      type: string
                      description: Skip vCenter TLS verification (self-signed lab certs)
                      default: "true"
                    proxmox:
                      type: object
                      description: |
                        Proxmox promotion. Read only when test.provider is
                        'proxmox'; the fields above are the vSphere ones and are
                        ignored here.

                        This does NOT rename anything. bpg's VirtualMachine
                        clones by numeric VMID only — spec.forProvider.clone
                        takes vmId and nothing else, no name, path, ref or
                        selector — so renaming a template in PVE would redirect
                        zero consumers. What they resolve is `templateVmId` in
                        the proxmoxvm capability chart, so promotion is a change
                        to that value, delivered as a pull request against the
                        config repo. Merging it is the promotion; until then the
                        fleet still clones the previous VMID.

                        Consequently there is no golden name, no
                        `-previous` generation to keep and no PVE API call —
                        rollback is putting the old VMID back.
                      properties:
                        valuePath:
                          type: string
                          description: |
                            yq path of the golden pointer, e.g.
                            ".environments.labul.templateVmId". Required when
                            promoting on Proxmox, with no default and no
                            derivation from `lab` on purpose: the path names an
                            environment block, and a guess would promote the
                            wrong one. May come from the EnvironmentConfig's
                            promote.proxmox block instead.
                        configRepoUrl:
                          type: string
                          description: |
                            Repo holding the capability chart. Defaults to
                            stuttgart-things/stuttgart-things in the pipeline.
                        configRepoBranch:
                          type: string
                          description: Branch the pull request targets. Pipeline default "main".
                        valuesFile:
                          type: string
                          description: |
                            Repo-relative chart values file. Pipeline default
                            "crossplane/platform/capabilities/proxmoxvm/values.yaml".
                        chartFile:
                          type: string
                          description: |
                            Chart.yaml given a patch bump so the chart is
                            actually republished. Without it a merged pull
                            request changes a file no cluster ever pulls.
                        gitTokenSecretName:
                          type: string
                          description: |
                            Secret with a token allowed to push a branch and
                            open a pull request on configRepoUrl. It needs
                            write — the read-only clone credential the build
                            pipelines use is not sufficient.
                        gitTokenSecretKey:
                          type: string
                          description: Key inside that Secret. Pipeline default "token".
                        prTitle:
                          type: string
                          description: Defaults to a generated one-liner naming path and value.
                        prBody:
                          type: string
                          description: Appended below the generated summary.
                        dryRun:
                          type: string
                          description: |
                            "true" does everything except push and open the pull
                            request, printing the diff. Useful to prove the
                            valuePath matches before letting a release near the
                            config repo.
                        pipelineRevision:
                          type: string
                          description: |
                            stage-time tag holding promote-proxmox-template.yaml.
                            Separate from the promote-level pipelineRevision on
                            purpose: that key predates this provider and pins the
                            vSphere promoter, and applying it here produced a
                            pipelineRef naming promote-proxmox-template.yaml at a
                            tag that does not contain it. Floor is v0.13.2 — v0.13.0/v0.13.1
                            could not re-run a promotion (stale-info push).
                        pipelinePath:
                          type: string
                          description: |
                            Path to the pipeline inside the stage-time repo.
                            Defaults to pipelines/promote-proxmox-template.yaml.
                    pipelineRunName:
                      type: string
                      description: |
                        Name of the promote PipelineRun. Defaults to
                        "<xr-name>-promote". Immutable like any PipelineRun —
                        re-promoting means recreating this XR.
                    namespace:
                      type: string
                      description: Namespace the promote PipelineRun runs in
                    caCertsConfigMapName:
                      type: string
                      description: |
                        ConfigMap of PEM CA certificates, mounted as the
                        pipeline's optional `caCerts` workspace. Required when
                        the Vault holding the vCenter credentials sits behind a
                        private CA — which is the case in the labs, so leaving
                        this unset there fails at the Vault call, not at TLS
                        setup, and the error names neither.
                    vaultSecretName:
                      type: string
                      description: Secret carrying VAULT_ADDR / VAULT_TOKEN
                      default: vault
                    vaultSecretPath:
                      type: string
                      description: Vault KV v2 path holding the vCenter credentials
                    workingImage:
                      type: string
                      description: |
                        Image providing govc. Must be >= 2.0.0 — govc was added
                        in that image version.
                    crossplaneProviderConfig:
                      type: string
                      description: |
                        The provider-KUBERNETES ClusterProviderConfig the Object
                        targets — not the OpenTofu one the test VM uses.
                      default: in-cluster

              required:
                - build
              x-kubernetes-validations:
                # Both providers can promote, by different mechanisms: vSphere
                # renames in the vCenter inventory (govc), Proxmox changes the
                # templateVmId consumers resolve, via a pull request against the
                # config repo. A provider with neither pipeline must be rejected
                # here rather than letting the Composition fire the vSphere
                # promoter at a template it cannot address. Defense in depth: the
                # Composition gates on the provider too and reports an
                # unsupported one as the terminal phase PromoteUnsupported.
                - rule: "!has(self.promote) || !has(self.promote.enabled) || !self.promote.enabled || !has(self.test) || !has(self.test.provider) || self.test.provider in ['vsphere', 'proxmox']"
                  message: "spec.promote.enabled requires spec.test.provider 'vsphere' or 'proxmox' — those are the two promote pipelines that exist."
                # Proxmox promotion writes to a yq path in the config repo, and
                # that path names the environment block. There is no safe default
                # and no derivation from `lab`: a guess would promote a different
                # lab's pointer, and it would look like it worked. Required at
                # admission unless the EnvironmentConfig supplies it — which CEL
                # cannot see, hence the escape hatch of setting it explicitly.
                - rule: "!has(self.promote) || !has(self.promote.enabled) || !self.promote.enabled || !has(self.test) || !has(self.test.provider) || self.test.provider != 'proxmox' || (has(self.promote.proxmox) && has(self.promote.proxmox.valuePath) && self.promote.proxmox.valuePath != '') || has(self.environmentConfig)"
                  message: "Proxmox promotion needs spec.promote.proxmox.valuePath (e.g. '.environments.labul.templateVmId'), or an EnvironmentConfig supplying promote.proxmox.valuePath."

            status:
              type: object
              properties:
                phase:
                  type: string
                  description: |
                    Building — the build PipelineRun is still running.
                    BuildFailed — the build PipelineRun failed. Terminal: the
                      gate never opens, no test VM is created, and nothing is
                      retried. Read buildPipelineRunName for the logs.
                    BuildIncomplete — the build succeeded but reported no
                      `template-name`, so there is nothing to test or promote.
                      In practice this means the nested packer-build predates
                      v0.3.0, which is what the dependency floor guards against.
                    Testing — a test VM is up (or coming up) against the
                      freshly built template.
                    Tested — the smoke test passed; the test VM has been torn
                      down and the template is a promotion candidate. Terminal
                      when spec.promote.enabled is false.
                    Promoting — the promote PipelineRun is running.
                    Promoted — the promote pipeline succeeded.
                      status.previousTemplate names what it superseded, and is
                      the rollback target.

                      Read this differently per provider. On vSphere the rename
                      has happened and the golden image points at this build
                      now. On Proxmox it means the promotion PULL REQUEST exists
                      (status.promotionPullRequest) — the fleet keeps cloning
                      the previous VMID until that is merged and the chart
                      rolled out. Promoted is not "in service" there.
                    PromoteFailed — the promote PipelineRun failed. Terminal;
                      nothing retries. The task refuses to run against a
                      half-promoted inventory, so a rerun needs the golden
                      folder looked at first.
                    PromoteUnsupported — spec.promote.enabled is true but
                      spec.test.provider is neither vsphere nor proxmox, the
                      two providers that have a promote pipeline. Terminal: the
                      build is done and the smoke test passed, but the golden
                      pointer is deliberately left untouched rather than firing
                      the vSphere promoter at a template it cannot address. New
                      XRs are rejected at admission; this phase is what an XR
                      predating the rule reports.

                      Proxmox reached this phase until the promote-proxmox
                      pipeline existed. If an old XR still reports it, the
                      Composition pin is behind — not the provider.
                    TestSkipped — spec.test.enabled is false AND the build
                      produced a template. A build-only XR still reports
                      Building/BuildFailed while the build is in flight.
                      Promotion cannot follow this phase — it is gated on the
                      `tested` latch, which only a test VM sets.
                templateName:
                  type: string
                  description: |
                    The template the build produced, lifted from the nested
                    PackerBuild's `template-name` pipeline result. This is the
                    handle every later step needs — it is what the test VM is
                    cloned from and what a promote step would rename.
                buildSucceeded:
                  type: string
                  description: '"True", "False" or "Unknown" from the build PipelineRun'
                buildPipelineRunName:
                  type: string
                  description: Name of the build PipelineRun
                tested:
                  type: boolean
                  description: |
                    Latch. Set once the test VM reported Ready and never
                    cleared. The Composition stops rendering the test VM after
                    this, which is what tears it down — so without the latch a
                    later reconcile would build the VM again, forever.
                testVmIp:
                  type: array
                  description: |
                    IP(s) the test VM had. Latched, so it survives the teardown
                    that the `tested` latch triggers — otherwise the only trace
                    of what was actually verified would vanish one reconcile
                    after the test passed.
                  items:
                    type: string
                promoted:
                  type: boolean
                  description: |
                    Latch. Set once the promote PipelineRun succeeded. Unlike
                    `tested` it does not gate anything off — the promote Object
                    stays composed either way, because it IS the record.
                promoteSucceeded:
                  type: string
                  description: '"True", "False" or "Unknown" from the promote PipelineRun'
                promotePipelineRunName:
                  type: string
                  description: Name of the promote PipelineRun
                goldenTemplate:
                  type: string
                  description: |
                    What the golden pointer now names, from the promote
                    pipeline's `promoted-template` result. On vSphere that is
                    the inventory path the golden image lives at. On Proxmox it
                    is the VMID the capability chart will resolve — "will",
                    because it only takes effect once the promotion pull request
                    is merged and the chart rolled out.
                previousTemplate:
                  type: string
                  description: |
                    The rollback target, from the `previous-template` result.
                    Empty on a first promotion. On vSphere it is the inventory
                    path the superseded golden image was renamed to — roll back
                    by renaming it back to goldenName. On Proxmox it is the VMID
                    the pointer named before; roll back by putting it back.
                promotionPullRequest:
                  type: string
                  description: |
                    Proxmox only: the pull request carrying the promotion, or
                    empty when the pointer already named this build.

                    Read it before treating `promoted: true` as finished. On
                    Proxmox the promote pipeline succeeding means the pull
                    request exists — the fleet still clones the previous VMID
                    until it is merged and the chart rolled out. On vSphere the
                    rename takes effect immediately and this stays empty.
      additionalPrinterColumns:
        - name: PHASE
          type: string
          jsonPath: .status.phase
        - name: TEMPLATE
          type: string
          jsonPath: .status.templateName
        - name: BUILT
          type: string
          jsonPath: .status.buildSucceeded
        - name: GOLDEN
          type: string
          jsonPath: .status.goldenTemplate
        - name: TESTED
          type: boolean
          jsonPath: .status.tested
