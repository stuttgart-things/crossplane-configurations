---
# Build without the smoke test. Equivalent to using `packer-build` directly,
# but keeps the same API when a build is known-good or the lab has no capacity
# for a test VM. The XR is Ready as soon as the build succeeds, and
# status.templateName / status.templateVmId still carry the result.
#
# test.provider is set even though no test VM is built: it is how the release
# knows that the build's artifact ID is a Proxmox VMID, not a name.
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: PackerRelease
metadata:
  name: ubuntu26-labul-buildonly
  namespace: default
spec:
  environmentConfig: default
  build:
    osVersion: ubuntu26
    provisioning: base-os
    packerTemplate: ubuntu26-base-os.pkr.hcl
    vaultSecretName: vault-infra # pragma: allowlist secret
  test:
    enabled: false
    provider: proxmox
