---
# Every spec field set — the maximal vSphere release: build, smoke-test, and
# promote, with every build/test/promote knob pinned rather than resolved from
# the three EnvironmentConfigs (packer-release, packer-build, vsphere-vm).
#
# Provider is vsphere, so the vSphere placement + promote fields are the ones
# exercised here; the Proxmox test/promote sub-blocks are mutually exclusive
# with vsphere at admission (see the XRD's x-kubernetes-validations) and are
# covered by xr-promote-proxmox.yaml instead. This file is the vSphere super-set
# — it catches templating breakage in fields xr/xr-promote never set (build
# placement overrides, test.vsphere/tfvars/providerRef, promote folders/CA).
#
# `crossplane render` does not apply XRD defaults, so every defaulted field is
# also stated explicitly here.
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: PackerRelease
metadata:
  name: ubuntu24-labul-max
  namespace: default
spec:
  environmentConfig: default

  build:
    environmentConfig: default
    pipelineRunName: ubuntu24-labul-max-build
    osVersion: ubuntu24
    provisioning: base-os
    packerTemplate: ubuntu24-base-os.pkr.hcl
    gitRevision: main
    lab: labul
    hypervisor: vsphere
    gitWorkspaceSubdirectory: packer/builds/ubuntu24-labul-vsphere-base-os
    namespace: tekton-ci
    storageClass: openebs-hostpath
    vaultSecretName: vault # pragma: allowlist secret

  test:
    enabled: true
    provider: vsphere
    environmentConfig: default
    cpu: "4"
    ram: "4096"
    disk: "64"
    firmware: bios
    vsphere:
      folderPath: /LabUL/vm/stuttgart-things/packer
      datacenter: /LabUL
      datastore: /LabUL/datastore/UL-ESX-SAS-01
      resourcePool: /LabUL/host/UL-ESX-01/Resources
      network: /LabUL/network/MGMT
    tfvars:
      secretName: vsphere-tfvars # pragma: allowlist secret
      secretKey: tfvars # pragma: allowlist secret
    providerRef:
      name: opentofu-vsphere
      kind: ClusterProviderConfig
    ansible:
      enabled: true
      playbooks:
        - sthings.baseos.setup
      varsFile:
        - manage_filesystem+-true
        - update_packages+-true
        - ansible_become+-true
        - ansible_become_method+-sudo

  promote:
    enabled: true
    goldenName: sthings-u24
    buildFolder: /LabUL/vm/stuttgart-things/packer
    goldenFolder: /LabUL/vm/stuttgart-things/vm-templates
    previousSuffix: "-previous"
    datacenter: /LabUL
    insecureSkipVerify: "true"
    pipelineRunName: ubuntu24-labul-max-promote
    namespace: tekton-ci
    caCertsConfigMapName: packer-ca-certs
    vaultSecretName: vault # pragma: allowlist secret
    vaultSecretPath: vsphere/labul # pragma: allowlist secret
    workingImage: ghcr.io/stuttgart-things/sthings-packer:2.0.0
    crossplaneProviderConfig: in-cluster
