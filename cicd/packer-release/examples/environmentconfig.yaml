---
# Per-environment defaults for the TEST VM and the promotion of a
# PackerRelease — the LabUL environment, which builds on PROXMOX.
#
# Selected by the config-scoped label
# `packer-release.resources.stuttgart-things.com/environment`, matched against
# the XR's `spec.environmentConfig` (default "default"). The key is namespaced
# to this Configuration because function-environment-configs requires exactly
# one Selector match, and sibling Configurations ship EnvironmentConfigs whose
# value is also "default".
#
# Two environments ship: this one (LabUL, Proxmox) and
# environmentconfig-labda.yaml (LabDA, vSphere). LabUL vSphere is gone, so its
# vCenter placement, govc folders and Vault path were removed here in v0.5.0.
# An XR on this environment sets `test.provider: proxmox` (the XRD default is
# still vsphere).
#
# Build settings come from the packer-build EnvironmentConfig. Proxmox test-VM
# placement (node, datastore, network) is deliberately NOT set here: it falls
# back to the ProxmoxVM EnvironmentConfig, which owns it. Set a field in exactly
# one place.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: packer-release-defaults
  labels:
    packer-release.resources.stuttgart-things.com/environment: default
data:
  # Must match the firmware the template was built with, or it will not boot.
  firmware: bios

  # Hypervisor credentials as tfvars. NOT named here on purpose: the lookup is
  # test.tfvars.secretName -> here -> "<provider>-tfvars", so leaving it unset
  # gives a Proxmox test `proxmox-tfvars`. Naming `vsphere-tfvars` here (as
  # this file did while LabUL had vSphere) handed vSphere credentials to every
  # Proxmox test that did not restate it.
  tfvarsSecretKey: terraform.tfvars # pragma: allowlist secret

  # The OPENTOFU provider config the test VM's Workspace runs through -- NOT
  # the provider-kubernetes one that ansible-run/packer-build call
  # `crossplaneProviderConfig`. This name is a per-cluster choice; check it
  # with `kubectl get clusterproviderconfigs.opentofu.m.upbound.io` before
  # trusting the value below. A copied "default" fails the test VM with
  # `cannot get provider config: ClusterProviderConfig … "default" not found`
  # after the build has already run.
  providerConfigName: in-cluster
  providerConfigKind: ClusterProviderConfig

  # Promotion of a tested template. On Proxmox that is a pull request against
  # the config repo that moves the capability chart's templateVmId; merging it
  # is the promotion (see xr-promote-proxmox.yaml). What is NOT here is
  # anything per-release.
  #
  # None of this takes effect unless an XR sets `spec.promote.enabled: true`.
  promote:
    # Namespace the promote PipelineRun runs in, and the provider-KUBERNETES
    # ClusterProviderConfig the wrapping Object targets -- not the OpenTofu one
    # above. Per-cluster: check with
    # `kubectl get clusterproviderconfigs.kubernetes.m.crossplane.io`.
    namespace: tekton-ci
    crossplaneProviderConfig: in-cluster

    workingImage: ghcr.io/stuttgart-things/sthings-packer:2.0.0

    proxmox:
      # The golden pointer for THIS lab, as a yq path into the capability
      # chart values. It names the environment block, which is why it lives in
      # the per-lab EnvironmentConfig and nowhere has a default.
      valuePath: .environments.labul.templateVmId
      # Must be a stage-time tag CONTAINING promote-proxmox-template.yaml,
      # >= v0.13.2 (v0.13.0/v0.13.1 could not re-run a promotion). Its own key,
      # not promote.pipelineRevision, which pins the vSphere promoter.
      pipelineRevision: v0.13.6

  # Ansible run against the test VM. Overridable per environment so a host
  # without an LVM data disk expresses that here rather than by editing an XR.
  ansible:
    playbooks:
      - sthings.baseos.setup
    varsFile:
      - manage_filesystem+-true
      - update_packages+-true
      - ansible_become+-true
      - ansible_become_method+-sudo
