---
# Shared per-environment defaults for ScheduledRun XRs, selected by the
# config-scoped label `scheduled-run.resources.stuttgart-things.com/environment`
# matched against spec.environmentConfig. Anything set on the XR wins.
#
# These fields deliberately have NO XRD default: an XRD default is applied by
# the API server before the Composition runs, so it would always look like an
# explicit XR value and mask this EnvironmentConfig.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: scheduled-run-defaults
  labels:
    scheduled-run.resources.stuttgart-things.com/environment: default
data:
  schedule: "0 * * * *"
  image: alpine/k8s:1.31.0
  namespace: crossplane-system
  targetNamespace: tekton-ci
