---
# Short CR names on `xpkg.upbound.io` — BOTH halves matter, do not "modernise"
# either one. See cicd/cluster-backup/examples/functions.yaml and the root
# CLAUDE.md for the full rationale: short names because a Composition's
# `functionRef` resolves by CR name (the fleet installs these under short names
# via Argo CD), and the upbound mirror because `dependsOn` uses
# `xpkg.crossplane.io` and a same-registry short-named CR would collide in the
# package Lock and freeze the resolver for every package on the cluster.
#
# `task apply-dev` skips this file unless you pass FUNCTIONS=1 — applying it to
# a cluster that already has Functions can silently downgrade them.
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-kcl
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-kcl:v0.12.0
---
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-auto-ready:v0.6.5
---
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-environment-configs
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-environment-configs:v0.7.1
