---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: vault-secrets
  labels:
    crossplane.io/xrd: vaultsecretsets.vault.stuttgart-things.com
    provider-vault: "true"
    service: vault-secrets
spec:
  compositeTypeRef:
    apiVersion: vault.stuttgart-things.com/v1alpha1
    kind: VaultSecretSet
  mode: Pipeline
  pipeline:
    - step: render-vault-secrets
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: | # pragma: allowlist secret
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec }}
            {{- $xrName := $xr.metadata.name }}
            {{- $xrNs := $xr.metadata.namespace }}
            {{- /* `crossplane render` applies no XRD defaults (CLAUDE.md gotcha 5),
                   so every default below restates the XRD's. */}}
            {{- $pc := $spec.providerConfigRef | default dict }}
            {{- $pcName := $pc.name | default "vault" }}
            {{- $pcKind := $pc.kind | default "ClusterProviderConfig" }}
            {{- $mount := $spec.mount.path }}
            {{- $engine := $spec.mount.type | default "kv-v2" }}
            {{- $createMount := $spec.mount.create | default false }}
            {{- $policies := ternary (list "Observe" "Create" "Update" "LateInitialize") (list "*") ($spec.keepOnDelete | default false) }}
            {{- $observed := .observed.resources | default dict }}
            {{- $extras := .extraResources }}
            {{- $secrets := $spec.secrets | default list }}
            {{- $kvKind := ternary "SecretV2" "Secret" (eq $engine "kv-v2") }}

            {{- /* One stable id per Vault path. Hashed rather than list-indexed, so
                   reordering `secrets` does not delete and re-create every secret;
                   hashed rather than slugified, so `a/b` and `a-b` cannot collide. */}}
            {{- $ids := dict }}
            {{- range $s := $secrets }}
            {{-   $_ := set $ids $s.path (printf "%s-%s" ($xrName | trunc 40 | trimSuffix "-") (sha256sum (printf "%s/%s" $mount $s.path) | trunc 8)) }}
            {{- end }}
            {{- /* One reader per referenced Vault entry, however many keys use it. */}}
            {{- $refIds := dict }}
            {{- range $s := $secrets }}{{ range $d := ($s.data | default list) }}{{ if hasKey $d "vaultRef" }}
            {{-   $_ := set $refIds (printf "%s/%s" $d.vaultRef.mount $d.vaultRef.entry) (printf "%s-ref-%s" ($xrName | trunc 40 | trimSuffix "-") (sha256sum (printf "%s/%s" $d.vaultRef.mount $d.vaultRef.entry) | trunc 8)) }}
            {{- end }}{{ end }}{{ end }}
            ---
            # Everything a value can come from that lives outside this pipeline:
            #  - src-*  the Secrets named by secretKeyRef (XR namespace only)
            #  - own-*  this XR's own composed data Secrets. Also available as
            #           observed resources, but read here as well so an offline
            #           render can be handed one as a fixture — otherwise every
            #           render generates fresh random values and no golden is stable.
            #  - kv-*   this XR's own KV MRs, for the same reason: whether Vault was
            #           already written decides between generating and refusing to.
            #  - ref-*  the connection Secret of each vaultRef reader: the adopted
            #           values arrive there as attribute.data.<key>.
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
            {{- $srcNames := dict }}
            {{- range $s := $secrets }}{{ range $d := $s.data }}{{ if hasKey $d "secretKeyRef" }}{{ $_ := set $srcNames $d.secretKeyRef.name true }}{{ end }}{{ end }}{{ end }}
            {{- range $src, $rid := $refIds }}
              ref-{{ $rid }}:
                apiVersion: v1
                kind: Secret
                matchName: {{ printf "%s-conn" $rid | quote }}
                namespace: {{ $xrNs | quote }}
            {{- end }}
            {{- range $n, $_ := $srcNames }}
              src-{{ $n }}:
                apiVersion: v1
                kind: Secret
                matchName: {{ $n | quote }}
                namespace: {{ $xrNs | quote }}
            {{- end }}
            {{- range $s := $secrets }}
            {{- /* own-* for EVERY entry, claims included — not because a claim reads
                   its payload back, but because the gate below waits for extra
                   resources to arrive. A set of claims only would otherwise request
                   nothing, never receive anything, compose nothing and report
                   Ready=True. Measured on u26-kind3 (#454 point 1). */}}
              own-{{ index $ids $s.path }}:
                apiVersion: v1
                kind: Secret
                matchName: {{ index $ids $s.path | quote }}
                namespace: {{ $xrNs | quote }}
            {{- if not (hasKey $s "claim") }}
              kv-{{ index $ids $s.path }}:
                apiVersion: kv.vault.m.upbound.io/v1alpha1
                kind: {{ $kvKind }}
                matchName: {{ printf "%s-kv" (index $ids $s.path) | quote }}
                namespace: {{ $xrNs | quote }}
            {{- end }}
            {{- end }}

            {{- /* Nothing below runs before Crossplane has answered the requirements.
                   The first call sees no extra resources at all: generating then
                   would be harmless (the output is discarded), but reading a missing
                   secretKeyRef as "absent" would not be. */}}
            {{- if $extras }}

            {{- $mountReady := not $createMount }}
            {{- if $createMount }}
            {{- $mountMr := printf "%s-mount" ($xrName | trunc 50 | trimSuffix "-") }}
            {{- $mountObs := index $observed $mountMr }}
            {{- if $mountObs }}
            {{-   range (dig "status" "conditions" list $mountObs.resource) }}{{ if and (eq .type "Ready") (eq .status "True") }}{{ $mountReady = true }}{{ end }}{{ end }}
            {{- end }}
            ---
            # KV MOUNT — never deleted by this XR (no Delete policy): removing a
            # mount removes every secret in it, not only the ones written here.
            apiVersion: vault.vault.m.upbound.io/v1alpha1
            kind: Mount
            metadata:
              name: {{ $mountMr }}
              annotations:
                {{ setResourceNameAnnotation $mountMr }}
            spec:
              providerConfigRef:
                name: {{ $pcName }}
                kind: {{ $pcKind }}
              managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
              forProvider:
                path: {{ $mount | quote }}
                type: kv
                options:
                  version: {{ ternary "2" "1" (eq $engine "kv-v2") | quote }}
                {{- if $spec.mount.description }}
                description: {{ $spec.mount.description | quote }}
                {{- end }}
            {{- end }}

            {{- $share := list }}
            {{- $missing := list }}
            {{- $refused := list }}
            {{- $readers := dict }}
            {{- range $s := $secrets }}
            {{- $id := index $ids $s.path }}

            {{- if hasKey $s "claim" }}
            {{- /* CLAIM — mark the entry as owned and remove it with the XR, but
                   never read or write its data: something else (the rancher join
                   play for kubeconfigs/<cluster>) writes that and keeps writing
                   versions. Same call the xplane-cluster kubeconfig Workspace makes. */}}
            {{- $meta := dict }}
            {{- range $k, $v := ($s.claim.customMetadata | default dict) }}{{ $_ := set $meta $k $v }}{{ end }}
            {{- $_ := set $meta "managed-by" "crossplane" }}
            {{- $claimReady := false }}
            {{- $claimObs := index $observed (printf "%s-claim" $id) }}
            {{- if $claimObs }}
            {{-   range (dig "status" "conditions" list $claimObs.resource) }}{{ if and (eq .type "Ready") (eq .status "True") }}{{ $claimReady = true }}{{ end }}{{ end }}
            {{- end }}
            ---
            # CLAIM PAYLOAD — generic.Endpoint only takes its JSON by secret
            # reference. Nothing in it is sensitive; it is custom_metadata only.
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $id }}
              namespace: {{ $xrNs }}
              annotations:
                {{ setResourceNameAnnotation $id }}
                gotemplating.fn.crossplane.io/ready: "True"
                vault.stuttgart-things.com/path: {{ printf "%s/metadata/%s" $mount $s.path | quote }}
              labels:
                app.kubernetes.io/managed-by: crossplane
                vault.stuttgart-things.com/secret-set: {{ $xrName }}
                vault.stuttgart-things.com/role: claim
            type: Opaque
            data:
              data.json: {{ dict "custom_metadata" $meta | toJson | b64enc }}
            {{- if $mountReady }}
            ---
            # Deleting this MR DELETEs <mount>/metadata/<path>: the metadata and
            # EVERY version of the data, whoever wrote them.
            apiVersion: generic.vault.m.upbound.io/v1alpha1
            kind: Endpoint
            metadata:
              name: {{ $id }}-claim
              annotations:
                {{ setResourceNameAnnotation (printf "%s-claim" $id) }}
                vault.stuttgart-things.com/path: {{ printf "%s/metadata/%s" $mount $s.path | quote }}
                {{- with dig "resource" "metadata" "resourceVersion" "" (index $observed $id | default dict) }}
                vault.stuttgart-things.com/data-revision: {{ . | quote }}
                {{- end }}
              labels:
                vault.stuttgart-things.com/secret-set: {{ $xrName }}
            spec:
              providerConfigRef:
                name: {{ $pcName }}
                kind: {{ $pcKind }}
              managementPolicies: {{ $policies | toJson }}
              forProvider:
                path: {{ printf "%s/metadata/%s" $mount $s.path | quote }}
                # A GET on the metadata path returns a different shape than the
                # POST takes (versions, timestamps), so reading it back would diff
                # forever — and it keeps the ACL to create/update/delete.
                disableRead: true
                ignoreAbsentFields: true
                dataJsonSecretRef:
                  name: {{ $id }}
                  key: data.json
            {{- end }}
            {{- $share = append $share (dict "path" $s.path "mode" "claim" "ready" $claimReady "dataSecret" $id) }}
            {{- else }}

            {{- /* Values already written, if any: observed composed Secret first,
                   then the same Secret as an extra resource (render fixtures). */}}
            {{- $prev := dict }}
            {{- $prevB64 := "" }}
            {{- $obs := index $observed $id }}
            {{- if $obs }}{{ $prevB64 = dig "resource" "data" "data.json" "" $obs }}{{ end }}
            {{- if not $prevB64 }}
            {{-   $own := index $extras (printf "own-%s" $id) }}
            {{-   if and $own $own.items }}{{ $prevB64 = dig "resource" "data" "data.json" "" (index $own.items 0) }}{{ end }}
            {{- end }}
            {{- if $prevB64 }}{{ $prev = $prevB64 | b64dec | fromYaml }}{{ end }}

            {{- /* Has Vault already been written? Observed MR first, then the same MR
                   as an extra resource (render fixtures). NOT "does the MR exist":
                   an MR whose first write failed (a 403, say) exists too, and
                   treating that as written would lock the XR out for good.
                     external-name   set by the provider only after a successful apply
                     Ready=True      an MR that observed an existing secret
                     atProvider.id   the provider's ID, only there after a read
                   NOT crossplane.io/external-create-succeeded: provider-vault creates
                   asynchronously, and that annotation is set when the async call
                   returns — on u26-kind3 it sat on four MRs whose every create had
                   failed with a 403 (#454 point 1). */}}
            {{- $kvCur := dict }}
            {{- $kvObs := index $observed (printf "%s-kv" $id) }}
            {{- if $kvObs }}{{ $kvCur = $kvObs.resource }}
            {{- else }}
            {{-   $kvEx := index $extras (printf "kv-%s" $id) }}
            {{-   if and $kvEx $kvEx.items }}{{ $kvCur = (index $kvEx.items 0).resource }}{{ end }}
            {{- end }}
            {{- $written := false }}
            {{- if dig "metadata" "annotations" "crossplane.io/external-name" "" $kvCur }}{{ $written = true }}{{ end }}
            {{- if dig "status" "atProvider" "id" "" $kvCur }}{{ $written = true }}{{ end }}
            {{- range (dig "status" "conditions" list $kvCur) }}{{ if and (eq .type "Ready") (eq .status "True") }}{{ $written = true }}{{ end }}{{ end }}

            {{- $vals := dict }}
            {{- $generated := list }}
            {{- $adopted := list }}
            {{- $unresolved := list }}
            {{- $blocked := list }}
            {{- range $d := $s.data }}
            {{-   if hasKey $d "value" }}
            {{-     $_ := set $vals $d.key $d.value }}
            {{-   else if hasKey $d "secretKeyRef" }}
            {{-     $src := index $extras (printf "src-%s" $d.secretKeyRef.name) }}
            {{-     $b64 := "" }}
            {{-     if and $src $src.items }}{{ $b64 = dig "resource" "data" $d.secretKeyRef.key "" (index $src.items 0) }}{{ end }}
            {{-     if $b64 }}
            {{-       $_ := set $vals $d.key (b64dec $b64) }}
            {{-     else if hasKey $prev $d.key }}
            {{- /* Source gone or key removed: keep what Vault already has
                         rather than blanking a live credential. Reported below. */}}
            {{-       $_ := set $vals $d.key (index $prev $d.key) }}
            {{-       $unresolved = append $unresolved (printf "%s/%s" $d.secretKeyRef.name $d.secretKeyRef.key) }}
            {{-     else }}
            {{-       $unresolved = append $unresolved (printf "%s/%s" $d.secretKeyRef.name $d.secretKeyRef.key) }}
            {{-     end }}
            {{-   else if hasKey $d "generate" }}
            {{-     $generated = append $generated $d.key }}
            {{-     if hasKey $prev $d.key }}
            {{-       $_ := set $vals $d.key (index $prev $d.key) }}
            {{- /* The data Secret is GONE while Vault already holds this secret:
                   generating now would silently rotate a live credential. Refuse
                   unless regenerate says otherwise. A key merely absent from an
                   existing data Secret is new, not lost, and is generated. */}}
            {{-     else if and $written (not $prevB64) (not ($d.generate.regenerate | default false)) }}
            {{-       $blocked = append $blocked $d.key }}
            {{-     else }}
            {{-       $len := int ($d.generate.length | default 32) }}
            {{-       $cs := $d.generate.charset | default "alphanumeric" }}
            {{-       if eq $cs "ascii" }}{{ $_ := set $vals $d.key (randAscii $len) }}
            {{-       else if eq $cs "numeric" }}{{ $_ := set $vals $d.key (randNumeric $len) }}
            {{-       else }}{{ $_ := set $vals $d.key (randAlphaNum $len) }}{{ end }}
            {{-     end }}
            {{- /* vaultRef — adopted once, like a generated value: kept in the data
                   Secret and never read again. Same hold when that Secret is lost
                   after Vault was written; reread lifts it. */}}
            {{-   else if hasKey $d "vaultRef" }}
            {{-     $r := $d.vaultRef }}
            {{-     $src := printf "%s/%s" $r.mount $r.entry }}
            {{-     $rid := index $refIds $src }}
            {{-     $adopted = append $adopted $d.key }}
            {{-     if hasKey $prev $d.key }}
            {{-       $_ := set $vals $d.key (index $prev $d.key) }}
            {{-     else if and $written (not $prevB64) (not ($r.reread | default false)) }}
            {{-       $blocked = append $blocked $d.key }}
            {{-     else }}
            {{-       $_ := set $readers $rid $src }}
            {{-       $conn := index $extras (printf "ref-%s" $rid) }}
            {{-       $b64 := "" }}
            {{-       if and $conn $conn.items }}{{ $b64 = dig "resource" "data" (printf "attribute.data.%s" $r.key) "" (index $conn.items 0) }}{{ end }}
            {{-       if $b64 }}
            {{-         $_ := set $vals $d.key (b64dec $b64) }}
            {{-       else }}
            {{- /* Why, most specific first: the reader answered without the key; the
                   reader reports an error (a 403 names what the credential lacks);
                   or it has not read yet. */}}
            {{-         $why := "not read yet" }}
            {{-         if and $conn $conn.items }}
            {{-           $why = printf "entry has no key %s" $r.key }}
            {{-         else }}
            {{-           $rObs := index $observed $rid }}
            {{-           if $rObs }}
            {{-             range (dig "status" "conditions" list $rObs.resource) }}{{ if and (eq .type "Synced") (eq .status "False") }}{{ $why = (.message | default "read failed" | replace "\n" " " | trunc 160) }}{{ end }}{{ end }}
            {{- /* Measured on u26-kind3: an entry outside the credential's policy is
                   reported as "does not exist", not as a 403 — so say both. */}}
            {{-             if contains "does not exist" $why }}{{ $why = printf "%s — the entry is missing, or this XR's providerConfigRef may not read it" $why }}{{ end }}
            {{-           end }}
            {{-         end }}
            {{-         $unresolved = append $unresolved (printf "vaultRef %s#%s (%s)" $src $r.key $why) }}
            {{-       end }}
            {{-     end }}
            {{-   end }}
            {{- end }}

            {{- /* Write only a COMPLETE secret. A first write with a key missing
                   would publish a partial secret that a consumer happily reads. An
                   already-written secret keeps its previous values instead (above). */}}
            {{- $complete := and (or $obs $prevB64 (eq (len $unresolved) 0)) (not $blocked) }}
            {{- if $unresolved }}{{ $missing = append $missing (printf "%s: %s" $s.path (join ", " $unresolved)) }}{{ end }}
            {{- if $blocked }}{{ $refused = append $refused (printf "%s: data Secret %s/%s is gone but Vault already holds this secret, so %s would be regenerated or re-read — restore the Secret, or set generate.regenerate / vaultRef.reread to true" $s.path $xrNs $id (join ", " $blocked)) }}{{ end }}

            {{- $kvReady := false }}
            {{- if $kvObs }}
            {{-   range (dig "status" "conditions" list $kvObs.resource) }}{{ if and (eq .type "Ready") (eq .status "True") }}{{ $kvReady = true }}{{ end }}{{ end }}
            {{- end }}
            {{- if $blocked }}{{ $kvReady = false }}{{ end }}

            {{- if $complete }}
            ---
            # DATA — the JSON provider-vault writes, referenced by dataJsonSecretRef.
            # Also the memory for generated values: they are read back from here.
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $id }}
              namespace: {{ $xrNs }}
              annotations:
                {{ setResourceNameAnnotation $id }}
                gotemplating.fn.crossplane.io/ready: "True"
                vault.stuttgart-things.com/path: {{ printf "%s/%s" $mount $s.path | quote }}
                {{- if $generated }}
                # For whoever is cleaning up Secrets in this namespace.
                vault.stuttgart-things.com/holds-generated-values: {{ join "," $generated | quote }}
                vault.stuttgart-things.com/on-delete: "the VaultSecretSet holds at Ready=False; with generate.regenerate true these values are ROTATED in Vault instead"
                {{- end }}
                {{- if $adopted }}
                vault.stuttgart-things.com/holds-adopted-values: {{ join "," $adopted | quote }}
                {{- end }}
              labels:
                app.kubernetes.io/managed-by: crossplane
                vault.stuttgart-things.com/secret-set: {{ $xrName }}
                vault.stuttgart-things.com/role: data
            type: Opaque
            data:
              data.json: {{ toJson $vals | b64enc }}
            {{- end }}

            {{- if and $mountReady (or $kvObs $kvCur $complete) }}
            ---
            {{- if eq $engine "kv-v2" }}
            apiVersion: kv.vault.m.upbound.io/v1alpha1
            kind: SecretV2
            {{- else }}
            apiVersion: kv.vault.m.upbound.io/v1alpha1
            kind: Secret
            {{- end }}
            metadata:
              name: {{ $id }}-kv
              annotations:
                {{ setResourceNameAnnotation (printf "%s-kv" $id) }}
                vault.stuttgart-things.com/path: {{ printf "%s/%s" $mount $s.path | quote }}
                {{- /* The data reaches the provider through dataJsonSecretRef, so a
                       changed value changes nothing in the MR — and the MR is not
                       reconciled until the provider's next poll (minutes). Measured on
                       u26-kind3 (#454 point 1). Carrying the data Secret's
                       resourceVersion makes every change an MR event, without putting
                       anything derived from the value on the MR. It lags one XR
                       reconcile, which follows immediately on the Secret update. */}}
                {{- with dig "resource" "metadata" "resourceVersion" "" ($obs | default dict) }}
                vault.stuttgart-things.com/data-revision: {{ . | quote }}
                {{- end }}
                {{- if $blocked }}
                # Paused rather than left to fail on its missing dataJsonSecretRef:
                # an explicit hold, explained by GeneratedValuesPreserved, cannot be
                # mistaken for a transient error. Dropped again as soon as the
                # Secret is back or regenerate is set.
                crossplane.io/paused: "true"
                {{- end }}
              labels:
                vault.stuttgart-things.com/secret-set: {{ $xrName }}
            spec:
              providerConfigRef:
                name: {{ $pcName }}
                kind: {{ $pcKind }}
              managementPolicies: {{ $policies | toJson }}
              forProvider:
                {{- if eq $engine "kv-v2" }}
                mount: {{ $mount | quote }}
                name: {{ $s.path | quote }}
                deleteAllVersions: {{ $s.deleteAllVersions | default false }}
                {{- else }}
                path: {{ printf "%s/%s" $mount $s.path | quote }}
                {{- end }}
                dataJsonSecretRef:
                  name: {{ $id }}
                  key: data.json
            {{- end }}

            {{- $entry := dict "path" $s.path "mode" "data" "ready" $kvReady }}
            {{- if $complete }}{{ $_ := set $entry "dataSecret" $id }}{{ end }}
            {{- if $generated }}{{ $_ := set $entry "generated" $generated }}{{ end }}
            {{- if $adopted }}{{ $_ := set $entry "adopted" $adopted }}{{ end }}
            {{- if $blocked }}{{ $_ := set $entry "blocked" $blocked }}{{ end }}
            {{- $share = append $share $entry }}
            {{- end }}
            {{- end }}

            {{- range $rid, $src := $readers }}
            ---
            # vaultRef READER — Observe-only: it can never write or delete. Its
            # connection Secret carries the entry as attribute.data.<key>; it exists
            # only until every key it serves is adopted into the data Secret, then it
            # goes and takes that copy with it.
            #
            # Same providerConfigRef as the writer, by rule: a reference reaches
            # exactly what this XR's credential may read, and no field lets an order
            # pick a stronger one.
            apiVersion: generic.vault.m.upbound.io/v1alpha1
            kind: Secret
            metadata:
              name: {{ $rid }}
              annotations:
                {{ setResourceNameAnnotation $rid }}
                crossplane.io/external-name: {{ $src | quote }}
                vault.stuttgart-things.com/path: {{ $src | quote }}
              labels:
                vault.stuttgart-things.com/secret-set: {{ $xrName }}
                vault.stuttgart-things.com/role: reader
            spec:
              providerConfigRef:
                name: {{ $pcName }}
                kind: {{ $pcKind }}
              managementPolicies: ["Observe"]
              writeConnectionSecretToRef:
                name: {{ printf "%s-conn" $rid }}
              forProvider:
                # Without `data/`: vault_generic_secret resolves kv-v2 itself.
                path: {{ $src | quote }}
            {{- end }}

            {{- $allReady := gt (len $share) 0 }}
            {{- range $share }}{{ if not .ready }}{{ $allReady = false }}{{ end }}{{ end }}
            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            {{- if not $allReady }}
            # Explicit, because readiness is otherwise derived from COMPOSED
            # resources only: a secret held back for a missing source composes
            # nothing, and an XR with nothing unready reports Ready=True.
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/ready: "False"
            {{- end }}
            status:
              share:
                mount: {{ $mount | quote }}
                engine: {{ $engine }}
                secrets: {{ $share | toJson }}
                ready: {{ $allReady }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              {{- if $missing }}
              - type: SourcesResolved
                status: "False"
                reason: SourceSecretMissing
                message: {{ join "; " $missing | quote }}
              {{- else }}
              - type: SourcesResolved
                status: "True"
                reason: Available
              {{- end }}
              {{- if $refused }}
              - type: GeneratedValuesPreserved
                status: "False"
                reason: DataSecretMissing
                message: {{ join "; " $refused | quote }}
              {{- else }}
              - type: GeneratedValuesPreserved
                status: "True"
                reason: Available
              {{- end }}
            {{- end }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
