---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: vaultsecretsets.vault.stuttgart-things.com
spec:
  group: vault.stuttgart-things.com
  scope: Namespaced
  defaultCompositeDeletePolicy: Foreground
  names:
    kind: VaultSecretSet
    plural: vaultsecretsets
    singular: vaultsecretset
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                providerConfigRef:
                  type: object
                  description: "provider-vault ProviderConfig / ClusterProviderConfig (vault.m.upbound.io)."
                  properties:
                    name:
                      type: string
                      default: vault
                    kind:
                      type: string
                      enum:
                        - ClusterProviderConfig
                        - ProviderConfig
                      default: ClusterProviderConfig
                mount:
                  type: object
                  description: The KV secret engine every entry of `secrets` is written to.
                  required:
                    - path
                  properties:
                    path:
                      type: string
                      minLength: 1
                      pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
                    type:
                      type: string
                      enum:
                        - kv-v2
                        - kv
                      default: kv-v2
                      description: "kv-v2 (versioned) or kv (version 1)."
                    create:
                      type: boolean
                      default: false
                      description: >-
                        Compose the mount as well. It is composed WITHOUT the
                        Delete management policy: deleting a KV mount deletes every
                        secret in it, including ones this XR never wrote, so
                        removing the XR orphans the mount on purpose. Leave false to
                        write into a mount that already exists — creating a mount
                        on a path that is in use fails.
                    description:
                      type: string
                keepOnDelete:
                  type: boolean
                  default: false
                  description: >-
                    Leave the written secrets — and claimed entries — in Vault when
                    the XR is deleted (managementPolicies without Delete).
                secrets:
                  type: array
                  minItems: 1
                  maxItems: 100
                  # One entry per path: a `data` entry and a `claim` on the same
                  # path would fight over it, and two data entries would too.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - path
                  items:
                    type: object
                    required:
                      - path
                    x-kubernetes-validations:
                      - rule: "has(self.data) != has(self.claim)"
                        message: each secret needs exactly one of data (own the secret) or claim (own the entry, not its data)
                    properties:
                      path:
                        type: string
                        minLength: 1
                        pattern: "^[a-zA-Z0-9]([a-zA-Z0-9._/-]*[a-zA-Z0-9._-])?$"
                        description: >-
                          Secret path below the mount, e.g. `apps/demo/db`. With
                          `data` the XR owns the WHOLE secret at that path: keys
                          written by anything else are removed on the next
                          reconcile. With `claim` it owns only the entry.
                      claim:
                        type: object
                        description: >-
                          Own the ENTRY without owning its data (kv-v2 only). Writes
                          custom_metadata to <mount>/metadata/<path> and, when the XR
                          is deleted, DELETEs that path — the metadata and every
                          version, whoever wrote them. The data itself is never
                          read or written, so whatever writes it (e.g. the rancher
                          join play into kubeconfigs/<cluster>) keeps doing so.
                          The entry may not exist yet: custom_metadata can be
                          written before the first version.
                        properties:
                          customMetadata:
                            type: object
                            maxProperties: 63
                            description: >-
                              Added to custom_metadata. `managed-by: crossplane` is
                              always set and cannot be overridden — it is what marks
                              the entry as owned.
                            additionalProperties:
                              type: string
                              maxLength: 512
                      deleteAllVersions:
                        type: boolean
                        default: false
                        description: "kv-v2 only: on delete, destroy every version and the metadata instead of soft-deleting the latest version."
                      data:
                        type: array
                        minItems: 1
                        maxItems: 100
                        x-kubernetes-list-type: map
                        x-kubernetes-list-map-keys:
                          - key
                        items:
                          type: object
                          required:
                            - key
                          x-kubernetes-validations:
                            # Arithmetic, not a list + filter(): the list form is
                            # multiplied by both array bounds and was rejected by
                            # the API server at 1.8x the CEL cost budget.
                            - rule: "(has(self.value) ? 1 : 0) + (has(self.secretKeyRef) ? 1 : 0) + (has(self.generate) ? 1 : 0) + (has(self.vaultRef) ? 1 : 0) == 1"
                              message: each data entry needs exactly one of value, secretKeyRef, generate or vaultRef
                          properties:
                            key:
                              type: string
                              minLength: 1
                              description: "Key inside the Vault secret."
                            value:
                              type: string
                              description: >-
                                Literal value. For NON-sensitive data only (a
                                username, a URL) — it is stored in the XR in clear
                                text. Anything sensitive comes in via secretKeyRef.
                            secretKeyRef:
                              type: object
                              description: >-
                                A key of a Secret in the XR's OWN namespace. No
                                namespace field, deliberately: reading across
                                namespaces would let anyone allowed to create this
                                XR copy any Secret the Crossplane core can read into
                                a Vault path they can read back.
                              required:
                                - name
                                - key
                              properties:
                                name:
                                  type: string
                                key:
                                  type: string
                            generate:
                              type: object
                              description: >-
                                Generate a random value ONCE. It is kept in the
                                composed `<xr>-<hash>` Secret next to the XR and
                                reused on every reconcile. If that Secret is deleted
                                after Vault was written, the XR holds at Ready=False
                                (condition GeneratedValuesPreserved) instead of
                                generating — unless `regenerate` is true.
                              properties:
                                regenerate:
                                  type: boolean
                                  default: false
                                  description: >-
                                    Generate a new value when the data Secret is
                                    missing although Vault already holds the secret,
                                    i.e. ROTATE the live credential. Off by default:
                                    a Secret removed during a namespace cleanup must
                                    not hand a running consumer a password it does
                                    not have. Set it deliberately to rotate, then
                                    unset it again.
                                length:
                                  type: integer
                                  minimum: 8
                                  maximum: 256
                                  default: 32
                                charset:
                                  type: string
                                  enum:
                                    - alphanumeric
                                    - ascii
                                    - numeric
                                  default: alphanumeric
                                  description: "ascii = printable ASCII incl. punctuation; numeric = digits only."
                            vaultRef:
                              type: object
                              description: >-
                                Adopt a value that already exists in Vault — seeded by
                                Terraform, or written by us for an earlier cluster.
                                Read ONCE, through this XR's own providerConfigRef (there
                                is no separate credential for reading, so a reference
                                reaches exactly what the writer may read), then kept in
                                the composed data Secret like a generated value and
                                never re-read. If that Secret is lost after Vault was
                                written, the XR holds at Ready=False instead of
                                re-reading a value that may have changed since —
                                unless `reread` is true.
                              required:
                                - mount
                                - entry
                                - key
                              x-kubernetes-validations:
                                # Shared `_` entries are read by every consumer directly
                                # and never copied into a cluster's entry (#464). The
                                # writer policies deny them too; rejecting here says so
                                # instead of surfacing a 403.
                                - rule: "!self.entry.startsWith('_') && !self.entry.contains('/_')"
                                  message: vaultRef cannot point at a shared `_` entry — shared entries are read directly by their consumers, never copied
                              properties:
                                mount:
                                  type: string
                                  minLength: 1
                                  maxLength: 64
                                  pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
                                entry:
                                  type: string
                                  minLength: 1
                                  maxLength: 256
                                  pattern: "^[a-zA-Z0-9_]([a-zA-Z0-9._/-]*[a-zA-Z0-9._-])?$"
                                  description: "Entry below the mount, e.g. `schmetterpause` or `apps/demo/db` — without `data/`."
                                key:
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                reread:
                                  type: boolean
                                  default: false
                                  description: >-
                                    Read the source again when the data Secret is
                                    missing although Vault already holds this secret.
                                    Off by default: the source may have changed or
                                    been removed since it was adopted.
              required:
                - mount
                - secrets
              x-kubernetes-validations:
                # KV v1 has no metadata endpoint, so there is nothing to claim.
                - rule: "!has(self.mount.type) || self.mount.type == 'kv-v2' || self.secrets.all(s, !has(s.claim))"
                  message: claim needs a kv-v2 mount — kv v1 has no <mount>/metadata endpoint
            status:
              type: object
              properties:
                share:
                  type: object
                  description: >- # pragma: allowlist secret
                    Per secret: its path, whether Vault has it, and the name of the
                    local Secret carrying the JSON that was written — a consumer in
                    the same namespace can mount that instead of reading Vault.
                  x-kubernetes-preserve-unknown-fields: true
