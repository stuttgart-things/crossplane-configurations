# Standard AppSecretProfile — schmetterpause, the copy-paste template: two
# generated entries owned per cluster, a literal, and a shared object-store key
# pair that is never copied (#464). The DB password is overridable so a
# migration can adopt the existing value (vaultRef) instead of regenerating it.
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: schmetterpause
spec:
  mount: schmetterpause
  entries:
    - suffix: ""
      keys:
        username:
          literal: schmetterpause
        password:
          generate: {length: 32}
          overridable: true
        session-key:
          generate: {length: 64}
          overridable: true
    - suffix: "-scoreboard"
      keys:
        token:
          generate: {length: 32}
          overridable: true
    - suffix: "-backup"
      keys:
        access_key:
          shared: object-store-backup
        secret_key:
          shared: object-store-backup
