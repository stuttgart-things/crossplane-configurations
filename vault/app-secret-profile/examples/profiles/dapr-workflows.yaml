# dapr-workflows -- the dapr workflow workers of the cicd platform
# (stuttgart-things/argocd cicd/dapr-workflows): backstage template-execution
# and cluster-build-watch (stuttgart-things/stuttgart-things#3796, #3798).
#
# Mount `cicd`, shared by dapr-workflows, harbor and zot -- hence the SUFFIX:
# an entry is <mount>/<cluster><suffix> and each profile writes and deletes its
# own, so three profiles on one mount need three suffixes.
#
# Only the redis password is the cluster's own. The tokens are lab-wide values
# the workers USE (they talk to GitHub, Backstage, omni-pitcher, machinery), so
# they are shared, seeded by openbao-cluster-secrets.
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: dapr-workflows
spec:
  mount: cicd
  entries:
    - suffix: "-dapr-workflows"
      keys:
        redisPassword:
          generate: {length: 32}
          overridable: true
        githubToken:
          shared: git-pat
        backstageToken:
          shared: backstage-token
        homerunAuthToken:
          shared: homerun-pitch
        machineryToken:
          shared: machinery-grpc
