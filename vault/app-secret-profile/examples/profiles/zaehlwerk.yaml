# zaehlwerk — owns nothing: every key comes from another app in the same cluster
# and is read there directly, never copied (#464; the copy of a webhook token is
# what once drifted into a 401). An order with zaehlwerk but without homerun2 or
# schmetterpause fails when it renders.
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: zaehlwerk
spec:
  reads:
    omni-pitcher-token:
      from: {app: homerun2, key: authToken}
    redis-password:
      from: {app: homerun2, key: redisPassword}
    schmetterpause-token:
      from: {app: schmetterpause, suffix: "-scoreboard", key: token}
