apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: app-secret-profile
  annotations:
    # Local convention used by `task push` to bump and re-publish.
    # Not a Crossplane-standard field — the true package version is the OCI tag.
    meta.crossplane.io/version: v0.1.0
    meta.crossplane.io/maintainer: patrick.hermann@sva.de
    meta.crossplane.io/source: github.com/stuttgart-things/crossplane-configurations
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      What an app needs in Vault, declared once per app as a CLUSTER-scoped
      `AppSecretProfile` (group secrets.stuttgart-things.com, metadata.name =
      the profile name an order lists). Each key has exactly one source —
      generate, literal or shared — enforced at admission, plus which keys an
      order may override; `reads` names keys of other apps used directly,
      never copied. Composes nothing: publishes the resolved view and checks
      every read reference. Consumed by xplane-cluster (#464).
    meta.crossplane.io/readme: |
      # app-secret-profile

      One cluster-scoped `AppSecretProfile` per app. A ClusterStack lists
      profiles; xplane-cluster reads them as extra resources and composes the
      `VaultSecretSet`s (vault/vault-secrets).

      - `entries[]` — entries the app owns, `<mount>/<cluster><suffix>` per
        cluster. Keys: `generate` | `literal` | `shared` (exactly one).
      - `overridable` — may an order replace the key via `secretOverrides`?
        Default: generate yes, literal and shared no.
      - `reads` — keys of another app's entry, read directly (`from: {app,
        suffix, key}`).
      - `status.resolved` — written keys, effective overridable set, shared
        names, and whether each read resolves (`ReadsResolved`).

      The environment half — real mounts, read policies, shared entry names,
      writer ProviderConfig — is the cluster-vault-<env> EnvironmentConfig.

      Cluster-scoped on purpose: a profile decides what every order of that app
      receives, so only admins or the app owners may change it.
spec:
  crossplane:
    version: ">=v2.1.3"
  dependsOn:
    - function: xpkg.crossplane.io/crossplane-contrib/function-go-templating
      version: ">=v0.12.1,<v0.13.0"
