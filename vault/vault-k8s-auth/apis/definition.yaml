---
# Native sibling of bootstrap/vault-auth. Same spec shape for the k8sAuths list,
# so an XR can be moved across by changing apiVersion and the connection fields —
# but every Vault object is its own provider-vault managed resource instead of
# one OpenTofu Workspace per auth.
#
# A DIFFERENT API group on purpose (vault.stuttgart-things.com, not
# config.stuttgart-things.com): both Configurations can sit on one cluster while
# the native one is being proven, without the two XRDs fighting over
# vaultk8sauths.config.stuttgart-things.com.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: vaultk8sauths.vault.stuttgart-things.com
spec:
  group: vault.stuttgart-things.com
  scope: Namespaced
  defaultCompositeDeletePolicy: Foreground
  names:
    kind: VaultK8sAuth
    plural: vaultk8sauths
    singular: vaultk8sauth
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                clusterName:
                  type: string
                  minLength: 1
                  pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
                  description: >-
                    Target cluster. Prefix of every auth mount path
                    ({clusterName}-{name}); created policies are named
                    xp-{clusterName}-{policy.name}.
                vaultAddr:
                  type: string
                  description: >-
                    Informational only — the connection itself comes from the
                    provider-vault (Cluster)ProviderConfig. Republished in
                    status.share.vaultAddr for consumers such as external-secrets,
                    which need the address and cannot read a ProviderConfig.
                providerConfigRef:
                  type: object
                  description: "provider-vault ProviderConfig / ClusterProviderConfig (vault.m.upbound.io) holding address and login."
                  properties:
                    name:
                      type: string
                      default: vault
                    kind:
                      type: string
                      enum:
                        - ClusterProviderConfig
                        - ProviderConfig
                      default: ClusterProviderConfig
                adoption:
                  type: object
                  description: >-
                    Take over Vault objects that already exist — typically the ones
                    bootstrap/vault-auth created through OpenTofu for the same
                    clusterName — instead of failing with "path is already in use".
                    Every MR gets a crossplane.io/external-name and starts Observe-only.
                    Once everything an auth composes has been observed, it is
                    compared with the spec; with no differences the auth is handed
                    over as a whole, WITHOUT the Delete policy. Differences hold the
                    hand-over and are named in the AdoptionComplete condition.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    acceptDifferences:
                      type: boolean
                      default: false
                      description: >-
                        Hand over despite differences, i.e. overwrite Vault with the
                        spec on the next reconcile. Set it after reading the
                        AdoptionComplete message, not before.
                    deleteOnRemoval:
                      type: boolean
                      default: false
                      description: >-
                        Add the Delete policy, so deleting the XR deletes the Vault
                        objects. Leave false while the previous owner (an OpenTofu
                        Workspace and its state) still holds them — a delete from
                        either side would remove them under the other. See README,
                        "Migrating from bootstrap/vault-auth".
                kubernetesHost:
                  type: string
                  description: "Kubernetes API host Vault calls for TokenReview. Only used by auths with backendConfig."
                  default: "https://kubernetes.default.svc:443"
                k8sAuths:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                    x-kubernetes-validations:
                      - rule: "has(self.tokenPolicies) || has(self.policies)"
                        message: an auth must reference policies (tokenPolicies) or create them (policies) — one with neither is created successfully and can do nothing
                    properties:
                      name:
                        type: string
                        minLength: 1
                        pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
                      tokenPolicies:
                        type: array
                        description: "Existing Vault policies to attach to the role."
                        items:
                          type: string
                      tokenTtl:
                        type: integer
                        default: 3600
                      boundServiceAccountNames:
                        type: array
                        items:
                          type: string
                        default: ["default"]
                      boundServiceAccountNamespaces:
                        type: array
                        items:
                          type: string
                        default: ["default"]
                      policies:
                        type: array
                        description: >-
                          Vault policies to CREATE, each named
                          xp-{clusterName}-{name} and appended to tokenPolicies.
                          The body is BUILT by the Composition from kvMount + read,
                          never supplied as HCL (crossplane-configurations#285).
                          Neither kvMount nor the read subtrees are restricted:
                          whoever may create this XR may grant read on any KV
                          mount and subtree. RBAC on the XR is the boundary — see
                          README, "Who may grant what".
                          The role is only composed once every policy it names is
                          Ready — Vault accepts a role naming a missing policy and
                          the token then silently has no permissions.
                        items:
                          type: object
                          required:
                            - name
                            - kvMount
                            - read
                          properties:
                            name:
                              type: string
                              pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
                            kvMount:
                              type: string
                              minLength: 1
                              pattern: "^[a-z0-9][a-z0-9._-]*$"
                            read:
                              type: array
                              minItems: 1
                              description: "Subtrees of kvMount to grant read on. `own` expands to this cluster's subtree."
                              items:
                                type: string
                                pattern: "^[a-z0-9][a-z0-9._-]*$"
                      backendConfig:
                        type: object
                        description: >-
                          Configure the auth mount's TokenReview connection. CA and
                          reviewer JWT come from a ServiceAccount-token Secret that
                          must live in the XR's OWN namespace: the JWT is handed to
                          provider-vault as a local secret reference, and reading a
                          Secret from another namespace would let any namespace that
                          may create this XR aim Vault at a token it cannot read
                          itself.
                        required:
                          - secretName
                        properties:
                          secretName:
                            type: string
                          caCertKey:
                            type: string
                            default: "ca.crt"
                          tokenKey:
                            type: string
                            default: "token"
                          disableIssValidation:
                            type: boolean
                            default: true
                          disableLocalCaJwt:
                            type: boolean
                            default: true
              required:
                - clusterName
                - k8sAuths
            status:
              type: object
              properties:
                share:
                  type: object
                  description: >-
                    Same contract as bootstrap/vault-auth: mountPath, role and
                    policies are ABSENT until the Vault object behind them is
                    Ready, never published empty.
                  x-kubernetes-preserve-unknown-fields: true
