apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: vault-k8s-auth
  annotations:
    # Local convention used by `task push` to bump and re-publish.
    # Not a Crossplane-standard field — the true package version is the OCI tag.
    meta.crossplane.io/version: v0.4.0
    meta.crossplane.io/maintainer: patrick.hermann@sva.de
    meta.crossplane.io/source: github.com/stuttgart-things/crossplane-configurations
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Vault Kubernetes auth backends from a namespaced `VaultK8sAuth` XR
      (group vault.stuttgart-things.com), composed as native provider-vault
      managed resources — auth mount, created policies, role and TokenReview
      config each its own MR. The provider-vault counterpart of
      bootstrap/vault-auth, which does the same through one OpenTofu Workspace
      per auth. PROTOTYPE.
    meta.crossplane.io/readme: |
      # vault-k8s-auth (prototype)

      Creates, per `spec.k8sAuths` entry, on the Vault behind a provider-vault
      ClusterProviderConfig:

      - `auth.vault.m.upbound.io` Backend — kubernetes auth mount `{clusterName}-{name}`
      - `vault.vault.m.upbound.io` Policy — one per `policies` entry, body BUILT from
        `kvMount` + `read` (never free-form HCL), named `xp-{clusterName}-{policy}`
      - `kubernetes.vault.m.upbound.io` AuthBackendRole — composed only once the mount
        and every created policy are Ready; sticky afterwards
      - `kubernetes.vault.m.upbound.io` AuthBackendConfig — when `backendConfig` is set;
        CA read from the reviewer Secret, JWT passed by reference

      `spec.adoption.enabled` takes over objects that already exist (e.g. from
      bootstrap/vault-auth): external-names, Observe-only first, compared with
      the spec, then handed over per auth WITHOUT Delete; differences hold it
      and are named in the AdoptionComplete condition. `deleteOnRemoval` adds
      Delete once the previous owner has let go.

      `status.share` keeps the contract of bootstrap/vault-auth: `mountPath`,
      `role`, `policies` are absent until Ready, never empty.

      ## Cluster preconditions

      - provider-vault installed (`upbound-provider-vault`, see examples/provider.yaml).
      - A `vault.m.upbound.io` ClusterProviderConfig (default name `vault`) with
        an AppRole login that has `sudo` + create/update/delete on `sys/auth/*`,
        create/update/delete on `sys/policies/acl/xp-*` (never `*`) and `auth/*`.
      - RBAC: `policies[].kvMount` may not name an admin-credential mount
        (kubeconfigs, ssh, cicd-*) or sys/auth/identity/cubbyhole — enforced at
        admission — but `tokenPolicies` can attach ANY existing policy, so keep
        `vaultk8sauths.vault.stuttgart-things.com` away from tenants (README).
      - For `backendConfig`: the reviewer ServiceAccount-token Secret in the XR's
        own namespace.
spec:
  crossplane:
    version: ">=v2.1.3"
  dependsOn:
    # provider-vault is published only on the Upbound mirror.
    - provider: xpkg.upbound.io/upbound/provider-vault
      version: ">=v4.0.4,<v5.0.0"
    - function: xpkg.crossplane.io/crossplane-contrib/function-go-templating
      version: ">=v0.12.1,<v0.13.0"
    - function: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      version: ">=v0.6.5,<v0.7.0"
