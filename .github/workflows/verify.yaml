---
name: Verify Crossplane Configurations
# The Configuration package pipeline (discover + pre-commit + verify + preview)
# does not apply to the XR claims under tests/envs — those are test-env
# manifests, not packages — nor to the Kyverno policies that lint them. A change
# touching ONLY those skips this whole workflow; a mixed PR that also edits a
# package still runs it in full. Claims are linted instead by the lighter
# Kyverno gate (validate-claims.yaml).
#
# NARROWED FROM `tests/**` ON 2026-08-20, and the reason is worth keeping.
# tests/ does not only hold fixtures: tests/lint/ holds the invariant linter
# that the lint-invariants job below RUNS. With the whole tree ignored, a PR
# that changed only the linter did not run the linter — #355 touched nothing
# else and came back with exactly one check (the Kyverno gate), so a change to
# the thing that guards every package was itself unguarded. tests/render/ is
# the same shape: check-golden.sh and render-golden.sh are code, not fixtures.
#
# paths-ignore has no negation, so the ignore list must name the fixture
# directories rather than excluding the code ones.
on:
  pull_request:
    paths-ignore:
      - 'tests/envs/**'
      - 'tests/kyverno/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'tests/envs/**'
      - 'tests/kyverno/**'

# One run per branch. Without this a second push leaves the first run alive and
# competing for dagger-labda, which is the runner every heavy job here shares —
# and contention there is what turns a 30-second preview into a 20-minute one.
#
# PR runs only: a push to main must never cancel a run that is publishing.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    # git diff + jq. Nothing here needs dagger or the self-hosted runner, and a
    # slot on dagger-labda is the scarce resource.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configs: ${{ steps.find.outputs.configs }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        name: Compute changed files vs base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # New branch / initial push: diff against the empty tree
          if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ]; then
            base=$(git hash-object -t tree /dev/null)
          fi
          git diff --name-only "$base" "$head" > changed.txt
          echo "Changed files:"
          cat changed.txt || true

      - id: find
        name: Intersect changed paths with Configuration directories
        run: |
          # All Configuration directories: any crossplane.yaml that is NOT in an examples/ subtree
          # (examples/configuration.yaml is the runtime install manifest, not a Configuration package).
          all=$(find . -type f -name crossplane.yaml \
                  -not -path './.git/*' \
                  -not -path '*/examples/*' \
                -printf '%h\n' \
                | sed 's|^\./||' \
                | sort -u)
          configs_json=$(
            while IFS= read -r c; do
              [ -z "$c" ] && continue
              if grep -q "^${c}/" changed.txt; then
                echo "$c"
              fi
            done <<< "$all" \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length>0))'
          )
          echo "configs=${configs_json}" >> "$GITHUB_OUTPUT"
          echo "Configurations to verify:"
          echo "${configs_json}" | jq -r '.[]'

  pre-commit:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-pre-commit.yaml@main
    with:
      runs-on: dagger-labda
    secrets: inherit

  # Structural invariant lint — parses the package YAML and asserts shape (XRD
  # v2/Namespaced/no-claims, Composition /v1/Pipeline, short-form Function CR
  # names, the xpkg.upbound.io mirror pin, required crossplane.yaml annotations).
  # Fast, cluster-free, and independent of the dagger pre-commit env so it stays
  # an authoritative gate even if that image can't build the local hook's venv.
  # It also runs via .pre-commit-config.yaml for local dev; this job is the CI
  # backstop. Ungated by `discover` on purpose — a cross-cutting invariant can
  # break from a change to any package file.
  lint-invariants:
    name: Lint Configuration invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install "pyyaml==6.0.2"
      # --registry is on HERE and off locally, on purpose. It is the only check
      # in this linter that needs network: it asks ghcr.io whether the version
      # the repo and README agree on was ever actually pushed. Without it the
      # two can be in perfect, documented agreement about an artifact that does
      # not exist — which is exactly what happened to vspherevm v0.9.1
      # (#345): documented and tabled for a day, never published, so the
      # machinery play pinned v0.9.0 and a run delivered something other than
      # what the repo described.
      #
      # A registry that cannot be reached is SKIPPED, not failed. A linter that
      # goes red when GHCR has a bad day gets switched off, and then it checks
      # nothing at all.
      - run: python3 tests/lint/lint-configurations.py --registry

  verify:
    needs: discover
    if: needs.discover.outputs.configs != '[]'
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.discover.outputs.configs) }}
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-crossplane-verify.yaml@main
    with:
      src: ${{ matrix.config }}
      runs-on: dagger-labda
    secrets: inherit

  # Phase 1 of the CI/CD roadmap (docs/ci-cd-roadmap.md): per-changed-Configuration
  # preview packages. Build each changed config and push it to the public,
  # ephemeral ttl.sh registry, then surface a copy-paste install manifest as a
  # sticky PR comment. ttl.sh is anonymous → no secrets, safe for fork PRs.
  preview:
    # AFTER verify, not beside it — so no preview is built for a PR that does
    # not verify, which is the case where nobody wants one.
    #
    # This ordering was originally introduced to cure the long preview hangs of
    # 2026-08-16, on the theory that two dagger jobs sharing one engine on
    # dagger-labda were contending. That theory was WRONG, and the ordering did
    # not cure anything — see the step timeout below for what actually hangs.
    # Kept only for the reason above.
    needs: [discover, verify]
    if: github.event_name == 'pull_request' && needs.discover.outputs.configs != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.discover.outputs.configs) }}
    runs-on: dagger-labda
    # Backstop only — the step timeout below is what should fire. Without any
    # timeout a hung job blocks the PR for GitHub's default of SIX HOURS.
    timeout-minutes: 20
    # A preview is a convenience, not a gate: verify is what actually tests the
    # Configuration. ttl.sh is a free anonymous registry with no uptime promise,
    # and letting its bad days block a reviewed PR buys nothing.
    continue-on-error: true
    env:
      # 24h is ttl.sh's maximum TTL — long enough to outlive a review cycle.
      TTL: "24h"
      # v0.118.0: the crossplane module's push-preview function builds a
      # Configuration, pushes it anonymously to ttl.sh, and returns the
      # install manifest — replacing the task/gum/curl bootstrap below.
      # v0.118.0 pins crank to v2.2.2 + tolerates the release bucket's
      # mismatched crank.sha256 (stuttgart-things/dagger#295).
      # v0.118.1 runs render Functions as Dagger services instead of nested
      # Docker containers, fixing the function-kcl render-sandbox failure
      # (DeadlineExceeded / connection refused) — stuttgart-things/dagger#300.
      # v0.124.0 hebt die CLI auf v2.4.1 und installiert zusaetzlich das
      # Crossplane-CORE-Binary. Ab CLI v2.3.0 ruft `render` naemlich
      # `crossplane internal render` auf — was die CLI selbst nicht kann — und
      # startet dafuer per Default einen Container aus dem FLOATING Tag
      # crossplane:stable. Das Modul zeigt render jetzt per
      # --crossplane-binary auf den gepinnten Core: kein Container, kein
      # floating Tag. Gemessen: die Development-Runtime allein haette das
      # NICHT verhindert (stuttgart-things/dagger#331).
      CROSSPLANE_MODULE_VERSION: v0.124.0
    steps:
      - uses: actions/checkout@v7.0.1

      - id: meta
        name: Compute preview prefix
        run: |
          set -euo pipefail
          pr='${{ github.event.pull_request.number }}'
          sha='${{ github.event.pull_request.head.sha }}'
          config='${{ matrix.config }}'
          # Encode PR# + short SHA in the ttl.sh path so each commit publishes a
          # fresh, traceable preview that never collides with another PR's.
          echo "prefix=stuttgart-things/crossplane-configurations-pr${pr}-${sha:0:7}" >> "$GITHUB_OUTPUT"
          # Flatten the config path for a unique, filesystem-safe artifact name.
          echo "safe=$(printf '%s' "$config" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build & push ttl.sh preview
        id: push
        # THE hang. Traced on 2026-08-16 (PR #279): the whole dagger pipeline —
        # engine start, container, `crossplane xpkg build`, finished .xpkg — took
        # FOUR SECONDS, and then
        #
        #   withExec crossplane xpkg push ttl.sh/…/flux-apps:24h
        #
        # produced not one further byte until the 20-minute job timeout killed
        # it. Reproduced independently from a workstation at the same moment:
        # ttl.sh's read path was healthy (`GET /v2/` 200 in 0.34s) while
        # `POST /v2/<name>/blobs/uploads/` hung past 30s with zero bytes. The
        # registry's write path was down; nothing here was at fault.
        #
        # `crossplane xpkg push` sets no client-side timeout, so it blocks
        # forever. This cap turns a ttl.sh outage into a two-minute, clearly
        # labelled failure instead of twenty minutes of an occupied runner.
        #
        # Note what this is NOT: it is not dagger contention, not the shared
        # engine, not the runner. Those were the earlier theories and they cost
        # a serialisation change that cured nothing. If previews hang again,
        # check ttl.sh's blob-upload endpoint FIRST.
        timeout-minutes: 2
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          # Must match every other dagger job that can run on dagger-labda at
          # the same time — the reusable workflows default to 0.21.8, so this
          # does too. The dagger provisioner destroys engine containers of
          # OTHER versions when it starts, so two concurrent jobs on different
          # versions kill each other's engine mid-run. The victim sees
          #   docker exec … buildctl dial-stdio … exit status 137
          # which reads like an OOM and is not one: 137 is SIGKILL, and the
          # runner logs no OOM at all. That is what the previous comment here
          # ("the 0.20.8 engine was OOM-killed") was actually seeing; bumping
          # one job's version only moved which job loses the race.
          version: "0.21.8"
          verb: call
          module: github.com/stuttgart-things/dagger/crossplane@${{ env.CROSSPLANE_MODULE_VERSION }}
          # push-preview reads the package name from crossplane.yaml and pushes
          # anonymously (ttl.sh needs no creds). Its stdout is the install
          # manifest, exposed as steps.push.outputs.output.
          args: >-
            push-preview
            --src ${{ matrix.config }}
            --prefix ${{ steps.meta.outputs.prefix }}
            --ttl ${{ env.TTL }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Compose preview snippet
        env:
          MANIFEST: ${{ steps.push.outputs.output }}
          CONFIG: ${{ matrix.config }}
          SAFE: ${{ steps.meta.outputs.safe }}
        run: |
          set -euo pipefail
          # spec.package holds the pushed ttl.sh ref; surface it in the summary.
          dest=$(printf '%s\n' "$MANIFEST" | awk '/^  package:/{print $2}')
          {
            echo "<details>"
            echo "<summary>📦 <code>${CONFIG}</code> → <code>${dest}</code></summary>"
            echo
            echo '```yaml'
            printf '%s\n' "$MANIFEST"
            echo '```'
            echo
            echo "</details>"
          } > "preview-${SAFE}.md"

      - uses: actions/upload-artifact@v7
        with:
          name: preview-${{ steps.meta.outputs.safe }}
          path: preview-*.md
          if-no-files-found: error

  # Aggregate every changed config's snippet into one sticky PR comment. Split
  # from `preview` so the matrix stays secret-free (fork-safe) and the single
  # write-scoped step runs once instead of racing across matrix legs.
  preview-comment:
    needs: [discover, preview]
    if: ${{ always() && github.event_name == 'pull_request' && needs.discover.outputs.configs != '[]' }}
    permissions:
      contents: read
      pull-requests: write
    # Downloads artifacts and posts a comment — no dagger involved.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: previews
          pattern: preview-*
          merge-multiple: true

      - name: Compose comment body
        run: |
          set -euo pipefail
          marker='<!-- crossplane-ttl-preview -->'
          {
            echo "$marker"
            echo "## 📦 ttl.sh preview packages"
            echo
            echo "Preview OCI packages for the Configurations changed in this PR, pushed to the public, ephemeral [ttl.sh](https://ttl.sh) registry. No auth required — install on any Crossplane v2 cluster:"
            echo
            if ls previews/preview-*.md >/dev/null 2>&1; then
              cat previews/preview-*.md
            else
              echo "_No preview packages were produced (the push step failed for every changed config — see the \`preview\` job logs)._"
            fi
            echo
            echo "> [!NOTE]"
            echo "> Images expire **24h** after the last push (ttl.sh's maximum TTL); push a new commit to refresh them. The Configuration name is suffixed \`-preview\` so it won't clash with a canonical install."
          } > body.md
          cat body.md

      - name: Post or update sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- crossplane-ttl-preview -->'
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "map(select(.body | contains(\"$marker\"))) | .[0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md >/dev/null
            echo "Updated sticky comment $id"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null
            echo "Created sticky comment"
          fi
